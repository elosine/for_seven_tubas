<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 9h-1 THE STAND, FIRST SLICE (PLAN §9, day 46): one part, full screen, on the
     iPad. The three lines that make Share → Add to Home Screen open this page as
     a full-screen app with no Safari toolbar (9d's home-screen piece): -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="stand.manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuba part">
<link rel="apple-touch-icon" href="stand-icon.png">
<title>Tuba part</title>
<style>
  :root { color-scheme: light; }
  /* the decided notation text font (V0.7) — served from /notation/app/fonts */
  @font-face { font-family: 'Crimson Pro Light'; font-style: normal; font-weight: 300; src: url('fonts/CrimsonPro-Light.ttf') format('truetype'); }
  @font-face { font-family: 'Crimson Pro Light'; font-style: italic; font-weight: 300; src: url('fonts/CrimsonPro-LightItalic.ttf') format('truetype'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  /* the frame IS the screen: no chrome, no scroll, no selection, no pinch
     (AR-22); the safe-area insets keep the page off a notch or home bar */
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* the sheet is laid out by CSS — below the status bar, to the screen's other
     three edges — and the frame is MEASURED from it (getBoundingClientRect),
     never computed from innerHeight or the insets: on the home-screen app two
     computed versions each left the last row short (iPad, day 46). The home
     indicator at the bottom overlays the music; a black strip there read as a bug. */
  #sheet { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; bottom: 0;
           background: #fff; overflow: hidden; }
  /* a page = several systems (rows) of this part, each its own SVG the size of
     the frame, stacked — a paper part's shape */
  #sheet > svg { position: absolute; left: 0; top: 0; display: block; }
  #animov { position: absolute; top: 0; left: 0; pointer-events: none; }
  /* the one-time hint (the strip comes in 9i) */
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #000b; color: #eee;
          font: 15px sans-serif; padding: 8px 14px; border-radius: 16px; opacity: 0; transition: opacity .5s; pointer-events: none; white-space: nowrap; }
  #hint.on { opacity: 1; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #b00; background: #fff8; font: 12px monospace; white-space: pre-wrap; max-width: 90vw; }
  #err:empty { display: none; }
</style>
</head>
<body>
<div id="sheet"></div>
<div id="hint"></div>
<div id="err"></div>
<script src="/notation/lib/coords.js"></script>
<script src="/notation/lib/stamps.js"></script>
<script src="/notation/lib/layout.js"></script>
<script src="/notation/lib/gc.js"></script>
<script src="/notation/lib/render.js"></script>
<script src="/notation/lib/splice.js"></script>
<script src="/notation/lib/transport.js"></script>
<script src="/notation/lib/animobj.js"></script>
<script src="/notation/lib/animlive.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  // ?part=N (1…10) picks the part — the token of 9g will carry this later.
  // THE SIZE KNOBS (AR-20: "the part's size / the screen's time span: chosen by
  // eye on the real iPad" — 9i's sitting; here as link parameters so the
  // composer can try sizes without a build): ?s= seconds per system (row) ·
  // ?rows= systems per page · ?z= an extra factor on the staff. Also ?ir= the
  // score file · ?t= go to a time · ?play=1 start playing (the check's hooks).
  const PART = Math.min(10, Math.max(1, parseInt(Q.get('part') || '1', 10) || 1));
  const IR = Q.get('ir') || 'db1';
  // THE DECISION (PLAN 9s, day 46, the composer's eye after the data: "8 seconds,
  // 5 rows, 7.5 mm reads best"): rows of 8 s at a 7.5 mm staff, five to a screen.
  // On the iPad that is 140 px/s = 2.7 cm/s — inside the 2–3 cm/s reading
  // ceiling (Vickery 2014) and above the piece's cluster floor (7.3 s).
  const S_DEFAULT = 8, ROWS_DEFAULT = 5;
  const SS_DEFAULT = 9.75;   // a 7.5 mm staff on the iPad class (AR-20, day 46)
  // THE DRAWING LANE (day 46, the composer on rows per screen and the GCs' feel):
  // the GC's drop and the meters span the LANE's height (gc.js), so a taller
  // row made taller arcs — "it felt awkward, so I shrank the GCs". The lane the
  // drawing sees is now its own height in staff spaces, centred in the row; the
  // row count only adds air around it. Default: the jury frame's lane, which the
  // composer approved — 104 px at a 31.6 px staff = 13.2 ss. ?lane= overrides.
  const LANE_DEFAULT = 13.2;
  const LANE_SS = Math.max(6, parseFloat(Q.get('lane')) || LANE_DEFAULT);
  const ROWS = Math.min(12, Math.max(1, parseInt(Q.get('rows') || String(ROWS_DEFAULT), 10) || ROWS_DEFAULT));
  const Z_EXTRA = Math.max(0.25, parseFloat(Q.get('z')) || 1);
  // THE CIRCULAR BUFFER (D101, day 46 — the composer: "b"; the string quartet's
  // parts mode, built there and checked): the screen's ROWS slots are a ring over
  // the planned rows — planned row i always lives in slot i mod ROWS, so the
  // screen shows rows cur … cur + ROWS − 1; when the cursor leaves row cur, its
  // slot reloads with row cur + ROWS; the cursor runs down the slots and wraps to
  // the top. At least ROWS − 1 rows of future music are visible at every moment.
  const state = { scores: {}, cur: 0, live: null, slots: null, layers: null, geomKey: '', turnLog: [] };
  state.transport = NotationTransport.makeTransport();
  let rafId = null;

  async function loadScore(name) {
    if (state.scores[name]) return state.scores[name];
    const r = await fetch('/api/composer/load/' + name);
    if (!r.ok) throw new Error('score fetch ' + name + ' ' + r.status);
    const j = await r.json();
    state.scores[name] = j.data || j;
    return state.scores[name];
  }

  // THE FRAME is the screen, in CSS px, inside the safe areas: the sheet's own
  // laid-out box — measured, never computed from innerHeight or the insets,
  // which on the home-screen app each left the last row short (iPad, day 46).
  function frameSize() {
    const r = $('sheet').getBoundingClientRect();
    const W = Math.max(320, Math.floor(r.width));
    const H = Math.max(240, Math.floor(r.height));
    return { W, H };
  }
  // the home-screen app settles its viewport after the first paint: re-measure
  // a little later and on every viewport change; re-render only on a change
  function sizeChanged() {
    if (!state.size) return false;
    const { W, H } = frameSize();
    return W !== state.size.W || H !== state.size.H;
  }
  function refit() { if (state.ir && sizeChanged()) render(); }
  const pageSeconds = () => Math.max(2, parseFloat(Q.get('s')) || S_DEFAULT);
  // the planned row (one system's worth, s seconds, cut by the page rules) that holds t
  function plannedOf(t) {
    const P = state.planned;
    let i = P.findIndex(pg => t >= pg.t0 - 1e-9 && t < pg.t1);
    if (i < 0) i = t >= P[P.length - 1].t1 - 1e-9 ? P.length - 1 : 0;
    return i;
  }
  const slotOf = i => i % ROWS;
  const srcEnd = () => state.ir.source.window[1];

  // THE GEOMETRY of a row, computed once per frame size: the staff from the
  // size dial, the speed from the seconds dial, the drawing lane centred in the
  // row. THE SIZE keeps the jury frame's reference: the staff space is the dial
  // (default 7.5 mm), the gutter and the lane scale with it.
  function geometry() {
    const C = state.container;
    const { W, H } = frameSize();
    const s = pageSeconds();
    const juryW = (C.frame && C.frame.widthPx) || 1920;
    const regSeconds = (C.timeScale && C.timeScale.defaults && C.timeScale.defaults.trance) || 12;
    const G0 = (C.prefatory && C.prefatory.gutterPx) || 0;
    const ssJury = ((C.staff && C.staff.staffHeightPx) || 31.6) / 4;
    const juryPxPerS = (juryW - G0) / regSeconds;
    // THE TWO DIALS (day 46, the composer: "2 dials"): ?ss= the staff space in CSS
    // px — THE NOTE SIZE, fixed from printed parts (a 7.5 mm staff; on the iPad
    // class 5.2 CSS px/mm → ss 9.75) · ?s= seconds per row — THE SPEED. ?ss=auto
    // keeps the first build's coupling (the staff scaling with the speed), for
    // comparison only.
    const ssArg = Q.get('ss');
    let ss, pxPerS, k;
    if (ssArg === 'auto') {
      pxPerS = W / (s + G0 / juryPxPerS);
      k = (pxPerS / juryPxPerS) * Z_EXTRA;
      ss = ssJury * k;
    } else {
      ss = (parseFloat(ssArg) || SS_DEFAULT) * Z_EXTRA;
      k = ss / ssJury;
      pxPerS = (W - Math.min(W * 0.4, G0 * k)) / s;
    }
    const gutterPx = Math.min(W * 0.4, G0 * k);
    const rowH = H / ROWS, padFrac = 0.03;
    const laneH = Math.min(rowH * (1 - 2 * padFrac), LANE_SS * ss);
    const laneAir = (rowH - laneH) / 2;
    return { W, H, s, ss, k, pxPerS, gutterPx, rowH, laneH, laneAir, ssPerSystem: laneH / ss, coupling: ssArg === 'auto' ? 'auto' : 'fixed' };
  }

  // ONE ROW in one slot: a full-frame SVG with the system in the slot's lane, and
  // its scene for the overlay. A ROW ENDS WHERE ITS MUSIC ENDS (the composer: "the
  // cursors don't go all the way to the end"): the page rules cut one row in five
  // short to keep a figure whole on the next row; the row's view is only as wide
  // as its own music at the constant px per second — a ragged right edge, the end
  // bar at the cut, the cursor running to it.
  function buildSlot(k, i) {
    const C = state.container, G = state.geom, pg = state.planned[i];
    const f0 = (k * G.rowH + G.laneAir) / G.H, f1 = (k * G.rowH + G.laneAir + G.laneH) / G.H;
    const rowSeconds = Math.min(G.s, pg.t1 - pg.t0);
    const rowW = Math.min(G.W, G.gutterPx + rowSeconds * G.pxPerS);
    const view = NotationCoords.makeView({ widthPx: rowW, heightPx: G.H, window: [pg.t0, pg.t0 + rowSeconds], gutterPx: G.gutterPx,
      systems: [{ part: PART - 1, laneFrac0: f0, laneFrac1: f1 }], ssPerSystem: G.ssPerSystem });
    const ownsEnd = i === state.planned.length - 1;
    let svg = NotationRender.renderSection(state.model, view, state.glyphs, {
      reshow: pg.reshow, ownsEnd, engraving: (C.engraving && C.engraving.render) || {},
      hideBricks: true,   // the parachute bricks are a workshop look, not the part's (composer, day 46)
    });
    // the rows stack: the paper is the sheet's, not each SVG's (render.js paints
    // a full-frame paper rect first — the row above would vanish)
    svg = svg.replace(/ style="background:[^"]*"/, '')
             .replace(/<rect x="0" y="0" width="[\d.]+" height="[\d.]+" fill="[^"]*"\/>/, '');
    // the system's terminal barline, as the full score draws it
    const eb = ((C.engraving && C.engraving.render) || {}).systemEndBar;
    let endBar = '';
    if (eb) {
      const sys = view.systems[0], se = srcEnd();
      const xEnd = (se > view.window[0] && se < view.window[1]) ? view.xOfSeconds(se) : view.widthPx;
      endBar = '<rect x="' + (xEnd - eb.wPx).toFixed(2) + '" y="' + sys.yTopPx.toFixed(1) +
        '" width="' + eb.wPx + '" height="' + (sys.yBotPx - sys.yTopPx).toFixed(1) + '" fill="#111" opacity="' + (eb.opacity || 0.55) + '"/>';
    }
    const tpl = document.createElement('template');
    tpl.innerHTML = svg.replace('</svg>', endBar + '</svg>');
    const el = tpl.content.firstElementChild;
    const old = state.slots[k];
    if (old && old.el.parentNode) old.el.parentNode.replaceChild(el, old.el);
    else $('sheet').appendChild(el);
    state.slots[k] = { k, idx: i, pg, view, el };
    // each row shows its overlay only while t is inside ITS music — from its
    // start to the page rules' cut, where the next row begins
    state.layers[k] = { scene: NotationAnimLive.plan(state.animInstances, view, state.animStyle), opacity: 1,
      clip: [pg.t0, Math.min(pg.t1, srcEnd() + 1)] };
  }
  function clearSlot(k) {
    const old = state.slots[k];
    if (old && old.el.parentNode) old.el.parentNode.removeChild(old.el);
    state.slots[k] = null; state.layers[k] = null;
  }

  // (re)lay the ring out for state.cur: only the slots whose row changed are
  // rebuilt — one slot at a row change, every slot at a goto or a frame change
  function render() {
    try {
      const s = pageSeconds();
      if (!state.planned || state.plannedS !== s) {
        state.planned = NotationSplice.planPages(state.ir, state.pageRules, s);
        state.plannedS = s;
      }
      state.cur = Math.min(Math.max(0, state.cur), state.planned.length - 1);
      const G = geometry();
      const key = [G.W, G.H, G.s, G.ss, ROWS, LANE_SS].join('|');
      if (key !== state.geomKey || !state.slots) {
        $('sheet').innerHTML = '';
        if (state.live) { state.live.destroy(); state.live = null; }
        state.slots = new Array(ROWS).fill(null); state.layers = new Array(ROWS).fill(null);
        state.geomKey = key;
      }
      state.geom = G;
      // the instances: the whole piece once, then THIS part's (and the score-level ones)
      if (!state.animInstances) {
        const C = state.container;
        const score = state.scores[state.ir.source.score] || null;
        const _dev = NotationLayout.deviceResolver(state.ir, (C.engraving || {}).layout || {});
        const all = NotationAnimObj.collect(state.ir, score, C.animated,
          { parts: state.ir.source.parts, meta: false, deviceOf: _dev,
            drawnOf: e => NotationLayout.drawnLevelSamples(e, _dev(e) || {}) });
        state.animInstances = all.filter(i => i.part === undefined || i.part === PART - 1);
        state.animStyle = C.animated;
      }
      const n = state.planned.length;
      for (let i = state.cur; i < state.cur + ROWS; i++) {
        const k = slotOf(i);
        if (i >= n) { clearSlot(k); continue; }
        if (state.slots[k] && state.slots[k].idx === i) continue;
        buildSlot(k, i);
      }
      const last = Math.min(n - 1, state.cur + ROWS - 1);
      state.size = { W: G.W, H: G.H, rows: last - state.cur + 1, rowsMax: ROWS, s: G.s, ss: +G.ss.toFixed(2), staffMmIpad: +(G.ss * 4 / 5.2).toFixed(2),
        pxPerS: +G.pxPerS.toFixed(1), laneSs: +G.ssPerSystem.toFixed(1), laneWanted: LANE_SS, rowPx: +G.rowH.toFixed(1), k: +G.k.toFixed(3), coupling: G.coupling,
        page: [state.planned[state.cur].t0, state.planned[last].t1] };
      mountLive();
      $('err').textContent = '';
    } catch (e) { $('err').textContent = String(e.stack || e); }
  }
  // A2 (9a): one overlay per frame size, kept across rows; a reload re-plans
  // one slot's scene. One scene per slot — a slot not holding t has its rider
  // off the frame, and its layer clipped to its own music.
  function mountLive() {
    const G = state.geom;
    if (!state.live) state.live = NotationAnimLive.mount($('sheet'), { widthPx: G.W, heightPx: G.H }, { snap: Q.get('snap') !== '0' });
    state.live.attach($('sheet'));   // the overlay stays the sheet's last child, above every row
    state.live.setLayers(state.layers);
    state.live.setScale(1);
  }

  // ---- the clock on the page ------------------------------------------------
  const rowEnd = () => Math.min(state.planned[state.cur].t1, srcEnd());
  function drawOverlayFrame(tArg) {
    if (!state.slots) return null;
    const t = tArg !== undefined ? tArg : state.transport.now();
    if (state.transport.isPlaying() && t >= rowEnd() - 1e-9) {
      // the row change: the cursor leaves row cur — its slot reloads with row
      // cur + ROWS (one slot built), the cursor goes on in the next slot
      const c0 = performance.now();
      if (state.cur < state.planned.length - 1) { state.cur++; render(); }
      else state.transport.pause();
      state.turnLog.push({ t, ms: performance.now() - c0 });
      if (state.turnLog.length > 200) state.turnLog.shift();
      return { turned: true, t };
    }
    state.live.frame(t);
    return { turned: false, t };
  }
  // each frame is drawn at the FRAME's time (the rAF timestamp), not at the
  // callback's — a game loop's rule
  function animLoop(ts) {
    rafId = null;
    drawOverlayFrame(typeof ts === 'number' ? state.transport.nowAt(ts) : undefined);
    if (state.transport.isPlaying()) rafId = requestAnimationFrame(animLoop);
  }
  function ensureLoop() { if (!rafId) rafId = requestAnimationFrame(animLoop); }
  function goto(t) {
    const i = plannedOf(t);
    if (i !== state.cur) { state.cur = i; render(); }
    state.transport.seek(t); ensureLoop();
  }
  let wakeLock = null;
  async function play() {
    if (!state.slots) return;
    const t = state.transport.now(), t0 = state.planned[state.cur].t0;
    if (t < t0 || t >= rowEnd()) state.transport.seek(t0);
    state.transport.play(); ensureLoop();
    // AR-25: the screen stays awake while the part plays (needs HTTPS; silent otherwise)
    try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  function pause() { state.transport.pause(); ensureLoop(); if (wakeLock) { try { wakeLock.release(); } catch (e) { } wakeLock = null; } }
  function togglePlay() { if (state.transport.isPlaying()) pause(); else play(); }
  // a swipe = a screenful of rows (AR-26's "page")
  function turnPage(d) {
    if (!state.planned) return;
    const i = Math.min(state.planned.length - 1, Math.max(0, state.cur + d * ROWS));
    if (i === state.cur) return;
    state.cur = i; render();
    state.transport.seek(state.planned[i].t0); ensureLoop();
  }
  // one-finger tap = place the cursor (AR-26): the slot under the finger, the
  // time under it, inside that row's music
  function seekAt(clientX, clientY) {
    if (!state.slots) return;
    const rect = $('sheet').getBoundingClientRect();
    const k = Math.min(ROWS - 1, Math.max(0, Math.floor((clientY - rect.top) / rect.height * ROWS)));
    const slot = state.slots[k]; if (!slot) return;
    const view = slot.view;
    const t = view.secondsOfX((clientX - rect.left) * (view.widthPx / rect.width) * (rect.width / state.geom.W));
    const [w0, w1] = view.window;
    if (t >= w0 && t <= w1) goto(t);
  }

  // ---- THE GESTURES (AR-26, one vocabulary): swipe = pages · one-finger tap =
  // cursor · two-finger tap = play / stop. Laptop (AR-28): click = cursor ·
  // space = play / stop · arrows = pages.
  let touch = null;
  const sheet = $('sheet');
  sheet.addEventListener('touchstart', e => {
    e.preventDefault();
    const f = e.touches[0];
    if (!touch) touch = { t: performance.now(), n: 0, x: f.clientX, y: f.clientY, dx: 0, dy: 0, moved: false };
    touch.n = Math.max(touch.n, e.touches.length);
  }, { passive: false });
  sheet.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touch) return;
    const f = e.touches[0];
    touch.dx = f.clientX - touch.x; touch.dy = f.clientY - touch.y;
    if (Math.hypot(touch.dx, touch.dy) > 12) touch.moved = true;
  }, { passive: false });
  sheet.addEventListener('touchend', e => {
    e.preventDefault();
    if (!touch || e.touches.length) return;
    const dt = performance.now() - touch.t;
    if (touch.moved) {
      if (Math.abs(touch.dx) > 60 && Math.abs(touch.dx) > 2 * Math.abs(touch.dy)) turnPage(touch.dx < 0 ? 1 : -1);
    } else if (dt < 500) {
      if (touch.n >= 2) togglePlay(); else seekAt(touch.x, touch.y);
    }
    touch = null;
  }, { passive: false });
  sheet.addEventListener('touchcancel', () => { touch = null; });
  sheet.addEventListener('click', e => { if (!('ontouchstart' in window) || e.detail === 0) seekAt(e.clientX, e.clientY); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') turnPage(1);
    else if (e.key === 'ArrowLeft') turnPage(-1);
  });
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', () => setTimeout(refit, 300));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

  // the one-time hint: how to play (the strip and the menu come in 9i)
  function hint(text, ms) {
    const h = $('hint'); h.textContent = text; h.classList.add('on');
    clearTimeout(hint.tm); hint.tm = setTimeout(() => h.classList.remove('on'), ms || 4000);
  }

  // headless check + the composer's link: ?t= and ?play=1, and the state
  window.__standGoto = t => { goto(t); return { cur: state.cur, page: state.size && state.size.page }; };
  window.__standRows = () => (state.slots || []).map((sl, k) => sl ? { slot: k, idx: sl.idx, t0: sl.pg.t0, t1: sl.pg.t1, window: sl.view.window, gutterPx: sl.view.gutterPx } : null);
  window.__standPlay = () => { play(); return true; };
  window.__standPause = () => { pause(); return true; };
  window.__standState = () => ({
    part: PART, ir: IR, ready: !!state.slots, error: $('err').textContent,
    t: state.transport.now(), playing: state.transport.isPlaying(),
    cur: state.cur, rowsTotal: state.planned ? state.planned.length : 0,
    pageIdx: Math.floor(state.cur / ROWS), pages: state.planned ? Math.ceil(state.planned.length / ROWS) : 0,
    ring: (state.slots || []).map(sl => sl ? sl.idx : null),
    size: state.size || null, turns: state.turnLog.slice(),
    pieces: state.layers ? state.layers.reduce((a, L) => a + (L ? L.scene.pieces.length : 0), 0) : null,
    instances: state.animInstances ? state.animInstances.length : null,
    overlay: state.live ? state.live.stats() : null,
    standalone: !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)),
  });

  try {
    const [glyphs, pageRules, container, irRes] = await Promise.all([
      fetch('/notation/lib/glyphs.json').then(r => { if (!r.ok) throw new Error('glyphs fetch ' + r.status); return r.json(); }),
      fetch('/notation/registry/page_rules.json').then(r => { if (!r.ok) throw new Error('page rules fetch ' + r.status); return r.json(); }),
      fetch('/notation/registry/container.json').then(r => { if (!r.ok) throw new Error('container fetch ' + r.status); return r.json(); }),
      fetch('/notation/ir/' + IR + '.ir.json').then(r => { if (!r.ok) throw new Error('IR fetch ' + IR + ' ' + r.status); return r.json(); }),
    ]);
    state.glyphs = glyphs; state.pageRules = pageRules; state.container = container; state.ir = irRes;
    try { await loadScore(state.ir.source.score); } catch (e) { /* the score-level objects are optional */ }
    state.model = NotationLayout.layoutSection(state.ir, state.glyphs, Object.assign(
      { frameParts: state.ir.source.parts },
      (container.engraving && container.engraving.layout) || {}));
    render();
    setTimeout(refit, 300); setTimeout(refit, 1200);
    if (Q.has('t') && isFinite(parseFloat(Q.get('t')))) goto(parseFloat(Q.get('t')));
    else ensureLoop();
    if (Q.get('play') === '1') play();
    else hint('two fingers: play / stop · one finger: cursor · swipe: page', 5000);
  } catch (e) { $('err').textContent = String(e.stack || e); }
})();
</script>
</body>
</html>
