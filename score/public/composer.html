    loadCellToUI(cellId) {
        const cell = (this.databases.cells || []).find(c => c.id === cellId);
        if (!cell) return;
        this.pk.editingCellId = cellId;
        this.pk.cellPitches = (cell.items || []).map(it => {
            const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
            if (it.type === 'chord' && it.midis) {
                const item = { type: 'chord', midis: it.midis, name: it.name || 'Chord' };
                if (it.shapeId) item.shapeId = it.shapeId;
                if (it.root != null) item.root = it.root;
                if (it.instrument) item.instrument = it.instrument;
                return item;
            }
            const midi = it.midi;
            const name = it.name || (midi != null ? noteNames[midi % 12] + (Math.floor(midi / 12) - 1) : '?');
            const item = { midi: midi, name: name };
            if (it.instrument) item.instrument = it.instrument;
            if (it.beater) item.beater = it.beater;
            if (it.articulation) item.articulation = it.articulation;
            return item;
        });
        document.getElementById('pkCellLabel').value = cell.label || '';
        document.getElementById('pkCellInstrument').value = cell.instrument || '';
        // Three-axis behavior — with legacy mapping
        let repeatMode = cell.repeatMode;
        let phrasing = cell.phrasing;
        let ordering = cell.ordering || 'sequential';
        if (!phrasing && cell.playbackBehavior) {
            // Legacy mapping
            if (cell.playbackBehavior === 'loop') { phrasing = 'ostinato'; repeatMode = 'cycle'; }
            else if (cell.playbackBehavior === 'randomPick') { phrasing = 'ostinato'; repeatMode = 'cycle'; ordering = 'random'; }
            else if (cell.playbackBehavior === 'strictPulse') { phrasing = 'pulse'; repeatMode = 'cycle'; }
            else if (cell.playbackBehavior === 'simultaneous') { phrasing = 'simultaneous'; repeatMode = 'once'; }
        }
        document.getElementById('pkCellRepeat').value = repeatMode || 'cycle';
        document.getElementById('pkCellOrdering').value = ordering;
        document.getElementById('pkCellPhrasing').value = phrasing || 'ostinato';
        document.getElementById('pkCellClusterWindow').value = cell.clusterWindowMs || 150;
        document.getElementById('pkCellSustainMs').value = cell.sustainMs || 500;
        document.getElementById('pkCellRingMode').value = cell.ringMode || 'ring';
        document.getElementById('pkCellRingMs').value = cell.ringMs || 500;
        this.updateCellPhrasingUI();
        // Behavior — with backward compat for legacy bounds
        const beh = cell.behavior || {};
        const spd = beh.speed || {};
        const vol = beh.volume || {};
        // Legacy migration: allowedDensityRange → speed, allowedDynamicRange → volume (mapped 1-127 to 1-10)
        const spdStart = spd.start != null ? spd.start : (cell.allowedDensityRange ? cell.allowedDensityRange[0] : 5.0);
        const spdEnd = spd.end != null ? spd.end : (cell.allowedDensityRange ? cell.allowedDensityRange[1] : 5.0);
        const spdCurve = spd.curve || 'linear';
        const volStart = vol.start != null ? vol.start : (cell.allowedDynamicRange ? Math.round(cell.allowedDynamicRange[0] / 12.7 * 10) / 10 : 5.0);
        const volEnd = vol.end != null ? vol.end : (cell.allowedDynamicRange ? Math.round(cell.allowedDynamicRange[1] / 12.7 * 10) / 10 : 5.0);
        const volCurve = vol.curve || 'linear';
        document.getElementById('pkCellSpeedStart').value = spdStart;
        document.getElementById('pkCellSpeedEnd').value = spdEnd;
        document.getElementById('pkCellSpeedCurve').value = spdCurve;
        document.getElementById('pkCellVolStart').value = volStart;
        document.getElementById('pkCellVolEnd').value = volEnd;
        document.getElementById('pkCellVolCurve').value = volCurve;
        document.getElementById('pkCellDefaultDur').value = cell.defaultDurationMs || 1000;
        document.getElementById('pkCellJitter').value = cell.jitter != null ? cell.jitter : 0;
        this.renderCellPitches();
        this.updateCellKeyHighlights();
        this.onCellInstrumentChange();
        this.updateCellPhrasingUI();
        this.setPKStatus('Loaded cell: ' + (cell.label || cell.id));
    },

    renderCellPitches() {
        const container = document.getElementById('pkCellPitches');
        const countEl = document.getElementById('pkCellPitchCount');
        if (!container) return;
        const pitches = this.pk.cellPitches || [];
        if (countEl) countEl.textContent = '(' + pitches.length + ')';
        if (pitches.length === 0) {
            container.innerHTML = '<div style="color:#555;padding:2px 0">Click keys to add pitches</div>';
            return;
        }
        const phrasingEl = document.getElementById('pkCellPhrasing');
        const isCluster = phrasingEl && phrasingEl.value === 'cluster';
        const clusterWindowMs = parseFloat((document.getElementById('pkCellClusterWindow') || {}).value) || 150;
        let html = '';
        pitches.forEach((p, i) => {
            const isChord = p.type === 'chord';
            const isPerc = p.instrument ? InstrumentRegistry.isPerc(p.instrument) : false;
            const nameColor = isChord ? '#64B5F6' : (isPerc ? '#FF9800' : '#8BC34A');
            const instInfo = p.instrument ? InstrumentRegistry.get(p.instrument) : null;
            const instShort = instInfo ? instInfo.name : (p.instrument || '');
            let label = isChord ? ('♫ ' + p.name + ' <span style="color:#888;font-size:8px">(' + p.midis.length + ' notes)</span>') : p.name;
            if (p.instrument) label += ' <span style="color:#666;font-size:8px">[' + instShort + ']</span>';
            const midiDisplay = isChord ? p.midis.join(',') : p.midi;
            const titleText = isChord ? ('Click to play chord: ' + p.name) : ('Click to play ' + p.name);
            html += '<div class="pk-cell-row" draggable="true" data-idx="' + i + '"' + (isChord ? '' : ' data-midi="' + p.midi + '"') + ' style="display:flex;align-items:center;gap:4px;padding:1px 0;border-bottom:1px solid #2a2a2a;cursor:pointer" title="' + titleText + '">';
            html += '<span class="pk-cell-drag" style="cursor:grab;color:#555;font-size:10px;user-select:none;padding:0 2px">⠿</span>';
            html += '<span style="color:#666;font-size:8px;width:14px">' + (i + 1) + '</span>';
            html += '<span style="color:' + nameColor + ';flex:1">' + label + '</span>';
            if (isCluster) {
                const hasPos = typeof p.position === 'number' && isFinite(p.position);
                const defaultPos = pitches.length > 1 ? i / (pitches.length - 1) : 0;
                const posVal = hasPos ? p.position : defaultPos;
                const posMs = Math.round(posVal * clusterWindowMs);
                const placeholder = defaultPos.toFixed(2);
                const inputVal = hasPos ? p.position : '';
                html += '<span style="color:#666;font-size:8px" title="Cluster position 0..1 (blank = even spacing)">Pos:</span>';
                html += '<input class="pk-cell-pos" data-idx="' + i + '" type="number" min="0" max="1" step="0.01" value="' + inputVal + '" placeholder="' + placeholder + '" style="width:40px;font-size:8px;background:#222;color:#ccc;border:1px solid #444;border-radius:2px;padding:0 2px" title="0..1 — blank uses even spacing">';
                html += '<span style="color:#555;font-size:8px;width:30px;text-align:right" title="Computed ms at current window">' + posMs + 'ms</span>';
            }
            html += '<span style="color:#555;font-size:8px">' + midiDisplay + '</span>';
            html += '<button class="pk-cell-remove" data-idx="' + i + '" style="font-size:8px;padding:0 3px;background:#333;color:#C62828;border:1px solid #555;border-radius:2px;cursor:pointer">−</button>';
            html += '</div>';
        });
        container.innerHTML = html;
        // Click to audition
        container.querySelectorAll('.pk-cell-row').forEach(row => {
            row.addEventListener('click', (e) => {
                if (e.target.classList.contains('pk-cell-remove') || e.target.classList.contains('pk-cell-drag')) return;
                const idx = parseInt(row.dataset.idx, 10);
                const item = this.pk.cellPitches && this.pk.cellPitches[idx];
                if (!item) return;
                if (item.type === 'chord' && item.midis) {
                    this.auditionCellChordItem(item);
                } else {
                    this.auditionSingleCellPitch(item.midi, item.instrument);
                }
            });
        });
        // Remove button
        container.querySelectorAll('.pk-cell-remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                this.removeCellPitch(parseInt(btn.dataset.idx, 10));
            });
        });
        // Cluster position input — persist 0..1 on the item; blank clears to even-spacing default
        container.querySelectorAll('.pk-cell-pos').forEach(inp => {
            inp.addEventListener('click', (e) => e.stopPropagation());
            inp.addEventListener('change', () => {
                const idx = parseInt(inp.dataset.idx, 10);
                const item = this.pk.cellPitches && this.pk.cellPitches[idx];
                if (!item) return;
                const raw = inp.value.trim();
                if (raw === '') {
                    delete item.position;
                } else {
                    let v = parseFloat(raw);
                    if (!isFinite(v)) { delete item.position; }
                    else {
                        v = Math.max(0, Math.min(1, v));
                        item.position = v;
                    }
                }
                this.renderCellPitches();
            });
        });
        // Drag-to-reorder
        let dragIdx = null;
        container.querySelectorAll('.pk-cell-row').forEach(row => {
            row.addEventListener('dragstart', (e) => {
                dragIdx = parseInt(row.dataset.idx, 10);
                row.style.opacity = '0.4';
                e.dataTransfer.effectAllowed = 'move';
            });
            row.addEventListener('dragend', () => {
                row.style.opacity = '';
                container.querySelectorAll('.pk-cell-row').forEach(r => {
                    r.style.borderTop = '';
                    r.style.borderBottom = '';
                });
            });
            row.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const targetIdx = parseInt(row.dataset.idx, 10);
                container.querySelectorAll('.pk-cell-row').forEach(r => {
                    r.style.borderTop = '';
                    r.style.borderBottom = '';
                });
                if (targetIdx < dragIdx) {
                    row.style.borderTop = '2px solid #4CAF50';
                } else if (targetIdx > dragIdx) {
                    row.style.borderBottom = '2px solid #4CAF50';
                }
            });
            row.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetIdx = parseInt(row.dataset.idx, 10);
                if (dragIdx == null || dragIdx === targetIdx) return;
                const arr = this.pk.cellPitches;
                const [item] = arr.splice(dragIdx, 1);
                arr.splice(targetIdx, 0, item);
                this.renderCellPitches();
                this.updateCellKeyHighlights();
                this.setPKStatus('Reordered: ' + item.name + ' → position ' + (targetIdx + 1));
            });
        });
    },

    removeCellPitch(idx) {
        if (!this.pk.cellPitches || idx < 0 || idx >= this.pk.cellPitches.length) return;
        const removed = this.pk.cellPitches.splice(idx, 1)[0];
        this.renderCellPitches();
        this.updateCellKeyHighlights();
        this.setPKStatus('Removed ' + removed.name + ' — ' + this.pk.cellPitches.length + ' pitches');
    },

    updateCellKeyHighlights() {
        this.pk.keys.forEach(k => {
            if (k.el) k.el.classList.remove('pk-toggled', 'pk-root', 'pk-cell-selected');
        });
        const pitches = this.pk.cellPitches || [];
        const midiSet = new Set(pitches.flatMap(p => p.type === 'chord' && p.midis ? p.midis : (p.midi != null ? [p.midi] : [])));
        // Build chord shape MIDI set if root + shape selected
        const shapeMidis = new Set();
        const shapes = (this.databases && this.databases.chordShapes) || [];
        const sIdx = this.pk.cellShapeIdx;
        const cRoot = this.pk.cellChordRoot;
        if (cRoot != null && sIdx >= 0 && sIdx < shapes.length) {
            shapes[sIdx].intervals.forEach(i => {
                const m = cRoot + i;
                if (m >= 21 && m <= 108) shapeMidis.add(m);
            });
        }
        this.pk.keys.forEach(k => {
            if (midiSet.has(k.midi)) {
                k.el.classList.add('pk-toggled');
            }
            if (this.pk.cellSelectedKey && k.midi === this.pk.cellSelectedKey.midi) {
                k.el.classList.add('pk-cell-selected');
            }
            if (shapeMidis.has(k.midi)) {
                k.el.classList.add('pk-cell-selected');
                if (k.midi === cRoot) k.el.classList.add('pk-root');
            }
        });
    },

    previewCellSelectedKey() {
        const k = this.pk.cellSelectedKey;
        if (!k) { this.setPKStatus('No key selected — click a key first'); return; }
        const inst = document.getElementById('pkCellInstrument').value || null;
        this.auditionSingleCellPitch(k.midi, inst);
        this.setPKStatus('Preview: ' + k.name + ' (MIDI ' + k.midi + ')');
    },

    addCellSelectedKey() {
        const k = this.pk.cellSelectedKey;
        if (!k) { this.setPKStatus('No key selected — click a key first'); return; }
        if (!this.pk.cellPitches) this.pk.cellPitches = [];
        const inst = document.getElementById('pkCellInstrument').value || null;
        const item = { midi: k.midi, name: k.name };
        if (inst) item.instrument = inst;
        this.pk.cellPitches.push(item);
        this.renderCellPitches();
        this.updateCellKeyHighlights();
        const instLabel = inst ? ' [' + inst + ']' : '';
        this.setPKStatus('Added ' + k.name + instLabel + ' — ' + this.pk.cellPitches.length + ' items');
    },

    refreshCellShapeSelect() {
        const sel = document.getElementById('pkCellShapeSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">— Shape —</option>';
        const shapes = (this.databases && this.databases.chordShapes) || [];
        shapes.forEach((s, i) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = s.structuredName;
            sel.appendChild(opt);
        });
    },

    updateCellPhrasingUI() {
        const phrasing = document.getElementById('pkCellPhrasing').value;
        const repeat = document.getElementById('pkCellRepeat').value;
        const ringMode = document.getElementById('pkCellRingMode').value;
        const isSimOrCluster = phrasing === 'simultaneous' || phrasing === 'cluster';
        // Cluster window: show only for cluster phrasing
        document.getElementById('pkCellClusterWindow').style.display = phrasing === 'cluster' ? '' : 'none';
        // Re-render pitch rows so per-item Pos inputs appear/disappear with cluster phrasing
        this.renderCellPitches();
        // Sustain label + input: show only for simultaneous phrasing
        document.getElementById('pkCellSustainLabel').style.display = phrasing === 'simultaneous' ? '' : 'none';
        document.getElementById('pkCellSustainMs').style.display = phrasing === 'simultaneous' ? '' : 'none';
        // Ring mode: show for simultaneous or cluster
        document.getElementById('pkCellRingMode').style.display = isSimOrCluster ? '' : 'none';
        // Ring time: show only for cluster + cut mode
        const showRingMs = phrasing === 'cluster' && ringMode === 'cut';
        document.getElementById('pkCellRingMsLabel').style.display = showRingMs ? '' : 'none';
        document.getElementById('pkCellRingMs').style.display = showRingMs ? '' : 'none';
        // Default duration row: hide when (cluster or simultaneous) + once
        const hideDefaultDur = (phrasing === 'cluster' || phrasing === 'simultaneous') && repeat === 'once';
        document.getElementById('pkCellDurRow').style.display = hideDefaultDur ? 'none' : 'flex';
    },

    clearCellShape() {
        this.pk.cellShapeIdx = -1;
        document.getElementById('pkCellShapeSelect').value = '';
        this.updateCellKeyHighlights();
        this.setPKStatus('Shape cleared');
    },

    onCellShapeChange() {
        const idx = parseInt(document.getElementById('pkCellShapeSelect').value, 10);
        this.pk.cellShapeIdx = isNaN(idx) ? -1 : idx;
        this.updateCellKeyHighlights();
        const shapes = (this.databases && this.databases.chordShapes) || [];
        if (this.pk.cellShapeIdx >= 0 && this.pk.cellShapeIdx < shapes.length) {
            const shape = shapes[this.pk.cellShapeIdx];
            const rootName = this.pk.cellChordRoot != null
                ? (this.pk.keys.find(k => k.midi === this.pk.cellChordRoot) || {}).name || '?'
                : '—';
            this.setPKStatus('Shape: ' + shape.structuredName + ' on ' + rootName + ' — ▶ Chord to play, + Shape to add all');
        }
    },

    playCellChord() {
        const shapes = (this.databases && this.databases.chordShapes) || [];
        const idx = this.pk.cellShapeIdx;
        const root = this.pk.cellChordRoot;
        if (root == null) { this.setPKStatus('Click a key to set root first'); return; }

        let midis;
        if (idx >= 0 && idx < shapes.length) {
            midis = shapes[idx].intervals.map(i => root + i).filter(m => m >= 21 && m <= 108);
        } else {
            midis = [root];
        }

        if (!this.pk.midiOut) { this.setPKStatus('No MIDI output available'); return; }

        const inst = document.getElementById('pkCellInstrument').value || 'main_piano';
        const _r = InstrumentRegistry.getRouting('piano1', inst);
        const channel = _r ? (_r.channel - 1) : 0;
        const velocity = 80;
        const durationMs = 1500;

        midis.forEach(midi => { this.pk.midiOut.send([0x90 | channel, midi, velocity]); });

        // Visual feedback
        const btn = document.getElementById('pkCellPlayChord');
        midis.forEach(midi => {
            const key = this.pk.keys.find(k => k.midi === midi);
            if (key && key.el) key.el.classList.add('pk-active');
        });
        if (btn) { btn.style.background = '#4A148C'; }

        const shapeName = (idx >= 0 && idx < shapes.length) ? shapes[idx].structuredName : 'single pitch';
        this.setPKStatus('Playing: ' + shapeName);

        setTimeout(() => {
            midis.forEach(midi => {
                this.pk.midiOut.send([0x80 | channel, midi, 0]);
                const key = this.pk.keys.find(k => k.midi === midi);
                if (key && key.el) key.el.classList.remove('pk-active');
            });
            if (btn) { btn.style.background = ''; }
        }, durationMs);
    },

    addCellChord() {
        const shapes = (this.databases && this.databases.chordShapes) || [];
        const idx = this.pk.cellShapeIdx;
        const root = this.pk.cellChordRoot;
        if (root == null) { this.setPKStatus('Click a key to set root first'); return; }
        if (idx < 0 || idx >= shapes.length) { this.setPKStatus('Select a shape first'); return; }

        const shape = shapes[idx];
        const midis = shape.intervals.map(i => root + i).filter(m => m >= 21 && m <= 108);
        if (midis.length === 0) { this.setPKStatus('No valid pitches in shape'); return; }

        if (!this.pk.cellPitches) this.pk.cellPitches = [];
        const inst = document.getElementById('pkCellInstrument').value || null;
        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const rootName = noteNames[root % 12] + (Math.floor(root / 12) - 1);
        const label = shape.structuredName + ' on ' + rootName;
        const item = { type: 'chord', midis: midis, name: label, shapeId: shape.id, root: root };
        if (inst) item.instrument = inst;
        this.pk.cellPitches.push(item);

        this.renderCellPitches();
        this.updateCellKeyHighlights();
        this.setPKStatus('Added chord: ' + label + ' (' + midis.length + ' notes) — ' + this.pk.cellPitches.length + ' items total');
    },

    async auditionSingleCellPitch(midi, itemInstrument) {
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { this.setPKStatus('No MIDI access'); return; }
        }
        let output = this.pk.midiOut;
        let channel = 0;
        const inst = itemInstrument || document.getElementById('pkCellInstrument').value;
        if (inst) {
            const isPerc = InstrumentRegistry.isPerc(inst);
            const routing = InstrumentRegistry.getRouting(isPerc ? 'perc1' : 'piano1', inst);
            if (routing) {
                const portName = (routing.port || '').toLowerCase();
                for (const [name, out] of Object.entries(this._zoneMidiOutputs)) {
                    if (name.includes(portName)) { output = out; break; }
                }
                channel = (routing.channel || 1) - 1;
            }
        }
        if (!output) { this.setPKStatus('No MIDI output'); return; }
        const vel = 80;
        const durMs = 400;
        output.send([0x90 | channel, midi, vel]);
        setTimeout(() => output.send([0x80 | channel, midi, 0]), durMs);
        this.highlightPianoKey(midi, null, durMs);
    },

    async auditionCellChordItem(item) {
        if (!item || !item.midis || item.midis.length === 0) return;
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { this.setPKStatus('No MIDI access'); return; }
        }
        let output = this.pk.midiOut;
        let channel = 0;
        const inst = item.instrument || document.getElementById('pkCellInstrument').value;
        if (inst) {
            const isPerc = InstrumentRegistry.isPerc(inst);
            const routing = InstrumentRegistry.getRouting(isPerc ? 'perc1' : 'piano1', inst);
            if (routing) {
                const portName = (routing.port || '').toLowerCase();
                for (const [name, out] of Object.entries(this._zoneMidiOutputs)) {
                    if (name.includes(portName)) { output = out; break; }
                }
                channel = (routing.channel || 1) - 1;
            }
        }
        if (!output) { this.setPKStatus('No MIDI output'); return; }
        const vel = 80;
        const durMs = 600;
        item.midis.forEach(midi => {
            output.send([0x90 | channel, midi, vel]);
            this.highlightPianoKey(midi, null, durMs);
        });
        setTimeout(() => {
            item.midis.forEach(midi => output.send([0x80 | channel, midi, 0]));
        }, durMs);
    },

    _getCellFromUI() {
        const label = document.getElementById('pkCellLabel').value.trim();
        const instrument = document.getElementById('pkCellInstrument').value || null;
        const repeatMode = document.getElementById('pkCellRepeat').value || 'cycle';
        const ordering = document.getElementById('pkCellOrdering').value || 'sequential';
        const phrasing = document.getElementById('pkCellPhrasing').value || 'ostinato';
        const clusterWindowMs = phrasing === 'cluster' ? (parseInt(document.getElementById('pkCellClusterWindow').value) || 150) : null;
        const sustainMs = phrasing === 'simultaneous' ? (parseInt(document.getElementById('pkCellSustainMs').value) || 500) : null;
        const isSimOrCluster = phrasing === 'simultaneous' || phrasing === 'cluster';
        const ringMode = isSimOrCluster ? (document.getElementById('pkCellRingMode').value || 'ring') : null;
        const ringMs = (phrasing === 'cluster' && ringMode === 'cut') ? (parseInt(document.getElementById('pkCellRingMs').value) || 500) : null;
        const speedStart = parseFloat(document.getElementById('pkCellSpeedStart').value) || 5.0;
        const speedEnd = parseFloat(document.getElementById('pkCellSpeedEnd').value) || 5.0;
        const speedCurve = document.getElementById('pkCellSpeedCurve').value || 'linear';
        const volStart = parseFloat(document.getElementById('pkCellVolStart').value) || 5.0;
        const volEnd = parseFloat(document.getElementById('pkCellVolEnd').value) || 5.0;
        const volCurve = document.getElementById('pkCellVolCurve').value || 'linear';
        const defaultDurationMs = parseInt(document.getElementById('pkCellDefaultDur').value) || 1000;
        const jitter = parseFloat(document.getElementById('pkCellJitter').value) || 0;
        return {
            label: label || 'Untitled Cell',
            instrument: instrument,
            items: (this.pk.cellPitches || []).map(p => {
                if (p.type === 'chord') {
                    const it = { type: 'chord', midis: p.midis, name: p.name };
                    if (p.shapeId) it.shapeId = p.shapeId;
                    if (p.root != null) it.root = p.root;
                    if (p.instrument) it.instrument = p.instrument;
                    if (typeof p.position === 'number') it.position = p.position;
                    return it;
                }
                const it = { midi: p.midi };
                if (p.name) it.name = p.name;
                if (p.instrument) it.instrument = p.instrument;
                if (p.beater) it.beater = p.beater;
                if (p.articulation) it.articulation = p.articulation;
                if (typeof p.position === 'number') it.position = p.position;
                return it;
            }),
            repeatMode: repeatMode,
            ordering: ordering,
            phrasing: phrasing,
            clusterWindowMs: clusterWindowMs,
            sustainMs: sustainMs,
            ringMode: ringMode,
            ringMs: ringMs,
            defaultDurationMs: defaultDurationMs,
            jitter: jitter,
            behavior: {
                speed: { start: speedStart, end: speedEnd, curve: speedCurve },
                volume: { start: volStart, end: volEnd, curve: volCurve }
            }
        };
    },

    saveCell() {
        const pitches = this.pk.cellPitches || [];
        if (pitches.length === 0) {
            this.setPKStatus('Cannot save — no pitches in cell');
            return;
        }
        const data = this._getCellFromUI();
        if (this.pk.editingCellId) {
            // Update existing cell
            const cell = this.databases.cells.find(c => c.id === this.pk.editingCellId);
            if (cell) {
                Object.assign(cell, data);
                this.refreshCellSelect();
                document.getElementById('pkCellSelect').value = cell.id;
                this.setPKStatus('Updated cell: ' + cell.label);
                this.markDirty();
                return;
            }
        }
        // Check for duplicate name
        const dupCell = this.databases.cells.find(c => c.label === data.label);
        if (dupCell) {
            if (!confirm('A cell named "' + data.label + '" already exists. Overwrite it?')) {
                this.setPKStatus('Save cancelled — rename to avoid duplicate');
                return;
            }
            // Overwrite existing cell
            Object.assign(dupCell, data);
            this.pk.editingCellId = dupCell.id;
            this.refreshCellSelect();
            document.getElementById('pkCellSelect').value = dupCell.id;
            this.setPKStatus('Overwrote cell: ' + dupCell.label);
            this.markDirty();
            return;
        }
        // Create new cell
        const id = 'cell_' + String((this.databases.cells || []).length + 1).padStart(3, '0') + '_' + Date.now();
        const cell = { id, ...data, createdAt: new Date().toISOString() };
        this.databases.cells.push(cell);
        this.pk.editingCellId = id;
        this.refreshCellSelect();
        document.getElementById('pkCellSelect').value = id;
        this.setPKStatus('Saved new cell: ' + cell.label);
        this.markDirty();
    },

    async auditionCell() {
        const data = this._getCellFromUI();
        if (data.items.length === 0) {
            this.setPKStatus('Cannot audition — no pitches');
            return;
        }

        // Use cell's behavior as-is (deterministic audition)
        const audDur = parseInt(document.getElementById('pkCellDefaultDur').value) || 1000;
        const cellInstance = { durationMs: audDur };
        // behavior comes from data (via _getCellFromUI) — realizeCellEvents reads data.behavior as default

        const events = realizeCellEvents(data, cellInstance, 0);
        if (events.length === 0) {
            this.setPKStatus('No events generated');
            return;
        }

        // Ensure MIDI output
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { this.setPKStatus('No MIDI access'); return; }
        }

        // Resolve routing per-event from _instrument (fallback to cell-level instrument)
        const defaultOutput = this.pk.midiOut;
        const outs = this._zoneMidiOutputs;
        function resolveEvtRouting(evtInst) {
            if (!evtInst) return { output: defaultOutput, channel: 0 };
            const isPerc = InstrumentRegistry.isPerc(evtInst);
            const routing = InstrumentRegistry.getRouting(isPerc ? 'perc1' : 'piano1', evtInst);
            if (routing) {
                const portName = (routing.port || '').toLowerCase();
                for (const [name, out] of Object.entries(outs)) {
                    if (name.includes(portName)) return { output: out, channel: (routing.channel || 1) - 1 };
                }
            }
            return { output: defaultOutput, channel: 0 };
        }
        if (!defaultOutput && Object.keys(outs).length === 0) { this.setPKStatus('No MIDI output'); return; }

        // Play events with per-event routing
        events.forEach(evt => {
            const delay = evt.onsetMs;
            const instKey = evt._instrument || data.instrument || null;
            const { output, channel } = resolveEvtRouting(instKey);
            if (!output) return;
            if (evt._cc != null) {
                setTimeout(() => { output.send([0xB0 | channel, evt._cc, evt._ccValue != null ? evt._ccValue : 0]); }, delay);
                return;
            }
            setTimeout(() => {
                evt.notes.forEach(m => output.send([0x90 | channel, m, evt.velocity]));
                const noteDur = (evt.durations && evt.durations[0]) || 200;
                setTimeout(() => {
                    evt.notes.forEach(m => output.send([0x80 | channel, m, 0]));
                }, noteDur);
            }, delay);
        });

        let totalMs = 0;
        for (const evt of events) {
            const end = evt._cc != null ? evt.onsetMs : evt.onsetMs + ((evt.durations && evt.durations[0]) || 200);
            if (end > totalMs) totalMs = end;
        }
        const beh = data.behavior || {};
        const spdDesc = (beh.speed ? beh.speed.start + '→' + beh.speed.end : '?');
        const volDesc = (beh.volume ? beh.volume.start + '→' + beh.volume.end : '?');
        this.setPKStatus('▶ ' + events.length + ' events, ' + (totalMs / 1000).toFixed(1) + 's, ' + data.phrasing + '/' + data.repeatMode + ' spd:' + spdDesc + ' vol:' + volDesc);
    },

    deleteCell() {
        if (!this.pk.editingCellId) {
            this.setPKStatus('No cell selected to delete');
            return;
        }
        const cell = this.databases.cells.find(c => c.id === this.pk.editingCellId);
        if (!cell) return;
        if (!confirm('Delete cell "' + (cell.label || cell.id) + '"?')) return;
        const idx = this.databases.cells.indexOf(cell);
        if (idx >= 0) this.databases.cells.splice(idx, 1);
        this.pk.editingCellId = null;
        this.pk.cellPitches = [];
        document.getElementById('pkCellLabel').value = '';
        this.refreshCellSelect();
        this.renderCellPitches();
        this.setPKStatus('Deleted cell: ' + (cell.label || cell.id));
        this.markDirty();
    },

    onPercSetSelectChange() {
        const val = this.pk.percSetSelect.value;
        if (val === '__new') {
            const name = prompt('Set name:');
            if (!name) { this.pk.percSetSelect.value = this.pk.activeSetId || ''; return; }
            if (!this.databases.sets) this.databases.sets = [];
            const id = 'set_' + String(this.databases.sets.length + 1).padStart(3, '0');
            const newSet = { id, name, items: [], createdAt: new Date().toISOString() };
            this.databases.sets.push(newSet);
            this.pk.activeSetId = id;
            this.refreshPercSetSelect();
            this.pk.percSetSelect.value = id;
            this.refreshSetSelect();
            this.renderSetItems();
            this.setPKStatus('Created set: ' + name);
            this.markDirty();
        } else {
            this.pk.activeSetId = val || null;
            // Sync piano set select if it exists
            if (this.pk.setSelect) this.pk.setSelect.value = val || '';
            this.renderSetItems();
        }
    },

    setPKStatus(text) {
        const span = this.pk.featurebar.querySelector('.pk-status');
        if (span) span.textContent = text;
    },

    setPKAnalysis(text) {
        const span = this.pk.featurebar.querySelector('.pk-analysis');
        if (span) span.textContent = text;
    },

    togglePianoKeyboard() {
        if (this.pk.el.style.display === 'none' || !this.pk.el.style.display) {
            this.showPianoKeyboard();
        } else {
            this.hidePianoKeyboard();
        }
    },

    showPianoKeyboard() {
        const pk = this.pk.el;
        pk.style.display = 'flex';
        if (!pk.style.left) {
            pk.style.left = '50px';
            pk.style.top = (window.innerHeight - 300) + 'px';
            pk.style.width = '750px';
        }
        if (!pk.style.height) {
            pk.style.height = '280px';
        }
    },

    hidePianoKeyboard() {
        this.pk.el.style.display = 'none';
    },

    savePKPos() {
        const pk = this.pk.el;
        const pos = {
            left: pk.style.left, top: pk.style.top,
            width: pk.style.width,
            height: pk.style.height,
            keyHeight: pk.querySelector('.pk-keys').style.height
        };
        try { localStorage.setItem('composerPKPos', JSON.stringify(pos)); } catch(e) {}
    },

    // Clamp the keyboard panel position so the drag-bar always stays inside
    // the viewport. Without this, dragging the panel above `top: 0` hides
    // the drag-bar and there's no way to recover access. Used by both the
    // drag-handler (live) and the localStorage restore (load-time).
    _clampPKPosition(left, top, panelWidth) {
        const DRAGBAR_HEIGHT = 40;            // a bit of slack over actual ~24px bar
        const MIN_VISIBLE_X  = 100;           // keep ≥ 100px of bar reachable horizontally
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const w    = panelWidth || 750;
        const minLeft = -(w - MIN_VISIBLE_X);
        const maxLeft = winW - MIN_VISIBLE_X;
        const minTop  = 0;
        const maxTop  = Math.max(0, winH - DRAGBAR_HEIGHT);
        return {
            left: Math.max(minLeft, Math.min(maxLeft, left)),
            top:  Math.max(minTop,  Math.min(maxTop,  top))
        };
    },

    setupPKDrag() {
        const pk = this.pk.el;
        const bar = this.pk.dragbar;
        let dragging = false, sx, sy, sl, st;

        bar.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('pk-close')) return;
            dragging = true;
            sx = e.clientX; sy = e.clientY;
            sl = pk.offsetLeft; st = pk.offsetTop;
            bar.style.cursor = 'grabbing';
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const rawLeft = sl + e.clientX - sx;
            const rawTop  = st + e.clientY - sy;
            const clamped = this._clampPKPosition(rawLeft, rawTop, pk.offsetWidth);
            pk.style.left = clamped.left + 'px';
            pk.style.top  = clamped.top  + 'px';
        });
        window.addEventListener('mouseup', () => {
            if (dragging) { dragging = false; bar.style.cursor = 'grab'; this.savePKPos(); }
        });
    },

    setupPKResize() {
        const pk = this.pk.el;
        const handle = this.pk.resizeHandle;
        let resizing = false, sx, sy, sw, sh;

        handle.addEventListener('mousedown', (e) => {
            resizing = true;
            sx = e.clientX; sy = e.clientY;
            sw = pk.offsetWidth;
            sh = pk.offsetHeight;
            e.preventDefault(); e.stopPropagation();
        });
        window.addEventListener('mousemove', (e) => {
            if (!resizing) return;
            const nw = Math.max(400, sw + e.clientX - sx);
            const nh = Math.max(120, sh + e.clientY - sy);
            pk.style.width = nw + 'px';
            pk.style.height = nh + 'px';
        });
        window.addEventListener('mouseup', () => {
            if (resizing) { resizing = false; this.savePKPos(); }
        });
    },

    setupPKSplit() {
        const split = this.pk.el.querySelector('.pk-split');
        if (!split) return;
        const keysEl = this.pk.keysContainer;
        let dragging = false, startY, startH;

        split.addEventListener('mousedown', (e) => {
            dragging = true;
            startY = e.clientY;
            startH = keysEl.offsetHeight;
            e.preventDefault(); e.stopPropagation();
        });
        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const nh = Math.max(40, startH + (e.clientY - startY));
            keysEl.style.height = nh + 'px';
        });
        window.addEventListener('mouseup', () => {
            if (dragging) { dragging = false; this.savePKPos(); }
        });
    },

    highlightPianoKey(midi, color, durationMs) {
        const key = this.pk.keys.find(k => k.midi === midi);
        if (!key || !key.el) return;
        key.el.classList.add('pk-active');
        if (color) key.el.style.background = color;
        if (durationMs) {
            setTimeout(() => {
                key.el.classList.remove('pk-active');
                key.el.style.background = '';
            }, durationMs);
        }
    },

    clearPianoHighlights() {
        this.pk.keys.forEach(k => {
            if (k.el) { k.el.classList.remove('pk-active'); k.el.style.background = ''; }
        });
    }
};

// Global: green flash on number input commit (change = Enter or blur)
document.addEventListener('change', (e) => {
    if (e.target.matches('input[type="number"]')) {
        e.target.classList.remove('input-committed');
        void e.target.offsetWidth; // force reflow to restart animation
        e.target.classList.add('input-committed');
        e.target.addEventListener('animationend', () => {
            e.target.classList.remove('input-committed');
        }, { once: true });
    }
}, true);

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', () => Composer.init());
</script>

<script>
// ---- BLASTS insertion strip ----
(function () {
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const nmOf = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
  let TAXB = null, activeList = null, selectedSon = null;
  let CBANK = null, srcMode = 'blasts', selectedCg = null, cgPending = [];

  async function loadTaxB() {
    TAXB = (await fetch('/api/taxonomy').then(r => r.json())).tax;
    try { CBANK = (await fetch('/api/clusterbank').then(r => r.json())).bank; } catch (e) { CBANK = null; }
    const sel = document.getElementById('blastListSel');
    const src = srcMode === 'clusters' ? ((CBANK && CBANK.lists) || {}) : (TAXB.customLists || {});
    const lists = Object.keys(src);
    sel.innerHTML = '';
    lists.forEach(l => {
      const o = document.createElement('option');
      o.value = l; o.textContent = l + ' (' + (src[l] || []).length + ')';
      sel.appendChild(o);
    });
    if (!lists.length) {
      const o = document.createElement('option');
      o.value = ''; o.textContent = '(no lists yet' + (srcMode === 'clusters' ? ' \u2014 store from the cluster sandbox)' : ')');
      sel.appendChild(o);
    }
    activeList = lists.includes(activeList) ? activeList : lists[0] || null;
    if (activeList) sel.value = activeList;
    drawMinis();
  }

  function sonEntries() {
    if (!TAXB || !activeList) return [];
    return (TAXB.customLists[activeList] || [])
      .map(id => [id, (TAXB.sonorities || {})[id]])
      .filter(([, s]) => s);
  }

  function miniFor(id, son) {
    const wrap = document.createElement('div');
    wrap.dataset.sid = id;
    wrap.style.cssText = 'display:inline-block; width:26px; margin:0 3px; cursor:pointer; vertical-align:top; text-align:center';
    const c = document.createElement('canvas');
    c.width = 26; c.height = 96;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#26262a'; ctx.fillRect(0, 0, 26, 96);
    const LOK = 30, HIK = 67, rows = HIK - LOK + 1, rh = 96 / rows;
    const cv = new Set([...(son.cuivreConverted || []), ...(son.cuivreAdded || [])]);
    son.pitches.forEach(m => {
      if (m < LOK || m > HIK) return;
      ctx.fillStyle = cv.has(m) ? '#ff9c54' : '#ffd479';
      ctx.fillRect(0, (HIK - m) * rh, 26, Math.max(1.4, rh));
    });
    wrap.appendChild(c);
    const arts = [...new Set(Object.values(son.artic || {}))];
    const short = { ord: 'o', fortepiano: 'fp', staccato: 's' };
    const lab = document.createElement('div');
    lab.textContent = son.chord.replace('VERT01-', '').replace(/^0/, '');   // chord number
    lab.style.cssText = 'font-size:9px; color:#bbb; font-weight:600; line-height:1.1';
    wrap.appendChild(lab);
    const sub = document.createElement('div');
    sub.textContent = son.voicing.replace('*', '') + ' ' + (arts.length === 1 ? (short[arts[0]] || '?') : 'mx');
    sub.style.cssText = 'font-size:7.5px; color:#888; line-height:1.1';
    wrap.appendChild(sub);
    wrap.addEventListener('click', () => selectSon(id));
    wrap.addEventListener('dblclick', () => selectSon(id, true));
    wrap.addEventListener('mouseenter', () => showInfo(id, son, true));
    wrap.addEventListener('mouseleave', () => {
      if (selectedSon) showInfo(selectedSon, (TAXB.sonorities || {})[selectedSon], false);
    });
    if (id === selectedSon) {
      c.style.outline = '2px solid #ffd479';
      lab.style.color = '#ffd479';
      sub.style.color = '#ffd479';
    }
    return wrap;
  }

  const NAMES2 = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const pname = m => NAMES2[m % 12] + (Math.floor(m / 12) - 1);
  function describe(id, son) {
    const arts = [...new Set(Object.values(son.artic || {}))];
    const artTxt = arts.length === 1
      ? ({ ord: 'ordinario', fortepiano: 'fortepiano', staccato: 'staccato' }[arts[0]] || arts[0])
      : 'mixed (' + arts.map(a => a[0]).join('/') + ')';
    const cv = [...(son.cuivreConverted || []), ...(son.cuivreAdded || [])];
    return id + '  \u00b7  ' + son.chord.replace('VERT01-', 'chord ') + ' ' + son.voicing +
      '  \u00b7  ' + artTxt + '  \u00b7  ' + son.pitches.length + ' parts' +
      (cv.length ? '  \u00b7  cuivre ' + cv.map(pname).join(' ') : '') +
      '  \u00b7  dyn ' + son.dyn +
      (arts.includes('ord') ? '  \u00b7  ' + (son.ordLen || 1) + 's' : '') +
      '  [' + son.pitches.map(pname).join(' ') + ']';
  }
  function showInfo(id, son, hovering) {
    if (!son) return;
    const el = document.getElementById('blastInfo');
    el.textContent = (hovering && id !== selectedSon ? '\u25b8 ' : '\u25c9 ') + describe(id, son);
    el.style.color = (hovering && id !== selectedSon) ? '#8fb3a5' : '#ffd479';
  }
  const hearOn = () => document.getElementById('blastHear').checked;
  function selectSon(id, forceHear) {
    const son = (TAXB.sonorities || {})[id];
    if (!son) return;
    selectedSon = id;
    drawMinis();
    showInfo(id, son, false);
    if (forceHear || hearOn()) auditionSon(son);
    const box = document.getElementById('blastMinis');
    const el = [...box.children].find(c => c.dataset.sid === id);
    if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }
  function stepSon(dir) {
    if (srcMode === 'clusters') {
      const ids = cgEntries().map(([id]) => id);
      if (!ids.length) return;
      const i = ids.indexOf(selectedCg);
      selectCg(ids[Math.max(0, Math.min(ids.length - 1, (i < 0 ? 0 : i + dir)))]);
      return;
    }
    const ids = sonEntries().map(([id]) => id);
    if (!ids.length) return;
    const i = ids.indexOf(selectedSon);
    selectSon(ids[Math.max(0, Math.min(ids.length - 1, (i < 0 ? 0 : i + dir)))]);
  }

  function cgEntries() {
    if (!CBANK || !activeList) return [];
    return ((CBANK.lists || {})[activeList] || [])
      .filter(id => CBANK.gestures[id])
      .map(id => [id, CBANK.gestures[id]]);
  }
  function cgMiniFor(id, cg) {
    // a tiny piano-roll thumbnail: time x pitch dots
    const wrap = document.createElement('div');
    wrap.dataset.sid = id;
    wrap.style.cssText = 'display:inline-block; width:56px; margin:0 3px; cursor:pointer; vertical-align:top; text-align:center';
    const c = document.createElement('canvas');
    c.width = 56; c.height = 44;
    c.style.cssText = 'background:#26262a; border-radius:3px; display:block';
    const ctx = c.getContext('2d');
    const span = Math.max(cg.span, 0.3);
    ctx.fillStyle = '#8fdbe8';
    for (const e of cg.events) {
      ctx.fillRect(2 + 52 * e.t / span, 42 - 40 * (e.p - 30) / 37, 1.6, 1.6);
    }
    wrap.appendChild(c);
    const lab = document.createElement('div');
    lab.textContent = id;
    lab.style.cssText = 'font-size:8.5px; color:#8fdbe8; line-height:1.2';
    wrap.appendChild(lab);
    if (id === selectedCg) c.style.outline = '2px solid #3FA7B8';
    wrap.addEventListener('click', () => selectCg(id));
    wrap.addEventListener('dblclick', () => selectCg(id, true));
    wrap.addEventListener('mouseenter', () => showCgInfo(id, cg, true));
    wrap.addEventListener('mouseleave', () => {
      if (selectedCg && CBANK.gestures[selectedCg]) showCgInfo(selectedCg, CBANK.gestures[selectedCg], false);
    });
    return wrap;
  }
  function cgDescribe(id, cg) {
    const pv = cg.provenance || {};
    const tr = pv.transforms || {};
    const bits = [];
    if (tr.stretch && tr.stretch !== 1) bits.push('\u00d7' + tr.stretch);
    if (tr.tonality) bits.push(tr.tonality);
    if (tr.chord) bits.push('ch' + String(tr.chord).replace('VERT01-', ''));
    if (tr.reverse) bits.push('rev');
    if (tr.oct) bits.push('oct' + (tr.oct > 0 ? '+' : '') + tr.oct);
    if (tr.thin && tr.thin < 100) bits.push('thin' + tr.thin + '%');
    return id + '  \u00b7  from ' + (pv.cluster || '?') + '  \u00b7  ' + cg.events.length +
      ' notes / ' + cg.span.toFixed(1) + 's' + (bits.length ? '  \u00b7  ' + bits.join(' \u00b7 ') : '');
  }
  function showCgInfo(id, cg, hovering) {
    const el = document.getElementById('blastInfo');
    el.textContent = (hovering && id !== selectedCg ? '\u25b8 ' : '\u25c9 ') + cgDescribe(id, cg);
    el.style.color = (hovering && id !== selectedCg) ? '#8fb3a5' : '#8fdbe8';
  }
  function cgStop() { cgPending.forEach(clearTimeout); cgPending = []; }
  const CG_VARIABLE = { ord: 1, cuivre: 1 };   // drawn durations, not one-shots
  function cgLen(e) {
    return CG_VARIABLE[e.tech] ? e.d : (Composer.techLength(e.tech, e.p) || e.d);
  }
  // Placement goes through the shared playability engine (Composer.assignCluster).
  // No occupancy = audition (hear the gesture on its own); occupancy from the
  // score = insert (route around whatever is already on those players).
  function cgPlace(events, occ) {
    const notes = events.slice().sort((a, b) => a.t - b.t)
      .map(e => ({ e, start: e.t, dur: cgLen(e), pitch: e.p, tech: e.tech }));
    return Composer.assignCluster(occ || Array.from({ length: 10 }, () => []), notes);
  }
  // layer L is Tuba L+1 (TRACKS order) — audition and insert now agree; they
  // used to disagree, so what you heard was not the assignment you got
  function cgPortFor(layer, tech) {
    return 'tuba' + (layer + 1) + (tech === 'staccato' ? 'b' : '');
  }
  function cgChanFor(tech) {
    return tech === 'fortepiano' ? 11 : tech === 'staccato' ? 4 : tech === 'cuivre' ? 5 : 1;
  }
  function cgAudition(cg) {
    cgStop();
    for (const n of cgPlace(cg.events)) {
      cgPending.push(setTimeout(
        () => Composer.auditionNote(cgPortFor(n.layer, n.tech), cgChanFor(n.tech), n.pitch, n.e.v, n.dur * 1000),
        n.start * 1000));
    }
  }
  function selectCg(id, forceHear) {
    const cg = CBANK && CBANK.gestures[id];
    if (!cg) return;
    selectedCg = id;
    drawMinis();
    showCgInfo(id, cg, false);
    if (forceHear || hearOn()) cgAudition(cg);
    const box = document.getElementById('blastMinis');
    const el = [...box.children].find(c => c.dataset.sid === id);
    if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }

  function drawMinis() {
    const box = document.getElementById('blastMinis');
    box.innerHTML = '';
    if (srcMode === 'clusters') {
      cgEntries().forEach(([id, cg]) => box.appendChild(cgMiniFor(id, cg)));
    } else {
      sonEntries().forEach(([id, son]) => box.appendChild(miniFor(id, son)));
    }
  }

  function durFor(son, pitch) {
    // MEASURED lengths (probe 2026-08-15): fp/stac/cuivre are fixed one-shots,
    // so the block equals the sounding length. Only ord is a real duration.
    const cv = (son.cuivreConverted || []).includes(pitch) || (son.cuivreAdded || []).includes(pitch);
    const art = (son.artic || {})[pitch] || 'ord';
    const tech = cv ? 'cuivre' : art;
    const measured = Composer.techLength(tech, pitch);
    return measured != null ? measured : (son.ordLen || 1);
  }

  function auditionSon(son) {
    const pitches = son.pitches.slice().sort((a, b) => a - b).slice(0, 10);
    pitches.forEach((pitch, k) => {
      const cv = (son.cuivreConverted || []).includes(pitch) || (son.cuivreAdded || []).includes(pitch);
      const art = (son.artic || {})[pitch] || 'ord';
      const port = 'tuba' + (10 - k) + (!cv && art === 'staccato' ? 'b' : '');
      const ch = cv ? 5 : art === 'fortepiano' ? 11 : art === 'staccato' ? 4 : 1;
      Composer.auditionNote(port, ch, pitch, son.dyn || 127, durFor(son, pitch) * 1000);
    });
  }

  function insertClusterAtCursor() {
    const cg = selectedCg && CBANK && CBANK.gestures[selectedCg];
    if (!cg) return;
    const t = Composer.scrollOffset / Composer.pixelsPerSecond;
    const group = 'grp-' + selectedCg.toLowerCase() + '-' + Math.floor(t * 10);
    Composer.pushUndoState();
    Composer.objects.push({ id: 'mk-' + (Composer.nextId++), type: 'marker', layer: 0,
      time: +t.toFixed(3), label: selectedCg + ' (' + cgOrigin(cg) + ')',
      color: '#3FA7B8', groupId: group, performanceNotes: '', properties: {} });
    let span = 0, softN = 0, hardN = 0;
    // absolute-time placement against the score's real occupancy
    const placed = cgPlace(cg.events.map(e => Object.assign({}, e, { t: e.t + t })), Composer.buildOccupancy());
    for (const n of placed) {
      const e = n.e, len = n.dur;
      span = Math.max(span, n.start - t + len);
      if (n.tier === 'hard') hardN++; else if (n.tier === 'soft') softN++;
      const lv = Math.max(1, Math.round((e.v / 127) * 100) / 10);
      Composer.objects.push({ id: 'wc-' + (Composer.nextId++), type: 'waveCurve', layer: n.layer,
        groupId: group, startSeconds: +n.start.toFixed(3), endSeconds: +(n.start + len).toFixed(3),
        nodes: [{ pos: 0, y: lv, smooth: 0.25 }, { pos: 1, y: lv, smooth: 0.25 }],
        segments: [{ model: 'power', slope: 0 }],
        color: '#3FA7B8', fillMode: 'bottom', opacity: 0.55,
        performanceNotes: selectedCg, properties: {}, srcKind: 'cluster',
        sonifyNote: e.p, technique: e.tech, sonifyMode: 'plain', recVel: e.v });
    }
    Composer.objects.push({ id: 'wc-' + (Composer.nextId++), type: 'waveCurve', layer: 10,
      groupId: group, startSeconds: +t.toFixed(3), endSeconds: +(t + span).toFixed(3),
      nodes: [{ pos: 0, y: 8.5, smooth: 0 }, { pos: 1, y: 8.5, smooth: 0 }],
      segments: [{ model: 'power', slope: 0 }],
      color: '#3FA7B8', fillMode: 'bottom', opacity: 0.6,
      performanceNotes: selectedCg + ' (drag = move; only ord stretches)', properties: {} });
    Composer.lastInsertGroup = group;
    Composer.openMetaWin();
    Composer.renderAll();
    Composer.markDirty();
    reportInsert(selectedCg, t, cg.events.length, hardN, softN);
  }

  function cgOrigin(cg) {
    const pv = cg.provenance || {};
    const src = pv.source || {};
    return pv.cluster || src.from || pv.from || pv.snippet || 'cluster';
  }

  // Insert never refuses and never silently drops: everything lands, conflicts
  // are marked on the lanes, and the resolver opens so removal is one click.
  function reportInsert(name, t, n, hardN, softN) {
    Composer.refreshConflicts();   // synchronous: the report must match the score
    const el = document.getElementById('blastInfo');
    let msg = '\u2713 ' + name + ' inserted @ ' + t.toFixed(2) + 's \u2014 ' + n + ' notes + META shape';
    if (hardN) msg += '  \u00b7  \u26a0 ' + hardN + ' could not fit a free player';
    else if (softN) msg += '  \u00b7  ' + softN + ' tight re-attack';
    el.textContent = msg;
    el.style.color = hardN ? '#ff8080' : softN ? '#ffd479' : '#7ec9a8';
    if (hardN || softN) Composer.openResolver();
  }

  function insertAtCursor() {
    if (srcMode === 'clusters') return insertClusterAtCursor();
    if (!selectedSon || !TAXB) return;
    const son = (TAXB.sonorities || {})[selectedSon];
    if (!son) return;
    const t = Composer.scrollOffset / Composer.pixelsPerSecond;   // playhead time
    const group = 'grp-' + selectedSon.toLowerCase() + '-' + Math.floor(t * 10);
    Composer.pushUndoState();
    const pitches = son.pitches.slice().sort((a, b) => a - b).slice(0, 10);
    const maxDur = Math.max.apply(null, pitches.map(p => durFor(son, p)));
    Composer.objects.push({ id: 'mk-' + (Composer.nextId++), type: 'marker', layer: 0,
      time: +t.toFixed(3), label: selectedSon + ' ' + son.chord.replace('VERT01-', 'ch') + ' ' + son.voicing,
      color: '#5E8C7A', groupId: group, performanceNotes: '', properties: {} });
    const lv = Math.max(1, Math.round(((son.dyn || 127) / 127) * 100) / 10);
    // A blast sounds all at once, so every note needs its OWN player. The engine
    // keeps the pitch-ordered stage reading (lowest = Tuba 10) as far as free
    // lanes allow, and marks whatever could not fit rather than dropping it.
    const bNotes = pitches.map(pitch => {
      const cv = (son.cuivreConverted || []).includes(pitch) || (son.cuivreAdded || []).includes(pitch);
      const art = (son.artic || {})[pitch] || 'ord';
      return { pitch, tech: cv ? 'cuivre' : art, start: t, dur: durFor(son, pitch) };
    });
    let bHard = 0, bSoft = 0;
    for (const n of Composer.assignBlast(Composer.buildOccupancy(), bNotes)) {
      if (n.tier === 'hard') bHard++; else if (n.tier === 'soft') bSoft++;
      Composer.objects.push({ id: 'wc-' + (Composer.nextId++), type: 'waveCurve',
        layer: n.layer, groupId: group,
        startSeconds: +t.toFixed(3), endSeconds: +(t + n.dur).toFixed(3),
        nodes: [{ pos: 0, y: lv, smooth: 0.25 }, { pos: 1, y: lv, smooth: 0.25 }],
        segments: [{ model: 'power', slope: 0 }],
        color: '#5E8C7A', fillMode: 'bottom', opacity: 0.55,
        performanceNotes: selectedSon, properties: {}, srcKind: 'blast',
        sonifyNote: n.pitch, technique: n.tech, sonifyMode: 'plain',
        recVel: son.dyn || 127 });
    }
    // META shape built at INSERT TIME (derived, not stored with the sonority)
    Composer.objects.push({ id: 'wc-' + (Composer.nextId++), type: 'waveCurve', layer: 10,
      groupId: group, startSeconds: +t.toFixed(3), endSeconds: +(t + maxDur).toFixed(3),
      nodes: [{ pos: 0, y: 8.5, smooth: 0 }, { pos: 1, y: 8.5, smooth: 0 }],
      segments: [{ model: 'power', slope: 0 }],
      color: '#C452B5', fillMode: 'bottom', opacity: 0.6,
      performanceNotes: selectedSon + ' (drag = move, box = stretch)', properties: {} });
    Composer.lastInsertGroup = group;
    Composer.openMetaWin();
    Composer.renderAll();
    Composer.markDirty();
    reportInsert(selectedSon, t, pitches.length, bHard, bSoft);
  }

  document.getElementById('blastsBtn').addEventListener('click', async function () {
    const strip = document.getElementById('blastStrip');
    const show = strip.style.display === 'none';
    strip.style.display = show ? 'block' : 'none';
    this.classList.toggle('on', show);
    this.style.background = show ? '#4a3a12' : '';
    this.style.color = show ? '#ffd479' : '';
    if (show) await loadTaxB();
    // push the score down instead of covering it (the lane container is
    // absolutely positioned, so nothing reflows on its own)
    const lanes = document.getElementById('laneContainer');
    const h = show ? strip.getBoundingClientRect().height : 0;
    if (lanes) lanes.style.top = (32 + h) + 'px';
    const ft = document.getElementById('floatingTime');
    if (ft) ft.style.top = (show ? h + 40 : 60) + 'px';
    if (Composer.renderAll) { Composer.generateTicks(); Composer.applyScroll(); Composer.renderAll(); }
  });
  document.getElementById('blastListSel').addEventListener('change', function () {
    activeList = this.value; selectedSon = null; selectedCg = null; drawMinis(); this.blur();
  });
  document.getElementById('blastSrcSel').addEventListener('change', function () {
    this.blur();
    srcMode = this.value;
    activeList = null;
    cgStop();
    loadTaxB();
    const el = document.getElementById('blastInfo');
    el.textContent = '\u2190 \u2192 to step \u00b7 click to hear \u00b7 insert at the playhead';
    el.style.color = srcMode === 'clusters' ? '#8fdbe8' : '#ffd479';
  });
  document.getElementById('blastInsert').addEventListener('click', insertAtCursor);
  document.getElementById('conflictBadge').addEventListener('click', function () {
    this.blur();
    if (Composer._resolverOpen) Composer.closeResolver(); else Composer.openResolver();
  });
  window.addEventListener('keydown', e => {
    if (document.getElementById('blastStrip').style.display !== 'block') return;
    const t = e.target;
    if (t && t.matches && t.matches('input, textarea, select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stepSon(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepSon(-1); }
  }, true);
})();
</script>
</body>
</html>
