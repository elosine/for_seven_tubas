        return this.CONFLICT.minAttack + this.CONFLICT.maxLeapAdd;
    },

    // Every waveCurve that OCCUPIES a player — regardless of technique, sonify
    // mode or solo state. Drawn crescendo material counts exactly like an
    // inserted blast; solo is a listening tool, not a score property.
    noteEvents() {
        const out = [];
        for (const o of this.objects) {
            if (o.type !== 'waveCurve' || o.sonifyNote == null) continue;
            if (!(o.layer >= 0 && o.layer < META_LAYER)) continue;
            if (o.startSeconds == null || o.endSeconds == null) continue;
            out.push(o);
        }
        return out;
    },
    noteLabel(o) {
        const NM = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const p = o.sonifyNote;
        const nm = p == null ? '?' : NM[((p % 12) + 12) % 12] + (Math.floor(p / 12) - 1);
        const src = String(o.performanceNotes || '').split(' (')[0].trim();
        return (src ? src + ' ' : '') + nm + (o.technique ? ' ' + o.technique : '');
    },
    // shortest playable interval between two ATTACKS on one player
    requiredAttack(prev, next) {
        const leap = Math.abs((next.sonifyNote || 0) - (prev.sonifyNote || 0));
        return this.CONFLICT.minAttack + Math.min(this.CONFLICT.maxLeapAdd, leap * this.CONFLICT.perSemitone);
    },
    // a is the earlier-starting note
    pairTier(a, b) {
        if (b.startSeconds < a.endSeconds - 1e-6) return 'hard';                        // physics
        if (b.startSeconds - a.endSeconds < this.CONFLICT.tongueReset - 1e-6) return 'soft';
        return (b.startSeconds - a.startSeconds) < this.requiredAttack(a, b) - 1e-6 ? 'soft' : 'free';
    },
    tierAgainst(list, cand) {
        let worst = 'free';
        for (const o of list) {
            const t = (o.startSeconds <= cand.startSeconds) ? this.pairTier(o, cand) : this.pairTier(cand, o);
            if (t === 'hard') return 'hard';
            if (t === 'soft') worst = 'soft';
        }
        return worst;
    },
    buildOccupancy(excludeGroupId) {
        const occ = Array.from({ length: META_LAYER }, () => []);
        for (const o of this.noteEvents()) {
            if (excludeGroupId && o.groupId === excludeGroupId) continue;
            occ[o.layer].push(o);
        }
        occ.forEach(l => l.sort((a, b) => a.startSeconds - b.startSeconds));
        return occ;
    },

    // ---- placement ----
    // Blast: all notes sound together, so each needs its OWN player. Ideal is
    // the existing pitch-ordered reading (lowest pitch = layer 9 = Tuba 10);
    // we keep as close to it as free lanes allow.
    assignBlast(occ, notes) {
        const taken = new Set();
        return notes.map((nt, i) => {
            const ideal = Math.max(0, (META_LAYER - 1) - i);
            const cand = { startSeconds: nt.start, endSeconds: nt.start + nt.dur, sonifyNote: nt.pitch, technique: nt.tech };
            let best = null;
            for (let L = 0; L < META_LAYER; L++) {
                if (taken.has(L)) continue;
                const tier = this.tierAgainst(occ[L], cand);
                const score = (tier === 'free' ? 0 : tier === 'soft' ? 1 : 2) * 100 + Math.abs(L - ideal);
                if (!best || score < best.score) best = { L, tier, score };
            }
            if (!best) best = { L: ideal, tier: 'hard' };   // >10 notes: fall back, mark it
            taken.add(best.L);
            return Object.assign({}, nt, { layer: best.L, tier: best.tier });
        });
    },
    // Cluster: notes are spread in time, so a player can take several. Prefer a
    // legal lane; tie-break by least-recently-used, which keeps the ten-way
    // spread the composer already approved.
    assignCluster(occ, notes) {
        const busy = Array(META_LAYER).fill(-1);
        return notes.map(nt => {
            const cand = { startSeconds: nt.start, endSeconds: nt.start + nt.dur, sonifyNote: nt.pitch, technique: nt.tech };
            let best = null;
            for (let L = 0; L < META_LAYER; L++) {
                const tier = this.tierAgainst(occ[L], cand);
                const score = (tier === 'free' ? 0 : tier === 'soft' ? 1 : 2) * 1e6 + Math.max(0, busy[L]) * 1000 + L;
                if (!best || score < best.score) best = { L, tier, score };
            }
            occ[best.L].push(cand);
            occ[best.L].sort((a, b) => a.startSeconds - b.startSeconds);
            busy[best.L] = cand.endSeconds;
            return Object.assign({}, nt, { layer: best.L, tier: best.tier });
        });
    },

    // ---- detection ----
    computeConflicts() {
        const marks = new Map(), pairs = [];
        const lanes = new Map();
        for (const o of this.noteEvents()) {
            if (!lanes.has(o.layer)) lanes.set(o.layer, []);
            lanes.get(o.layer).push(o);
        }
        const mark = (o, tier) => {
            const cur = marks.get(o.id);
            if (cur && cur.tier === 'hard') return;      // hard wins
            marks.set(o.id, { tier, obj: o });
        };
        const win = this._conflictWindow;
        for (const [layer, list] of lanes) {
            list.sort((a, b) => a.startSeconds - b.startSeconds || a.endSeconds - b.endSeconds);
            for (let i = 0; i < list.length; i++) {
                const a = list[i];
                for (let j = i + 1; j < list.length; j++) {
                    const b = list[j];
                    // sorted by start, so once b starts well clear of a's end,
                    // every later b does too
                    if (b.startSeconds - a.endSeconds > win) break;
                    const tier = this.pairTier(a, b);
                    if (tier === 'free') continue;
                    mark(a, tier); mark(b, tier);
                    pairs.push({
                        a, b, tier, layer,
                        gap: +(b.startSeconds - a.endSeconds).toFixed(3),
                        attack: +(b.startSeconds - a.startSeconds).toFixed(3),
                        need: +this.requiredAttack(a, b).toFixed(3),
                    });
                }
            }
        }
        pairs.sort((x, y) => (x.tier === y.tier ? x.a.startSeconds - y.a.startSeconds : (x.tier === 'hard' ? -1 : 1)));
        this._conflicts = marks;
        this._conflictPairs = pairs;
        return { marks, pairs };
    },
    // setTimeout, NOT requestAnimationFrame: rAF is throttled or suspended when
    // the tab is not painting, which left the marks stale and the badge empty.
    // Timers always fire, and a 0 ms timer still coalesces a burst of edits.
    scheduleConflictRefresh() {
        if (this._conflictTimer) return;
        this._conflictTimer = setTimeout(() => {
            this._conflictTimer = null;
            this.refreshConflicts();
        }, 0);
    },
    refreshConflicts() {
        this.computeConflicts();
        this.renderConflictMarks();
        this.updateConflictBadge();
        if (this._resolverOpen) this.renderResolver();
    },
    renderConflictMarks() {
        const svgNS = 'http://www.w3.org/2000/svg';
        const marks = this._conflicts || new Map();
        for (const o of this.noteEvents()) {
            const g = this.elementCache.get(o.id);
            if (!g) continue;
            const old = g.querySelector('.conflictMark');
            if (old) old.remove();
            const m = marks.get(o.id);
            if (!m) continue;
            const dims = this.getLaneDims(o.layer);
            const hard = m.tier === 'hard';
            const r = document.createElementNS(svgNS, 'rect');
            r.setAttribute('class', 'conflictMark');
            r.setAttribute('x', String(o.startSeconds * this.pixelsPerSecond));
            r.setAttribute('y', String(dims.top));
            r.setAttribute('width', String(Math.max(3, (o.endSeconds - o.startSeconds) * this.pixelsPerSecond)));
            r.setAttribute('height', String(Math.max(4, dims.bottom - dims.top)));
            r.setAttribute('fill', hard ? 'rgba(255,60,60,0.20)' : 'rgba(255,176,32,0.14)');
            r.setAttribute('stroke', hard ? '#ff4d4d' : '#ffb020');
            r.setAttribute('stroke-width', hard ? '1.8' : '1.2');
            if (!hard) r.setAttribute('stroke-dasharray', '4 3');
            r.style.pointerEvents = 'none';
            g.appendChild(r);
        }
    },
    updateConflictBadge() {
        const el = document.getElementById('conflictBadge');
        if (!el) return;
        const pairs = this._conflictPairs || [];
        const hard = pairs.filter(p => p.tier === 'hard').length;
        const soft = pairs.length - hard;
        if (!pairs.length) { el.style.display = 'none'; return; }
        el.style.display = '';
        el.textContent = '⚠ ' + (hard ? hard + ' hard' : '') + (hard && soft ? ' · ' : '') + (soft ? soft + ' soft' : '');
        el.style.background = hard ? '#4a1414' : '#4a3a12';
        el.style.color = hard ? '#ff8080' : '#ffd479';
    },

    // ---- resolution ----
    // MOVING beats dropping: the note survives, only the player changes. This is
    // also the only thing that fixes a RATE problem (one player asked for more
    // attacks per second than they can tongue) — nudging the gesture in time
    // cannot help there, because the line is still just as fast.
    // Returns the best alternative player for this note, or null if none is
    // better than where it already sits.
    bestLaneFor(note) {
        const rank = t => (t === 'free' ? 0 : t === 'soft' ? 1 : 2);
        const occ = Array.from({ length: META_LAYER }, () => []);
        for (const o of this.noteEvents()) if (o !== note) occ[o.layer].push(o);
        occ.forEach(l => l.sort((a, b) => a.startSeconds - b.startSeconds));
        const here = rank(this.tierAgainst(occ[note.layer], note));
        let best = null;
        for (let L = 0; L < META_LAYER; L++) {
            if (L === note.layer) continue;
            const tier = this.tierAgainst(occ[L], note);
            // prefer the cleanest player; tie-break toward a nearby lane so the
            // stage picture moves as little as possible
            const score = rank(tier) * 100 + Math.abs(L - note.layer);
            if (!best || score < best.score) best = { layer: L, tier, score };
        }
        if (!best || rank(best.tier) >= here) return null;
        return best;
    },
    moveNoteToLane(note, layer) {
        if (note.layer === layer) return;
        this.pushUndoState();
        note.layer = layer;              // all ten tracks are the same instrument
        this.renderAll();
        this.markDirty();
        this.refreshConflicts();
    },
    // Insert NEVER refuses and never silently drops. Everything lands, conflicts
    // are marked, and removal happens here as an explicit act.
    dropNote(obj) {
        this.pushUndoState();
        const idx = this.objects.indexOf(obj);
        if (idx < 0) return;
        if (obj._els && obj._els.group) obj._els.group.remove();
        this.elementCache.delete(obj.id);
        this.objects.splice(idx, 1);
        this.selectedObjects = this.selectedObjects.filter(o => o !== obj);
        if (this.selectedObject === obj) { this.selectedObject = null; this.hidePropertyPanel && this.hidePropertyPanel(); }
        this.renderAll();
        this.markDirty();
        this.refreshConflicts();
    },
    // Slide a whole inserted gesture (marker + notes + META shape) to the
    // nearest time that clears every HARD conflict with the rest of the score.
    // A blast is a point event: 100-300 ms usually costs nothing musically and
    // keeps both objects intact.
    nudgeGroupClear(groupId) {
        const all = this.objects.filter(o => o.groupId === groupId);
        const notes = all.filter(o => o.type === 'waveCurve' && o.sonifyNote != null && o.layer < META_LAYER);
        if (!notes.length) return null;
        const occ = this.buildOccupancy(groupId);
        const clearAt = dt => notes.every(n => this.tierAgainst(occ[n.layer], {
            startSeconds: n.startSeconds + dt, endSeconds: n.endSeconds + dt,
            sonifyNote: n.sonifyNote, technique: n.technique,
        }) !== 'hard');
        let found = null;
        for (let step = 1; step <= 150 && found == null; step++) {
            for (const sign of [1, -1]) {
                const dt = +(sign * step * 0.02).toFixed(3);
                if (notes.some(n => n.startSeconds + dt < 0)) continue;
                if (clearAt(dt)) { found = dt; break; }
            }
        }
        if (found == null) return null;
        this.pushUndoState();
        for (const o of all) {
            if (o.type === 'marker') o.time = Math.max(0, +(o.time + found).toFixed(3));
            else if (o.startSeconds != null) {
                o.startSeconds = +(o.startSeconds + found).toFixed(3);
                o.endSeconds = +(o.endSeconds + found).toFixed(3);
            }
        }
        this.renderAll();
        this.markDirty();
        this.refreshConflicts();
        return found;
    },
    // A voicing is an IDENTITY (D11: the pitch set IS the object); a cluster is
    // a STATISTIC (losing 1 of 14 notes does not change what it is). So the
    // cluster yields. Never automatic — this is a button the composer presses.
    autoResolveHard() {
        const rank = o => (o.srcKind === 'blast' ? 2 : o.srcKind === 'cluster' ? 0 : 1);
        let moved = 0, dropped = 0;
        this.computeConflicts();
        if (!(this._conflictPairs || []).some(q => q.tier === 'hard')) return { moved, dropped };
        this.pushUndoState();   // ONE undo step for the whole sweep
        for (let guard = 0; guard < 200; guard++) {
            this.computeConflicts();
            const p = (this._conflictPairs || []).find(q => q.tier === 'hard');
            if (!p) break;
            const ra = rank(p.a), rb = rank(p.b);
            let victim;
            if (ra !== rb) victim = ra < rb ? p.a : p.b;
            else victim = (parseInt(String(p.b.id).replace(/\D/g, ''), 10) || 0) >= (parseInt(String(p.a.id).replace(/\D/g, ''), 10) || 0) ? p.b : p.a;
            // hand it to a free player before considering deleting it — a note
            // that survives on another stand costs the music nothing
            const alt = this.bestLaneFor(victim);
            if (alt && alt.tier === 'free') { victim.layer = alt.layer; moved++; continue; }
            const idx = this.objects.indexOf(victim);
            if (idx < 0) break;
            if (victim._els && victim._els.group) victim._els.group.remove();
            this.elementCache.delete(victim.id);
            this.objects.splice(idx, 1);
            dropped++;
        }
        if (moved || dropped) { this.renderAll(); this.markDirty(); }
        this.refreshConflicts();
        return { moved, dropped };
    },

    openResolver() {
        this._resolverOpen = true;
        this._resolverMsg = '';   // a fresh open starts with no stale verdict
        let box = document.getElementById('conflictResolver');
        if (!box) {
            box = document.createElement('div');
            box.id = 'conflictResolver';
            box.style.cssText = 'position:fixed; right:12px; bottom:12px; width:430px; max-height:52vh; ' +
                'background:#1b1b1f; border:1px solid #444; border-radius:6px; z-index:9000; ' +
                'font-family:Consolas,monospace; font-size:11.5px; color:#ddd; display:flex; flex-direction:column; ' +
                'box-shadow:0 6px 24px rgba(0,0,0,0.55)';
            document.body.appendChild(box);
        }
        box.style.display = 'flex';
        this.renderResolver();
    },
    closeResolver() {
        this._resolverOpen = false;
        const box = document.getElementById('conflictResolver');
        if (box) box.style.display = 'none';
    },
    renderResolver() {
        const box = document.getElementById('conflictResolver');
        if (!box) return;
        const pairs = this._conflictPairs || [];
        box.innerHTML = '';
        const head = document.createElement('div');
        head.style.cssText = 'padding:7px 9px; border-bottom:1px solid #383838; display:flex; align-items:center; gap:8px; flex:0 0 auto';
        const hard = pairs.filter(p => p.tier === 'hard').length;
        head.innerHTML = '<b style="color:#fff">Playability</b>' +
            '<span style="color:' + (hard ? '#ff8080' : '#7ec9a8') + '">' +
            (pairs.length ? hard + ' hard · ' + (pairs.length - hard) + ' soft' : 'all clear') + '</span>';
        const spacer = document.createElement('span'); spacer.style.flex = '1 1 auto';
        head.appendChild(spacer);
        const mk = (label, title, fn, col) => {
            const b = document.createElement('button');
            b.textContent = label; b.title = title;
            b.style.cssText = 'font-size:10.5px; padding:2px 7px; cursor:pointer; background:#2a2a2e; color:' + (col || '#ccc') + '; border:1px solid #4a4a4a; border-radius:3px';
            b.addEventListener('click', fn);
            return b;
        };
        if (this.lastInsertGroup) {
            head.appendChild(mk('nudge', 'slide the last inserted gesture to the nearest time with no hard conflicts', () => {
                const dt = this.nudgeGroupClear(this.lastInsertGroup);
                this.resolverNote(dt == null ? 'no clear slot found within ±3 s' : 'moved ' + (dt > 0 ? '+' : '') + dt.toFixed(2) + 's — hard conflicts cleared');
            }, '#8fdbe8'));
        }
        if (hard) {
            head.appendChild(mk('auto', 'clear every hard conflict: the blast keeps its voicing and the cluster yields — moved to a free player where possible, dropped only when no player is free', () => {
                const r = this.autoResolveHard();
                const bits = [];
                if (r.moved) bits.push('moved ' + r.moved + ' to free players');
                if (r.dropped) bits.push('dropped ' + r.dropped + ' (nowhere free)');
                this.resolverNote(bits.length ? bits.join(', ') + ' — CTRL+Z undoes' : 'nothing to resolve');
            }, '#ffb0b0'));
        }
        head.appendChild(mk('✕', 'close', () => this.closeResolver()));
        box.appendChild(head);

        const note = document.createElement('div');
        note.id = 'resolverNote';
        note.style.cssText = 'padding:4px 9px; color:#7ec9a8; font-size:10.5px; flex:0 0 auto';
        // the panel is rebuilt on every refresh, so the last message has to be
        // re-applied or it vanishes the instant the deferred refresh lands
        note.textContent = this._resolverMsg || '';
        note.style.display = this._resolverMsg ? '' : 'none';
        box.appendChild(note);

        const list = document.createElement('div');
        list.style.cssText = 'overflow-y:auto; padding:4px 0; flex:1 1 auto';
        if (!pairs.length) {
            list.innerHTML = '<div style="padding:10px 9px; color:#888">Every player can play every note. ' +
                'Red = two notes at once on one player. Amber = too close to re-attack or leap.</div>';
        }
        for (const p of pairs.slice(0, 200)) {
            const row = document.createElement('div');
            row.style.cssText = 'padding:5px 9px; border-bottom:1px solid #2a2a2e';
            const hardP = p.tier === 'hard';
            const title = document.createElement('div');
            title.style.cssText = 'color:' + (hardP ? '#ff8080' : '#ffb020') + '; margin-bottom:3px';
            title.textContent = (hardP ? '■ ' : '□ ') + (TRACKS[p.layer] ? TRACKS[p.layer].label : 'layer ' + p.layer) +
                ' @ ' + p.a.startSeconds.toFixed(2) + 's' +
                (hardP ? '  — overlap'
                    : '  — ' + p.attack.toFixed(2) + 's apart (' + (p.attack > 0 ? (1 / p.attack).toFixed(1) : '∞') +
                      ' attacks/s), needs ' + p.need.toFixed(2) + 's');
            row.appendChild(title);
            // one line per note: MOVE first (nothing is lost), drop as the fallback
            const side = (o) => {
                const r = document.createElement('div');
                r.style.cssText = 'display:flex; align-items:center; gap:5px; margin-top:3px';
                const lbl = document.createElement('span');
                lbl.textContent = this.noteLabel(o);
                lbl.style.cssText = 'flex:1 1 auto; color:#bbb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap';
                r.appendChild(lbl);
                const alt = this.bestLaneFor(o);
                if (alt) {
                    const to = TRACKS[alt.layer] ? TRACKS[alt.layer].label.replace('Tuba ', 'T') : 'L' + alt.layer;
                    r.appendChild(mk('→ ' + to,
                        'reassign this note to ' + (TRACKS[alt.layer] ? TRACKS[alt.layer].label : 'layer ' + alt.layer) +
                        ', who is ' + (alt.tier === 'free' ? 'free here' : 'less busy here') + ' — the note survives',
                        () => {
                            const from = TRACKS[o.layer] ? TRACKS[o.layer].label : 'layer ' + o.layer;
                            this.moveNoteToLane(o, alt.layer);
                            this.resolverNote('moved ' + this.noteLabel(o) + ': ' + from + ' → ' + to + ' — CTRL+Z undoes');
                        }, alt.tier === 'free' ? '#7ec9a8' : '#ffd479'));
                }
                r.appendChild(mk('drop', 'remove this note entirely (CTRL+Z undoes)', () => {
                    this.dropNote(o);
                    this.resolverNote('dropped ' + this.noteLabel(o) + ' — CTRL+Z undoes');
                }, '#e09090'));
                return r;
            };
            row.appendChild(side(p.a));
            row.appendChild(side(p.b));
            const foot = document.createElement('div');
            foot.style.cssText = 'display:flex; justify-content:flex-end; margin-top:3px';
            foot.appendChild(mk('→ show', 'scroll the score to this conflict', () => {
                this.scrollOffset = Math.max(0, p.a.startSeconds * this.pixelsPerSecond);
                this.applyScroll(); this.renderAll(); this.refreshConflicts();
            }, '#8fdbe8'));
            row.appendChild(foot);
            list.appendChild(row);
        }
        box.appendChild(list);
    },
    resolverNote(msg) {
        this._resolverMsg = msg;
        const n = document.getElementById('resolverNote');
        if (!n) return;
        n.textContent = msg; n.style.display = msg ? '' : 'none';
    },

    renderAll() {
        // Clear content groups and element cache
        for (let i = 0; i < this.lanes.length; i++) {
            this.contentGroups[i].innerHTML = '';
        }
        this.elementCache.clear();

        // Re-render all objects
        for (const obj of this.objects) {
            if (obj.type === 'waveCurve') this.renderWaveCurve(obj);
            else if (obj.type === 'lineWedge') this.renderLineWedge(obj);
            else if (obj.type === 'marker') this.renderMarker(obj);
            else if (obj.type === 'zone') this.renderZone(obj);
            else if (obj.type === 'motive') this.renderMotive(obj);
        }
        // conflict wash is re-applied after every full render (the element cache
        // was just rebuilt, so the marks went with it)
        this.scheduleConflictRefresh();
    },

    // ---- no-overwrite policy ----
    // Adopting a NEW name (different from the file this session owns) that
    // already exists on the server auto-suffixes (-2, -3, ...) instead of
    // overwriting that file. Re-saves of the owned file pass through untouched.
    async fetchSessionNames() {
        try {
            const r = await fetch('/api/composer/list');
            const j = await r.json();
            return new Set(j.success ? j.sessions.map(s => s.name) : []);
        } catch (e) { return new Set(); }
    },
    uniqueSessionName(base, existing) {
        if (!existing.has(base)) return base;
        let n = 2;
        while (existing.has(base + '-' + n)) n++;
        return base + '-' + n;
    },

    async saveSession(makeVersion = false) {
        let name = this.sessionNameInput.value.trim() || '7tubas';
        if (name !== this.boundName) {
            const existing = await this.fetchSessionNames();
            if (existing.has(name)) {
                name = this.uniqueSessionName(name, existing);
                this.sessionNameInput.value = name;
            }
        }
        this.sessionName = name;
        const data = this.collectData();

        this.saveStatus.textContent = 'Saving...';

        try {
            const resp = await fetch('/api/composer/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, data, makeVersion })
            });
            const result = await resp.json();
            if (result.success) {
                this.isDirty = false;
                this.boundName = name;
                this.saveStatus.textContent = `Saved: ${name}`;
                if (makeVersion) this.refreshRestore();
                localStorage.setItem('composerLastSession', name);
                this.refreshSessionList();
            } else {
                this.saveStatus.textContent = `Error: ${result.error}`;
            }
        } catch (err) {
            this.saveStatus.textContent = 'Save failed';
            console.error('Save error:', err);
        }
    },

    async loadSession(name) {
        this.saveStatus.textContent = 'Loading...';

        try {
            const resp = await fetch(`/api/composer/load/${encodeURIComponent(name)}`);
            const result = await resp.json();
            if (result.success) {
                this.sessionNameInput.value = name;
                this.sessionName = name;
                this.boundName = name;
                this.restoreData(result.data);
                // scores that carry META shapes open the META window on load
                // (otherwise the shapes exist but are invisible)
                if (this.objects.some(o => o.type === 'waveCurve' && o.layer === META_LAYER)) {
                    this.openMetaWin();
                }
                this.isDirty = false;
                this.saveStatus.textContent = `Loaded: ${name}`;
                localStorage.setItem('composerLastSession', name);
            } else {
                this.saveStatus.textContent = `Error: ${result.error}`;
            }
        } catch (err) {
            this.saveStatus.textContent = 'Load failed';
            console.error('Load error:', err);
        }
    },

    // (Palette methods retired 2026-08-14 — superseded by the Load menu and
    //  the Blasts strip. score/palette.json + /api/composer/palette remain.)

    // ================= SAVE SYSTEM (composer 2026-08-14) =================
    // Piece files are protected by a WORKING COPY: opening piece-sNN puts you in
    // piece-sNN-work, autosave writes there, and the canonical save is never
    // touched. "Save as next" promotes the work copy to piece-sNN+1.
    isPieceName(n) { return /^piece-/.test(n) && !/-work$/.test(n); },
    isWorkName(n) { return /-work$/.test(n); },
    pieceBase(n) { return String(n).replace(/-work$/, ''); },

    // piece-s07b -> {stem:'piece-s', num:7, letter:'b'}
    parsePiece(n) {
        const m = /^piece-s(\d+)([a-z]*)(?:-(\d+))?$/.exec(this.pieceBase(n));
        return m ? { num: +m[1], letter: m[2] || '' } : null;
    },
    nextPieceName(list) {
        const nums = list.map(n => this.parsePiece(n)).filter(Boolean).map(p => p.num);
        const next = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
        return 'piece-s' + String(next).padStart(2, '0');
    },
    sortPieces(names) {
        return names.slice().sort((a, b) => {
            const pa = this.parsePiece(a), pb = this.parsePiece(b);
            if (!pa || !pb) return a.localeCompare(b);
            return (pb.num - pa.num) || pb.letter.localeCompare(pa.letter);
        });
    },

    async openPiece(name) {
        const work = this.pieceBase(name) + '-work';
        // an existing working copy holds unpromoted edits — never clobber it silently
        const existing = (this._allScores || []).some(s => s.name === work);
        if (existing) {
            const resume = confirm('A working copy of ' + name + ' exists (unpromoted edits).\n\n' +
                'OK = resume that working copy\nCancel = start fresh from ' + name + ' (working copy is overwritten)');
            if (resume) {
                await this.loadSession(work);
                document.getElementById('saveNextBtn').style.display = '';
                this.saveStatus.textContent = 'resumed ' + work;
                this.updateSessionBadge();
                this.refreshRestore();
                return;
            }
        }
        // load the canonical, then divert the session to its working copy
        await this.loadSession(name);
        this.sessionNameInput.value = work;
        this.sessionName = work;
        this.boundName = work;
        this.saveStatus.textContent = 'working on ' + name + ' \u25b8 ' + work;
        document.getElementById('saveNextBtn').style.display = '';
        this.updateSessionBadge();
        this.refreshRestore();
    },

    async saveAsNext() {
        const all = (this._allScores || []).map(s => s.name);
        const target = this.nextPieceName(all);
        const data = this.collectData();
        const r = await fetch('/api/composer/save', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: target, data, makeVersion: true }) }).then(x => x.json());
        if (!r.success) { this.saveStatus.textContent = 'save failed'; return; }
        const work = this.sessionName;
        if (this.isWorkName(work)) {
            await fetch('/api/composer/discard', { method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: work }) });
        }
        this.sessionNameInput.value = target;
        this.sessionName = target; this.boundName = target;
        this.isDirty = false;
        this.saveStatus.textContent = 'Saved: ' + target;
        document.getElementById('saveNextBtn').style.display = 'none';
        this.updateSessionBadge();
        this.refreshSessionList();
    },

    async saveVariant() {
        const base = this.pieceBase(this.sessionName);
        const p = this.parsePiece(base);
        if (!p) { this.saveStatus.textContent = 'variants are for piece saves'; return; }
        const all = (this._allScores || []).map(s => s.name);
        const stem = 'piece-s' + String(p.num).padStart(2, '0');
        let letter = 'a';
        while (all.includes(stem + letter)) letter = String.fromCharCode(letter.charCodeAt(0) + 1);
        const target = stem + letter;
        const data = this.collectData();
        const r = await fetch('/api/composer/save', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: target, data, makeVersion: true }) }).then(x => x.json());
        if (!r.success) { this.saveStatus.textContent = 'variant save failed'; return; }
        this.saveStatus.textContent = 'Variant saved: ' + target + ' (still editing ' + this.sessionName + ')';
        this.refreshSessionList();
    },

    // MEASURED one-shot sample lengths (probe 2026-08-15, bank/sample_lengths.json).
    // fp / staccato / cuivre are FIXED: the sample ends itself, so the score
    // duration must equal the sounding length and must never be scaled.
    sampleLen: null,
    async loadSampleLengths() {
        try { this.sampleLen = await fetch('/bank/sample_lengths.json').then(r => r.json()); }
        catch (e) { this.sampleLen = null; }
    },
    FIXED_TECHS: { fortepiano: 1.67, staccato: 0.45, cuivre: 1.17 },
    isFixedLen(o) {
        return !!(o && o.type === 'waveCurve' && o.layer < META_LAYER &&
                  this.FIXED_TECHS[o.technique] !== undefined);
    },
    techLength(tech, pitch) {
        const fallback = this.FIXED_TECHS[tech];
        if (fallback === undefined) return null;                 // ord: variable
        const tbl = this.sampleLen && this.sampleLen[tech];
        if (tbl && tbl[pitch] != null) return tbl[pitch];
        if (tbl) {                                               // nearest measured pitch
            const keys = Object.keys(tbl).map(Number);
            if (keys.length) {
                const near = keys.reduce((a, b) => Math.abs(b - pitch) < Math.abs(a - pitch) ? b : a);
                return tbl[near];
            }
        }
        return fallback;
    },

    // makes the protection state obvious at a glance
    updateSessionBadge() {
        const inp = this.sessionNameInput;
        if (!inp) return;
        const n = this.sessionName || '';
        const btn = document.getElementById('saveNextBtn');
        if (this.isWorkName(n)) {
            inp.style.background = '#4a3a12'; inp.style.color = '#ffd479'; inp.style.borderColor = '#B8860B';
            inp.title = 'working copy - ' + this.pieceBase(n) + ' is protected from autosave';
            if (btn) btn.style.display = '';
        } else if (this.isPieceName(n)) {
            inp.style.background = '#5a2020'; inp.style.color = '#ffb4b4'; inp.style.borderColor = '#a44';
            inp.title = 'editing the piece file DIRECTLY - autosave writes here. Re-open it from the Piece menu for a protected working copy.';
            if (btn) btn.style.display = 'none';
        } else {
            inp.style.background = ''; inp.style.color = ''; inp.style.borderColor = '';
            inp.title = '';
            if (btn) btn.style.display = 'none';
        }
    },

    async refreshRestore() {
        const sel = document.getElementById('restoreSel');
        if (!sel) return;
        try {
            const r = await fetch('/api/composer/versions/' + encodeURIComponent(this.sessionName)).then(x => x.json());
            sel.innerHTML = '<option value="">-- Restore --</option>';
            (r.versions || []).forEach(f => {
                const o = document.createElement('option');
                o.value = f;
                const ts = (f.match(/_v(.+)\.json$/) || [])[1] || f;
                o.textContent = ts.replace('T', ' ').replace(/-/g, ':').slice(0, 16).replace(':', '-').replace(':', '-');
                sel.appendChild(o);
            });
        } catch (e) {}
    },

    async refreshSessionList() {
        try {
            const resp = await fetch('/api/composer/list');
            const result = await resp.json();
            if (result.success) {
                this._allScores = result.sessions;
                const pieceSel = document.getElementById('pieceSelect');
                const pieces = this.sortPieces(result.sessions.map(s => s.name).filter(n => this.isPieceName(n)));
                if (pieceSel) {
                    pieceSel.innerHTML = '<option value="">-- Piece --</option>';
                    pieces.forEach(n => {
                        const o = document.createElement('option');
                        o.value = n; o.textContent = n;
                        pieceSel.appendChild(o);
                    });
                }
                this.loadSelect.innerHTML = '<option value="">-- Scores --</option>';
                result.sessions.filter(s => !this.isPieceName(s.name) && !this.isWorkName(s.name)).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.textContent = `${s.name} (${new Date(s.modified).toLocaleDateString()})`;
                    this.loadSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error('Error refreshing session list:', err);
        }
    },

    markDirty() {
        if (!this.isDirty) {
            this.isDirty = true;
            this.saveStatus.textContent = 'Unsaved changes';
        }
        // any mutation can create or clear a conflict — dragging a gesture is
        // the common one, which is why an insert-time-only check would not hold
        this.scheduleConflictRefresh();
        // Debounced auto-save (5 seconds after last change)
        clearTimeout(this.autoSaveTimer);
        this.autoSaveTimer = setTimeout(() => {
            if (this.isDirty && this.sessionName !== 'untitled') {
                this.saveSession();
            }
        }, 5000);
    },

    // ========== FREEHAND FIT (sketch -> clean node curve on META) ==========

    fitSketch(raw) {
        if (!raw || raw.length < 3) return;
        const laneRect = this.lanes[META_LAYER].getBoundingClientRect();
        const dims = this.getLaneDims(META_LAYER);
        // client coords -> (time, y01); enforce monotonic time
        let pts = raw.map(p => ({
            t: this.clientXToTime(p.x),
            v: Math.max(0, Math.min(1, 1 - (p.y - laneRect.top - dims.top) / dims.height))
        }));
        const mono = [pts[0]];
        for (const p of pts) if (p.t > mono[mono.length - 1].t + 0.01) mono.push(p);
        if (mono.length < 3) return;
        const t0 = mono[0].t, t1 = mono[mono.length - 1].t;
        if (t1 - t0 < 0.5) return;
        // normalize to (u,v) unit square
        let norm = mono.map(p => ({ u: (p.t - t0) / (t1 - t0), v: p.v }));
        const eps = parseFloat(document.getElementById('fitSelect')?.value || '0.03');
        // pre-smooth: the jag-killer (window scales with fit strength); RDP then reduces
        const win = eps <= 0.015 ? 5 : eps <= 0.03 ? 9 : 15;
        for (let pass = 0; pass < 2; pass++) {
            const sm = norm.map((p, i) => {
                let s = 0, n = 0;
                for (let k = -win; k <= win; k++) {
                    const j = i + k;
                    if (j >= 0 && j < norm.length) { s += norm[j].v; n++; }
                }
                return { u: p.u, v: s / n };
            });
            norm = sm;
        }
        const keep = this.rdp(norm, eps);
        const nodes = keep.map(p => ({ pos: Math.round(p.u * 1000) / 1000, y: Math.round(p.v * 100) / 10, smooth: 0.35 }));
        nodes[0].pos = 0; nodes[nodes.length - 1].pos = 1;
        const segments = [];
        for (let i = 0; i < nodes.length - 1; i++) segments.push({ model: 'bezier', slope: 0 });
        this.createWaveCurve({
            startSeconds: Math.max(0, Math.round(t0 * 100) / 100),
            endSeconds: Math.round(t1 * 100) / 100,
            layer: META_LAYER, nodes, segments, color: '#2E8B57', opacity: 0.5
        });
        this.deselectAll();   // no panel pop on draw (composer request)
    },

    rdp(points, eps) {
        if (points.length < 3) return points;
        const d2line = (p, a, b) => {
            const dx = b.u - a.u, dy = b.v - a.v;
            const L2 = dx * dx + dy * dy;
            if (L2 < 1e-12) return Math.hypot(p.u - a.u, p.v - a.v);
            const s = ((p.u - a.u) * dx + (p.v - a.v) * dy) / L2;
            const cs = Math.max(0, Math.min(1, s));
            return Math.hypot(p.u - (a.u + cs * dx), p.v - (a.v + cs * dy));
        };
        let maxD = 0, idx = 0;
        for (let i = 1; i < points.length - 1; i++) {
            const d = d2line(points[i], points[0], points[points.length - 1]);
            if (d > maxD) { maxD = d; idx = i; }
        }
        if (maxD <= eps) return [points[0], points[points.length - 1]];
        const left = this.rdp(points.slice(0, idx + 1), eps);
        const right = this.rdp(points.slice(idx), eps);
        return left.slice(0, -1).concat(right);
    },

    // ========== UTILITY ==========

    generateId(prefix) {
        return `${prefix}-${this.nextId++}`;
    },

    // Convert time in seconds to X pixel position
    timeToPx(seconds) {
        return seconds * this.pixelsPerSecond;
    },

    // Convert X pixel position to time in seconds
    pxToTime(px) {
        return px / this.pixelsPerSecond;
    },

    // Get the track index from a Y position in the lane container.
    // The META draw window overlays the tuba lanes — it claims hits only in
    // draw mode, so ordinary clicks fall through to the parts underneath.
    getLaneFromY(clientY) {
        if (this.drawMode) {
            const r = this.lanes[META_LAYER].getBoundingClientRect();
            if (clientY >= r.top && clientY <= r.bottom) return META_LAYER;
        }
        for (let i = 0; i < META_LAYER; i++) {
            const r = this.lanes[i].getBoundingClientRect();
            if (clientY >= r.top && clientY <= r.bottom) return i;
        }
        return META_LAYER - 1;
    },

    // Convert selected plain (captured) notes into surge crescendos: the played
    // onset becomes the apex, the swell back-fills as far as the lane allows.
    // ---- cuivre palette (C key) ----
    // Per-note articulation change with pitch choice: cuivre's range is only
    // 60-67, so converting always asks which pitch. Hover = preview through
    // the first selected note's track port; click = apply to all selected.
    // Other techniques don't need this — select note, P, Technique dropdown.
    openCuivrePalette() {
        const sel = (this.selectedObjects || []).filter(o =>
            o.type === 'waveCurve' && o.sonifyNote != null && o.layer < META_LAYER);
        if (!sel.length) { this.saveStatus.textContent = 'Select note(s), then press C'; return; }
        this.closeCuivrePalette();
        const t = TRACKS[sel[0].layer];
        const inst = typeof INSTRUMENTS !== 'undefined' && INSTRUMENTS[t.instKey];
        const tech = inst && (inst.techniques || []).find(q => q.key === 'cuivre');
        if (!tech) { this.saveStatus.textContent = 'No cuivre on this track'; return; }
        const port = tech.port || inst.port, ch = tech.channel;
        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const label = m => names[m % 12] + (Math.floor(m / 12) - 2); // Reaper octaves (C3 = 60)
        const pal = document.createElement('div');
        pal.id = 'cuivrePalette';
        pal.style.cssText = 'position:fixed; left:50%; top:70px; transform:translateX(-50%);' +
            'z-index:9999; background:#222; border:1px solid #B8860B; border-radius:6px;' +
            'padding:8px; display:flex; gap:4px; align-items:center; box-shadow:0 4px 16px rgba(0,0,0,.5)';
        const title = document.createElement('span');
        title.textContent = 'cuivre → pick pitch (hover previews):';
        title.style.cssText = 'color:#B8860B; font-size:11px; margin-right:4px';
        pal.appendChild(title);
        for (let m = tech.rangeLow; m <= tech.rangeHigh; m++) {
            const b = document.createElement('button');
            b.textContent = label(m);
            b.title = 'MIDI ' + m;
            b.style.cssText = 'background:#333; color:#ddd; border:1px solid #555;' +
                'border-radius:4px; padding:6px 9px; cursor:pointer; font-size:12px';
            b.addEventListener('mouseenter', () => { b.style.background = '#4a3a12'; this.auditionNote(port, ch, m, 112, 400); });
            b.addEventListener('mouseleave', () => { b.style.background = '#333'; });
            b.addEventListener('click', () => {
                this.pushUndoState();
                sel.forEach(wc => { wc.technique = 'cuivre'; wc.sonifyNote = m; this.renderWaveCurve(wc); });
                this.markDirty();
                this.saveStatus.textContent = 'cuivre ' + label(m) + ' → ' + sel.length + ' note(s)';
                this.closeCuivrePalette();
            });
            pal.appendChild(b);
        }
        const close = document.createElement('button');
        close.textContent = '✕';
        close.style.cssText = 'background:none; color:#888; border:none; cursor:pointer; margin-left:4px';
        close.addEventListener('click', () => this.closeCuivrePalette());
        pal.appendChild(close);
        document.body.appendChild(pal);
        this._cuivrePal = pal;
        this._cuivreEsc = (ev) => { if (ev.key === 'Escape') this.closeCuivrePalette(); };
        window.addEventListener('keydown', this._cuivreEsc);
    },

    closeCuivrePalette() {
        if (this._cuivrePal) { this._cuivrePal.remove(); this._cuivrePal = null; }
        if (this._cuivreEsc) { window.removeEventListener('keydown', this._cuivreEsc); this._cuivreEsc = null; }
    },

    // Retime a META group shape to [newStart, newEnd], affinely rescaling every
    // member (notes: onsets AND durations; markers: time). Used by panel edits;
    // the edge-node drag applies the same rule inline.
    scaleGroupTo(shape, newStart, newEnd) {
        if (!(newEnd - newStart >= 0.1)) return;
        const s0 = shape.startSeconds, e0 = shape.endSeconds;
        if (e0 - s0 <= 0) return;
        const ratio = (newEnd - newStart) / (e0 - s0);
        const map = t => +(newStart + (t - s0) * ratio).toFixed(3);
        this.objects.forEach(o => {
            if (o.groupId !== shape.groupId || o === shape) return;
            if (o.type === 'marker') { o.time = Math.max(0, map(o.time)); this.renderMarker(o); }
            else if (o.startSeconds != null) {
                const a = map(o.startSeconds), b = map(o.endSeconds);
                const dur = o.endSeconds - o.startSeconds;
                o.startSeconds = a;
                o.endSeconds = this.isFixedLen(o) ? +(a + dur).toFixed(3) : Math.max(a + 0.02, b);
                if (o.type === 'waveCurve') this.renderWaveCurve(o);
            }
        });
        shape.startSeconds = newStart; shape.endSeconds = newEnd;
        this.renderWaveCurve(shape);
    },

    convertSelectedToSurge() {
        const targets = (this.selectedObjects.length ? this.selectedObjects
            : (this.selectedObject ? [this.selectedObject] : []))
            .filter(o => o.type === 'waveCurve' && o.sonifyNote != null && o.sonifyMode === 'plain');
        if (!targets.length) return;
        this.pushUndoState();
        for (const wc of targets) {
            const apex = wc.startSeconds;
            const prevEnds = this.objects
                .filter(o => o !== wc && o.type === 'waveCurve' && o.layer === wc.layer
                    && o.sonifyNote != null && o.endSeconds <= apex + 1e-6)
                .map(o => o.endSeconds);
            const avail = apex - (prevEnds.length ? Math.max(...prevEnds) : 0.1) - 0.08;
            const dur = Math.max(0.15, Math.min(2.5, avail));
            const release = 0.05;
            const lv = Math.max(1, Math.round(((wc.recVel != null ? wc.recVel : 100) / 127) * 100) / 10);
            const pPos = Math.round((dur / (dur + release)) * 1000) / 1000;
            wc.startSeconds = Math.max(0, Math.round((apex - dur) * 1000) / 1000);
            wc.endSeconds = Math.round((apex + release) * 1000) / 1000;
            wc.nodes = [{ pos: 0, y: 0, smooth: 0.25 }, { pos: pPos, y: lv, smooth: 0.25 }, { pos: 1, y: 0, smooth: 0.25 }];
            wc.segments = [{ model: 'exponential', slope: 0.35 }, { model: 'power', slope: 0 }];
            wc.technique = 'ord';
            wc.envShape = 'surge';
            delete wc.sonifyMode;   // back to CC7-curve rendering
            wc.color = '#2E7D32';
            this.renderWaveCurve(wc);
        }
        this.deselectAll();
        this.markDirty();
    },

    // ---- Per-part SOLO (composer 2026-08-12) ----
    // Any solo active -> only soloed parts send MIDI. Playback gating lives in
    // tickCurvePlayback (sounding notes on un-soloed parts get clean noteOffs
    // via the outside-branch) and tickMotivePlayback.
    isPartAudible(layer) {
        return !this.soloParts || this.soloParts.size === 0 || this.soloParts.has(layer);
    },

    updateSoloVisuals() {
        for (let i = 0; i < META_LAYER; i++) {
            const btn = this.lanes[i].querySelector('.soloBtn');
            if (btn) btn.classList.toggle('on', this.soloParts.has(i));
            this.lanes[i].classList.toggle('soloDim', this.soloParts.size > 0 && !this.soloParts.has(i));
        }
    },

    // A "grain" = a generated, sonified envelope on a part lane. Grains get the
    // dedicated editing suite (amplitude/duration handles, go-time box) INSTEAD
    // of the node/diamond/splice tools (composer, 2026-08-10 addendum).
    isGrain(wc) {
        return !!wc && wc.type === 'waveCurve' && wc.sonifyNote != null && wc.layer < META_LAYER;
    },

    openMetaWin() {
        const w = this.lanes[META_LAYER];
        if (!w.classList.contains('open')) {
            w.classList.add('open');
            this.generateTicks(); this.renderAll(); this.applyScroll();   // geometry was display:none
        }
    },

    closeMetaWin() {
        this.lanes[META_LAYER].classList.remove('open');
    },

    // Convert client X to time in seconds
    clientXToTime(clientX) {
        const viewportW = window.innerWidth;
        const playheadX = viewportW / 2;
        const dx = clientX - playheadX;
        return (this.scrollOffset + dx) / this.pixelsPerSecond;
    },

    // ========== UNDO SYSTEM ==========

    pushUndoState() {
        const snapshot = JSON.stringify({ objects: this.objects, markers: this.markers, nextId: this.nextId, motives: this._motiveCache },
            (key, val) => key === '_els' ? undefined : val);
        this.undoStack.push(snapshot);
        if (this.undoStack.length > this.maxUndoSteps) this.undoStack.shift();
        this.redoStack = [];
        this.lastUndoPushTime = Date.now();
    },

    pushUndoStateDebounced(intervalMs = 500) {
        if (Date.now() - this.lastUndoPushTime < intervalMs) return;
        this.pushUndoState();
    },

    undo() {
        if (this.undoStack.length === 0) return;
        const selId = this.selectedObject?.id || null;
        this.selectedObjects = [];
        const current = JSON.stringify({ objects: this.objects, markers: this.markers, nextId: this.nextId, motives: this._motiveCache },
            (key, val) => key === '_els' ? undefined : val);
        this.redoStack.push(current);
        const prev = JSON.parse(this.undoStack.pop());
        this.objects = prev.objects;
        this.markers = prev.markers;
        this.nextId = prev.nextId;
        this._restoreMotives(prev.motives);
        this.selectedObject = null;
        this.selectedNodeIdx = -1;
        this.renderAll();
        if (selId) { const obj = this.objects.find(o => o.id === selId); if (obj) this.selectObject(obj); }
        this.markDirty();
    },

    redo() {
        if (this.redoStack.length === 0) return;
        const selId = this.selectedObject?.id || null;
        this.selectedObjects = [];
        const current = JSON.stringify({ objects: this.objects, markers: this.markers, nextId: this.nextId, motives: this._motiveCache },
            (key, val) => key === '_els' ? undefined : val);
        this.undoStack.push(current);
        const next = JSON.parse(this.redoStack.pop());
        this.objects = next.objects;
        this.markers = next.markers;
        this.nextId = next.nextId;
        this._restoreMotives(next.motives);
        this.selectedObject = null;
        this.selectedNodeIdx = -1;
        this.renderAll();
        if (selId) { const obj = this.objects.find(o => o.id === selId); if (obj) this.selectObject(obj); }
        this.markDirty();
    },

    // ========== CURVE MATH (ported from CurveMaker) ==========

    computeSegY(seg, y1Norm, y2Norm, t) {
        if (seg && seg.model === 'ctrl') {
            const cx = Math.max(0.02, Math.min(0.98, seg.cx != null ? seg.cx : 0.5));
            const cy = Math.max(-0.4, Math.min(1.4, seg.cy != null ? seg.cy : (y1Norm + y2Norm) / 2));
            const a = 1 - 2 * cx, b = 2 * cx, c = -t;
            let bT;
            if (Math.abs(a) < 0.0001) bT = t;
            else {
                const disc = b * b - 4 * a * c;
                if (disc < 0) bT = t;
                else {
                    const sq = Math.sqrt(disc);
                    const t1 = (-b + sq) / (2 * a), t2 = (-b - sq) / (2 * a);
                    bT = (t1 >= 0 && t1 <= 1) ? t1 : t2;
                    bT = Math.max(0, Math.min(1, bT));
                }
            }
            const omt = 1 - bT;
            return Math.max(0, Math.min(1, omt * omt * y1Norm + 2 * omt * bT * cy + bT * bT * y2Norm));
        }
        return this.computeYAtT(seg ? (seg.model || 'bezier') : 'bezier', seg ? (seg.slope || 0) : 0, y1Norm, y2Norm, t);
    },

    computeYAtT(model, slope, y1Norm, y2Norm, t) {
        t = Math.max(0, Math.min(1, t));
        switch (model) {
            case 'power': {
                const exponent = Math.pow(4, slope);
                return y1Norm + (y2Norm - y1Norm) * Math.pow(t, exponent);
            }
            case 'sigmoid': {
                const steepness = slope * 4;
                if (Math.abs(steepness) < 0.01) return y1Norm + (y2Norm - y1Norm) * t;
                const raw = 1 / (1 + Math.exp(-steepness * (t - 0.5)));
                const atZero = 1 / (1 + Math.exp(-steepness * -0.5));
                const atOne = 1 / (1 + Math.exp(-steepness * 0.5));
                return y1Norm + (y2Norm - y1Norm) * ((raw - atZero) / (atOne - atZero));
            }
            case 'exponential': {
                const k = slope * 4;
                if (Math.abs(k) < 0.01) return y1Norm + (y2Norm - y1Norm) * t;
                return y1Norm + (y2Norm - y1Norm) * ((Math.exp(k * t) - 1) / (Math.exp(k) - 1));
            }
            case 'logarithmic': {
                const absK = Math.abs(slope) * 5;
                let shaped;
                if (absK < 0.01) shaped = t;
                else if (slope < 0) shaped = Math.tanh(absK * t) / Math.tanh(absK);
                else shaped = 1 - Math.tanh(absK * (1 - t)) / Math.tanh(absK);
                return y1Norm + (y2Norm - y1Norm) * shaped;
            }
            case 'bezier': default: {
                const ctrlYNorm = slope >= 0
                    ? y1Norm + (y2Norm - y1Norm) * (1 - Math.abs(slope)) * 0.5
                    : y2Norm - (y2Norm - y1Norm) * (1 - Math.abs(slope)) * 0.5;
                const ctrlXNorm = 0.5 + Math.max(-1, Math.min(1, slope)) * 0.49;
                const a = 1 - 2 * ctrlXNorm;
                const b = 2 * ctrlXNorm;
                const c = -t;
                let bT;
                if (Math.abs(a) < 0.0001) bT = t;
                else {
                    const discriminant = b * b - 4 * a * c;
                    if (discriminant < 0) bT = t;
                    else {
                        const sqrtD = Math.sqrt(discriminant);
                        const t1 = (-b + sqrtD) / (2 * a);
                        const t2 = (-b - sqrtD) / (2 * a);
                        bT = (t1 >= 0 && t1 <= 1) ? t1 : t2;
                        bT = Math.max(0, Math.min(1, bT));
                    }
                }
                const omt = 1 - bT;
                return omt * omt * y1Norm + 2 * omt * bT * ctrlYNorm + bT * bT * y2Norm;
            }
        }
    },

    // ========== WAVE CURVE SYSTEM ==========

    getLaneDims(laneIdx) {
        const lane = this.lanes[laneIdx];
        if (!lane) return { top: 30, bottom: 100, height: 70 };
        const rect = lane.getBoundingClientRect();
        if (rect.height === 0) return { top: 30, bottom: 100, height: 70 };   // hidden META window
        const padTop = Math.min(28, Math.round(rect.height * 0.20));
        const padBottom = Math.min(8, Math.round(rect.height * 0.08));
        return { top: padTop, bottom: rect.height - padBottom, height: rect.height - padTop - padBottom };
    },

    createWaveCurve(params) {
        this.pushUndoState();
        const startSeconds = params?.startSeconds ?? (parseFloat(this.wcStartInput.value) || 0);
        const endSeconds = params?.endSeconds ?? (parseFloat(this.wcEndInput.value) || 10);
        const layer = params?.layer ?? (parseInt(this.wcLayerSelect.value) || 1);

        const wc = {
            id: this.generateId('wc'),
            type: 'waveCurve',
            layer,
            startSeconds,
            endSeconds,
            nodes: params?.nodes || [
                { pos: 0, y: 0, smooth: 0.25 },
                { pos: 1, y: 10, smooth: 0.25 }
            ],
            segments: params?.segments || [{ model: 'logarithmic', slope: 0 }],
            color: params?.color || '#000000',
            fillMode: params?.fillMode || 'bottom',
            opacity: params?.opacity ?? 0.3,
            performanceNotes: params?.performanceNotes || '',
            properties: params?.properties || {}
        };

        this.objects.push(wc);
        this.renderWaveCurve(wc);
        this.selectObject(wc);
        this.markDirty();
        return wc;
    },

    // ========== LINE WEDGE SYSTEM ==========

    createLineWedge(params) {
        this.pushUndoState();
        const startSeconds = params?.startSeconds ?? (parseFloat(this.wcStartInput.value) || 0);
        const endSeconds = params?.endSeconds ?? (parseFloat(this.wcEndInput.value) || 10);
        const layer = params?.layer ?? (parseInt(this.wcLayerSelect.value) || 1);

        const lw = {
            id: this.generateId('lw'),
            type: 'lineWedge',
            layer,
            startSeconds,
            endSeconds,
            nodes: params?.nodes || [
                { pos: 0, thickness: 1 },
                { pos: 1, thickness: 5 }
            ],
            yOffset: params?.yOffset ?? 0,
            color: params?.color || '#000000',
            opacity: params?.opacity ?? 0.3,
            performanceNotes: params?.performanceNotes || '',
            properties: params?.properties || {}
        };

        this.objects.push(lw);
        this.renderLineWedge(lw);
        this.selectObject(lw);
        this.markDirty();
        return lw;
    },

    generateLWPath(lw) {
        const dims = this.getLaneDims(lw.layer);
        const centerY = (dims.top + dims.bottom) / 2 + (lw.yOffset || 0);
        const maxPx = dims.height / 3;
        const nodes = lw.nodes;
        if (!nodes || nodes.length < 2) return '';

        const x1 = lw.startSeconds * this.pixelsPerSecond;
        const totalWidth = (lw.endSeconds - lw.startSeconds) * this.pixelsPerSecond;
        if (totalWidth <= 0) return '';

        let pathD = '';
        for (let i = 0; i < nodes.length; i++) {
            const x = x1 + nodes[i].pos * totalWidth;
            const halfThick = (nodes[i].thickness / 10) * maxPx / 2;
            pathD += (i === 0 ? 'M' : ' L') + ` ${x} ${centerY - halfThick}`;
        }
        for (let i = nodes.length - 1; i >= 0; i--) {
            const x = x1 + nodes[i].pos * totalWidth;
            const halfThick = (nodes[i].thickness / 10) * maxPx / 2;
            pathD += ` L ${x} ${centerY + halfThick}`;
        }
        pathD += ' Z';
        return pathD;
    },

    renderLineWedge(lw) {
        const svgNS = 'http://www.w3.org/2000/svg';
        const cg = this.contentGroups[lw.layer];
        if (!cg) return;

        const old = this.elementCache.get(lw.id);
        if (old) old.remove();

        const g = document.createElementNS(svgNS, 'g');
        g.setAttribute('class', 'composerObject');
        g.setAttribute('data-id', lw.id);

        const hl = document.createElementNS(svgNS, 'path');
        hl.setAttribute('fill', 'none');
        hl.setAttribute('stroke', '#FFD700');
        hl.setAttribute('stroke-width', '6');
        hl.setAttribute('stroke-opacity', '0.5');
        hl.style.display = 'none';
        hl.style.pointerEvents = 'none';

        const pathD = this.generateLWPath(lw);
        const p = document.createElementNS(svgNS, 'path');
        p.setAttribute('d', pathD);
        p.setAttribute('fill', lw.color);
        p.setAttribute('fill-opacity', String(lw.opacity ?? 0.8));
        p.setAttribute('stroke', lw.color);
        p.setAttribute('stroke-width', '0.5');
        p.setAttribute('stroke-linejoin', 'round');
        p.style.pointerEvents = 'none';

        const hp = document.createElementNS(svgNS, 'path');
        hp.setAttribute('d', pathD);
        hp.setAttribute('fill', 'transparent');
        hp.setAttribute('stroke', 'transparent');
        hp.setAttribute('stroke-width', '8');
        hp.style.cursor = 'copy';   // dblclick = add node
        hp.style.pointerEvents = 'fill';
        hp.addEventListener('mousedown', (e) => {
            e.stopPropagation(); e.preventDefault();
            if (e.shiftKey) { this.selectObject(lw, { additive: true }); return; }
            if (this.selectedObjects.length > 1 && this.selectedObjects.includes(lw)) {
                this.startGroupDrag(lw, e);
                return;
            }
            this.selectObject(lw);
            this.startLWBodyDrag(lw, e);
        });
        hp.addEventListener('dblclick', (e) => { e.stopPropagation(); this.addLWNodeAtClick(lw, e.clientX); });

        hl.setAttribute('d', pathD);
        g.appendChild(hl);
        g.appendChild(p);
        g.appendChild(hp);

        this.elementCache.set(lw.id, g);
        lw._els = { group: g, path: p, hitPath: hp, highlight: hl, nodeHandles: [] };
        cg.appendChild(g);

        const lwSelIdx = this.selectedObjects.findIndex(o => o.id === lw.id);
        if (lwSelIdx >= 0) {
            this.selectedObjects[lwSelIdx] = lw;
            if (this.selectedObject && this.selectedObject.id === lw.id) this.selectedObject = lw;
            hl.style.display = '';
            if (this.selectedObject && this.selectedObject.id === lw.id) this.renderLWNodeHandles(lw);
        }
    },

    renderLWNodeHandles(lw) {
        if (!lw._els) return;
        const svgNS = 'http://www.w3.org/2000/svg';
        const g = lw._els.group;
        const dims = this.getLaneDims(lw.layer);
        const centerY = (dims.top + dims.bottom) / 2 + (lw.yOffset || 0);
        lw._els.nodeHandles.forEach(h => h.remove());
        lw._els.nodeHandles = [];
        const x1 = lw.startSeconds * this.pixelsPerSecond;
        const tw = (lw.endSeconds - lw.startSeconds) * this.pixelsPerSecond;

        lw.nodes.forEach((node, idx) => {
            const cx = x1 + node.pos * tw;
            const c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('cx', cx);
            c.setAttribute('cy', centerY);
            c.setAttribute('r', 5);
            c.setAttribute('fill', this.selectedNodeIdx === idx ? '#FFD700' : '#fff');
            c.setAttribute('stroke', '#333');
            c.setAttribute('stroke-width', '1.5');
            c.style.cursor = 'grab';
            c.style.pointerEvents = 'all';
            c.setAttribute('class', 'composerObject');
            c.addEventListener('mousedown', (e) => {
                e.stopPropagation(); e.preventDefault();
                this.selectedNodeIdx = idx;
                this.renderLWNodeHandles(lw);
                this.showPropertyPanel();
                this.startLWNodeDrag(lw, idx, e);
            });
            g.appendChild(c);
            lw._els.nodeHandles.push(c);
        });
    },

    updateLWRendering(lw) {
        if (!lw._els) return;
        const pathD = this.generateLWPath(lw);
        lw._els.path.setAttribute('d', pathD);
        lw._els.path.setAttribute('fill', lw.color);
        lw._els.path.setAttribute('fill-opacity', String(lw.opacity ?? 0.8));
        lw._els.path.setAttribute('stroke', lw.color);
        lw._els.hitPath.setAttribute('d', pathD);
        lw._els.highlight.setAttribute('d', pathD);
        this.renderLWNodeHandles(lw);
    },

    startLWBodyDrag(lw, startEvent) {
        this.pushUndoState();
        const startClientX = startEvent.clientX;
        const startClientY = startEvent.clientY;
        const origStart = lw.startSeconds;
        const origEnd = lw.endSeconds;
        const origYOffset = lw.yOffset || 0;
        const dims = this.getLaneDims(lw.layer);
        let hasMoved = false;
        let constrainAxis = null; // null | 'h' | 'v'

        const onMove = (e) => {
            hasMoved = true;
            const dx = e.clientX - startClientX;
            const dy = e.clientY - startClientY;

            // Shift-constrain: lock axis after 4px of movement
            let effDx = dx, effDy = dy;
            if (e.shiftKey) {
                if (!constrainAxis && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                    constrainAxis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
                }
                if (constrainAxis === 'h') effDy = 0;
                else if (constrainAxis === 'v') effDx = 0;
            } else {
                constrainAxis = null;
            }

            const dtSec = effDx / this.pixelsPerSecond;
            let newStart = origStart + dtSec;
            if (newStart < 0) newStart = 0;
            const dur = origEnd - origStart;
            lw.startSeconds = Math.round(newStart * 20) / 20;
            lw.endSeconds = Math.round((lw.startSeconds + dur) * 20) / 20;

            const halfH = dims.height / 2;
            lw.yOffset = Math.max(-halfH, Math.min(halfH, origYOffset + effDy));

            this.updateLWRendering(lw);
            this.refreshPanelValues();
        };

        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (!hasMoved) this.undoStack.pop();
            this.showPropertyPanel();
            this.markDirty();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    startLWNodeDrag(lw, nodeIdx, startEvent) {
        const dims = this.getLaneDims(lw.layer);
        const maxPx = dims.height / 3;
        const centerY = (dims.top + dims.bottom) / 2 + (lw.yOffset || 0);
        const node = lw.nodes[nodeIdx];
        this.pushUndoState();
        let hasMoved = false;

        const onMove = (e) => {
            hasMoved = true;
            const viewportW = window.innerWidth;
            const tx = viewportW / 2 - this.scrollOffset;
            const contentX = e.clientX - tx;
            const timeAtCursor = contentX / this.pixelsPerSecond;

            if (nodeIdx === 0) {
                const newStart = Math.max(0, Math.round(timeAtCursor * 20) / 20);
                if (newStart < lw.endSeconds - 0.1) lw.startSeconds = newStart;
            } else if (nodeIdx === lw.nodes.length - 1) {
                const newEnd = Math.max(lw.startSeconds + 0.1, Math.round(timeAtCursor * 20) / 20);
                lw.endSeconds = newEnd;
            } else {
                const curX1 = lw.startSeconds * this.pixelsPerSecond;
                const curTw = (lw.endSeconds - lw.startSeconds) * this.pixelsPerSecond;
                if (curTw > 0) {
                    const minP = lw.nodes[nodeIdx - 1].pos + 0.001;
                    const maxP = lw.nodes[nodeIdx + 1].pos - 0.001;
                    node.pos = Math.max(minP, Math.min(maxP, (contentX - curX1) / curTw));
                }
            }

            const lane = this.lanes[lw.layer];
            const laneRect = lane.getBoundingClientRect();
            const relY = e.clientY - laneRect.top;
            const distFromCenter = Math.abs(relY - centerY);
            node.thickness = Math.max(1, Math.min(10, Math.round((distFromCenter / (maxPx / 2)) * 10)));

            this.updateLWRendering(lw);
            this.refreshPanelValues();
        };

        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (!hasMoved) this.undoStack.pop();
            this.showPropertyPanel();
            this.markDirty();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    addLWNodeAtClick(lw, clientX) {
        this.pushUndoState();
        const viewportW = window.innerWidth;
        const tx = viewportW / 2 - this.scrollOffset;
        const contentX = clientX - tx;
        const x1 = lw.startSeconds * this.pixelsPerSecond;
        const tw = (lw.endSeconds - lw.startSeconds) * this.pixelsPerSecond;
        const nPos = Math.max(0, Math.min(1, (contentX - x1) / tw));

        let insertIdx = 0;
        for (let i = 0; i < lw.nodes.length - 1; i++) {
            if (nPos >= lw.nodes[i].pos && nPos <= lw.nodes[i + 1].pos) { insertIdx = i + 1; break; }
        }

        const leftNode = lw.nodes[insertIdx - 1];
        const rightNode = lw.nodes[insertIdx];
        const segLen = rightNode.pos - leftNode.pos;
        const t = segLen > 0 ? (nPos - leftNode.pos) / segLen : 0;
        const interpThickness = Math.max(1, Math.min(10, Math.round(leftNode.thickness + t * (rightNode.thickness - leftNode.thickness))));

        lw.nodes.splice(insertIdx, 0, { pos: nPos, thickness: interpThickness });
        this.selectedNodeIdx = insertIdx;
        this.updateLWRendering(lw);
        this.showPropertyPanel();
        this.markDirty();
    },

    getThicknessAtTime(lw, timeSec) {
        if (!lw.nodes || lw.nodes.length < 2) return 0;
        const dur = lw.endSeconds - lw.startSeconds;
        if (dur <= 0) return lw.nodes[0].thickness;
        const t = Math.max(0, Math.min(1, (timeSec - lw.startSeconds) / dur));
        for (let i = 0; i < lw.nodes.length - 1; i++) {
            if (t >= lw.nodes[i].pos && t <= lw.nodes[i + 1].pos) {
                const segT = (t - lw.nodes[i].pos) / (lw.nodes[i + 1].pos - lw.nodes[i].pos);
                return lw.nodes[i].thickness + segT * (lw.nodes[i + 1].thickness - lw.nodes[i].thickness);
            }
        }
        return lw.nodes[lw.nodes.length - 1].thickness;
    },

    generateWCPath(wc) {
        const dims = this.getLaneDims(wc.layer);
        const trackTop = dims.top, trackBottom = dims.bottom, trackHeight = dims.height;
        const nodes = wc.nodes, segments = wc.segments;
        if (!nodes || nodes.length < 2 || !segments || segments.length < 1) return { lineD: '', filledD: null };

        const x1 = wc.startSeconds * this.pixelsPerSecond;
        const x2 = wc.endSeconds * this.pixelsPerSecond;
        const totalWidth = x2 - x1;
        if (totalWidth <= 0) return { lineD: '', filledD: null };

        const smoothRadii = nodes.map((n, i) => {
            const s = n.smooth ?? 0;
            if (s <= 0 || i === 0 || i === nodes.length - 1) return 0;
            const leftLen = nodes[i].pos - nodes[i - 1].pos;
            const rightLen = nodes[i + 1].pos - nodes[i].pos;
            return s * Math.min(leftLen, rightLen) * 0.5;
        });
        const hasSmooth = smoothRadii.some(r => r > 0);

        const self = this;
        function evalSeg(segIdx, posNorm) {
            const n0 = nodes[segIdx], n1 = nodes[segIdx + 1];
            const segLen = n1.pos - n0.pos;
            if (segLen <= 0) return n0.y / 10;
            const t = Math.max(0, Math.min(1, (posNorm - n0.pos) / segLen));
            const s = segments[segIdx];
            return self.computeSegY(s, n0.y / 10, n1.y / 10, t);
        }

        if (!hasSmooth) {
            const points = [];
            for (let seg = 0; seg < segments.length; seg++) {
                const n0 = nodes[seg], n1 = nodes[seg + 1];
                if (!n0 || !n1) continue;
                const y1N = n0.y / 10, y2N = n1.y / 10;
                const x0Px = x1 + n0.pos * totalWidth, x1Px = x1 + n1.pos * totalWidth;
                const segW = x1Px - x0Px;
                if (segW <= 0) continue;
                const step = Math.max(1, Math.min(2, segW / 100));
                for (let x = seg === 0 ? x0Px : x0Px + step; x < x1Px; x += step) {
                    const t = (x - x0Px) / segW;
                    const yN = this.computeYAtT(segments[seg].model || 'bezier', segments[seg].slope || 0, y1N, y2N, t);
                    points.push({ x, y: trackBottom - yN * trackHeight });
                }
            }
            const ln = nodes[nodes.length - 1];
            const lx = x1 + ln.pos * totalWidth, ly = trackBottom - (ln.y / 10) * trackHeight;
            if (!points.length || points[points.length - 1].x < lx) points.push({ x: lx, y: ly });
            if (points.length < 2) return { lineD: '', filledD: null };
            let lineD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) lineD += ` L ${points[i].x} ${points[i].y}`;
            if (wc.fillMode !== 'line') {
                const fy = wc.fillMode === 'bottom' ? trackBottom : trackTop;
                let filledD = `M ${points[0].x} ${fy} L ${points[0].x} ${points[0].y}`;
                for (let i = 1; i < points.length; i++) filledD += ` L ${points[i].x} ${points[i].y}`;
                filledD += ` L ${points[points.length - 1].x} ${fy} Z`;
                return { lineD, filledD };
            }
            return { lineD, filledD: null };
        }

        // Smooth-aware path with cubic Bezier blending at smooth nodes
        function getPixelSlope(segIdx, posNorm) {
            const n0 = nodes[segIdx], n1 = nodes[segIdx + 1];
            const eps = (n1.pos - n0.pos) * 0.001;
            if (eps <= 0) return 0;
            const p1 = Math.max(n0.pos, posNorm - eps), p2 = Math.min(n1.pos, posNorm + eps);
            if (p2 <= p1) return 0;
            return -trackHeight * ((evalSeg(segIdx, p2) - evalSeg(segIdx, p1)) / (p2 - p1)) / totalWidth;
        }
        let pathBody = '', firstPt = null, lastPt = null;
        function addPt(pt) {
            if (!firstPt) firstPt = pt;
            else pathBody += ` L ${pt.x} ${pt.y}`;
            lastPt = pt;
        }
        for (let seg = 0; seg < segments.length; seg++) {
            const n0 = nodes[seg], n1 = nodes[seg + 1];
            if (!n0 || !n1) continue;
            if (n1.pos - n0.pos <= 0) continue;
            const eStart = n0.pos + smoothRadii[seg], eEnd = n1.pos - smoothRadii[seg + 1];
            if (eEnd > eStart) {
                const ex0 = x1 + eStart * totalWidth, ex1 = x1 + eEnd * totalWidth;
                const step = Math.max(1, Math.min(2, (ex1 - ex0) / 100));
                for (let x = ex0; x <= ex1 + 0.5; x += step) {
                    const ax = Math.min(x, ex1);
                    const pN = (ax - x1) / totalWidth;
                    addPt({ x: ax, y: trackBottom - evalSeg(seg, pN) * trackHeight });
                    if (ax >= ex1) break;
                }
            } else if (!firstPt) {
                addPt({ x: x1 + eStart * totalWidth, y: trackBottom - evalSeg(seg, eStart) * trackHeight });
            }
            if (smoothRadii[seg + 1] > 0 && seg < segments.length - 1) {
                const r = smoothRadii[seg + 1], np = nodes[seg + 1].pos;
                const lp = np - r, rp = np + r;
                const lx = x1 + lp * totalWidth, ly = trackBottom - evalSeg(seg, lp) * trackHeight;
                const rx = x1 + rp * totalWidth, ry = trackBottom - evalSeg(seg + 1, rp) * trackHeight;
                const mL = getPixelSlope(seg, lp), mR = getPixelSlope(seg + 1, rp);
                const dx = rx - lx;
                if (!firstPt) firstPt = { x: lx, y: ly };
                pathBody += ` C ${lx + dx/3} ${ly + dx/3*mL} ${rx - dx/3} ${ry - dx/3*mR} ${rx} ${ry}`;
                lastPt = { x: rx, y: ry };
            }
        }
        const ln = nodes[nodes.length - 1];
        const lx = x1 + ln.pos * totalWidth, ly = trackBottom - (ln.y / 10) * trackHeight;
        if (!lastPt || lastPt.x < lx - 0.5) addPt({ x: lx, y: ly });
        if (!firstPt) return { lineD: '', filledD: null };
        const lineD = `M ${firstPt.x} ${firstPt.y}${pathBody}`;
        if (wc.fillMode !== 'line') {
            const fy = wc.fillMode === 'bottom' ? trackBottom : trackTop;
            return { lineD, filledD: `M ${firstPt.x} ${fy} L ${firstPt.x} ${firstPt.y}${pathBody} L ${lastPt.x} ${fy} Z` };
        }
        return { lineD, filledD: null };
    },

    getYAtPos(wc, pos) {
        const nodes = wc.nodes, segments = wc.segments;
        if (!nodes || nodes.length < 2) return 0;
        pos = Math.max(0, Math.min(1, pos));
        for (let i = 1; i < nodes.length - 1; i++) {
            const s = nodes[i].smooth ?? 0;
            if (s <= 0) continue;
            const leftLen = nodes[i].pos - nodes[i - 1].pos, rightLen = nodes[i + 1].pos - nodes[i].pos;
            const radius = s * Math.min(leftLen, rightLen) * 0.5;
            if (radius <= 0) continue;
            const lb = nodes[i].pos - radius, rb = nodes[i].pos + radius;
            if (pos < lb || pos > rb) continue;
            const zw = rb - lb;
            if (zw <= 0) continue;
            const u = (pos - lb) / zw;
            const lSeg = segments[i - 1] || { model: 'bezier', slope: 0 };
            const rSeg = segments[i] || { model: 'bezier', slope: 0 };
            const lT = leftLen > 0 ? Math.min(1, (lb - nodes[i - 1].pos) / leftLen) : 0;
            const rT = rightLen > 0 ? Math.min(1, (rb - nodes[i].pos) / rightLen) : 0;
            const yL = this.computeYAtT(lSeg.model, lSeg.slope, nodes[i-1].y/10, nodes[i].y/10, lT) * 10;
            const yR = this.computeYAtT(rSeg.model, rSeg.slope, nodes[i].y/10, nodes[i+1].y/10, rT) * 10;
            const eps = Math.max(radius * 0.01, 1e-6);
            const lTe = leftLen > 0 ? Math.min(1, (lb + eps - nodes[i-1].pos) / leftLen) : 0;
            const yLp = this.computeYAtT(lSeg.model, lSeg.slope, nodes[i-1].y/10, nodes[i].y/10, lTe) * 10;
            const slopeL = (yLp - yL) / eps;
            const rTe = rightLen > 0 ? Math.max(0, (rb - eps - nodes[i].pos) / rightLen) : 0;
            const yRm = this.computeYAtT(rSeg.model, rSeg.slope, nodes[i].y/10, nodes[i+1].y/10, rTe) * 10;
            const slopeR = (yR - yRm) / eps;
            const m0 = slopeL * zw, m1 = slopeR * zw;
            const u2 = u * u, u3 = u2 * u;
            return (2*u3-3*u2+1)*yL + (u3-2*u2+u)*m0 + (-2*u3+3*u2)*yR + (u3-u2)*m1;
        }
        for (let i = 0; i < nodes.length - 1; i++) {
            if (pos >= nodes[i].pos && pos <= nodes[i + 1].pos) {
                const segLen = nodes[i + 1].pos - nodes[i].pos;
                const segT = segLen > 0 ? (pos - nodes[i].pos) / segLen : 0;
                const seg = segments[i] || { model: 'bezier', slope: 0 };
                return this.computeYAtT(seg.model, seg.slope, nodes[i].y/10, nodes[i+1].y/10, segT) * 10;
            }
        }
        return nodes[nodes.length - 1].y;
    },

    getYAtTime(wc, timeSec) {
        if (!wc.nodes || wc.nodes.length < 2) return 0;
        const dur = wc.endSeconds - wc.startSeconds;
        if (dur <= 0) return wc.nodes[0].y;
        return this.getYAtPos(wc, Math.max(0, Math.min(1, (timeSec - wc.startSeconds) / dur)));
    },

    renderWaveCurve(wc) {
        const svgNS = 'http://www.w3.org/2000/svg';
        const cg = this.contentGroups[wc.layer];
        if (!cg) return;

        const old = this.elementCache.get(wc.id);
        if (old) old.remove();

        const g = document.createElementNS(svgNS, 'g');
        g.setAttribute('class', 'composerObject');
        g.setAttribute('data-id', wc.id);

        const hl = document.createElementNS(svgNS, 'path');
        hl.setAttribute('fill', 'none');
        hl.setAttribute('stroke', '#FFD700');
        hl.setAttribute('stroke-width', '6');
        hl.setAttribute('stroke-opacity', '0.5');
        hl.style.display = 'none';
        hl.style.pointerEvents = 'none';

        const { lineD, filledD } = this.generateWCPath(wc);
        const p = document.createElementNS(svgNS, 'path');
        if (wc.fillMode === 'line' || !filledD) {
            p.setAttribute('d', lineD);
            p.setAttribute('fill', 'none');
            p.setAttribute('stroke', wc.color);
