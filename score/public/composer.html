        if (idx == null || idx < 0) return;
        const cm = zone.chordMarkers[idx];
        if (!cm) return;

        // Open piano keyboard in Chord Shape Playback mode
        this.showPianoKeyboard();
        this.pk.functionSelect.value = 'chordPlayback';
        this.switchPKFunction('chordPlayback');

        // Set up the assign callback
        this.pk.assignTarget = { zone, markerIdx: idx, hand };

        // Harmonics mode detection
        this.pk.harmonicsAssignMode = !!(zone.instrument && InstrumentRegistry.isHarmonics(zone.instrument));
        if (this.pk.harmonicsAssignMode) this._activateHarmonicsAssignUI();

        // Show the assign button
        let assignBtn = document.getElementById('pkAssignBtn');
        if (!assignBtn) {
            assignBtn = document.createElement('button');
            assignBtn.id = 'pkAssignBtn';
            assignBtn.textContent = '✓ Assign';
            assignBtn.style.cssText = 'font-size:10px;padding:2px 8px;background:#43A047;color:#fff;border:1px solid #4CAF50;border-radius:3px;cursor:pointer;';
            const playbackPanel = document.getElementById('pkFnChordPlayback');
            if (playbackPanel) {
                const sep = document.createElement('div');
                sep.className = 'pk-sep';
                sep.id = 'pkAssignSep';
                playbackPanel.appendChild(sep);
                playbackPanel.appendChild(assignBtn);
            }
            assignBtn.addEventListener('click', () => this.completeChordAssignment());
        }
        assignBtn.style.display = '';
        const sep = document.getElementById('pkAssignSep');
        if (sep) sep.style.display = '';

        this.setPKStatus('Select shape + root, then click Assign (' + hand.replace('hand', '') + ')');
    },

    completeChordAssignment() {
        const target = this.pk.assignTarget;
        if (!target) return;

        // Harmonics assignment branch
        if (this.pk.harmonicsAssignMode) {
            const sel = this.pk.harmonicsSelection;
            if (!sel) {
                this.setPKStatus('Select a fundamental + partial before assigning');
                return;
            }
            const hData = {
                fundamental: sel.fundamental,
                partial: sel.partial,
                soundsAs: sel.soundsAs,
                soundsMidi: sel.soundsMidi,
                playMidi: sel.playMidi,
                cc21: sel.cc21,
                errorCents: sel.errorCents
            };
            const label = sel.fundamentalName + ' P' + sel.partial + ' ≈ ' + sel.soundsAs;

            if (target.oneShot && target.marker) {
                this.pushUndoState();
                if (target.arInstNum) {
                    const prefix = 'inst' + target.arInstNum;
                    target.marker[prefix + 'Notes'] = [sel.soundsMidi];
                    target.marker[prefix + 'Harmonics'] = hData;
                    target.marker[prefix + 'ShapeId'] = null;
                    target.marker[prefix + 'Root'] = sel.fundamental;
                    console.log('[A-R Harmonics] Assigned', label, 'to Inst', target.arInstNum, 'on marker', target.marker.id);
                } else {
                    target.marker.notes = [sel.soundsMidi];
                    target.marker.harmonics = hData;
                    target.marker.notesShapeId = null;
                    target.marker.notesRoot = sel.fundamental;
                    console.log('[OneShot Harmonics] Assigned', label, 'to marker', target.marker.id);
                }
                if (target.marker.midiSnippet) target.marker.midiSnippet._stale = true;
            } else if (target.asr && target.zone) {
                this.pushUndoState();
                target.zone.asrNotes = [sel.soundsMidi];
                target.zone.asrHarmonics = hData;
                target.zone.asrShapeId = null;
                target.zone.asrRoot = sel.fundamental;
                target.zone.asrLabel = label;
                if (target.zone.midiSnippet) target.zone.midiSnippet._stale = true;
                console.log('[ASR Harmonics] Assigned', label, 'to zone', target.zone.id);
            } else if (target.zone && target.hand) {
                const cm = target.zone.chordMarkers && target.zone.chordMarkers[target.markerIdx];
                if (cm) {
                    this.pushUndoState();
                    cm[target.hand] = {
                        mode: 'harmonics',
                        fundamental: sel.fundamental,
                        partial: sel.partial,
                        soundsAs: sel.soundsAs,
                        soundsMidi: sel.soundsMidi,
                        midis: [sel.soundsMidi],
                        label: label,
                        _harmonics: hData
                    };
                    if (target.zone.midiSnippet) target.zone.midiSnippet._stale = true;
                    console.log('[Chord Harmonics] Assigned', label, 'to', target.hand, 'on marker', target.markerIdx);
                }
            }

            // Clean up
            this.pk.assignTarget = null;
            this.pk.harmonicsAssignMode = false;
            this.pk.harmonicsSelection = null;
            this._setHarmonicsKeyboardMode(false);
            const hPanel = document.getElementById('pkHarmonicsPanel');
            if (hPanel) hPanel.style.display = 'none';
            document.getElementById('pkHarmonicsAdd').style.display = '';
            const assignBtn = document.getElementById('pkAssignBtn');
            if (assignBtn) assignBtn.style.display = 'none';
            const sep = document.getElementById('pkAssignSep');
            if (sep) sep.style.display = 'none';

            this.setPKStatus('Assigned harmonics: ' + label);
            this.showPropertyPanel();
            this.markDirty();
            return;
        }

        const shapes = (this.databases && this.databases.chordShapes) || [];
        const idx = this.pk.playbackShapeIdx;
        const root = this.pk.playbackRoot;

        if (root == null) {
            this.setPKStatus('Click a key to set root before assigning');
            return;
        }

        const hasShape = idx >= 0 && idx < shapes.length;
        const shape = hasShape ? shapes[idx] : null;
        const midis = hasShape
            ? shape.intervals.map(i => root + i).filter(m => m >= 21 && m <= 108)
            : [root];

        // One-shot / AR marker assignment path
        if (target.oneShot && target.marker) {
            this.pushUndoState();
            if (target.arInstNum) {
                // Anticipation-Reaction: write to inst<N>Notes/ShapeId/Root
                const prefix = 'inst' + target.arInstNum;
                target.marker[prefix + 'Notes'] = [...midis];
                target.marker[prefix + 'ShapeId'] = shape ? shape.id : null;
                target.marker[prefix + 'Root'] = root;
                console.log('[A-R] Assigned notes', midis, '(shape:', shape ? shape.id : 'single', 'root:', root, ') to Inst', target.arInstNum, 'on marker', target.marker.id);
            } else {
                // Plain one-shot marker — store notes + shape provenance
                target.marker.notes = [...midis];
                target.marker.notesShapeId = shape ? shape.id : null;
                target.marker.notesRoot = root;
                console.log('[OneShot] Assigned notes', midis, '(shape:', shape ? shape.id : 'single', 'root:', root, ') to marker', target.marker.id);
            }
            if (target.marker.midiSnippet) target.marker.midiSnippet._stale = true;

            // Clean up assign UI
            this.pk.assignTarget = null;
            const assignBtn = document.getElementById('pkAssignBtn');
            if (assignBtn) assignBtn.style.display = 'none';
            const sep = document.getElementById('pkAssignSep');
            if (sep) sep.style.display = 'none';

            this.setPKStatus('Assigned to marker: ' + midis.join(', '));
            this.showPropertyPanel();
            this.markDirty();
            return;
        }

        // ASR zone assignment path
        if (target.asr && target.zone) {
            this.pushUndoState();
            const noteName = (['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][root % 12]) + (Math.floor(root / 12) - 1);
            target.zone.asrNotes = [...midis];
            target.zone.asrShapeId = shape ? shape.id : null;
            target.zone.asrRoot = root;
            target.zone.asrLabel = shape ? (shape.structuredName + ' on ' + noteName) : (noteName + ' (' + root + ')');
            if (target.zone.midiSnippet) target.zone.midiSnippet._stale = true;
            console.log('[ASR] Assigned notes', midis, '(shape:', shape ? shape.id : 'single', 'root:', root, ') to zone', target.zone.id);

            this.pk.assignTarget = null;
            const assignBtn = document.getElementById('pkAssignBtn');
            if (assignBtn) assignBtn.style.display = 'none';
            const sep = document.getElementById('pkAssignSep');
            if (sep) sep.style.display = 'none';

            this.setPKStatus('Assigned to ASR zone: ' + midis.join(', '));
            this.showPropertyPanel();
            this.markDirty();
            return;
        }

        // Zone chord marker assignment path (original)
        const { zone, markerIdx, hand } = target;
        const cm = zone.chordMarkers && zone.chordMarkers[markerIdx];
        if (!cm) return;

        const timeBefore = zone.chordMarkers.map(m => m.time.toFixed(3));
        this.pushUndoState();
        const noteName = (['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][root % 12]) + (Math.floor(root / 12) - 1);
        cm[hand] = {
            mode: 'fixed',
            shapeId: shape ? shape.id : null,
            root: root,
            midis: midis,
            label: shape ? (shape.structuredName + ' on ' + noteName) : (noteName + ' (' + root + ')')
        };
        if (zone.midiSnippet) zone.midiSnippet._stale = true;
        const timeAfter = zone.chordMarkers.map(m => m.time.toFixed(3));
        console.log('[Assign] Marker times before:', timeBefore, 'after:', timeAfter);

        // Clean up assign UI
        this.pk.assignTarget = null;
        const assignBtn = document.getElementById('pkAssignBtn');
        if (assignBtn) assignBtn.style.display = 'none';
        const sep = document.getElementById('pkAssignSep');
        if (sep) sep.style.display = 'none';

        this.setPKStatus('Assigned ' + hand.replace('hand', '') + ' hand: ' + midis.join(', '));
        this.renderZone(zone);
        this.showPropertyPanel();
        this.markDirty();
    },

    async generateOstinatoMidi(zone) {
        // Validate required data
        if (!zone.player || !zone.instrument) {
            alert('Set Player and Instrument first');
            return;
        }
        const cms = zone.chordMarkers || [];
        if (cms.length === 0) {
            alert('Add at least one chord marker');
            return;
        }
        const allSets = (this.databases && this.databases.sets) || [];
        // Validate: each marker must have at least one hand with content (fixed midis or set)
        const hasContent = cms.some(cm => {
            const lOk = (cm.handL && cm.handL.mode === 'set' && cm.handL.setId) ||
                         (cm.handL && cm.handL.midis && cm.handL.midis.length > 0);
            const rOk = (cm.handR && cm.handR.mode === 'set' && cm.handR.setId) ||
                         (cm.handR && cm.handR.midis && cm.handR.midis.length > 0);
            return lOk || rOk;
        });
        if (!hasContent) {
            alert('Assign chords/sets to at least one marker');
            return;
        }

        // Sample curve (wave curve or line wedge)
        const curveSample = this.sampleCurveForZone(zone);
        if (!curveSample) {
            alert('No Wave Curve or Line Wedge found in this layer overlapping the zone');
            return;
        }

        // Store curve snapshot + link on zone (data completeness for future renderers)
        zone.linkedCurveId = curveSample.curveId;
        zone.linkedCurveType = curveSample.curveType;
        zone.curveSnapshot = {
            points: curveSample.points,
            curveType: curveSample.curveType,
            yMin: curveSample.yMin,
            yMax: curveSample.yMax,
            sampledAt: new Date().toISOString()
        };

        const routing = this.getZoneMidiRouting(zone);
        if (!routing) {
            alert('Cannot resolve MIDI routing — check Player/Instrument');
            return;
        }

        const op = zone.ostinatoParams || { smooth: 0.7, speed: 1.0, stretch: 1.5 };
        const durationSec = zone.endTime - zone.startTime;

        // Build breakpoints string for CLI
        const bpParts = curveSample.points.map(p => p.t.toFixed(4) + ',' + p.y.toFixed(4));
        const curveStr = 'breakpoints:' + bpParts.join(',');

        // Sort chord markers by time and build chord change segments
        const sortedCms = [...cms].sort((a, b) => a.time - b.time);

        // Helper: build source payload for a hand
        const buildHandSource = (hand) => {
            if (!hand) return null;
            const mode = hand.mode || 'fixed';
            if (mode === 'set') {
                const set = allSets.find(s => s.id === hand.setId);
                if (!set || set.items.length === 0) return null;
                return {
                    mode: 'set',
                    items: set.items.map(it => ({ midis: it.midis || (it.midi ? [it.midi] : [60]) })),
                    strategy: hand.strategy || 'random',
                    setId: hand.setId,
                    setName: set.name
                };
            }
            // Fixed mode (or legacy without mode)
            if (hand.midis && hand.midis.length > 0) {
                return { mode: 'fixed', midis: hand.midis };
            }
            return null;
        };

        // Build chordChanges array with source info
        const chordChanges = sortedCms.map(cm => {
            const normT = (cm.time - zone.startTime) / durationSec;
            const handA = buildHandSource(cm.handR);
            const handB = buildHandSource(cm.handL);
            return { t: Math.max(0, Math.min(1, normT)), handA, handB };
        });

        // Fill nulls by inheriting from previous marker
        for (let i = 0; i < chordChanges.length; i++) {
            if (i > 0) {
                if (!chordChanges[i].handA) chordChanges[i].handA = chordChanges[i - 1].handA;
                if (!chordChanges[i].handB) chordChanges[i].handB = chordChanges[i - 1].handB;
            }
            if (!chordChanges[i].handA) chordChanges[i].handA = { mode: 'fixed', midis: [60] };
            if (!chordChanges[i].handB) chordChanges[i].handB = { mode: 'fixed', midis: [48] };
        }

        // Data completeness: embed set items snapshot on each marker's source object
        sortedCms.forEach(cm => {
            ['handL', 'handR'].forEach(hand => {
                if (cm[hand] && (cm[hand].mode === 'set') && cm[hand].setId) {
                    const set = allSets.find(s => s.id === cm[hand].setId);
                    if (set) {
                        cm[hand]._snapshotItems = JSON.parse(JSON.stringify(set.items));
                        cm[hand]._snapshotSetName = set.name;
                        cm[hand]._snapshotAt = new Date().toISOString();
                    }
                }
            });
        });

        // Data completeness: snapshot set contents used (zone-level)
        zone.sourceSnapshot = {
            chordMarkers: sortedCms.map(cm => ({
                time: cm.time,
                handL: cm.handL ? JSON.parse(JSON.stringify(cm.handL)) : null,
                handR: cm.handR ? JSON.parse(JSON.stringify(cm.handR)) : null
            })),
            setsUsed: allSets.filter(s => chordChanges.some(cc =>
                (cc.handA && cc.handA.setId === s.id) || (cc.handB && cc.handB.setId === s.id)
            )).map(s => ({ id: s.id, name: s.name, items: JSON.parse(JSON.stringify(s.items)) })),
            snapshotAt: new Date().toISOString()
        };

        console.log('[Generate] Chord changes:', chordChanges);

        // Build harmonics map for re-tagging server-returned events (Phase 3.4)
        // Chord markers with _harmonics on handR/handL will have their soundsMidi sent
        // to the server as normal notes, then re-tagged after return.
        const _harmonicsMapR = {};  // handR (handA)
        const _harmonicsMapL = {};  // handL (handB)
        let _needsDualChannel = false;
        sortedCms.forEach(cm => {
            const rhH = cm.handR && cm.handR._harmonics;
            const lhH = cm.handL && cm.handL._harmonics;
            if (rhH) _harmonicsMapR[rhH.soundsMidi] = rhH;
            if (lhH) _harmonicsMapL[lhH.soundsMidi] = lhH;
            if (lhH && rhH && lhH.cc21 !== rhH.cc21) _needsDualChannel = true;
            // Also scan set items for harmonics metadata
            [['handR', _harmonicsMapR], ['handL', _harmonicsMapL]].forEach(([hk, map]) => {
                const hand = cm[hk];
                if (hand && (hand.mode === 'set') && hand.setId) {
                    const set = allSets.find(s => s.id === hand.setId);
                    if (set) set.items.forEach(it => {
                        if (it._harmonics) map[it._harmonics.soundsMidi] = it._harmonics;
                    });
                }
            });
        });
        const _hasHarmonicsMap = Object.keys(_harmonicsMapR).length > 0 || Object.keys(_harmonicsMapL).length > 0;

        // Call server endpoint to generate
        try {
            const genBtn = document.getElementById('ppGenerateOstinato');
            if (genBtn) { genBtn.textContent = 'Generating...'; genBtn.disabled = true; }

            const resp = await fetch('/api/generate-ostinato', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chordChanges,
                    curve: curveStr,
                    duration: durationSec,
                    smooth: op.smooth,
                    speed: op.speed,
                    stretch: op.stretch,
                    velMin: op.velMin != null ? op.velMin : null,
                    velMax: op.velMax != null ? op.velMax : null,
                    channel: (routing.channel - 1), // 0-indexed for MIDI
                    zoneId: zone.id
                })
            });

            if (!resp.ok) {
                const err = await resp.text();
                alert('Generation failed: ' + err);
                return;
            }

            const result = await resp.json();

            // Re-tag harmonics events from _harmonicsMap (Phase 3.4)
            if (_hasHarmonicsMap) {
                const hInst = InstrumentRegistry.get('harmonics_piano');
                const secondCh = (_needsDualChannel && hInst && hInst.routing) ? hInst.routing.secondChannel : null;
                result.events.forEach(evt => {
                    if (!evt.notes || evt.notes.length === 0) return;
                    const note = evt.notes[0];
                    if (_harmonicsMapR[note]) {
                        evt._harmonics = Object.assign({}, _harmonicsMapR[note]);
                        // RH stays on primary channel (already set by server)
                    } else if (_harmonicsMapL[note]) {
                        evt._harmonics = Object.assign({}, _harmonicsMapL[note]);
                        if (secondCh) evt.channel = secondCh;  // LH to secondary channel
                    }
                });
            }

            const _hRules = InstrumentRegistry.getHarmonicsRules();
            if (_hRules) injectHarmonicsCC(result.events, _hRules);
            zone.midiSnippet = {
                events: result.events,
                generatedAt: new Date().toISOString(),
                params: { chordChanges, smooth: op.smooth, speed: op.speed, stretch: op.stretch },
                port: routing.port,
                channel: routing.channel
            };

            zone.cellActivations = [];
            console.log('[Zone MIDI] Generated snippet for ' + zone.id + ':', {
                events: zone.midiSnippet.events.length,
                port: zone.midiSnippet.port,
                channel: zone.midiSnippet.channel,
                first3: zone.midiSnippet.events.slice(0, 3),
                last: zone.midiSnippet.events[zone.midiSnippet.events.length - 1],
                durationMs: result.durationMs
            });

            // Cascade: auto-regenerate linked imitation zones
            const linkedImitations = this.objects.filter(o => o.type === 'zone' && o.midiModel === 'imitation' && o.ratioSourceZoneId === zone.id);
            linkedImitations.forEach(iz => {
                console.log('[Cascade] Auto-regenerating imitation zone', iz.id);
                this.generateImitationMidi(iz);
            });

            this.renderZone(zone);
            this.showPropertyPanel();
            this.markDirty();
        } catch (e) {
            alert('Error generating: ' + e.message);
        } finally {
            const genBtn = document.getElementById('ppGenerateOstinato');
            if (genBtn) { genBtn.textContent = 'Generate MIDI'; genBtn.disabled = false; }
        }
    },

    generateAccelDecelMidi(zone) {
        if (!zone.player || !zone.instrument) {
            alert('Set Player and Instrument first');
            return;
        }

        // Sample curve (wave curve or line wedge)
        const curveSample = this.sampleCurveForZone(zone);
        if (!curveSample) {
            alert('No Wave Curve or Line Wedge found in this layer overlapping the zone');
            return;
        }

        // Store curve snapshot + link on zone (data completeness)
        zone.linkedCurveId = curveSample.curveId;
        zone.linkedCurveType = curveSample.curveType;
        zone.curveSnapshot = {
            points: curveSample.points,
            curveType: curveSample.curveType,
            yMin: curveSample.yMin,
            yMax: curveSample.yMax,
            sampledAt: new Date().toISOString()
        };

        const routing = this.getZoneMidiRouting(zone);
        if (!routing) {
            alert('Cannot resolve MIDI routing — check Player/Instrument');
            return;
        }

        const adp = zone.accelDecelParams || { fastRate: 100, slowRate: 500, humanize: 15, velStart: 80, velEnd: 110, volumeMode: 'linear' };
        const durationMs = (zone.endTime - zone.startTime) * 1000;
        const points = curveSample.points;
        if (!points || points.length < 2) {
            alert('Curve has insufficient sample points');
            return;
        }

        // Resolve pitch material from chord markers. Returns up to two hand
        // payloads per pulse so L and R remain logically separate (matches
        // ostinato; required for harmonics, which carry per-hand _harmonics
        // metadata and channel-wide CC21 state).
        const allSets = (this.databases && this.databases.sets) || [];
        const cms = (zone.chordMarkers || []).slice().sort((a, b) => a.time - b.time);
        const _resolveState = {};
        function resolveHand(hand) {
            if (!hand) return null;
            const mode = hand.mode || 'fixed';
            if (mode === 'set' && hand.setId) {
                const r = resolveSource(hand, allSets, _resolveState);
                if (!r || !r.midis || r.midis.length === 0) return null;
                return { midis: r.midis, harmonics: r._harmonics || null };
            }
            if (mode === 'harmonics') {
                if (!hand.midis || hand.midis.length === 0) return null;
                return { midis: hand.midis, harmonics: hand._harmonics || null };
            }
            // fixed / legacy
            if (hand.midis && hand.midis.length > 0) {
                return { midis: hand.midis, harmonics: null };
            }
            return null;
        }
        function resolveHandsAtTime(timeMs) {
            if (cms.length === 0) return [{ midis: [60], harmonics: null }]; // fallback: C4
            const timeSec = zone.startTime + timeMs / 1000;
            let active = cms[0];
            for (let i = 1; i < cms.length; i++) {
                if (cms[i].time <= timeSec) active = cms[i];
                else break;
            }
            const out = [];
            const L = resolveHand(active.handL);
            const R = resolveHand(active.handR);
            if (L) out.push(L);
            if (R) out.push(R);
            return out.length ? out : [{ midis: [60], harmonics: null }];
        }

        // Evaluate curve Y at normalized time (0-1) by linear interpolation of breakpoints
        function evalCurve(normT) {
            const t = Math.max(0, Math.min(1, normT));
            if (t <= points[0].t) return points[0].y;
            if (t >= points[points.length - 1].t) return points[points.length - 1].y;
            for (let i = 1; i < points.length; i++) {
                if (t <= points[i].t) {
                    const frac = (t - points[i - 1].t) / (points[i].t - points[i - 1].t);
                    return points[i - 1].y + frac * (points[i].y - points[i - 1].y);
                }
            }
            return points[points.length - 1].y;
        }

        // --- Core Algorithm: Instantaneous-Rate Integration ---
        // Curve Y (0-1) directly maps to inter-onset interval (IOI):
        //   Y=0 → slowRate ms between notes
        //   Y=1 → fastRate ms between notes
        // Total note count emerges naturally from integrating 1/rate over time.
        const fastRate = Math.max(10, Math.min(5000, adp.fastRate != null ? adp.fastRate : 100));
        const slowRate = Math.max(10, Math.min(10000, adp.slowRate != null ? adp.slowRate : 500));

        // Step through the zone at fine resolution and place notes when the
        // accumulated "phase" (integral of 1/rate) reaches 1.
        const dt = 2; // 2ms integration step — fine enough for even the fastest rates
        function rateAt(timeMs) {
            const y = Math.max(0, Math.min(1, evalCurve(timeMs / durationMs)));
            return slowRate + (fastRate - slowRate) * y;
        }

        const noteTimes = [0]; // first note always at t=0
        let phase = 0;
        for (let t = 0; t < durationMs; t += dt) {
            const r = rateAt(t);
            phase += dt / r;
            if (phase >= 1) {
                noteTimes.push(t);
                phase -= 1;
            }
        }
        // Ensure a note near the end (within the last local rate's distance)
        const lastPlaced = noteTimes[noteTimes.length - 1];
        const endRate = rateAt(durationMs - 1);
        if (durationMs - lastPlaced > endRate * 0.6) {
            noteTimes.push(Math.max(lastPlaced + 20, durationMs - 30));
        }

        // --- Humanization: Gaussian jitter with speed-scaling ---
        const humanize = Math.max(0, Math.min(100, adp.humanize || 20));
        const avgInterval = durationMs / Math.max(1, noteTimes.length - 1);
        const percentageJitter = avgInterval * 0.03 * (humanize / 100);
        const absoluteMaxJitter = 8 * (humanize / 100);
        const maxJitterMs = Math.min(percentageJitter, absoluteMaxJitter);

        function gaussianRandom(mean, stdDev) {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return z0 * stdDev + mean;
        }

        const humanizedTimes = noteTimes.map((t, i) => {
            if (i === 0 || i === noteTimes.length - 1) return t;
            const prevInt = t - noteTimes[i - 1];
            const nextInt = i < noteTimes.length - 1 ? noteTimes[i + 1] - t : avgInterval;
            const localInterval = Math.min(prevInt, nextInt);
            const speedFactor = Math.min(0.7, localInterval / 150);
            const jitter = gaussianRandom(0, (maxJitterMs * speedFactor) / 2);
            return Math.max(0, Math.min(durationMs - 50, t + jitter));
        });
        humanizedTimes.sort((a, b) => a - b);

        // --- Build MIDI events ---
        const velStart = Math.max(1, Math.min(127, adp.velStart || 80));
        const velEnd = Math.max(1, Math.min(127, adp.velEnd || 127));
        const volumeMode = adp.volumeMode || 'linear';
        const totalNotes = humanizedTimes.length;
        const generatedEvents = [];

        for (let idx = 0; idx < totalNotes; idx++) {
            const timeMs = humanizedTimes[idx];
            const nextTimeMs = idx < totalNotes - 1 ? humanizedTimes[idx + 1] : timeMs + 100;
            const noteDur = Math.max(20, Math.min(100, nextTimeMs - timeMs - 5));

            // Per-note velocity from volume mode
            const tNorm = totalNotes > 1 ? idx / (totalNotes - 1) : 0;
            let noteVelocity;
            if (volumeMode === 'steady') {
                noteVelocity = velStart;
            } else if (volumeMode === 'linear') {
                noteVelocity = Math.round(velStart + tNorm * (velEnd - velStart));
            } else {
                // Curve or Inverse Curve: sample curve Y at note's time position
                const curveY = evalCurve(timeMs / durationMs);
                const t = volumeMode === 'inverseCurve' ? (1 - curveY) : curveY;
                noteVelocity = Math.round(velStart + t * (velEnd - velStart));
            }
            noteVelocity = Math.max(1, Math.min(127, noteVelocity));

            // Emit one event per active hand (L, then R if present).
            // Harmonics require separate events so injectHarmonicsCC can
            // bracket each with its own CC21 set/reset pair.
            const hands = resolveHandsAtTime(timeMs);
            for (const h of hands) {
                const evt = {
                    onsetMs: timeMs,
                    notes: h.midis,
                    velocity: noteVelocity,
                    durations: h.midis.map(() => noteDur)
                };
                if (h.harmonics) evt._harmonics = h.harmonics;
                generatedEvents.push(evt);
            }
        }

        // Store harmonics CC injection
        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(generatedEvents, _hRules);

        zone.midiSnippet = {
            events: generatedEvents,
            generatedAt: new Date().toISOString(),
            params: { fastRate, slowRate, humanize: adp.humanize, velStart, velEnd, volumeMode },
            port: routing.port,
            channel: routing.channel
        };

        zone.cellActivations = [];
        console.log('[AccelDecel] Generated snippet for ' + zone.id + ':', {
            events: generatedEvents.length,
            fastRate, slowRate,
            port: routing.port,
            channel: routing.channel,
            durationMs
        });

        this.renderZone(zone);
        this.showPropertyPanel();
        this.markDirty();
    },

    _testPlayTimers: [],
    _testPlayOutput: null,
    _testPlayChannel: 0,
    _testPlayActive: false,

    async testPlaySnippet(zone) {
        // Toggle off if already playing
        if (this._testPlayActive) {
            this.stopTestPlay();
            return;
        }

        if (!zone.midiSnippet || !zone.midiSnippet.events || zone.midiSnippet.events.length === 0) {
            alert('No MIDI snippet to play');
            return;
        }

        const snippet = zone.midiSnippet;
        console.log('[Test Play] Starting playback of ' + snippet.events.length + ' events, port: "' + snippet.port + '", ch: ' + snippet.channel);

        // Init MIDI if needed
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                    console.log('[Test Play] Found MIDI output: "' + output.name + '"');
                });
                this._zoneMidiInited = true;
            } catch (e) {
                console.error('[Test Play] Web MIDI not available:', e);
                alert('Web MIDI not available. Check browser permissions.\nSnippet has ' + snippet.events.length + ' events — see console for details.');
                return;
            }
        }

        // List available outputs
        const outputNames = Object.keys(this._zoneMidiOutputs);
        console.log('[Test Play] Available MIDI outputs:', outputNames);

        // Resolve default port/channel from snippet (backward compat)
        const defaultPortName = (snippet.port || '').toLowerCase();
        const defaultOutput = this._zoneMidiOutputs[defaultPortName];
        const defaultCh = (snippet.channel || 1) - 1;

        // Check if any events have per-event routing
        const hasPerEventRouting = snippet.events.some(e => e.port);

        if (!defaultOutput && !hasPerEventRouting) {
            console.warn('[Test Play] Port "' + snippet.port + '" not found. Available:', outputNames);
            alert('MIDI port "' + snippet.port + '" not found.\nAvailable ports: ' + (outputNames.length > 0 ? outputNames.join(', ') : 'none') + '\n\nSnippet has ' + snippet.events.length + ' events — see console.');
            console.log('[Test Play] First 5 events:', snippet.events.slice(0, 5));
            return;
        }

        this._testPlayOutput = defaultOutput;
        this._testPlayChannel = defaultCh;
        this._testPlayActive = true;
        this._testPlayTimers = [];
        this._testPlayOutputs = [];  // track all outputs used for cleanup

        // Schedule events via setTimeout so they can be cancelled
        for (const evt of snippet.events) {
            // Per-event routing: check evt.port/evt.channel, fall back to snippet defaults
            const evtPortName = evt.port ? evt.port.toLowerCase() : defaultPortName;
            const evtOutput = this._zoneMidiOutputs[evtPortName] || defaultOutput;
            const evtCh = (evt.channel || snippet.channel || 1) - 1;
            if (!evtOutput) continue;
            if (!this._testPlayOutputs.includes(evtOutput)) this._testPlayOutputs.push(evtOutput);

            // CC event (e.g. All Sound Off for ring cutoff)
            if (evt._cc != null) {
                const ccTimer = setTimeout(() => {
                    if (!this._testPlayActive) return;
                    evtOutput.send([0xB0 | evtCh, evt._cc, evt._ccValue != null ? evt._ccValue : 0]);
                }, evt.onsetMs);
                this._testPlayTimers.push(ccTimer);
                continue;
            }

            const vel = Math.min(127, Math.max(1, Math.round(evt.velocity)));

            // Note-on timer
            const onTimer = setTimeout(() => {
                if (!this._testPlayActive) return;
                evt.notes.forEach((note) => {
                    evtOutput.send([0x90 | evtCh, note, vel]);
                });
            }, evt.onsetMs);
            this._testPlayTimers.push(onTimer);

            // Note-off timers
            evt.notes.forEach((note, ni) => {
                const dur = evt.durations[ni] || 100;
                const offTimer = setTimeout(() => {
                    if (!this._testPlayActive) return;
                    evtOutput.send([0x80 | evtCh, note, 0]);
                }, evt.onsetMs + dur);
                this._testPlayTimers.push(offTimer);
            });
        }

        // Auto-stop timer after last event + longest duration
        let maxEndMs = 0;
        for (const evt of snippet.events) {
            const end = evt._cc != null ? evt.onsetMs : evt.onsetMs + Math.max(...(evt.durations || [100]));
            if (end > maxEndMs) maxEndMs = end;
        }

        // Cutoff CC (e.g. CC120 All Sound Off for secco) — send right after last note-off
        if (snippet.cutoffCC) {
            const ccNum = snippet.cutoffCC;
            const cutoffTimer = setTimeout(() => {
                if (!this._testPlayActive) return;
                const cutoffOutput = this._zoneMidiOutputs[defaultPortName] || defaultOutput;
                if (cutoffOutput) {
                    cutoffOutput.send([0xB0 | defaultCh, ccNum, 0]);
                    console.log('[Test Play] Sent CC' + ccNum + ' (cutoff) on ch' + (defaultCh + 1));
                }
            }, maxEndMs + 50);
            this._testPlayTimers.push(cutoffTimer);
        }

        const autoStop = setTimeout(() => { this.stopTestPlay(); }, maxEndMs + 500);
        this._testPlayTimers.push(autoStop);

        console.log('[Test Play] Scheduled ' + snippet.events.length + ' events');

        // Update button (zone, marker, or AR test play)
        const btn = document.getElementById('ppTestPlaySnippet') || document.getElementById('ppOneShotTestPlay') || document.getElementById('ppARTestPlay');
        if (btn) {
            btn.textContent = '■ Stop';
            btn.style.background = '#C62828';
        }
    },

    stopTestPlay() {
        // Clear all pending timers
        this._testPlayTimers.forEach(t => clearTimeout(t));
        this._testPlayTimers = [];
        this._testPlayActive = false;

        // Send all-notes-off + all-sound-off on all outputs used (supports per-event routing)
        const outputs = (this._testPlayOutputs && this._testPlayOutputs.length > 0)
            ? this._testPlayOutputs
            : (this._testPlayOutput ? [this._testPlayOutput] : []);
        outputs.forEach(out => {
            for (let c = 0; c < 16; c++) {
                out.send([0xB0 | c, 123, 0]); // All Notes Off
                out.send([0xB0 | c, 120, 0]); // All Sound Off (kills Spitfire/Kontakt resonance)
            }
        });
        this._testPlayOutputs = [];

        console.log('[Test Play] Stopped');

        // Update button (zone, marker, or AR test play)
        const btn = document.getElementById('ppTestPlaySnippet') || document.getElementById('ppOneShotTestPlay') || document.getElementById('ppARTestPlay');
        if (btn) {
            btn.textContent = '▶ Test';
            btn.style.background = '#43A047';
        }
    },

    // ========== ZONE MIDI PLAYBACK (playhead-triggered) ==========

    _zoneMidiOutputs: {},       // portName -> MIDIOutput
    _zoneMidiInited: false,
    _activeZonePlayback: {},    // zoneId -> { nextEventIdx, scheduledUntilMs }
    _lastPlayheadTimeSec: null,

    async initZoneMidi() {
        if (this._zoneMidiInited) return;
        try {
            const access = await navigator.requestMIDIAccess();
            access.outputs.forEach((output) => {
                this._zoneMidiOutputs[output.name.toLowerCase()] = output;
            });
            this._zoneMidiAccess = access;
            access.onstatechange = () => {
                clearTimeout(this._hwRebindTimer);
                this._hwRebindTimer = setTimeout(() => this.bindHwInput(), 400);
            };
            this.bindHwInput();
            this._zoneMidiInited = true;
        } catch (e) {
            console.warn('Zone MIDI init failed:', e);
        }
    },

    tickZoneMidiPlayback(currentTimeSec) {
        if (!this._zoneMidiInited) {
            this.initZoneMidi();
            return;
        }

        const prevTime = this._lastPlayheadTimeSec;
        this._lastPlayheadTimeSec = currentTimeSec;
        if (prevTime == null) return;

        // Mute/Solo logic: if any MIDI object is solo'd, only solo'd objects play
        const hasSolo = this.objects.some(o =>
            o.midiSolo && (o.midiSnippet || o.midiFunction || (o.zoneFunction === 'midiPreview'))
        );

        // Find all zones with midiSnippet
        this.objects.forEach(obj => {
            if (obj.type !== 'zone' || !obj.midiSnippet || !obj.midiSnippet.events || obj.midiSnippet.events.length === 0) return;
            if (obj.midiMute && !obj.midiSolo) return;
            if (hasSolo && !obj.midiSolo) return;

            const snippet = obj.midiSnippet;
            const zoneStart = obj.startTime;
            const zoneEnd = obj.endTime;

            // If playhead just entered this zone
            if (prevTime < zoneStart && currentTimeSec >= zoneStart) {
                this._activeZonePlayback[obj.id] = { nextEventIdx: 0, startedAtPerf: performance.now(), enteredAtSec: currentTimeSec };
            }

            // If playhead left the zone, clean up
            if (currentTimeSec > zoneEnd || currentTimeSec < zoneStart) {
                if (this._activeZonePlayback[obj.id]) {
                    // Send cutoff CC if snippet requests it (e.g. CC120 All Sound Off for ASR secco)
                    if (snippet.cutoffCC) {
                        const cutPortName = (snippet.port || '').toLowerCase();
                        const cutOutput = this._zoneMidiOutputs[cutPortName];
                        const cutCh = (snippet.channel || 1) - 1;
                        if (cutOutput) {
                            cutOutput.send([0xB0 | cutCh, snippet.cutoffCC, 0]);
                        }
                    }
                    delete this._activeZonePlayback[obj.id];
                }
                return;
            }

            // If playhead is inside zone but we haven't started tracking
            if (!this._activeZonePlayback[obj.id] && currentTimeSec >= zoneStart && currentTimeSec <= zoneEnd) {
                const elapsedInZoneMs = (currentTimeSec - zoneStart) * 1000;
                let startIdx = 0;
                for (let i = 0; i < snippet.events.length; i++) {
                    if (snippet.events[i].onsetMs >= elapsedInZoneMs) { startIdx = i; break; }
                    startIdx = i + 1;
                }
                this._activeZonePlayback[obj.id] = { nextEventIdx: startIdx, startedAtPerf: performance.now() - elapsedInZoneMs, enteredAtSec: zoneStart };
            }

            const state = this._activeZonePlayback[obj.id];
            if (!state) return;

            // Schedule events that fall within the current time
            const elapsedInZoneMs = (currentTimeSec - zoneStart) * 1000;
            const lookaheadMs = 100; // schedule 100ms ahead

            const defaultPortName = (snippet.port || '').toLowerCase();
            const defaultOutput = this._zoneMidiOutputs[defaultPortName];
            const hasPerEventRouting = snippet.events.some(e => e.port);
            if (!defaultOutput && !hasPerEventRouting) return;

            const defaultCh = (snippet.channel || 1) - 1; // 0-indexed

            while (state.nextEventIdx < snippet.events.length) {
                const evt = snippet.events[state.nextEventIdx];
                if (evt.onsetMs > elapsedInZoneMs + lookaheadMs) break;

                if (evt.onsetMs >= elapsedInZoneMs - 50) { // don't play events more than 50ms in the past
                    // Per-event routing (for flocking with multiple instruments)
                    const evtPortName = evt.port ? evt.port.toLowerCase() : defaultPortName;
                    const evtOutput = this._zoneMidiOutputs[evtPortName] || defaultOutput;
                    if (!evtOutput) { state.nextEventIdx++; continue; }
                    const evtCh = (evt.channel || snippet.channel || 1) - 1;

                    const delayMs = Math.max(0, evt.onsetMs - elapsedInZoneMs);
                    const now = performance.now();

                    // CC event (e.g. All Sound Off for ring cutoff)
                    if (evt._cc != null) {
                        evtOutput.send([0xB0 | evtCh, evt._cc, evt._ccValue != null ? evt._ccValue : 0], now + delayMs);
                        state.nextEventIdx++;
                        continue;
                    }

                    const vel = Math.min(127, Math.max(1, Math.round(evt.velocity)));
                    evt.notes.forEach((note, ni) => {
                        const dur = evt.durations[ni] || 100;
                        evtOutput.send([0x90 | evtCh, note, vel], now + delayMs);
                        evtOutput.send([0x80 | evtCh, note, 0], now + delayMs + dur);
                    });
                }

                state.nextEventIdx++;
            }
        });

        // Marker playback (oneShot + anticipationReaction): fire when playhead crosses marker time
        this.objects.forEach(obj => {
            if (obj.type !== 'marker') return;
            if (obj.midiFunction !== 'oneShot' && obj.midiFunction !== 'anticipationReaction') return;
            if (!obj.midiSnippet || !obj.midiSnippet.events || obj.midiSnippet.events.length === 0) return;
            if (obj.midiMute && !obj.midiSolo) return;
            if (hasSolo && !obj.midiSolo) return;

            const markerTime = obj.time;
            // Fire if playhead just crossed the marker time (within this tick)
            if (prevTime < markerTime && currentTimeSec >= markerTime) {
                const snippet = obj.midiSnippet;
                const defaultPortName = (snippet.port || '').toLowerCase();
                const defaultOutput = this._zoneMidiOutputs[defaultPortName];
                const defaultCh = (snippet.channel || 1) - 1;
                const now = performance.now();

                snippet.events.forEach(evt => {
                    // Per-event routing (for AR markers with two instruments)
                    const evtPortName = evt.port ? evt.port.toLowerCase() : defaultPortName;
                    const evtOutput = this._zoneMidiOutputs[evtPortName] || defaultOutput;
                    const evtCh = (evt.channel || snippet.channel || 1) - 1;
                    if (!evtOutput) return;

                    const delayMs = Math.max(0, evt.onsetMs || 0);

                    // CC event (e.g. harmonics CC21)
                    if (evt._cc != null) {
                        evtOutput.send([0xB0 | evtCh, evt._cc, evt._ccValue != null ? evt._ccValue : 0], now + delayMs);
                        return;
                    }

                    const vel = Math.min(127, Math.max(1, Math.round(evt.velocity)));
                    evt.notes.forEach((note, ni) => {
                        const dur = evt.durations[ni] || 100;
                        evtOutput.send([0x90 | evtCh, note, vel], now + delayMs);
                        evtOutput.send([0x80 | evtCh, note, 0], now + delayMs + dur);
                    });
                });
                console.log('[Marker MIDI] Fired', snippet.events.length, 'events for', obj.midiFunction, 'marker', obj.id, 'at', markerTime + 's');
            }
        });
    },

    // ========== FLOATING TIME READOUT (draggable vertically) ==========

    setupFloatingTimeDrag() {
        const el = this.floatingTime;
        if (!el) return;
        // the retired top-bar zoom controls live here now (composer 2026-08-14):
        // HOVER shows px/s, DOUBLE-CLICK resets the zoom
        el.addEventListener('mouseenter', () => {
            el._time = el.textContent;
            el.textContent = Math.round(this.pixelsPerSecond) + ' px/s';
            el.style.color = '#2a6faa';
        });
        el.addEventListener('mouseleave', () => {
            if (el._time != null) el.textContent = el._time;
            el.style.color = '#333';
        });
        el.addEventListener('dblclick', (e) => {
            e.preventDefault(); e.stopPropagation();
            this.resetZoom();
            el.textContent = Math.round(this.pixelsPerSecond) + ' px/s';
        });
        let dragging = false;
        let startY = 0;
        let startTop = 0;

        el.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragging = true;
            startY = e.clientY;
            startTop = el.offsetTop;
        });

        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const dy = e.clientY - startY;
            const container = document.getElementById('laneContainer');
            const rect = container.getBoundingClientRect();
            const newTop = Math.max(rect.top, Math.min(rect.bottom - 30, startTop + dy));
            el.style.top = newTop + 'px';
        });

        window.addEventListener('mouseup', () => { dragging = false; });
    },

    // ========== PIANO KEYBOARD TOOL ==========

    // ---- Interval dictionary (semitones → name) ----
    INTERVAL_NAMES: {
        0:'P1', 1:'m2', 2:'M2', 3:'m3', 4:'M3', 5:'P4',
        6:'TT', 7:'P5', 8:'m6', 9:'M6', 10:'m7', 11:'M7', 12:'P8',
        13:'m9', 14:'M9', 15:'m10', 16:'M10', 17:'P11', 18:'TT+8',
        19:'P12', 20:'m13', 21:'M13', 22:'m14', 23:'M14', 24:'P15'
    },

    intervalName(semitones) {
        if (this.INTERVAL_NAMES[semitones]) return this.INTERVAL_NAMES[semitones];
        const octaves = Math.floor(semitones / 12);
        const rem = semitones % 12;
        const base = this.INTERVAL_NAMES[rem] || (rem + '?');
        return base + '+' + octaves + 'oct';
    },

        // Auto-select number input contents on focus
        pk.addEventListener('focus', (e) => {
            if (e.target.matches('input[type="number"]')) e.target.select();

        // Clamp number inputs to min/max on change
        pk.addEventListener('change', (e) => {
            if (e.target.matches('input[type="number"]')) {
                const el = e.target;
                const min = el.min !== '' ? parseFloat(el.min) : null;
                const max = el.max !== '' ? parseFloat(el.max) : null;
                let v = parseFloat(el.value);
                if (isNaN(v)) v = min != null ? min : 0;
                if (min != null && v < min) v = min;
                if (max != null && v > max) v = max;
                el.value = v;
