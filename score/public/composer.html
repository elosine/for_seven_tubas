    generateSeeAllThePeopleMidi(zone) {
        if (!zone || zone.midiModel !== 'seeAllThePeople') return;

        const satpPlayers = zone.seeAllThePeoplePlayers || [];
        const numPlayers = satpPlayers.length;
        if (numPlayers < 2) { alert('Need at least 2 players'); return; }

        const allSets = (this.databases && this.databases.sets) || [];
        const cellsDb = (this.databases && this.databases.cells) || [];
        const durationMs = (zone.endTime - zone.startTime) * 1000;

        // Validate: each player needs a player key and a set with items
        for (let pi = 0; pi < numPlayers; pi++) {
            const pCfg = satpPlayers[pi];
            if (!pCfg.player) { alert('Player ' + (pi + 1) + ' needs a player assigned'); return; }
            const set = pCfg.setId ? allSets.find(s => s.id === pCfg.setId) : null;
            if (!set || set.items.length === 0) { alert('Player ' + (pi + 1) + ' needs a set with items'); return; }
        }

        // Resolve a fallback routing from first player's first set item (including cellDef instruments)
        let fallbackRouting = null;
        for (const pCfg of satpPlayers) {
            const set = pCfg.setId ? allSets.find(s => s.id === pCfg.setId) : null;
            if (set && set.items.length > 0) {
                for (const item of set.items) {
                    let instKey = item.instrument || '';
                    if (!instKey && item.type === 'cellRef' && item.cellId) {
                        const cd = cellsDb.find(c => c.id === item.cellId);
                        if (cd) instKey = cd.instrument || '';
                    }
                    if (instKey) {
                        fallbackRouting = InstrumentRegistry.getRouting(pCfg.player, instKey);
                        if (fallbackRouting) break;
                    }
                }
                if (fallbackRouting) break;
            }
        }
        if (!fallbackRouting) {
            // Use first player's default routing when no instrument routing found
            const firstPlayerKey = satpPlayers[0] ? satpPlayers[0].player : '';
            const PLAYER_DEFAULTS = { piano1: { port: 'Piano1', channel: 1 }, piano2: { port: 'Piano2', channel: 1 }, perc1: { port: 'Perc1-A', channel: 1 }, perc2: { port: 'Perc2-A', channel: 1 } };
            fallbackRouting = PLAYER_DEFAULTS[firstPlayerKey] || { port: 'loopmidi_perc1', channel: 1 };
        }
        console.log('[SATP] Fallback routing:', fallbackRouting.port, 'ch', fallbackRouting.channel);

        // Player-based default routing (when cell has no instrument)
        const PLAYER_DEFAULT_ROUTING = {
            piano1: { port: 'Piano1', channel: 1 },
            piano2: { port: 'Piano2', channel: 1 },
            perc1:  { port: 'Perc1-A', channel: 1 },
            perc2:  { port: 'Perc2-A', channel: 1 }
        };

        // Internal constants
        const P1_GAP_MIN_MS = 80;
        const P1_GAP_MAX_MS = 100;
        const TARGET_CYCLES = [0, 2.0, 2.7, 1.5]; // per player index (0=P1 unused)
        const DIRECTION_INVERT_PROB = 0.7;
        const ONSET_OFFSET_MIN_MS = 50;
        const ONSET_OFFSET_MAX_MS = 80;

        function pickItem(set) {
            return set.items[Math.floor(Math.random() * set.items.length)];
        }

        function resolveItemRouting(playerKey, item, cellDef) {
            const instKey = item.instrument || (cellDef && cellDef.instrument) || '';
            if (instKey) {
                const r = InstrumentRegistry.getRouting(playerKey, instKey);
                if (r) return r;
            }
            return PLAYER_DEFAULT_ROUTING[playerKey] || fallbackRouting;
        }

        // Get sorted onset times from events (onset-only, ignoring durations)
        function getSortedOnsets(events) {
            return events.map(e => e.onsetMs).sort((a, b) => a - b);
        }

        // Find the largest gap between consecutive onsets in a time window
        function findLargestOnsetGap(events, fromMs, toMs) {
            const onsets = getSortedOnsets(events).filter(t => t >= fromMs && t <= toMs);
            if (onsets.length === 0) return { midMs: (fromMs + toMs) / 2, gapMs: toMs - fromMs };
            let bestGap = onsets[0] - fromMs;
            let bestMid = fromMs + bestGap / 2;
            for (let i = 1; i < onsets.length; i++) {
                const gap = onsets[i] - onsets[i - 1];
                if (gap > bestGap) { bestGap = gap; bestMid = onsets[i - 1] + gap / 2; }
            }
            const tailGap = toMs - onsets[onsets.length - 1];
            if (tailGap > bestGap) { bestGap = tailGap; bestMid = onsets[onsets.length - 1] + tailGap / 2; }
            return { midMs: bestMid, gapMs: bestGap };
        }

        // Check if a set item is a cycle stream cell (repeatMode=cycle triggers parallax engine)
        function isCycleStreamCell(item) {
            if (item.type !== 'cellRef' || !item.cellId) return false;
            const cd = cellsDb.find(c => c.id === item.cellId);
            if (!cd) return false;
            return (cd.repeatMode || 'cycle') === 'cycle';
        }

        // Check if a set item is a once cell (repeatMode=once triggers onset-offset placement)
        function isOnceCell(item) {
            if (item.type !== 'cellRef' || !item.cellId) return false;
            const cd = cellsDb.find(c => c.id === item.cellId);
            if (!cd) return false;
            return cd.repeatMode === 'once';
        }

        // Resolve cell duration: durationOverride > defaultDurationMs > 1000
        function resolveCellDuration(cellDef, playerCfg) {
            const ovr = playerCfg.durationOverrides;
            if (ovr && ovr[cellDef.id]) return ovr[cellDef.id];
            return cellDef.defaultDurationMs || 1000;
        }

        // Estimate local inter-onset interval near a time point
        function estimateLocalIOI(events, timeMs, windowMs) {
            const nearby = events.filter(e => Math.abs(e.onsetMs - timeMs) < windowMs);
            if (nearby.length < 2) return 200;
            nearby.sort((a, b) => a.onsetMs - b.onsetMs);
            let totalGap = 0, count = 0;
            for (let i = 1; i < nearby.length; i++) {
                totalGap += nearby[i].onsetMs - nearby[i - 1].onsetMs;
                count++;
            }
            return count > 0 ? totalGap / count : 200;
        }

        // Compute phase-shifted behavior override for a subsequent player's stream
        // Bases speed on P1's actual tempo (avgIOI), not the cell's baked-in speed
        function computePhaseShiftBehavior(cellDef, prevDir, pi, avgIOI, zoneDurMs) {
            const tc = TARGET_CYCLES[Math.min(pi, TARGET_CYCLES.length - 1)] || 2.0;
            const delta = tc * avgIOI / zoneDurMs;
            const levelOffset = -8.314 * Math.log(1 + delta);

            // Convert P1's avgIOI to a base speed level (inverse of densityToIOI)
            const baseLevel = Math.max(1, Math.min(22,
                1 + 21 * Math.log(avgIOI / 1000) / Math.log(80 / 1000)));

            // Preserve cell's accel/decel range but center on P1's tempo
            const defBeh = cellDef.behavior || {};
            const defSpeed = defBeh.speed || {};
            const defStart = defSpeed.start != null ? defSpeed.start : 5;
            const defEnd = defSpeed.end != null ? defSpeed.end : 5;
            const range = Math.abs(defEnd - defStart);
            const isAccel = defEnd > defStart;
            const invert = Math.random() < DIRECTION_INVERT_PROB;

            let newStart, newEnd;
            if (range > 0 && invert) {
                // Inverted direction centered on base level + offset
                newStart = baseLevel + range / 2 + levelOffset;
                newEnd = baseLevel - range / 2 - levelOffset;
            } else if (range > 0) {
                // Same direction centered on base level + offset
                if (isAccel) {
                    newStart = baseLevel - range / 2 + levelOffset;
                    newEnd = baseLevel + range / 2 + levelOffset;
                } else {
                    newStart = baseLevel + range / 2 + levelOffset;
                    newEnd = baseLevel - range / 2 + levelOffset;
                }
            } else {
                // Steady pulse at base level + offset
                newStart = baseLevel + levelOffset;
                newEnd = baseLevel + levelOffset;
            }

            newStart = Math.max(1, Math.min(22, newStart));
            newEnd = Math.max(1, Math.min(22, newEnd));
            const dir = newEnd > newStart ? 1 : (newEnd < newStart ? -1 : prevDir);
            return {
                behavior: {
                    speed: {
                        start: Math.round(newStart * 10) / 10,
                        end: Math.round(newEnd * 10) / 10,
                        curve: defSpeed.curve || 'linear'
                    }
                },
                direction: dir
            };
        }

        function buildSingleEvent(item, onsetMs, playerKey, pi, role) {
            const notes = item.midis || (item.midi ? [item.midi] : [60]);
            const r = resolveItemRouting(playerKey, item, null);
            return {
                onsetMs: Math.round(onsetMs),
                notes: [...notes],
                velocity: 80 + Math.floor(Math.random() * 40),
                durations: notes.map(() => 200),
                port: r.port,
                channel: r.channel,
                playerIndex: pi,
                playerKey: playerKey,
                role: role,
                itemType: item.type || '',
                itemLabel: item.label || '',
                instrument: item.instrument || null,
                beater: item.beater || null,
                articulation: item.articulation || null
            };
        }

        // Tag cell events with per-event routing and metadata
        function tagCellEvents(cellEvents, cellDef, item, playerKey, pi, role) {
            if (cellEvents.length > 0) {
                const firstInst = cellEvents[0]._instrument || cellDef.instrument || '(none)';
                const r0 = InstrumentRegistry.getRouting(playerKey, firstInst);
                const pd = PLAYER_DEFAULT_ROUTING[playerKey];
                const routeStr = r0 ? r0.port + ' ch' + r0.channel : (pd ? pd.port + ' ch' + pd.channel + ' (player default)' : 'FALLBACK');
                console.log('[SATP] tagCellEvents P' + (pi+1) + ': player=' + playerKey + ', inst=' + firstInst + ', routing=' + routeStr);
            }
            cellEvents.forEach(ce => {
                const instKey = ce._instrument || cellDef.instrument || '';
                const playerDefault = PLAYER_DEFAULT_ROUTING[playerKey] || fallbackRouting;
                const r = instKey ? (InstrumentRegistry.getRouting(playerKey, instKey) || playerDefault) : playerDefault;
                ce.port = r.port;
                ce.channel = r.channel;
                ce.playerIndex = pi;
                ce.playerKey = playerKey;
                ce.role = role;
                ce.itemType = 'cellRef';
                ce.itemLabel = item.label || cellDef.label || item.cellId;
                if (ce._instrument) ce.instrument = ce._instrument;
                if (ce._beater) ce.beater = ce._beater;
                if (ce._articulation) ce.articulation = ce._articulation;
            });
        }

        function snapshotCellItems(cellDef) {
            return cellDef.items.map(it => ({
                midi: it.midi, name: it.name || '',
                instrument: it.instrument || cellDef.instrument || '',
                beater: it.beater || '', articulation: it.articulation || ''
            }));
        }

        this.pushUndoState();
        const cellActivations = [];

        // ===== PHASE A: P1 seed — dense stream with baked-in behavior =====
        const p1Cfg = satpPlayers[0];
        const p1Set = allSets.find(s => s.id === p1Cfg.setId);
        const p1Key = p1Cfg.player;
        const p1Events = [];
        let cursorMs = 0;
        let safety = 0;

        while (cursorMs < durationMs && safety < 5000) {
            const item = pickItem(p1Set);
            if (item.type === 'cellRef' && item.cellId) {
                const cellDef = cellsDb.find(c => c.id === item.cellId);
                if (cellDef && cellDef.items && cellDef.items.length > 0) {
                    const cellDur = Math.min(resolveCellDuration(cellDef, p1Cfg), durationMs - cursorMs);
                    if (cellDur <= 0) break;
                    const cellEvents = expandCellRef(cellDef, Math.round(cursorMs), cellDur, null);
                    tagCellEvents(cellEvents, cellDef, item, p1Key, 0, 'seed');
                    p1Events.push(...cellEvents);
                    cellActivations.push({
                        playerIndex: 0, cellId: cellDef.id,
                        label: cellDef.label || cellDef.id,
                        startMs: Math.round(cursorMs), endMs: Math.round(cursorMs + cellDur),
                        durationMs: cellDur, behaviorUsed: cellDef.behavior || {},
                        phrasing: cellDef.phrasing || 'ostinato',
                        repeatMode: cellDef.repeatMode || 'cycle',
                        ordering: cellDef.ordering || 'sequential',
                        clusterWindowMs: cellDef.clusterWindowMs || null,
                        sustainMs: cellDef.sustainMs || null,
                        ringMode: cellDef.ringMode || null,
                        ringMs: cellDef.ringMs || null,
                        defaultDurationMs: cellDef.defaultDurationMs || null,
                        jitter: cellDef.jitter || 0,
                        itemsSnapshot: snapshotCellItems(cellDef)
                    });
                    cursorMs += cellDur + P1_GAP_MIN_MS + Math.random() * (P1_GAP_MAX_MS - P1_GAP_MIN_MS);
                } else {
                    cursorMs += 100;
                }
            } else {
                p1Events.push(buildSingleEvent(item, cursorMs, p1Key, 0, 'seed'));
                cursorMs += P1_GAP_MIN_MS + Math.random() * (P1_GAP_MAX_MS - P1_GAP_MIN_MS);
            }
            safety++;
        }
        console.log('[SATP] P1 seed:', p1Events.length, 'events over', Math.round(cursorMs), 'ms');

        // ===== PHASE B: Subsequent players — phase-shift parallax =====
        let combinedEvents = [...p1Events];

        // Determine P1's direction for inversion chain
        let prevDirection = 1;
        const p1Streams = p1Set.items.filter(i => isCycleStreamCell(i));
        if (p1Streams.length > 0) {
            const cDef = cellsDb.find(c => c.id === p1Streams[0].cellId);
            if (cDef) {
                const sp = (cDef.behavior && cDef.behavior.speed) || {};
                prevDirection = ((sp.end || 5) >= (sp.start || 5)) ? 1 : -1;
            }
        }

        for (let pi = 1; pi < numPlayers; pi++) {
            const pCfg = satpPlayers[pi];
            const pSet = allSets.find(s => s.id === pCfg.setId);
            const playerKey = pCfg.player;
            if (!pSet || pSet.items.length === 0) continue;

            const playerEvents = [];
            let pCursor = 0;
            let pSafety = 0;
            let playerDir = prevDirection;

            while (pCursor < durationMs && pSafety < 5000) {
                const item = pickItem(pSet);

                if (isCycleStreamCell(item)) {
                    // === Cycle stream cell: phase-shifted parallax placement ===
                    const cellDef = cellsDb.find(c => c.id === item.cellId);
                    if (!cellDef || !cellDef.items || cellDef.items.length === 0) {
                        pCursor += 100;
                        pSafety++;
                        continue;
                    }

                    // Estimate local IOI from combined events
                    const localIOI = estimateLocalIOI(combinedEvents, pCursor, 500);

                    // Compute phase-shifted behavior override
                    const phaseResult = computePhaseShiftBehavior(cellDef, playerDir, pi, localIOI, durationMs);
                    const behOverride = phaseResult.behavior;
                    playerDir = phaseResult.direction;

                    // Find entry point in largest onset gap
                    const searchEnd = Math.min(pCursor + localIOI * 4, durationMs);
                    const gapInfo = findLargestOnsetGap(combinedEvents, pCursor, searchEnd);
                    const entryMs = Math.max(0, Math.round(gapInfo.midMs));

                    // Compute stream duration
                    const cellDur = Math.max(300, durationMs - entryMs);
                    if (cellDur <= 0) { pCursor = durationMs; break; }

                    // Realize the stream with overridden behavior
                    const cellEvents = expandCellRef(cellDef, entryMs, cellDur, behOverride);
                    tagCellEvents(cellEvents, cellDef, item, playerKey, pi, 'weave');
                    playerEvents.push(...cellEvents);
                    cellActivations.push({
                        playerIndex: pi, cellId: cellDef.id,
                        label: cellDef.label || cellDef.id,
                        startMs: entryMs, endMs: entryMs + cellDur,
                        durationMs: cellDur, behaviorUsed: behOverride,
                        phrasing: cellDef.phrasing || 'ostinato',
                        repeatMode: cellDef.repeatMode || 'cycle',
                        ordering: cellDef.ordering || 'sequential',
                        clusterWindowMs: cellDef.clusterWindowMs || null,
                        sustainMs: cellDef.sustainMs || null,
                        ringMode: cellDef.ringMode || null,
                        ringMs: cellDef.ringMs || null,
                        defaultDurationMs: cellDef.defaultDurationMs || null,
                        jitter: cellDef.jitter || 0,
                        itemsSnapshot: snapshotCellItems(cellDef)
                    });

                    pCursor = entryMs + cellDur + P1_GAP_MIN_MS + Math.random() * (P1_GAP_MAX_MS - P1_GAP_MIN_MS);
                } else {
                    // === Once cells, single articulations, clusters: onset-offset placement ===
                    // Find nearest existing onset at the current point in time
                    const sortedOnsets = getSortedOnsets(combinedEvents);
                    let nearestOnset = null;
                    let bestDist = Infinity;
                    for (const t of sortedOnsets) {
                        if (t >= pCursor - 100 && t <= pCursor + 400) {
                            const d = Math.abs(t - pCursor);
                            if (d < bestDist) { bestDist = d; nearestOnset = t; }
                        }
                    }
                    if (nearestOnset === null) {
                        // No onset nearby, skip ahead
                        pCursor += 150 + Math.random() * 100;
                        pSafety++;
                        continue;
                    }

                    // Offset 50-80ms from nearest existing onset
                    const offset = ONSET_OFFSET_MIN_MS + Math.random() * (ONSET_OFFSET_MAX_MS - ONSET_OFFSET_MIN_MS);
                    const beforeOrAfter = Math.random() < 0.5 ? -1 : 1;
                    const onsetMs = Math.max(0, Math.min(durationMs - 50, nearestOnset + offset * beforeOrAfter));

                    if (item.type === 'cellRef' && item.cellId) {
                        // Once cell or cluster cell: first note-on at offset point, uses default/override duration
                        const cellDef = cellsDb.find(c => c.id === item.cellId);
                        if (cellDef && cellDef.items && cellDef.items.length > 0) {
                            const cellDur = Math.min(resolveCellDuration(cellDef, pCfg), durationMs - onsetMs);
                            if (cellDur > 0) {
                                const cellEvents = expandCellRef(cellDef, Math.round(onsetMs), cellDur, null);
                                tagCellEvents(cellEvents, cellDef, item, playerKey, pi, 'weave');
                                playerEvents.push(...cellEvents);
                                cellActivations.push({
                                    playerIndex: pi, cellId: cellDef.id,
                                    label: cellDef.label || cellDef.id,
                                    startMs: Math.round(onsetMs), endMs: Math.round(onsetMs + cellDur),
                                    durationMs: cellDur, behaviorUsed: cellDef.behavior || {},
                                    phrasing: cellDef.phrasing || 'ostinato',
                                    repeatMode: cellDef.repeatMode || 'cycle',
                                    ordering: cellDef.ordering || 'sequential',
                                    clusterWindowMs: cellDef.clusterWindowMs || null,
                                    sustainMs: cellDef.sustainMs || null,
                                    ringMode: cellDef.ringMode || null,
                                    ringMs: cellDef.ringMs || null,
                                    defaultDurationMs: cellDef.defaultDurationMs || null,
                                    jitter: cellDef.jitter || 0,
                                    itemsSnapshot: snapshotCellItems(cellDef)
                                });
                                // Advance cursor past the cell's end to prevent overlapping activations
                                pCursor = onsetMs + cellDur + P1_GAP_MIN_MS + Math.random() * (P1_GAP_MAX_MS - P1_GAP_MIN_MS);
                                pSafety++;
                                continue;
                            }
                        }
                    } else {
                        playerEvents.push(buildSingleEvent(item, onsetMs, playerKey, pi, 'weave'));
                    }

                    pCursor = onsetMs + P1_GAP_MIN_MS + Math.random() * (P1_GAP_MAX_MS - P1_GAP_MIN_MS);
                }
                pSafety++;
            }

            // Update direction chain for next player
            prevDirection = playerDir;

            const streamCount = playerEvents.filter(e => e.itemType === 'cellRef').length;
            const oneshotCount = playerEvents.length - streamCount;
            console.log('[SATP] P' + (pi + 1) + ': placed', playerEvents.length, 'events (' + streamCount + ' stream, ' + oneshotCount + ' oneshot)');
            combinedEvents.push(...playerEvents);
            combinedEvents.sort((a, b) => a.onsetMs - b.onsetMs);
        }

        // ===== Snapshot + Store =====
        zone.seeAllThePeoplePlayersSnapshot = satpPlayers.map(pCfg => {
            const set = pCfg.setId ? allSets.find(s => s.id === pCfg.setId) : null;
            return {
                player: pCfg.player || '',
                setId: pCfg.setId || '',
                setName: set ? set.name : '',
                setItems: set ? set.items.map(item => {
                    const snap = {
                        type: item.type, label: item.label || '',
                        midis: item.midis ? [...item.midis] : [],
                        midi: item.midi || null,
                        instrument: item.instrument || null,
                        beater: item.beater || null,
                        articulation: item.articulation || null,
                        pitch: item.pitch || null,
                        shapeId: item.shapeId || null,
                        root: item.root || null
                    };
                    if (item.type === 'cellRef' && item.cellId) {
                        snap.cellId = item.cellId;
                        const cellDef = cellsDb.find(c => c.id === item.cellId);
                        if (cellDef) {
                            snap.cellSnapshot = {
                                label: cellDef.label || '',
                                phrasing: cellDef.phrasing || 'ostinato',
                                repeatMode: cellDef.repeatMode || 'cycle',
                                ordering: cellDef.ordering || 'sequential',
                                clusterWindowMs: cellDef.clusterWindowMs || null,
                                sustainMs: cellDef.sustainMs || null,
                                ringMode: cellDef.ringMode || null,
                                ringMs: cellDef.ringMs || null,
                                defaultDurationMs: cellDef.defaultDurationMs || null,
                                jitter: cellDef.jitter || 0,
                                behavior: cellDef.behavior ? JSON.parse(JSON.stringify(cellDef.behavior)) : {},
                                items: snapshotCellItems(cellDef)
                            };
                        }
                    }
                    return snap;
                }) : []
            };
        });

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(combinedEvents, _hRules);
        zone.midiSnippet = {
            events: combinedEvents,
            port: fallbackRouting.port,
            channel: fallbackRouting.channel,
            _stale: false,
            _generatedAt: Date.now()
        };
        zone.cellActivations = cellActivations;

        const uniquePorts = [...new Set(combinedEvents.map(e => e.port))];
        console.log('[SATP] Generated for', zone.id, '—', combinedEvents.length, 'events,', numPlayers, 'players');
        console.log('[SATP] Event ports:', uniquePorts, '| First 3 events:', combinedEvents.slice(0, 3).map(e => ({ port: e.port, ch: e.channel, onset: e.onsetMs, notes: e.notes })));
        this.showPropertyPanel();
        this.markDirty();
    },

    startARChordAssignment(marker, instNum) {
        if (!marker || marker.midiFunction !== 'anticipationReaction') return;
        this.showPianoKeyboard();
        this.pk.functionSelect.value = 'chordPlayback';
        this.switchPKFunction('chordPlayback');

        // Set up assign target with AR context
        this.pk.assignTarget = { marker, arInstNum: instNum, oneShot: true };

        // Harmonics mode detection
        const arInstKey = marker['inst' + instNum + 'Instrument'];
        this.pk.harmonicsAssignMode = !!(arInstKey && InstrumentRegistry.isHarmonics(arInstKey));
        if (this.pk.harmonicsAssignMode) this._activateHarmonicsAssignUI();

        // Show the assign button
        let assignBtn = document.getElementById('pkAssignBtn');
        if (!assignBtn) {
            assignBtn = document.createElement('button');
            assignBtn.id = 'pkAssignBtn';
            assignBtn.textContent = '✓ Assign';
            assignBtn.style.cssText = 'font-size:10px;padding:2px 8px;background:#43A047;color:#fff;border:1px solid #4CAF50;border-radius:3px;cursor:pointer;';
            const playbackPanel = document.getElementById('pkFnChordPlayback');
            if (playbackPanel) {
                const sep = document.createElement('div');
                sep.className = 'pk-sep';
                sep.id = 'pkAssignSep';
                playbackPanel.appendChild(sep);
                playbackPanel.appendChild(assignBtn);
            }
            assignBtn.addEventListener('click', () => this.completeChordAssignment());
        }
        assignBtn.style.display = '';
        const sep = document.getElementById('pkAssignSep');
        if (sep) sep.style.display = '';

        this.setPKStatus('Select shape + root → Assign to Inst ' + instNum + ' on marker ' + marker.id);
        console.log('[A-R] Chord assignment started for Inst', instNum, 'on marker', marker.id);
    },

    generateZoneOneShotMidi(zone) {
        if (!zone || zone.midiModel !== 'oneShot') return;
        const routing = InstrumentRegistry.getRouting(zone.player, zone.instrument);
        if (!routing) {
            alert('Cannot resolve MIDI routing — check Player/Instrument');
            return;
        }
        const cms = zone.chordMarkers || [];
        if (cms.length === 0) {
            alert('Add at least one marker first');
            return;
        }

        // === Cell material mode ===
        if (zone.materialType === 'cell') {
            const cellDef = zone.cellId ? (this.databases.cells || []).find(c => c.id === zone.cellId) : null;
            if (!cellDef || !cellDef.items || cellDef.items.length === 0) {
                alert('Select a cell with items first');
                return;
            }
            const dur = Math.max(100, zone.cellDurationMs != null ? zone.cellDurationMs : (cellDef.defaultDurationMs || 1000));
            let behaviorOverrides = null;
            if (zone.cellSpeedStart != null || zone.cellVolStart != null) {
                behaviorOverrides = {};
                const cb = (cellDef.behavior || {});
                const cs = cb.speed || {};
                const cv = cb.volume || {};
                behaviorOverrides.speed = {
                    start: zone.cellSpeedStart != null ? zone.cellSpeedStart : (cs.start != null ? cs.start : 5),
                    end: zone.cellSpeedEnd != null ? zone.cellSpeedEnd : (cs.end != null ? cs.end : 5),
                    curve: zone.cellSpeedCurve || cs.curve || 'linear'
                };
                behaviorOverrides.volume = {
                    start: zone.cellVolStart != null ? zone.cellVolStart : (cv.start != null ? cv.start : 5),
                    end: zone.cellVolEnd != null ? zone.cellVolEnd : (cv.end != null ? cv.end : 5),
                    curve: zone.cellVolCurve || cv.curve || 'linear'
                };
            }
            const allEvents = [];
            const sorted = [...cms].sort((a, b) => a.time - b.time);
            sorted.forEach(cm => {
                const markerOffsetMs = (cm.time - zone.startTime) * 1000;
                const cellEvents = expandCellRef(cellDef, markerOffsetMs, dur, behaviorOverrides);
                cellEvents.forEach(evt => {
                    const instKey = evt._instrument || cellDef.instrument || zone.instrument;
                    const evtRouting = InstrumentRegistry.getRouting(zone.player, instKey) || routing;
                    evt.port = evtRouting.port;
                    evt.channel = evtRouting.channel;
                });
                allEvents.push(...cellEvents);
            });
            if (allEvents.length === 0) {
                alert('Cell generated no events — check cell definition');
                return;
            }
            allEvents.sort((a, b) => a.onsetMs - b.onsetMs);
            const _hRules = InstrumentRegistry.getHarmonicsRules();
            if (_hRules) injectHarmonicsCC(allEvents, _hRules);
            zone.midiSnippet = {
                events: allEvents,
                port: routing.port,
                channel: routing.channel,
                _perEventRouting: true,
                _stale: false,
                _generatedAt: Date.now()
            };
            zone.cellActivations = [];
            console.log('[ZoneOneShot/Cell] Generated', allEvents.length, 'events for zone', zone.id, 'cell:', zone.cellId, cms.length, 'markers');
            this.showPropertyPanel();
            this.markDirty();
            return;
        }

        // === Articulation material mode (original) ===
        const velocity = Math.max(1, Math.min(127, zone.oneShotVelocity || 115));
        const durationMs = Math.max(10, zone.oneShotDurationMs || 200);
        const isPerc = InstrumentRegistry.isPerc(zone.instrument);

        // Build events: one per chord marker, with onsetMs relative to zone start
        const events = [];
        const sorted = [...cms].sort((a, b) => a.time - b.time);
        sorted.forEach(cm => {
            let notes = [];
            if (isPerc) {
                const midi = parseInt(zone.oneShotArticulation);
                if (midi || midi === 0) notes = [midi];
            } else {
                // Piano: use handL notes (one-shot doesn't distinguish L/R)
                if (cm.handL && cm.handL.midis && cm.handL.midis.length > 0) {
                    notes = [...cm.handL.midis];
                }
            }
            if (notes.length === 0) return;
            const evt = {
                onsetMs: (cm.time - zone.startTime) * 1000,
                notes: notes,
                velocity: velocity,
                durations: notes.map(() => durationMs)
            };
            if (cm.handL && cm.handL._harmonics) evt._harmonics = cm.handL._harmonics;
            events.push(evt);
        });

        if (events.length === 0) {
            alert('No valid events — check articulation/notes assignments');
            return;
        }

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(events, _hRules);
        zone.midiSnippet = {
            events: events,
            port: routing.port,
            channel: routing.channel,
            _stale: false,
            _generatedAt: Date.now()
        };

        zone.cellActivations = [];
        console.log('[ZoneOneShot] Generated', events.length, 'events for zone', zone.id, 'port:', routing.port, 'ch:', routing.channel);
        this.showPropertyPanel();
        this.markDirty();
    },

    generateAsrMidi(zone) {
        if (!zone || zone.midiModel !== 'asr') return;
        const routing = InstrumentRegistry.getRouting(zone.player, zone.instrument);
        if (!routing) {
            alert('Cannot resolve MIDI routing — check Player/Instrument');
            return;
        }
        const velocity = Math.max(1, Math.min(127, zone.asrVelocity || 115));
        const durationMs = Math.max(0, (zone.endTime - zone.startTime) * 1000);
        const isPerc = InstrumentRegistry.isPerc(zone.instrument);

        let notes = [];
        if (isPerc) {
            const midi = parseInt(zone.asrArticulation);
            if (midi || midi === 0) notes = [midi];
        } else {
            if (zone.asrNotes && zone.asrNotes.length > 0) {
                notes = [...zone.asrNotes];
            }
        }
        if (notes.length === 0) {
            alert('No notes/articulation assigned');
            return;
        }

        const evt = {
            onsetMs: 0,
            notes: notes,
            velocity: velocity,
            durations: notes.map(() => durationMs)
        };
        if (zone.asrHarmonics) evt._harmonics = zone.asrHarmonics;
        const events = [evt];

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(events, _hRules);
        zone.midiSnippet = {
            events: events,
            port: routing.port,
            channel: routing.channel,
            cutoffCC: 120,
            _stale: false,
            _generatedAt: Date.now()
        };

        zone.cellActivations = [];
        console.log('[ASR] Generated 1 event for zone', zone.id, 'duration:', durationMs + 'ms', 'port:', routing.port, 'ch:', routing.channel, 'cutoffCC:120');

        this.markDirty();

    findWaveCurveInLayer(layer, startTime, endTime) {
        return this.objects.find(o =>
            o.type === 'waveCurve' &&
            o.layer === layer &&
            o.startSeconds < endTime &&
            o.endSeconds > startTime
        ) || null;
    },

    findLineWedgeInLayer(layer, startTime, endTime) {
        return this.objects.find(o =>
            o.type === 'lineWedge' &&
            o.layer === layer &&
            o.startSeconds < endTime &&
            o.endSeconds > startTime
        ) || null;
    },

    findAllCurvesInLayer(layer, startTime, endTime) {
        const results = [];
        this.objects.forEach(o => {
            if (o.layer !== layer) return;
            if (o.type === 'waveCurve' && o.startSeconds < endTime && o.endSeconds > startTime) {
                results.push({ obj: o, curveType: 'waveCurve' });
            } else if (o.type === 'lineWedge' && o.startSeconds < endTime && o.endSeconds > startTime) {
                results.push({ obj: o, curveType: 'lineWedge' });
            }
        });
        return results;
    },

    findCurveInLayer(layer, startTime, endTime) {
        const all = this.findAllCurvesInLayer(layer, startTime, endTime);
        return all.length > 0 ? all[0] : null;
    },

    sampleCurveForZone(zone) {
        // Use user-selected curve if set, otherwise first available
        const searchLayer = zone.curveLayer != null ? zone.curveLayer : zone.layer;
        const allCurves = this.findAllCurvesInLayer(searchLayer, zone.startTime, zone.endTime);
        let found = null;
        if (zone.linkedCurveId) {
            found = allCurves.find(c => c.obj.id === zone.linkedCurveId) || null;
        }
        if (!found) found = allCurves.length > 0 ? allCurves[0] : null;
        if (!found) return null;
        const { obj, curveType } = found;
        const duration = zone.endTime - zone.startTime;
        const steps = Math.min(500, Math.max(20, Math.ceil(duration / 0.15)));
        const dt = duration / steps;
        const rawPoints = [];
        let yMin = Infinity, yMax = -Infinity;
        for (let i = 0; i <= steps; i++) {
            const t = zone.startTime + i * dt;
            const normT = i / steps; // 0→1 within zone
            const y = curveType === 'waveCurve'
                ? this.getYAtTime(obj, t)
                : this.getThicknessAtTime(obj, t);
            rawPoints.push({ t: normT, y });
            if (y < yMin) yMin = y;
            if (y > yMax) yMax = y;
        }
        // Normalize Y against fixed 0→10 scale for both curve types
        // (Line wedge thickness is 1–10, wave curve Y is 0–10)
        let globalYMin = 0, globalYMax = 10;
        const globalRange = globalYMax - globalYMin;
        const points = rawPoints.map(p => ({
            t: p.t,
            y: globalRange > 0.001 ? (p.y - globalYMin) / globalRange : 0.5
        }));
        console.log('[Curve Sample] type=' + curveType + ' global range: ' + globalYMin.toFixed(2) + '→' + globalYMax.toFixed(2) + ', zone Y: ' + yMin.toFixed(2) + '→' + yMax.toFixed(2) + ', ' + points.length + ' points (' + (dt * 1000).toFixed(0) + 'ms interval)');
        return { points, curveId: obj.id, curveType, yMin, yMax };
    },

    // Legacy alias
    sampleWaveCurveForZone(zone) {
        return this.sampleCurveForZone(zone);
    },

    addChordMarkerToZone(zone) {
        this.pushUndoState();
        if (!zone.chordMarkers) zone.chordMarkers = [];
        const cms = zone.chordMarkers;
        // Place at midpoint of zone, or after last marker
        let time;
        if (cms.length === 0) {
            time = zone.startTime;
        } else {
            const last = cms[cms.length - 1];
            time = Math.min(zone.endTime, last.time + (zone.endTime - zone.startTime) * 0.1);
        }
        // Inherit from previous marker
        const prev = cms.length > 0 ? cms[cms.length - 1] : null;
        const newCm = {
            id: this.generateId('cm'),
            time: Math.round(time * 20) / 20,
            handL: prev && prev.handL ? JSON.parse(JSON.stringify(prev.handL)) : { mode: 'fixed', shapeId: '', root: null, midis: [] },
            handR: prev && prev.handR ? JSON.parse(JSON.stringify(prev.handR)) : { mode: 'fixed', shapeId: '', root: null, midis: [] }
        };
        cms.push(newCm);
        // Auto-populate percussion notes if applicable
        if (InstrumentRegistry.isPerc(zone.instrument)) {
            const perc = InstrumentRegistry.getPercNotes(zone.instrument);
            if (perc) {
                newCm.handL = { mode: 'fixed', shapeId: 'perc', root: perc.handL.midis[0], midis: [...perc.handL.midis], label: perc.handL.label };
                newCm.handR = { mode: 'fixed', shapeId: 'perc', root: perc.handR.midis[0], midis: [...perc.handR.midis], label: perc.handR.label };
            }
        }
        if (zone.midiSnippet) zone.midiSnippet._stale = true;
        this._selectedChordMarkerIdx = cms.length - 1;
        this.renderZone(zone);
        this.showPropertyPanel();
        this.markDirty();
    },

    deleteSelectedChordMarker(zone) {
        const idx = this._selectedChordMarkerIdx;
        if (idx == null || idx < 0 || !zone.chordMarkers || idx >= zone.chordMarkers.length) return;
        this.pushUndoState();
        zone.chordMarkers.splice(idx, 1);
        if (zone.midiSnippet) zone.midiSnippet._stale = true;
        this._selectedChordMarkerIdx = Math.min(idx, zone.chordMarkers.length - 1);
        if (zone.chordMarkers.length === 0) this._selectedChordMarkerIdx = null;

    generateImitationMidi(zone) {
        console.log('[Imitation Debug] Called with zone:', zone ? zone.id : 'null', 'midiModel:', zone ? zone.midiModel : 'n/a');
        if (!zone || zone.midiModel !== 'imitation') return;

        // Validate source zone
        const sourceZone = this.objects.find(o => o.id === zone.ratioSourceZoneId);
        console.log('[Imitation Debug] ratioSourceZoneId:', zone.ratioSourceZoneId, 'sourceZone found:', !!sourceZone, 'has snippet:', !!(sourceZone && sourceZone.midiSnippet), 'event count:', sourceZone && sourceZone.midiSnippet && sourceZone.midiSnippet.events ? sourceZone.midiSnippet.events.length : 0);
        if (!sourceZone || !sourceZone.midiSnippet || !sourceZone.midiSnippet.events || sourceZone.midiSnippet.events.length < 2) {
            alert('Source zone must have generated MIDI with at least 2 events. Generate the source zone first.');
            return;
        }

        // Validate routing
        const routing = InstrumentRegistry.getRouting(zone.player, zone.instrument);
        console.log('[Imitation Debug] player:', zone.player, 'instrument:', zone.instrument, 'routing:', routing);
        if (!routing) {
            alert('Set Player and Instrument first');
            return;
        }

        // Validate ratio markers
        const rms = (zone.ratioMarkers || []).slice().sort((a, b) => a.time - b.time);
        console.log('[Imitation Debug] ratioMarkers:', rms.length, 'chordMarkers:', (zone.chordMarkers || []).length);
        if (rms.length === 0) {
            alert('Add at least one ratio marker');
            return;
        }

        const startMs = zone.startTime * 1000;
        const endMs = zone.endTime * 1000;
        const sourceStartMs = sourceZone.startTime * 1000;

        // Get source events (absolute ms from zone start) that overlap our range
        const sourceEvents = sourceZone.midiSnippet.events
            .map(e => ({ onsetMs: e.onsetMs + sourceStartMs }))
            .filter(e => e.onsetMs >= startMs - 500 && e.onsetMs <= endMs + 500)
            .sort((a, b) => a.onsetMs - b.onsetMs);

        console.log('[Imitation Debug] source range:', sourceStartMs + 'ms→' + (sourceZone.endTime * 1000) + 'ms, imitation range:', startMs + 'ms→' + endMs + 'ms, sourceEvents in range:', sourceEvents.length);
        if (sourceEvents.length < 2) {
            alert('Not enough source events in this time range (' + sourceEvents.length + ' found). Source zone: ' + sourceZone.startTime.toFixed(1) + 's→' + sourceZone.endTime.toFixed(1) + 's. Imitation zone: ' + zone.startTime.toFixed(1) + 's→' + zone.endTime.toFixed(1) + 's. Check zone overlap.');
            return;
        }

        // Build source IOI function: piecewise linear interpolation of gaps
        const sourceIOIs = [];
        for (let i = 0; i < sourceEvents.length - 1; i++) {
            sourceIOIs.push({
                time: sourceEvents[i].onsetMs,
                ioi: sourceEvents[i + 1].onsetMs - sourceEvents[i].onsetMs
            });
        }

        function getSourceIOI(timeMs) {
            if (sourceIOIs.length === 0) return 120;
            if (sourceIOIs.length === 1) return sourceIOIs[0].ioi;
            if (timeMs <= sourceIOIs[0].time) return sourceIOIs[0].ioi;
            if (timeMs >= sourceIOIs[sourceIOIs.length - 1].time) return sourceIOIs[sourceIOIs.length - 1].ioi;
            for (let i = 1; i < sourceIOIs.length; i++) {
                if (timeMs <= sourceIOIs[i].time) {
                    const frac = (timeMs - sourceIOIs[i - 1].time) / (sourceIOIs[i].time - sourceIOIs[i - 1].time);
                    return sourceIOIs[i - 1].ioi + frac * (sourceIOIs[i].ioi - sourceIOIs[i - 1].ioi);
                }
            }
            return sourceIOIs[sourceIOIs.length - 1].ioi;
        }

        // Get active ratio at a given time
        function getRatio(timeMs) {
            let active = rms[0];
            for (let i = 1; i < rms.length; i++) {
                if (rms[i].time * 1000 <= timeMs) active = rms[i];
                else break;
            }
            return { p: active.p || 7, q: active.q || 4 };
        }

        // Get active material (chord marker) at a given time
        const cms = (zone.chordMarkers || []).slice().sort((a, b) => a.time - b.time);
        const allSets = (this.databases && this.databases.sets) || [];
        const allCells = (this.databases && this.databases.cells) || [];
        const resolveState = {};

        function getMaterial(timeMs) {
            if (cms.length === 0) return null;
            let active = cms[0];
            for (let i = 1; i < cms.length; i++) {
                if (cms[i].time * 1000 <= timeMs) active = cms[i];
                else break;
            }
            return active;
        }

        // Humanization params
        const jitterMs = zone.jitterMs != null ? zone.jitterMs : 8;
        const driftFactor = zone.driftFactor != null ? zone.driftFactor : 0.02;
        const delayMs = zone.responseDelayMs || 0;

        // Walk forward, generating events
        const events = [];
        let currentMs = startMs + delayMs;
        let driftPhase = Math.random() * Math.PI * 2;
        let handToggle = 0;
        let count = 0;

        while (currentMs < endMs && count < 10000) {
            const ratio = getRatio(currentMs);
            const srcIOI = getSourceIOI(currentMs);
            let scaledIOI = srcIOI * ratio.q / ratio.p;

            // Drift: slow sinusoidal wander
            if (driftFactor > 0) {
                scaledIOI *= 1 + driftFactor * Math.sin(driftPhase);
                driftPhase += 0.3;
            }

            scaledIOI = Math.max(20, scaledIOI);

            // Jitter on onset
            let onset = currentMs;
            if (jitterMs > 0) {
                onset += (Math.random() * 2 - 1) * jitterMs;
            }
            onset = Math.max(startMs, onset);

            // Resolve pitches from material markers
            const mat = getMaterial(currentMs);
            let notes = [];
            if (mat) {
                const handSource = (handToggle === 0) ? mat.handL : mat.handR;
                if (handSource) {
                    const resolved = resolveSource(handSource, allSets, resolveState, allCells);
                    notes = (resolved && resolved.midis) ? resolved.midis : [];
                }
            }

            if (notes.length > 0) {
                events.push({
                    onsetMs: onset - startMs,
                    notes: [...notes],
                    velocity: 80 + Math.floor(Math.random() * 20),
                    durations: notes.map(() => Math.min(scaledIOI * 0.8, 500))
                });
            }

            currentMs += scaledIOI;
            handToggle = 1 - handToggle;
            count++;
        }

        if (events.length === 0) {
            alert('No events generated — check material markers and ratio settings');
            return;
        }

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(events, _hRules);
        zone.midiSnippet = {
            events: events,
            port: routing.port,
            channel: routing.channel,
            _stale: false,
            _generatedAt: Date.now()
        };
        zone.cellActivations = [];

        // Cascade: mark linked imitation zones as stale (if this is a source for others)
        this.objects.forEach(o => {
            if (o.type === 'zone' && o.ratioSourceZoneId === zone.id && o.midiSnippet) {
                o.midiSnippet._stale = true;
            }
        });

        console.log('[Imitation] Generated', events.length, 'events for', zone.id, 'from source', zone.ratioSourceZoneId);
        this.renderZone(zone);
        this.showPropertyPanel();
        this.markDirty();
    },

    startChordAssignment(zone, hand) {
