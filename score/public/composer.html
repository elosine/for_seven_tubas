        if (!this.databases.sets) this.databases.sets = [];
        if (!this.databases.cells) this.databases.cells = [];

        // Restore position from localStorage. Clamp against the current
        // viewport so a previously-saved off-screen position can't lock the
        // drag-bar out of reach (see _clampPKPosition).
        try {
            const saved = localStorage.getItem('composerPKPos');
            if (saved) {
                const pos = JSON.parse(saved);
                const rawLeft = parseFloat(pos.left) || 50;
                const rawTop  = parseFloat(pos.top)  || 50;
                const rawW    = parseFloat(pos.width) || 750;
                const clamped = this._clampPKPosition(rawLeft, rawTop, rawW);
                pk.style.left  = clamped.left + 'px';
                pk.style.top   = clamped.top  + 'px';
                pk.style.width = pos.width;
                if (pos.height) pk.style.height = pos.height;
                if (pos.keyHeight) pk.querySelector('.pk-keys').style.height = pos.keyHeight;
            }
        } catch(e) {}
    },

    buildPianoKeys() {
        const container = this.pk.keysContainer;
        container.innerHTML = '';
        this.pk.keys = [];

        // 88 keys: A0 (MIDI 21) to C8 (MIDI 108)
        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const blackSet = new Set([1, 3, 6, 8, 10]);

        const allKeys = [];
        for (let midi = 21; midi <= 108; midi++) {
            const noteIdx = midi % 12;
            const octave = Math.floor(midi / 12) - 1;
            allKeys.push({
                midi, note: noteNames[noteIdx], octave,
                isBlack: blackSet.has(noteIdx),
                name: noteNames[noteIdx] + octave
            });
        }

        const whiteKeys = allKeys.filter(k => !k.isBlack);
        const whiteCount = whiteKeys.length; // 52

        // Render white keys
        whiteKeys.forEach((k, i) => {
            const el = document.createElement('div');
            el.className = 'pk-white';
            el.dataset.midi = k.midi;
            el.dataset.name = k.name;
            el.style.left = (i / whiteCount * 100) + '%';
            el.style.width = (1 / whiteCount * 100) + '%';
            container.appendChild(el);
            k.el = el;
            this.pk.keys.push(k);

            if (k.note === 'C') {
                const lbl = document.createElement('div');
                lbl.className = 'pk-clabel';
                lbl.textContent = k.name;
                lbl.style.left = (i / whiteCount * 100) + '%';
                lbl.style.width = (1 / whiteCount * 100) + '%';
                container.appendChild(lbl);
            }

            el.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                this.handlePKKeyClick(k);
            });
        });

        // White key index map for black key positioning
        const whiteIdxMap = new Map();
        whiteKeys.forEach((k, i) => whiteIdxMap.set(k.midi, i));

        // Render black keys
        const blackKeys = allKeys.filter(k => k.isBlack);
        blackKeys.forEach(k => {
            const lowerIdx = whiteIdxMap.get(k.midi - 1);
            if (lowerIdx == null) return;

            const el = document.createElement('div');
            el.className = 'pk-black';
            el.dataset.midi = k.midi;
            el.dataset.name = k.name;
            const bw = (1 / whiteCount * 100) * 0.6;
            el.style.left = ((lowerIdx + 1) / whiteCount * 100 - bw / 2) + '%';
            el.style.width = bw + '%';
            container.appendChild(el);
            k.el = el;
            this.pk.keys.push(k);

            el.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                this.handlePKKeyClick(k);
            });
        });
    },

    handlePKKeyClick(k) {
        if (this.pk.captureMode) {
            // Toggle mode: click toggles key on/off
            if (this.pk.toggledMidis.has(k.midi)) {
                this.pk.toggledMidis.delete(k.midi);
                k.el.classList.remove('pk-toggled', 'pk-root');
            } else {
                this.pk.toggledMidis.add(k.midi);
                k.el.classList.add('pk-toggled');
            }
            this.updateCaptureRootHighlight();
            this.updateCaptureAnalysis();
        } else if (this.pk.activeFunction === 'cellBuilder') {
            // Harmonics mode: clicking a key selects a fundamental and shows partials
            const cellInst = document.getElementById('pkCellInstrument').value;
            if (cellInst && InstrumentRegistry.isHarmonics(cellInst)) {
                this._onHarmonicsKeyClick(k);
                return;
            }
            // Cell builder: select key for preview/add AND set as chord root
            this.pk.cellSelectedKey = k;
            this.pk.cellChordRoot = k.midi;
            const rootEl = document.getElementById('pkCellChordRoot');
            if (rootEl) rootEl.textContent = k.name + ' (' + k.midi + ')';
            this.updateCellKeyHighlights();
            this.setPKStatus('Selected ' + k.name + ' (MIDI ' + k.midi + ') — ♪ preview, + Add pitch, or select shape');
        } else if (this.pk.activeFunction === 'chordPlayback') {
            // Harmonics assign mode: clicking a key selects fundamental + shows partials
            if (this.pk.harmonicsAssignMode) {
                this._onHarmonicsKeyClick(k);
                return;
            }
            // Harmonics set-building mode: panel visible for adding harmonics to set
            const hPanelVis = document.getElementById('pkHarmonicsPanel');
            if (hPanelVis && hPanelVis.style.display !== 'none') {
                this._onHarmonicsKeyClick(k);
                return;
            }
            // Set root for playback
            this.pk.playbackRoot = k.midi;
            this.pk.playbackRootEl.textContent = k.name + ' (' + k.midi + ')';
            this.setPKStatus('Root: ' + k.name + ' (MIDI ' + k.midi + ')');
            this.updatePlaybackVisualization();
            this.pk.el.focus();
        } else {
            // Normal mode: momentary highlight
            k.el.classList.add('pk-active');
            if (this.pk.onKeyClick) this.pk.onKeyClick(k);
            this.setPKStatus(k.name + ' (MIDI ' + k.midi + ')');
            const release = () => { k.el.classList.remove('pk-active'); };
            window.addEventListener('mouseup', release, { once: true });
        }
    },

    switchPKFunction(fn) {
        // Deactivate previous function
        if (this.pk.activeFunction === 'chordCapture') {
            this.pk.captureMode = false;
            this.clearCapture();
        }
        if (this.pk.activeFunction === 'cellBuilder') {
            document.getElementById('pkCellPanel').style.display = 'none';
            this.pk.cellSelectedKey = null;
            this.pk.cellChordRoot = null;
            this.pk.cellShapeIdx = -1;
            this.pk.keys.forEach(k => { if (k.el) k.el.classList.remove('pk-toggled', 'pk-root', 'pk-cell-selected'); });
            this._setHarmonicsKeyboardMode(false);
            this.pk.harmonicsSelection = null;
            const hPanelCB = document.getElementById('pkHarmonicsPanel');
            if (hPanelCB) hPanelCB.style.display = 'none';
        }

        // Clean up harmonics mode if leaving chordPlayback
        if (this.pk.harmonicsAssignMode || (this.pk.pianoVoice && this.pk.pianoVoice.value === 'harmonics_piano')) {
            this.pk.harmonicsAssignMode = false;
            this.pk.harmonicsSelection = null;
            this._setHarmonicsKeyboardMode(false);
            const hPanel = document.getElementById('pkHarmonicsPanel');
            if (hPanel) hPanel.style.display = 'none';
            document.getElementById('pkHarmonicsAdd').style.display = '';
            if (this.pk.pianoVoice) this.pk.pianoVoice.value = 'main_piano';
        }

        // Hide all function control panels
        document.querySelectorAll('#pianoKeyboard .pk-fn-controls').forEach(el => el.style.display = 'none');

        this.pk.activeFunction = fn;

        if (fn === 'chordCapture') {
            document.getElementById('pkFnChordCapture').style.display = 'flex';
            this.pk.captureMode = true;
            this.refreshShapeSelect();
            this.setPKStatus('Click keys to toggle — lowest = root');
            this.setPKAnalysis('');
        } else if (fn === 'chordPlayback') {
            document.getElementById('pkFnChordPlayback').style.display = 'flex';
            this.pk.captureMode = false;
            this.pk.playbackRoot = null;
            this.pk.playbackShapeIdx = -1;
            this.pk.playbackRootEl.textContent = '—';
            this.refreshPlaybackShapeSelect();
            this.refreshSetSelect();
            this.renderSetItems();
            this.clearPianoHighlights();
            this.setPKStatus('Click a key to set root');
            this.setPKAnalysis('');
            this.pk.el.focus();
        } else if (fn === 'percSetBuilder') {
            document.getElementById('pkFnPercSetBuilder').style.display = 'flex';
            this.pk.captureMode = false;
            this.populatePercInstrumentDropdown();
            this.refreshPercSetSelect();
            if (this.pk.activeSetId) this.pk.percSetSelect.value = this.pk.activeSetId;
            this.renderSetItems();
            this.setPKStatus('Select instrument → beater → articulation, then audition or add to set');
            this.setPKAnalysis('');
        } else if (fn === 'cellBuilder') {
            document.getElementById('pkFnCellBuilder').style.display = 'flex';
            this.pk.captureMode = false;
            if (!this.pk.cellPitches) this.pk.cellPitches = [];
            if (!this.pk.editingCellId) this.pk.editingCellId = null;
            this.pk.cellChordRoot = null;
            this.pk.cellShapeIdx = -1;
            const cellRootEl = document.getElementById('pkCellChordRoot');
            if (cellRootEl) cellRootEl.textContent = '—';
            this.refreshCellSelect();
            this.refreshCellShapeSelect();
            this.populateCellInstrumentDropdown();
            this.updateCellPhrasingUI();
            this.renderCellPitches();
            this.updateCellKeyHighlights();
            document.getElementById('pkCellPanel').style.display = '';
            this.setPKStatus('Click a key to select, then preview/add — or pick a shape');
            this.setPKAnalysis('');
        } else {
            this.pk.captureMode = false;
            this.setPKStatus('Ready');
            this.setPKAnalysis('');
        }
    },

    refreshShapeSelect() {
        const sel = this.pk.shapeSelect;
        const prev = sel.value;
        sel.innerHTML = '<option value="">— Saved Shapes —</option>';
        const shapes = (this.databases && this.databases.chordShapes) || [];
        shapes.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.structuredName;
            sel.appendChild(opt);
        });
        if (prev) sel.value = prev;
    },

    recallChordShape(shapeId) {
        if (!shapeId) { this.clearCapture(); return; }
        const shape = (this.databases.chordShapes || []).find(s => s.id === shapeId);
        if (!shape || !shape.capturedFrom) return;

        // Clear current selection and set to the saved shape's original notes
        this.clearCapture();
        shape.capturedFrom.forEach(midi => {
            this.pk.toggledMidis.add(midi);
            const key = this.pk.keys.find(k => k.midi === midi);
            if (key && key.el) key.el.classList.add('pk-toggled');
        });
        this.updateCaptureRootHighlight();
        this.updateCaptureAnalysis();
        this.setPKStatus('Recalled: ' + shape.structuredName);
    },

    playCapturedChordMidi() {
        const midis = Array.from(this.pk.toggledMidis).sort((a, b) => a - b);
        if (midis.length === 0) { this.setPKStatus('No keys selected'); return; }
        if (!this.pk.midiOut) { this.setPKStatus('No MIDI output available'); return; }

        const voice = this.pk.captureVoice ? this.pk.captureVoice.value : 'main_piano';
        const _r = InstrumentRegistry.getRouting('piano1', voice);
        const channel = _r ? (_r.channel - 1) : 0;
        const velocity = 80;
        const durationMs = 1500;

        midis.forEach(midi => {
            this.pk.midiOut.send([0x90 | channel, midi, velocity]);
        });

        const playBtn = document.getElementById('pkCapturePlayBtn');
        midis.forEach(midi => {
            const key = this.pk.keys.find(k => k.midi === midi);
            if (key && key.el) key.el.classList.add('pk-active');
        });
        if (playBtn) { playBtn.style.background = '#2a6faa'; playBtn.style.color = '#fff'; }

        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const label = midis.map(m => noteNames[m % 12] + (Math.floor(m / 12) - 1)).join(' ');
        const _vLabel = voice === 'plucked_piano' ? 'Plucked' : voice === 'muted_piano' ? 'Muted' : 'Piano';
        this.setPKStatus('Playing (' + _vLabel + '): ' + label);

        setTimeout(() => {
            midis.forEach(midi => {
                this.pk.midiOut.send([0x80 | channel, midi, 0]);
                const key = this.pk.keys.find(k => k.midi === midi);
                if (key && key.el) key.el.classList.remove('pk-active');
            });
            if (playBtn) { playBtn.style.background = ''; playBtn.style.color = ''; }
        }, durationMs);
    },

    clearCapture() {
        this.pk.toggledMidis.clear();
        this.pk.keys.forEach(k => {
            if (k.el) k.el.classList.remove('pk-toggled', 'pk-root');
        });
        this.updateCaptureAnalysis();
        if (this.pk.captureMode) this.setPKStatus('Cleared — click keys');
    },

    updateCaptureRootHighlight() {
        // Root = lowest toggled MIDI
        const sorted = Array.from(this.pk.toggledMidis).sort((a,b) => a - b);
        this.pk.keys.forEach(k => {
            if (k.el) k.el.classList.remove('pk-root');
        });
        if (sorted.length > 0) {
            const rootKey = this.pk.keys.find(k => k.midi === sorted[0]);
            if (rootKey && rootKey.el) rootKey.el.classList.add('pk-root');
        }
    },

    updateCaptureAnalysis() {
        const midis = Array.from(this.pk.toggledMidis).sort((a, b) => a - b);
        if (midis.length === 0) {
            this.setPKAnalysis('');
            return;
        }

        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const root = midis[0];

        // Note names
        const names = midis.map(m => {
            const n = noteNames[m % 12];
            const o = Math.floor(m / 12) - 1;
            return n + o;
        });

        // Intervals from root
        const intervals = midis.map(m => m - root);

        // Interval names from root
        const iNames = intervals.map(i => this.intervalName(i));

        // Inner intervals (between consecutive)
        const inner = [];
        for (let i = 1; i < intervals.length; i++) {
            inner.push(intervals[i] - intervals[i - 1]);
        }
        const innerNames = inner.map(i => this.intervalName(i));

        // Structured name: interval names (skip P1) joined, then integers
        const shapeName = iNames.slice(1).join(' ') + ' [' + intervals.join(',') + ']';

        // Build display
        const namesWithMidi = midis.map((m, idx) => names[idx] + '[' + m + ']');
        let text = namesWithMidi.join(' ') + '  |  ' + shapeName;
        if (inner.length > 0) {
            text += '  |  inner: ' + innerNames.join(' ');
        }

        this.setPKAnalysis(text);
    },

    analyzeChordShape(midis) {
        const sorted = [...midis].sort((a, b) => a - b);
        if (sorted.length === 0) return null;
        const root = sorted[0];
        const intervals = sorted.map(m => m - root);
        const inner = [];
        for (let i = 1; i < intervals.length; i++) inner.push(intervals[i] - intervals[i - 1]);
        const iNames = intervals.map(i => this.intervalName(i));
        const innerNames = inner.map(i => this.intervalName(i));
        const structuredName = iNames.slice(1).join(' ') + ' [' + intervals.join(',') + ']';
        return { intervals, innerIntervals: inner, intervalNames: iNames, innerIntervalNames: innerNames, structuredName, noteCount: sorted.length };
    },

    saveChordShape() {
        const midis = Array.from(this.pk.toggledMidis).sort((a, b) => a - b);
        if (midis.length < 2) {
            this.setPKStatus('Need at least 2 keys to save a shape');
            return;
        }

        const analysis = this.analyzeChordShape(midis);
        if (!analysis) return;

        // Ensure database
        if (!this.databases) this.databases = {};
        if (!this.databases.chordShapes) this.databases.chordShapes = [];

        // Check for duplicate (same intervals array)
        const iKey = analysis.intervals.join(',');
        const existing = this.databases.chordShapes.find(s => s.intervals.join(',') === iKey);
        if (existing) {
            this.setPKStatus('Duplicate! Already saved as: ' + existing.structuredName);
            return;
        }

        // Generate ID
        const id = 'cs_' + String(this.databases.chordShapes.length + 1).padStart(3, '0');

        const shape = {
            id,
            structuredName: analysis.structuredName,
            intervals: analysis.intervals,
            innerIntervals: analysis.innerIntervals,
            intervalNames: analysis.intervalNames,
            innerIntervalNames: analysis.innerIntervalNames,
            noteCount: analysis.noteCount,
            capturedFrom: midis,
            instruments: [],  // whitelist: empty = available to all piano instruments
            createdAt: new Date().toISOString()
        };

        this.databases.chordShapes.push(shape);
        this.refreshShapeSelect();
        this.pk.shapeSelect.value = shape.id;
        this.setPKStatus('Saved: ' + shape.structuredName);
        this.markDirty();
    },

    // Transpose a chord shape to a given root MIDI note
    transposeChordShape(shapeId, rootMidi) {
        const shape = this.databases.chordShapes.find(s => s.id === shapeId);
        if (!shape) return [];
        return shape.intervals.map(i => rootMidi + i);
    },

    // ========== WEB MIDI ==========

    async initWebMidi() {
        if (!navigator.requestMIDIAccess) {
            console.warn('Web MIDI not supported in this browser');
            return;
        }
        try {
            this.midiAccess = await navigator.requestMIDIAccess({ sysex: false });
            this.refreshMidiOutputs();
            this.midiAccess.onstatechange = () => this.refreshMidiOutputs();
        } catch (e) {
            console.warn('Web MIDI access denied:', e);
        }
    },

    refreshMidiOutputs() {
        if (!this.midiAccess) return;
        // Auto-select Piano 1 output (hardwired)
        for (const [id, output] of this.midiAccess.outputs) {
            const lname = output.name.toLowerCase();
            if (lname.includes('piano 1')) {
                this.pk.midiOut = output;
                return;
            }
        }
        // Fallback: any output with 'piano' in name
        for (const [id, output] of this.midiAccess.outputs) {
            if (output.name.toLowerCase().includes('piano')) {
                this.pk.midiOut = output;
                return;
            }
        }
        // Last resort: first available output
        for (const [id, output] of this.midiAccess.outputs) {
            this.pk.midiOut = output;
            return;
        }
    },

    // ========== CHORD SHAPE PLAYBACK ==========

    refreshPlaybackShapeSelect() {
        const sel = this.pk.playbackShapeSelect;
        const prev = sel.value;
        sel.innerHTML = '<option value="">— Shape —</option>';
        const shapes = (this.databases && this.databases.chordShapes) || [];
        // Filter by instrument whitelist if in assignment mode
        const assignInst = this.pk.assignTarget
            ? (this.pk.assignTarget.oneShot ? this.pk.assignTarget.marker.instrument : this.pk.assignTarget.zone && this.pk.assignTarget.zone.instrument)
            : null;
        shapes.forEach((s, i) => {
            // If shape has instruments whitelist and current instrument isn't in it, skip
            if (assignInst && s.instruments && s.instruments.length > 0 && !s.instruments.includes(assignInst)) return;
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = s.structuredName;
            sel.appendChild(opt);
        });
        if (prev) sel.value = prev;
    },

    onPlaybackShapeChange() {
        const idx = parseInt(this.pk.playbackShapeSelect.value, 10);
        this.pk.playbackShapeIdx = isNaN(idx) ? -1 : idx;
        this.updatePlaybackVisualization();
        this.pk.el.focus();
    },

    updatePlaybackVisualization() {
        // Clear all highlights
        this.clearPianoHighlights();
        this.pk.keys.forEach(k => { if (k.el) k.el.classList.remove('pk-toggled', 'pk-root'); });

        const shapes = (this.databases && this.databases.chordShapes) || [];
        const idx = this.pk.playbackShapeIdx;
        const root = this.pk.playbackRoot;
        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

        if (root == null) {
            this.setPKAnalysis('');
            return;
        }

        // Always light up the root key
        const rootKey = this.pk.keys.find(k => k.midi === root);
        if (rootKey && rootKey.el) {
            rootKey.el.classList.add('pk-toggled', 'pk-root');
        }
        const rootName = noteNames[root % 12] + (Math.floor(root / 12) - 1);

        if (idx < 0 || idx >= shapes.length) {
            // No shape selected — just show root as single pitch
            this.setPKAnalysis(rootName + ' [' + root + ']  |  Single Pitch');
            this.setPKStatus('Root: ' + rootName + ' (MIDI ' + root + ') — select shape or add as pitch');
            return;
        }

        const shape = shapes[idx];
        const midis = shape.intervals.map(i => root + i).filter(m => m >= 21 && m <= 108);

        // Light up all shape keys
        midis.forEach((midi, i) => {
            const key = this.pk.keys.find(k => k.midi === midi);
            if (key && key.el) {
                key.el.classList.add('pk-toggled');
                if (i === 0) key.el.classList.add('pk-root');
            }
        });

        // Show analysis
        const names = midis.map(m => noteNames[m % 12] + (Math.floor(m / 12) - 1));
        const namesWithMidi = midis.map(m => noteNames[m % 12] + (Math.floor(m / 12) - 1) + '[' + m + ']');
        this.setPKAnalysis(namesWithMidi.join(' ') + '  |  ' + shape.structuredName);
        this.setPKStatus('Shape: ' + shape.structuredName + ' on ' + rootName + ' (MIDI ' + root + ')');
    },

    onPianoVoiceChange() {
        const val = this.pk.pianoVoice.value;
        if (val === 'harmonics_piano') {
            this._setHarmonicsKeyboardMode(true);
            this.pk.harmonicsSelection = null;
            const panel = document.getElementById('pkHarmonicsPanel');
            if (panel) {
                panel.style.display = 'block';
                document.getElementById('pkHarmonicsPartialList').innerHTML = '<div style="color:#666;font-style:italic">Click a key (A0–B4) to see partials, select one, then use + Harmonic to add to set</div>';
                document.getElementById('pkHarmonicsStatus').textContent = '';
                document.getElementById('pkHarmonicsAdd').style.display = 'none';
                document.getElementById('pkHarmonicsAssign').style.display = 'none';
            }
            this.setPKStatus('Harmonics mode — click a fundamental to see partials');
        } else {
            this._setHarmonicsKeyboardMode(false);
            this.pk.harmonicsSelection = null;
            const panel = document.getElementById('pkHarmonicsPanel');
            if (panel) panel.style.display = 'none';
        }
    },

    clearPlaybackSelection() {
        this.pk.playbackRoot = null;
        this.pk.playbackShapeIdx = -1;
        this.pk.playbackRootEl.textContent = '—';
        this.pk.playbackShapeSelect.value = '';
        this.clearPianoHighlights();
        this.pk.keys.forEach(k => { if (k.el) k.el.classList.remove('pk-toggled', 'pk-root'); });
        this.setPKStatus('Cleared — click a key to set root');
        this.setPKAnalysis('');
    },

    handlePKKeydown(e) {
        if (this.pk.activeFunction !== 'chordPlayback') return;
        if (e.target.matches('select, input')) return;

        const shapes = (this.databases && this.databases.chordShapes) || [];
        if (shapes.length === 0) return;

        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (this.pk.playbackShapeIdx <= 0) {
                this.pk.playbackShapeIdx = shapes.length - 1;
            } else {
                this.pk.playbackShapeIdx--;
            }
            this.pk.playbackShapeSelect.value = String(this.pk.playbackShapeIdx);
            this.updatePlaybackVisualization();
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            if (this.pk.playbackShapeIdx >= shapes.length - 1) {
                this.pk.playbackShapeIdx = 0;
            } else {
                this.pk.playbackShapeIdx++;
            }
            this.pk.playbackShapeSelect.value = String(this.pk.playbackShapeIdx);
            this.updatePlaybackVisualization();
        } else if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            this.playChordMidi();
        }
    },

    playChordMidi() {
        const shapes = (this.databases && this.databases.chordShapes) || [];
        const idx = this.pk.playbackShapeIdx;
        const root = this.pk.playbackRoot;

        if (root == null) { this.setPKStatus('Set a root first — click a key'); return; }

        let midis;
        if (idx >= 0 && idx < shapes.length) {
            const shape = shapes[idx];
            midis = shape.intervals.map(i => root + i).filter(m => m >= 21 && m <= 108);
        } else {
            // No shape selected — play single root pitch
            midis = [root];
        }

        if (!this.pk.midiOut) {
            this.setPKStatus('No MIDI output selected');
            return;
        }

        // Channel from piano voice toggle via InstrumentRegistry
        const voice = this.pk.pianoVoice ? this.pk.pianoVoice.value : 'main_piano';
        const _r = InstrumentRegistry.getRouting('piano1', voice);
        const channel = _r ? (_r.channel - 1) : 0; // 0-indexed
        const velocity = 80;
        const durationMs = 1500;

        // Send note-on for all notes
        midis.forEach(midi => {
            this.pk.midiOut.send([0x90 | channel, midi, velocity]);
        });

        // Visual feedback — flash keys + play button
        const playBtn = document.getElementById('pkPlayBtn');
        midis.forEach(midi => {
            const key = this.pk.keys.find(k => k.midi === midi);
            if (key && key.el) key.el.classList.add('pk-active');
        });
        if (playBtn) { playBtn.style.background = '#2a6faa'; playBtn.style.color = '#fff'; }

        this.setPKStatus('Playing: ' + shape.structuredName);

        // Send note-off after duration
        setTimeout(() => {
            midis.forEach(midi => {
                this.pk.midiOut.send([0x80 | channel, midi, 0]);
                const key = this.pk.keys.find(k => k.midi === midi);
                if (key && key.el) key.el.classList.remove('pk-active');
            });
            if (playBtn) { playBtn.style.background = ''; playBtn.style.color = ''; }
        }, durationMs);
    },

    // ========== SET BUILDER ==========

    getActiveSet() {
        if (!this.pk.activeSetId) return null;
        const sets = (this.databases && this.databases.sets) || [];
        return sets.find(s => s.id === this.pk.activeSetId) || null;
    },

    refreshSetSelect() {
        const sel = this.pk.setSelect;
        if (!sel) return;
        const prev = this.pk.activeSetId;
        sel.innerHTML = '<option value="">— none —</option><option value="__new">+ New Set</option>';
        const sets = (this.databases && this.databases.sets) || [];
        sets.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name + ' (' + s.items.length + ')';
            sel.appendChild(opt);
        });
        if (prev) sel.value = prev;
    },

    onSetSelectChange() {
        const val = this.pk.setSelect.value;
        if (val === '__new') {
            const name = prompt('Set name:');
            if (!name) { this.pk.setSelect.value = this.pk.activeSetId || ''; return; }
            if (!this.databases.sets) this.databases.sets = [];
            // Check for duplicate name
            const dupSet = this.databases.sets.find(s => s.name === name);
            if (dupSet) {
                if (!confirm('A set named "' + name + '" already exists. Switch to it instead?')) {
                    this.pk.setSelect.value = this.pk.activeSetId || '';
                    return;
                }
                this.pk.activeSetId = dupSet.id;
                this.refreshSetSelect();
                this.pk.setSelect.value = dupSet.id;
                this.renderSetItems();
                this.setPKStatus('Switched to existing set: ' + name);
                return;
            }
            const id = 'set_' + String(this.databases.sets.length + 1).padStart(3, '0');
            const newSet = { id, name, items: [], createdAt: new Date().toISOString() };
            this.databases.sets.push(newSet);
            this.pk.activeSetId = id;
            this.refreshSetSelect();
            this.pk.setSelect.value = id;
            this.renderSetItems();
            this.setPKStatus('Created set: ' + name);
            this.markDirty();
        } else {
            this.pk.activeSetId = val || null;
            this.renderSetItems();
        }
    },

    addShapeToSet() {
        const set = this.getActiveSet();
        if (!set) { this.setPKStatus('Select or create a set first'); return; }

        const shapes = (this.databases && this.databases.chordShapes) || [];
        const idx = this.pk.playbackShapeIdx;
        const root = this.pk.playbackRoot;
        if (root == null) { this.setPKStatus('Set a root first — click a key'); return; }
        if (idx < 0 || idx >= shapes.length) { this.setPKStatus('Select a shape first'); return; }

        const shape = shapes[idx];
        const midis = shape.intervals.map(i => root + i).filter(m => m >= 21 && m <= 108);
        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const rootName = noteNames[root % 12] + (Math.floor(root / 12) - 1);

        const pianoInst = this.pk.pianoVoice ? this.pk.pianoVoice.value : 'main_piano';
        const instLabel = pianoInst === 'plucked_piano' ? 'Plk' : pianoInst === 'muted_piano' ? 'Mut' : 'Pno';
        const vel = Math.max(1, Math.min(127, parseInt(document.getElementById('pkSetVelocity').value, 10) || 80));
        const dur = Math.max(10, parseInt(document.getElementById('pkSetDuration').value, 10) || 500);
        set.items.push({
            type: 'chordShape',
            shapeId: shape.id,
            root: root,
            midis: [...midis],
            instrument: pianoInst,
            velocity: vel,
            durationMs: dur,
            label: instLabel + ': ' + shape.structuredName + ' on ' + rootName + ' [' + root + ']'
        });

        this.renderSetItems();
        this.refreshSetSelect();
        this.setPKStatus('Added ' + shape.structuredName + ' on ' + rootName + ' (MIDI ' + root + ') to ' + set.name);
        this.markDirty();
    },

    addPitchToSet() {
        const set = this.getActiveSet();

        const root = this.pk.playbackRoot;

        const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const name = noteNames[root % 12] + (Math.floor(root / 12) - 1);

        const pianoInst = this.pk.pianoVoice ? this.pk.pianoVoice.value : 'main_piano';

        const vel = Math.max(1, Math.min(127, parseInt(document.getElementById('pkSetVelocity').value, 10) || 80));

        set.items.push({

    addHarmonicToSet() {

                    document.getElementById('pkHarmonicsAdd').style.display = 'none';

    addCellToSet() {

    toggleSetPanel() {
        const panel = document.getElementById('pkSetPanel');
        if (!panel) return;
        panel.style.display = panel.style.display === 'none' ? '' : 'none';
    },

    renderSetItems() {
        const nameEl = document.getElementById('pkSetName');
        const countEl = document.getElementById('pkSetCount');
        const itemsEl = document.getElementById('pkSetItems');
        if (!itemsEl) return;

        const set = this.getActiveSet();
        if (!set) {
            if (nameEl) nameEl.textContent = 'No set';
            if (countEl) countEl.textContent = '0 items';
            itemsEl.innerHTML = '<div style="color:#666;padding:2px 0">Select or create a set</div>';
            return;
        }

        if (nameEl) nameEl.textContent = set.name;
        if (countEl) countEl.textContent = set.items.length + ' items';

        if (set.items.length === 0) {
            itemsEl.innerHTML = '<div style="color:#666;padding:2px 0">Empty — add shapes or pitches above</div>';
            return;
        }

        let html = '';
        set.items.forEach((item, i) => {
            const icon = item.type === 'chordShape' ? '♫' : item.type === 'pitch' ? '♪' : item.type === 'cellRef' ? '⬡' : '⬤';
            const typeColor = item.type === 'chordShape' ? '#4A90D9' : item.type === 'pitch' ? '#8BC34A' : item.type === 'cellRef' ? '#AB47BC' : '#FB8C00';
            html += '<div style="display:flex;align-items:center;gap:4px;padding:2px 0;border-bottom:1px solid #2a2a2a">';
            html += '<span style="color:' + typeColor + '">' + icon + '</span>';
            html += '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (item.label || 'item') + '</span>';
            if (item.type !== 'cellRef') {
                html += '<span style="font-size:8px;color:#888">v</span>';
                html += '<input class="pk-set-item-vel" data-set-item-idx="' + i + '" type="number" min="1" max="127" value="' + (item.velocity || 80) + '" style="width:28px;font-size:8px;background:#1a1a1a;color:#ccc;border:1px solid #444;border-radius:2px;padding:0 2px" title="Velocity">';
                html += '<span style="font-size:8px;color:#888">d</span>';
                html += '<input class="pk-set-item-dur" data-set-item-idx="' + i + '" type="number" min="10" max="10000" step="10" value="' + (item.durationMs || 500) + '" style="width:36px;font-size:8px;background:#1a1a1a;color:#ccc;border:1px solid #444;border-radius:2px;padding:0 2px" title="Duration (ms)">';
            }
            html += '<button class="pk-set-audition" data-set-item-idx="' + i + '" style="font-size:9px;padding:0 4px;background:#333;color:#43A047;border:1px solid #555;border-radius:2px;cursor:pointer" title="Audition">▶</button>';
            html += '<button class="pk-set-remove" data-set-item-idx="' + i + '" style="font-size:9px;padding:0 4px;background:#333;color:#C62828;border:1px solid #555;border-radius:2px;cursor:pointer" title="Remove">−</button>';
            html += '</div>';
        });
        itemsEl.innerHTML = html;

        // Wire up remove buttons
        itemsEl.querySelectorAll('.pk-set-remove').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.setItemIdx, 10);
                this.removeSetItem(idx);
            });
        });

        // Wire up audition buttons
        itemsEl.querySelectorAll('.pk-set-audition').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.setItemIdx, 10);
                this.auditionSetItem(idx);
            });
        });

        // Wire up inline velocity/duration editing
        itemsEl.querySelectorAll('.pk-set-item-vel').forEach(inp => {
            inp.addEventListener('change', () => {
                const idx = parseInt(inp.dataset.setItemIdx, 10);
                const s = this.getActiveSet();
                if (s && s.items[idx]) {
                    s.items[idx].velocity = Math.max(1, Math.min(127, parseInt(inp.value, 10) || 80));
                    this.markDirty();
                }
            });
        });
        itemsEl.querySelectorAll('.pk-set-item-dur').forEach(inp => {
            inp.addEventListener('change', () => {
                const idx = parseInt(inp.dataset.setItemIdx, 10);
                const s = this.getActiveSet();
                if (s && s.items[idx]) {
                    s.items[idx].durationMs = Math.max(10, parseInt(inp.value, 10) || 500);
                    this.markDirty();
                }
            });
        });
    },

    removeSetItem(idx) {
        const set = this.getActiveSet();
        if (!set || idx < 0 || idx >= set.items.length) return;
        const removed = set.items.splice(idx, 1)[0];
        this.renderSetItems();
        this.refreshSetSelect();
        this.setPKStatus('Removed ' + (removed.label || 'item') + ' from ' + set.name);
        this.markDirty();
    },

    async auditionSetItem(idx) {
        const set = this.getActiveSet();
        if (!set || idx < 0 || idx >= set.items.length) return;
        const item = set.items[idx];

        // Ensure MIDI outputs are initialized
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { this.setPKStatus('No MIDI access'); return; }
        }

        // Cell references: use realizeCellEvents for audition
        if (item.type === 'cellRef' && item.cellId) {
            const cellDef = (this.databases.cells || []).find(c => c.id === item.cellId);
            if (!cellDef || !cellDef.items || cellDef.items.length === 0) {
                this.setPKStatus('Cell not found or empty'); return;
            }
            // Use cell's default behavior for audition preview
            const cellInstance = { durationMs: 2000 };
            const events = realizeCellEvents(cellDef, cellInstance, 0);
            if (events.length === 0) { this.setPKStatus('No events generated'); return; }

            let output = this.pk.midiOut;
            let channel = 0;
            if (cellDef.instrument) {
                const isPerc = InstrumentRegistry.isPerc(cellDef.instrument);
                const routing = InstrumentRegistry.getRouting(isPerc ? 'perc1' : 'piano1', cellDef.instrument);
                if (routing) {
                    const portName = (routing.port || '').toLowerCase();
                    if (this._zoneMidiOutputs[portName]) {
                        output = this._zoneMidiOutputs[portName];
                        channel = (routing.channel || 1) - 1;
                    }
                }
            }
            if (!output) { this.setPKStatus('No MIDI output'); return; }

            events.forEach(evt => {
                setTimeout(() => {
                    evt.notes.forEach(m => output.send([0x90 | channel, m, evt.velocity]));
                    const noteDur = (evt.durations && evt.durations[0]) || 200;
                    setTimeout(() => evt.notes.forEach(m => output.send([0x80 | channel, m, 0])), noteDur);
                }, evt.onsetMs);
            });
            this.setPKStatus('Audition cell: ' + (cellDef.label || cellDef.id) + ' (' + events.length + ' events)');
            return;
        }

        // Determine MIDI output and routing
        let output = this.pk.midiOut;
        let channel = 0;
        let midis = item.midis || [item.midi];

        if (item.type === 'percArticulation' && item.instrument) {
            // Perc items: use instrument's own routing
            const routing = InstrumentRegistry.getRouting('perc1', item.instrument);
            if (routing) {
                const portName = (routing.port || '').toLowerCase();
                if (this._zoneMidiOutputs[portName]) {
                    output = this._zoneMidiOutputs[portName];
                    channel = (routing.channel || 1) - 1;
                }
            }
        } else {
            // Piano items (chordShape, pitch): use stored instrument, fall back to voice toggle
            const pianoKey = item.instrument || (this.pk.pianoVoice ? this.pk.pianoVoice.value : 'main_piano');
            const routing = InstrumentRegistry.getRouting('piano1', pianoKey);
            if (routing) {
                const portName = (routing.port || '').toLowerCase();
                if (this._zoneMidiOutputs[portName]) {
                    output = this._zoneMidiOutputs[portName];
                    channel = (routing.channel || 1) - 1;
                }
            }
        }

        if (!output) { this.setPKStatus('No MIDI output available'); return; }

        const vel = item.velocity || 80;
        const dur = item.durationMs || 500;
        midis.forEach(m => output.send([0x90 | channel, m, vel]));
        setTimeout(() => midis.forEach(m => output.send([0x80 | channel, m, 0])), dur);
        this.setPKStatus('Audition: ' + (item.label || 'item'));
    },

    renameCurrentSet() {
        const set = this.getActiveSet();
        if (!set) return;
        const name = prompt('Rename set:', set.name);
        if (!name) return;
        set.name = name;
        this.refreshSetSelect();
        this.renderSetItems();
        this.markDirty();
    },

    deleteCurrentSet() {
        const set = this.getActiveSet();
        if (!set) return;
        if (!confirm('Delete set "' + set.name + '"?')) return;
        const sets = this.databases.sets;
        const idx = sets.indexOf(set);
        if (idx >= 0) sets.splice(idx, 1);
        this.pk.activeSetId = null;
        this.pk.setSelect.value = '';
        this.refreshSetSelect();
        this.renderSetItems();
        this.setPKStatus('Deleted set: ' + set.name);
        this.markDirty();
    },

    // ========== PERCUSSION SET BUILDER ==========

    populatePercInstrumentDropdown() {
        const sel = this.pk.percInstrument;
        sel.innerHTML = '<option value="">— Instrument —</option>';
        // List all percussion instruments with routing configured
        const percItems = InstrumentRegistry.list('perc').filter(item => {
            const inst = InstrumentRegistry.get(item.key);
            return inst && inst.allInOne && inst.allInOne.length > 0;
        });
        percItems.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.key;
            opt.textContent = item.name || item.key;
            sel.appendChild(opt);
        });
        this.pk.percBeater.innerHTML = '<option value="">— Beater —</option>';
        this.pk.percArticulation.innerHTML = '<option value="">— Articulation —</option>';
    },

    onPercInstrumentChange() {
        try {
            const instKey = this.pk.percInstrument.value;
            console.log('[PercBuilder] Instrument changed to:', JSON.stringify(instKey));
            const beaterSel = this.pk.percBeater;
            const artSel = this.pk.percArticulation;
            beaterSel.innerHTML = '<option value="">— Beater —</option>';
            artSel.innerHTML = '<option value="">— Articulation —</option>';
            if (!instKey) { this.setPKStatus('Select an instrument'); return; }

            const inst = InstrumentRegistry.get(instKey);
            const allInOne = inst ? (inst.allInOne || inst.allInOne_low || []) : [];
            console.log('[PercBuilder] Got instrument:', inst ? inst.name : 'NULL', 'allInOne entries:', allInOne.length);
            if (!inst || allInOne.length === 0) {
                this.setPKStatus('No articulation data for ' + instKey);
                return;
            }

            // Extract unique beaters (some entries may lack beater field)
            const hasBeaters = allInOne.some(a => a.beater);
            console.log('[PercBuilder] hasBeaters:', hasBeaters);

            if (!hasBeaters) {
                // No beater distinction — skip beater, populate articulations directly
                beaterSel.innerHTML = '<option value="__none" selected>— n/a —</option>';
                this.setPKStatus(inst.name + ': ' + allInOne.length + ' articulations');
                allInOne.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = String(a.midi);
                    const pitchLabel = a.pitch ? a.pitch + ', ' : '';
                    opt.textContent = pitchLabel + a.articulation + ' (' + a.note + ')';
                    opt.dataset.pitch = a.pitch || '';
                    opt.dataset.articulation = a.articulation;
                    artSel.appendChild(opt);
                });
                this.setPKAnalysis(allInOne.length + ' articulations');
            } else {
                const beaters = [...new Set(allInOne.map(a => a.beater))];
                console.log('[PercBuilder] Beaters found:', beaters);
                beaters.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b;
                    opt.textContent = b;
                    beaterSel.appendChild(opt);
                });
                this.setPKStatus(inst.name + ': ' + beaters.length + ' beater(s)');
                // Auto-select if only one beater
                if (beaters.length === 1) {
                    beaterSel.value = beaters[0];
                    this.onPercBeaterChange();
                }
            }
        } catch (err) {
            console.error('[PercBuilder] onPercInstrumentChange error:', err);
            this.setPKStatus('Error: ' + err.message);
        }
    },

    onPercBeaterChange() {
        try {
            const instKey = this.pk.percInstrument.value;
            const beater = this.pk.percBeater.value;
            console.log('[PercBuilder] Beater changed to:', JSON.stringify(beater), 'for', instKey);
            const artSel = this.pk.percArticulation;
            artSel.innerHTML = '<option value="">— Articulation —</option>';
            if (!instKey || !beater) return;

            const inst = InstrumentRegistry.get(instKey);
            const allInOne = inst ? (inst.allInOne || inst.allInOne_low || []) : [];
            if (allInOne.length === 0) return;

            // Filter allInOne by beater, build label from pitch + articulation
            const matches = allInOne.filter(a => (a.beater || '(default)') === beater);
            console.log('[PercBuilder] Articulation matches:', matches.length);
            matches.forEach(a => {
                const opt = document.createElement('option');
                opt.value = String(a.midi);
                const pitchLabel = a.pitch ? a.pitch + ', ' : '';
                opt.textContent = pitchLabel + a.articulation + ' (' + a.note + ')';
                opt.dataset.pitch = a.pitch || '';
                opt.dataset.articulation = a.articulation;
                artSel.appendChild(opt);
            });

            // Show analysis
            this.setPKAnalysis(matches.length + ' articulations for ' + beater);
        } catch (err) {
            console.error('[PercBuilder] onPercBeaterChange error:', err);
            this.setPKStatus('Error: ' + err.message);
        }
    },

    _getPercSelectionInfo() {
        const instKey = this.pk.percInstrument.value;
        const beater = this.pk.percBeater.value;
        const midi = parseInt(this.pk.percArticulation.value, 10);
        if (!instKey || isNaN(midi)) return null;
        // beater can be '__none' for instruments without beater distinctions
        const noBeater = !beater || beater === '__none';

        const inst = InstrumentRegistry.get(instKey);
        const allInOne = inst ? (inst.allInOne || inst.allInOne_low || []) : [];
        if (allInOne.length === 0) return null;

        const entry = noBeater
            ? allInOne.find(a => a.midi === midi)
            : allInOne.find(a => a.midi === midi && a.beater === beater);
        if (!entry) return null;

        const pitchLabel = entry.pitch ? entry.pitch + ', ' : '';
        const beaterLabel = entry.beater ? entry.beater + ', ' : '';
        const label = (inst.name || instKey) + ' – ' + beaterLabel + pitchLabel + entry.articulation;
        const routing = InstrumentRegistry.getRouting('perc1', instKey);

        return { instKey, beater: entry.beater || null, entry, label, midi, routing };
    },

    async auditionPercSelection() {
        const info = this._getPercSelectionInfo();
        if (!info) { this.setPKStatus('Select instrument, beater, and articulation first'); return; }

        // Ensure MIDI outputs are initialized
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { this.setPKStatus('No MIDI access'); return; }
        }

        let output = null;
        let channel = 0;
        if (info.routing) {
            const portName = (info.routing.port || '').toLowerCase();
            output = this._zoneMidiOutputs[portName];
            channel = (info.routing.channel || 1) - 1;
            console.log('[Perc Audition] Looking for port "' + portName + '" in:', Object.keys(this._zoneMidiOutputs));
        }
        if (!output) {
            console.warn('[Perc Audition] Port not found, falling back to pk.midiOut');
            output = this.pk.midiOut;
        }
        if (!output) { this.setPKStatus('No MIDI output available'); return; }

        const vel = Math.max(1, Math.min(127, parseInt((document.getElementById('pkPercSetVelocity') || {}).value, 10) || 80));
        const dur = Math.max(10, parseInt((document.getElementById('pkPercSetDuration') || {}).value, 10) || 500);
        console.log('[Perc Audition] Sending note', info.midi, 'on ch', channel + 1, 'via', output.name, 'vel', vel, 'dur', dur);
        output.send([0x90 | channel, info.midi, vel]);
        setTimeout(() => output.send([0x80 | channel, info.midi, 0]), dur);
        this.setPKStatus('Audition: ' + info.label);
    },

    addPercToSet() {
        const set = this.getActiveSet();
        if (!set) { this.setPKStatus('Select or create a set first'); return; }

        const info = this._getPercSelectionInfo();
        if (!info) { this.setPKStatus('Select instrument, beater, and articulation first'); return; }

        const vel = Math.max(1, Math.min(127, parseInt(document.getElementById('pkPercSetVelocity').value, 10) || 80));
        const dur = Math.max(10, parseInt(document.getElementById('pkPercSetDuration').value, 10) || 500);
        set.items.push({
            type: 'percArticulation',
            instrument: info.instKey,
            beater: info.beater,
            articulation: info.entry.articulation,
            pitch: info.entry.pitch || null,
            midi: info.midi,
            midis: [info.midi],
            velocity: vel,
            durationMs: dur,
            label: info.label
        });

        this.renderSetItems();
        this.refreshPercSetSelect();
        this.refreshSetSelect();
        this.setPKStatus('Added ' + info.label + ' to ' + set.name);
        this.markDirty();
    },

    onCellInstrumentChange() {
        const instKey = document.getElementById('pkCellInstrument').value;

        const harmonicsPanel = document.getElementById('pkHarmonicsPanel');
        const beaterSel = document.getElementById('pkCellPercBeater');

        const auditionPadsBox = document.getElementById('pkCellAuditionPads');
        beaterSel.innerHTML = '<option value="">— Beater —</option>';
        artSel.innerHTML = '<option value="">— Articulation —</option>';
        // Render/clear audition pads for percussion (cells are player-agnostic;
        // use perc1 — routing is mirrored to perc2 for same channel).
        if (auditionPadsBox) {
            auditionPadsBox.innerHTML = instKey ? this.ppAuditionPads('perc1', instKey) : '';
            auditionPadsBox.querySelectorAll('.pp-audition-pad').forEach(btn => {
                btn.addEventListener('click', () => {
                    const port = btn.dataset.audPort;
                    const ch = parseInt(btn.dataset.audCh, 10);
                    const midi = parseInt(btn.dataset.audMidi, 10);
                    this.auditionNote(port, ch, midi, 100, 250);
                    btn.style.background = '#4A90D9';
                    setTimeout(() => { btn.style.background = '#2a2a2a'; }, 200);
                });
            });
        }

        // Harmonics mode
        if (instKey && InstrumentRegistry.isHarmonics(instKey)) {
            percRow.style.display = 'none';
            if (harmonicsPanel) harmonicsPanel.style.display = 'block';
            document.getElementById('pkHarmonicsAdd').style.display = '';
            this._setHarmonicsKeyboardMode(true);
            this.pk.harmonicsSelection = null;
            document.getElementById('pkHarmonicsPartialList').innerHTML = '<div style="color:#666;font-style:italic">Click a key (A0–B4) to see available partials</div>';
            document.getElementById('pkHarmonicsStatus').textContent = '';
            this.setPKStatus('Harmonics Piano — select fundamental + partial');
            return;
        }

        // Not harmonics — hide harmonics panel, restore keyboard
        if (harmonicsPanel) harmonicsPanel.style.display = 'none';
        this._setHarmonicsKeyboardMode(false);
        this.pk.harmonicsSelection = null;

        if (!instKey || !InstrumentRegistry.isPerc(instKey)) {
            percRow.style.display = 'none';
            return;
        }
        percRow.style.display = 'flex';

        const inst = InstrumentRegistry.get(instKey);
        const allInOne = inst ? (inst.allInOne || inst.allInOne_low || []) : [];
        if (!inst || allInOne.length === 0) {
            this.setPKStatus('No articulation data for ' + instKey);
            return;
        }

        const hasBeaters = allInOne.some(a => a.beater);
        if (!hasBeaters) {
            beaterSel.innerHTML = '<option value="__none" selected>— n/a —</option>';
            allInOne.forEach(a => {
                const opt = document.createElement('option');
                opt.value = String(a.midi);
                const pitchLabel = a.pitch ? a.pitch + ', ' : '';
                opt.textContent = pitchLabel + a.articulation + ' (' + a.note + ')';
                opt.dataset.pitch = a.pitch || '';
                opt.dataset.articulation = a.articulation;
                opt.dataset.beater = '';
                artSel.appendChild(opt);
            });
            this.setPKStatus(inst.name + ': ' + allInOne.length + ' articulations');
        } else {
            const beaters = [...new Set(allInOne.map(a => a.beater))];
            beaters.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                beaterSel.appendChild(opt);
            });
            if (beaters.length === 1) {
                beaterSel.value = beaters[0];
                this.onCellPercBeaterChange();
            }
            this.setPKStatus(inst.name + ': ' + beaters.length + ' beater(s)');
        }
    },

    onCellPercBeaterChange() {

        const beater = document.getElementById('pkCellPercBeater').value;
        const artSel = document.getElementById('pkCellPercArtic');
        artSel.innerHTML = '<option value="">— Articulation —</option>';

            const pitchLabel = a.pitch ? a.pitch + ', ' : '';
            opt.textContent = pitchLabel + a.articulation + ' (' + a.note + ')';

            opt.dataset.articulation = a.articulation;

    _setHarmonicsKeyboardMode(enabled) {
        const rules = InstrumentRegistry.getHarmonicsRules();
        this.pk.keys.forEach(k => {
            if (!k.el) return;
            if (enabled) {
                // MIDI 21–71 are fundamentals that have at least some partials
                if (k.midi < 21 || k.midi > 71) {
                    k.el.style.opacity = '0.15';
                    k.el.style.pointerEvents = 'none';
                } else if (rules) {
                    const partials = getAvailablePartials(k.midi, rules);
                    if (!partials || partials.length === 0) {
                        k.el.style.opacity = '0.25';
                        k.el.style.pointerEvents = 'none';
                    } else {
                        k.el.style.opacity = '';
                        k.el.style.pointerEvents = '';
                    }
                }
            } else {
                k.el.style.opacity = '';
                k.el.style.pointerEvents = '';
                k.el.classList.remove('pk-harmonics-fundamental');
            }
        });
    },

    _onHarmonicsKeyClick(k) {
        const rules = InstrumentRegistry.getHarmonicsRules();
        if (!rules) { this.setPKStatus('Harmonics rules not loaded'); return; }
        const partials = getAvailablePartials(k.midi, rules);
        if (!partials || partials.length === 0) {
            this.setPKStatus(k.name + ' — no available partials');
            return;
        }
        this.pk.harmonicsSelection = null;
        this.pk.harmonicsFundamental = k;
        this.pk.keys.forEach(kk => { if (kk.el) kk.el.classList.remove('pk-harmonics-fundamental'); });
        if (k.el) k.el.classList.add('pk-harmonics-fundamental');
        const listEl = document.getElementById('pkHarmonicsPartialList');
        listEl.innerHTML = '';
        partials.forEach((p, i) => {
            const row = document.createElement('div');
            row.style.cssText = 'padding:2px 4px;cursor:pointer;border-radius:2px;margin-bottom:1px';
            const errStr = p.errorCents === 0 ? 'exact' : (p.errorCents > 0 ? '+' : '') + p.errorCents.toFixed(1) + '¢';
            row.textContent = 'P' + p.partial + ' — ' + p.soundsAs + ' (' + errStr + ')';
            row.dataset.idx = i;
            row.addEventListener('click', () => {
                listEl.querySelectorAll('div').forEach(d => {
                    d.style.background = '';
                    d.style.color = '#ccc';
                });
                row.style.background = '#446';
                row.style.color = '#fff';
                this.pk.harmonicsSelection = {
                    fundamental: k.midi,
                    fundamentalName: k.name,
                    partial: p.partial,
                    soundsAs: p.soundsAs,
                    soundsMidi: p.soundsMidi,
                    playMidi: p.playMidi,
                    cc21: p.cc21,
                    errorCents: p.errorCents
                };
                document.getElementById('pkHarmonicsStatus').textContent = k.name + ' P' + p.partial + ' ≈ ' + p.soundsAs;
                this.setPKStatus(k.name + ' P' + p.partial + ' → ' + p.soundsAs + ' (' + errStr + ')');
            });
            listEl.appendChild(row);
        });
        this.setPKStatus(k.name + ' (MIDI ' + k.midi + ') — ' + partials.length + ' partials available');
    },

    async _auditionHarmonicsSelection() {
        const sel = this.pk.harmonicsSelection;
        if (!sel) {
            this.setPKStatus('Select a fundamental + partial first');
            return;
        }
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { this.setPKStatus('No MIDI access'); return; }
        }
        const routing = InstrumentRegistry.getRouting('piano1', 'harmonics_piano');
        if (!routing) { this.setPKStatus('No routing for harmonics_piano'); return; }
        const portName = (routing.port || '').toLowerCase();
        let output = null;
        for (const [name, out] of Object.entries(this._zoneMidiOutputs)) {
            if (name.includes(portName)) { output = out; break; }
        }
        if (!output) { this.setPKStatus('MIDI output "' + routing.port + '" not found'); return; }
        const ch = (routing.channel || 1) - 1;
        const leadMs = 85;
        const vel = 100;
        const durMs = 1000;
        console.log('[Harmonics Audition] port:', routing.port, 'ch:', routing.channel, '(0-idx:', ch + ')', 'playMidi:', sel.playMidi, 'cc21:', sel.cc21, 'soundsAs:', sel.soundsAs, 'output:', output.name);
        // Send CC21 = cc21 value
        output.send([0xB0 | ch, 21, sel.cc21]);
        // Wait leadMs, then note-on
        setTimeout(() => {
            output.send([0x90 | ch, sel.playMidi, vel]);
            this.highlightPianoKey(sel.soundsMidi, null, durMs);
            // After durMs: note-off + CC21 reset
            setTimeout(() => {
                output.send([0x80 | ch, sel.playMidi, 0]);
                output.send([0xB0 | ch, 21, 64]);
            }, durMs);
        }, leadMs);
        this.setPKStatus('Audition: ' + sel.fundamentalName + ' P' + sel.partial + ' ≈ ' + sel.soundsAs);
    },
