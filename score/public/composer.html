            p.setAttribute('stroke-width', '2');
            p.setAttribute('opacity', String(wc.opacity ?? 0.8));
        } else {
            p.setAttribute('d', filledD);
            p.setAttribute('fill', wc.color);
            p.setAttribute('stroke', wc.color);
            p.setAttribute('stroke-width', '1');
            p.setAttribute('opacity', String(wc.opacity ?? 0.8));
        }
        p.style.pointerEvents = 'none';

        const hp = document.createElementNS(svgNS, 'path');
        // hit area: the FILLED region when the curve is filled (click anywhere
        // inside selects — composer 2026-08-13), the fat stroke for line mode
        hp.setAttribute('d', (wc.fillMode !== 'line' && filledD) ? filledD : lineD);
        hp.setAttribute('fill', 'transparent');
        hp.setAttribute('stroke', 'transparent');
        hp.setAttribute('stroke-width', '20');
        hp.setAttribute('class', 'composerObject');
        hp.style.cursor = 'copy';   // dblclick = add node
        hp.style.pointerEvents = 'all';
        hp.addEventListener('mousedown', (e) => {
            e.stopPropagation(); e.preventDefault();
            if (e.shiftKey) { this.selectObject(wc, { additive: true }); return; }
            if (this.selectedObjects.length > 1 && this.selectedObjects.includes(wc)) {
                this.startGroupDrag(wc, e);
                return;
            }
            // META overlay (composer 2026-08-14): gesture shapes may cover each
            // other. ALT+click = pick from a list of everything stacked here;
            // plain clicks at the same spot cycle down through the stack.
            let target = wc;
            if (wc.layer === META_LAYER) {
                if (e.altKey) { this.openMetaStackPicker(e); return; }
                target = this.pickFromMetaStack(e);
            }
            this.selectObject(target);
            this.startWCBodyDrag(target, e);
        });
        hp.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (this.isGrain(wc) || wc.isContainer) return;   // no node/splice tools
            if (e.shiftKey) this.spliceCurveAt(wc, e.clientX);
            else this.addNodeAtClick(wc, e.clientX);
        });

        hl.setAttribute('d', lineD);
        g.appendChild(hl);
        g.appendChild(p);

        // Apex dot (composer 2026-08-10): every envelope on a part lane shows a
        // small dot at its apex — the ending/attack moment of the swell species.
        // "Apex" = the loudest interior node; 2-node ramps have none.
        if (wc.layer < META_LAYER && wc.nodes.length >= 3) {
            let apexIdx = -1, apexY = -Infinity;
            for (let i = 1; i < wc.nodes.length - 1; i++) {
                if (wc.nodes[i].y > apexY) { apexY = wc.nodes[i].y; apexIdx = i; }
            }
            if (apexIdx >= 0 && apexY >= wc.nodes[0].y && apexY >= wc.nodes[wc.nodes.length - 1].y) {
                const dims = this.getLaneDims(wc.layer);
                const an = wc.nodes[apexIdx];
                const ax = (wc.startSeconds + an.pos * (wc.endSeconds - wc.startSeconds)) * this.pixelsPerSecond;
                const dot = document.createElementNS(svgNS, 'circle');
                dot.setAttribute('cx', ax);
                dot.setAttribute('cy', dims.bottom - (an.y / 10) * dims.height);
                dot.setAttribute('r', '2.6');
                dot.setAttribute('fill', '#222');
                dot.setAttribute('stroke', '#fff');
                dot.setAttribute('stroke-width', '0.8');
                dot.style.pointerEvents = 'none';
                g.appendChild(dot);
            }
        }

        g.appendChild(hp);

        this.elementCache.set(wc.id, g);
        wc._els = { group: g, path: p, hitPath: hp, highlight: hl, nodeHandles: [] };
        cg.appendChild(g);

        const wcSelIdx = this.selectedObjects.findIndex(o => o.id === wc.id);
        if (wcSelIdx >= 0) {
            this.selectedObjects[wcSelIdx] = wc;
            if (this.selectedObject && this.selectedObject.id === wc.id) this.selectedObject = wc;
            hl.style.display = '';
            if (this.selectedObject && this.selectedObject.id === wc.id) this.renderNodeHandles(wc);
        }
    },

    renderNodeHandles(wc) {
        if (!wc._els) return;
        const svgNS = 'http://www.w3.org/2000/svg';
        const g = wc._els.group;
        const dims = this.getLaneDims(wc.layer);
        wc._els.nodeHandles.forEach(h => h.remove());
        wc._els.nodeHandles = [];
        const x1 = wc.startSeconds * this.pixelsPerSecond;
        const tw = (wc.endSeconds - wc.startSeconds) * this.pixelsPerSecond;

        if (wc.isContainer) {
            // CONTAINER handles: duration via box edges + ONE curvature diamond
            // (the crescendo-family dial on the container's trajectory).
            const seg = wc.segments[0];
            const hu = 0.5;
            const hv = this.evalWaveCurve(wc, hu);
            const hx = x1 + hu * tw;
            const hy = dims.bottom - hv * dims.height;
            const d = document.createElementNS(svgNS, 'rect');
            d.setAttribute('x', hx - 6); d.setAttribute('y', hy - 6);
            d.setAttribute('width', 12); d.setAttribute('height', 12);
            d.setAttribute('transform', `rotate(45 ${hx} ${hy})`);
            d.setAttribute('fill', '#B8860B'); d.setAttribute('stroke', '#7a5a08');
            d.setAttribute('stroke-width', '1.5');
            d.style.cursor = 'ns-resize'; d.style.pointerEvents = 'all';
            d.setAttribute('class', 'composerObject');
            d.addEventListener('mousedown', (e) => {
                e.stopPropagation(); e.preventDefault();
                this.pushUndoState();
                const startY = e.clientY, startSlope = seg.slope || 0;
                const onMove = (ev) => {
                    seg.slope = Math.max(-1, Math.min(1,
                        startSlope + (startY - ev.clientY) / dims.height * 2));
                    this.updateWCRendering(wc);
                    this.renderNodeHandles(wc);
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    this.refreshPanelValues(); this.markDirty();
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            });
            g.appendChild(d); wc._els.nodeHandles.push(d);
            const lbl = document.createElementNS(svgNS, 'text');
            lbl.setAttribute('x', hx + 12); lbl.setAttribute('y', hy - 8);
            lbl.setAttribute('font-size', '10'); lbl.setAttribute('fill', '#7a5a08');
            lbl.textContent = 'curve ' + (seg.slope || 0).toFixed(2) +
                ' · ' + (wc.endSeconds - wc.startSeconds).toFixed(1) + 's';
            lbl.style.pointerEvents = 'none';
            g.appendChild(lbl); wc._els.nodeHandles.push(lbl);
            this.renderTransformBox(wc, dims, x1, tw);
            return;
        }

        if (this.isGrain(wc)) {
            // Grain suite: dotted start line + go-time box + transform box only.
            const sl = document.createElementNS(svgNS, 'line');
            sl.setAttribute('x1', x1); sl.setAttribute('x2', x1);
            sl.setAttribute('y1', dims.top); sl.setAttribute('y2', dims.bottom);
            sl.setAttribute('stroke', '#333'); sl.setAttribute('stroke-dasharray', '3 3');
            sl.setAttribute('stroke-opacity', '0.7');
            sl.style.pointerEvents = 'none';
            g.appendChild(sl); wc._els.nodeHandles.push(sl);
            const gtBox = document.createElementNS(svgNS, 'rect');
            gtBox.setAttribute('x', x1 - 21); gtBox.setAttribute('y', dims.top);
            gtBox.setAttribute('width', 42); gtBox.setAttribute('height', 13);
            gtBox.setAttribute('fill', '#fff'); gtBox.setAttribute('stroke', '#333');
            gtBox.setAttribute('stroke-width', '1'); gtBox.setAttribute('rx', '2');
            gtBox.style.pointerEvents = 'none';
            g.appendChild(gtBox); wc._els.nodeHandles.push(gtBox);
            const gtTxt = document.createElementNS(svgNS, 'text');
            gtTxt.setAttribute('x', x1); gtTxt.setAttribute('y', dims.top + 10);
            gtTxt.setAttribute('text-anchor', 'middle');
            gtTxt.setAttribute('font-size', '9'); gtTxt.setAttribute('fill', '#333');
            gtTxt.textContent = wc.startSeconds.toFixed(2);
            gtTxt.style.pointerEvents = 'none';
            g.appendChild(gtTxt); wc._els.nodeHandles.push(gtTxt);
            this.renderTransformBox(wc, dims, x1, tw);
            return;
        }

        wc.nodes.forEach((node, idx) => {
            const cx = x1 + node.pos * tw;
            const cy = dims.bottom - (node.y / 10) * dims.height;
            const c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('cx', cx);
            c.setAttribute('cy', cy);
            c.setAttribute('r', 7);
            c.setAttribute('fill', this.selectedNodeIdx === idx ? '#FFD700' : '#fff');
            c.setAttribute('stroke', '#333');
            c.setAttribute('stroke-width', '2');
            c.style.cursor = 'move';
            c.style.pointerEvents = 'all';
            c.setAttribute('class', 'composerObject nodeH');
            c.addEventListener('mousedown', (e) => {
                e.stopPropagation(); e.preventDefault();
                if (e.altKey) {   // ALT+click = erase node (interior only)
                    if (idx > 0 && idx < wc.nodes.length - 1) {
                        this.pushUndoState();
                        wc.nodes.splice(idx, 1);
                        wc.segments.splice(Math.min(idx, wc.segments.length - 1), 1);
                        this.selectedNodeIdx = -1;
                        this.updateWCRendering(wc);
                        this.renderNodeHandles(wc);
                        this.markDirty();
                    }
                    return;
                }
                this.selectedNodeIdx = idx;
                this.renderNodeHandles(wc);
                this.showPropertyPanel();
                this.startNodeDrag(wc, idx, e);
            });
            c.addEventListener('wheel', (e) => {
                if (e.ctrlKey) return;
                e.preventDefault(); e.stopPropagation();
                const segIdx = Math.min(idx, wc.segments.length - 1);
                this.pushUndoStateDebounced();
                const delta = e.deltaY > 0 ? -0.05 : 0.05;
                wc.segments[segIdx].slope = Math.max(-3, Math.min(3, (wc.segments[segIdx].slope || 0) + delta));
                this.updateWCRendering(wc);
                this.refreshPanelValues();
                this.markDirty();
            }, { passive: false });
            g.appendChild(c);
            wc._els.nodeHandles.push(c);
        });

        // Bezier control diamonds: each sits at its segment's control point and
        // drags in BOTH axes — vertical = bulge, horizontal = lean the curve.
        for (let i = 0; i < wc.nodes.length - 1; i++) {
            const nA = wc.nodes[i], nB = wc.nodes[i + 1];
            const segIdx = Math.min(i, wc.segments.length - 1);
            const seg = wc.segments[segIdx];
            let hu;
            if (seg && seg.model === 'ctrl') {
                hu = nA.pos + (seg.cx != null ? seg.cx : 0.5) * (nB.pos - nA.pos);
            } else {
                hu = (nA.pos + nB.pos) / 2;
            }
            const hv = this.evalWaveCurve(wc, hu);   // diamond stays ON the line
            const hx = x1 + hu * tw;
            const hy = dims.bottom - hv * dims.height;
            const grab = (e) => {
                e.stopPropagation(); e.preventDefault();
                this.startSegmentDrag(wc, i, e);
            };
            const halo = document.createElementNS(svgNS, 'circle');
            halo.setAttribute('cx', hx); halo.setAttribute('cy', hy);
            halo.setAttribute('r', 14);
            halo.setAttribute('fill', 'transparent');
            halo.style.cursor = 'move';
            halo.style.pointerEvents = 'all';
            halo.setAttribute('class', 'composerObject');
            halo.addEventListener('mousedown', grab);
            g.appendChild(halo);
            wc._els.nodeHandles.push(halo);
            const d = document.createElementNS(svgNS, 'rect');
            d.setAttribute('x', hx - 5); d.setAttribute('y', hy - 5);
            d.setAttribute('width', 10); d.setAttribute('height', 10);
            d.setAttribute('transform', `rotate(45 ${hx} ${hy})`);
            d.setAttribute('fill', '#2E8B57'); d.setAttribute('fill-opacity', '0.85');
            d.setAttribute('stroke', '#1b5e20'); d.setAttribute('stroke-width', '1.5');
            d.style.cursor = 'move';
            d.style.pointerEvents = 'all';
            d.setAttribute('class', 'composerObject');
            d.addEventListener('mousedown', grab);
            g.appendChild(d);
            wc._els.nodeHandles.push(d);
        }

        this.renderTransformBox(wc, dims, x1, tw);
    },

    startSegmentDrag(wc, nodeIdx, startEvent) {
        this.pushUndoState();
        const segIdx = Math.min(nodeIdx, wc.segments.length - 1);
        const seg = wc.segments[segIdx];
        const nA = wc.nodes[nodeIdx], nB = wc.nodes[nodeIdx + 1];
        // Convert to a real control-point segment, preserving the current shape:
        // choose cy so the curve midpoint stays where it is right now.
        if (seg.model !== 'ctrl') {
            const midU = (nA.pos + nB.pos) / 2;
            const vMid = this.evalWaveCurve(wc, midU);
            seg.model = 'ctrl';
            seg.cx = 0.5;
            seg.cy = Math.max(0, Math.min(1, 2 * vMid - (nA.y + nB.y) / 20));
        }
        const laneRect = this.lanes[wc.layer].getBoundingClientRect();
        const dims = this.getLaneDims(wc.layer);
        const x1 = wc.startSeconds * this.pixelsPerSecond;
        const tw = (wc.endSeconds - wc.startSeconds) * this.pixelsPerSecond;
        const onMove = (ev) => {
            // mouse -> (u within curve, v in lane) -> control point
            const svgY = ev.clientY - laneRect.top;
            const playheadX = window.innerWidth / 2;
            const contentX = (ev.clientX - playheadX) + this.scrollOffset;
            const u = (contentX - x1) / Math.max(1e-6, tw);
            seg.cx = Math.max(0.02, Math.min(0.98, (u - nA.pos) / Math.max(1e-6, nB.pos - nA.pos)));
            const vMouse = (dims.bottom - svgY) / dims.height;
            // doubling rule: control sits beyond the mouse so the CURVE passes at the mouse
            seg.cy = Math.max(-0.4, Math.min(1.4, 2 * vMouse - (nA.y + nB.y) / 20));
            this.updateWCRendering(wc);
            this.renderNodeHandles(wc);
        };
        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            this.refreshPanelValues();
            this.markDirty();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    // Bounding-box transform: right/left edges retime, top scales height,
    // corner does both. Rendered with node handles when a curve is selected.
    renderTransformBox(wc, dims, x1, tw) {
        const svgNS = 'http://www.w3.org/2000/svg';
        const g = wc._els.group;
        const maxY = Math.max(...wc.nodes.map(n => n.y), 0.5);
        const yTop = dims.bottom - (maxY / 10) * dims.height;
        const box = document.createElementNS(svgNS, 'rect');
        box.setAttribute('x', x1); box.setAttribute('y', yTop);
        box.setAttribute('width', tw); box.setAttribute('height', dims.bottom - yTop);
        box.setAttribute('fill', 'none'); box.setAttribute('stroke', '#2E8B57');
        box.setAttribute('stroke-dasharray', '5 4'); box.setAttribute('stroke-opacity', '0.5');
        box.style.pointerEvents = 'none';
        g.appendChild(box);
        wc._els.nodeHandles.push(box);
        const mkHandle = (x, y, cursor, kind) => {
            const h = document.createElementNS(svgNS, 'rect');
            h.setAttribute('x', x - 6); h.setAttribute('y', y - 6);
            h.setAttribute('width', 12); h.setAttribute('height', 12);
            h.setAttribute('fill', '#fff'); h.setAttribute('stroke', '#2E8B57');
            h.setAttribute('stroke-width', '2');
            h.style.cursor = cursor; h.style.pointerEvents = 'all';
            h.setAttribute('class', 'composerObject');
            h.addEventListener('mousedown', (e) => {
                e.stopPropagation(); e.preventDefault();
                this.startBoxDrag(wc, kind, e);
            });
            g.appendChild(h);
            wc._els.nodeHandles.push(h);
        };
        const midY = (yTop + dims.bottom) / 2;
        if (wc.isContainer) {
            // containers: duration edges only (curvature has its own diamond)
            mkHandle(x1, midY, 'ew-resize', 'left');
            mkHandle(x1 + tw, midY, 'ew-resize', 'right');
        } else if (this.isGrain(wc)) {
            // Grain semantics: left = duration "as if generated" (peak + release
            // stay put, the swell stretches), right = release length, top = amplitude.
            mkHandle(x1, midY, 'ew-resize', 'grainDur');
            mkHandle(x1 + tw, midY, 'ew-resize', 'right');
            mkHandle(x1 + tw / 2, yTop, 'ns-resize', 'top');
        } else {
            mkHandle(x1, midY, 'ew-resize', 'left');
            mkHandle(x1 + tw, midY, 'ew-resize', 'right');
            mkHandle(x1 + tw / 2, yTop, 'ns-resize', 'top');
            mkHandle(x1 + tw, yTop, 'nesw-resize', 'corner');
        }
    },

    startBoxDrag(wc, kind, startEvent) {
        this.pushUndoState();
        const dims = this.getLaneDims(wc.layer);
        const origStart = wc.startSeconds, origEnd = wc.endSeconds;
        // META group shape: the green box handles retime the MEMBERS too (this
        // was the composer's actual resize path all along — 2026-08-13)
        const isGroupShape = !!wc.groupId && wc.layer === META_LAYER;
        const grpMembers = isGroupShape
            ? this.objects.filter(o => o !== wc && o.groupId === wc.groupId)
                .map(o => ({ o, start: o.startSeconds, end: o.endSeconds, time: o.time }))
            : [];
        const origYs = wc.nodes.map(n => n.y);
        const maxY = Math.max(...origYs, 0.5);
        const x0 = startEvent.clientX, y0 = startEvent.clientY;
        // Peak-anchored duration stretch (grains): peak time and everything after
        // it (the release) stay fixed; pre-peak node times scale — the curve is
        // re-derived as if generated at the new duration. Segments (hence ratio)
        // are untouched, matching the engines' duration-independent shape params.
        const origNodes = wc.nodes.map(n => ({ ...n }));
        let apexIdx = 0, apexYv = -Infinity;
        origNodes.forEach((n, i) => { if (n.y > apexYv) { apexYv = n.y; apexIdx = i; } });
        const tPeak = origStart + origNodes[apexIdx].pos * (origEnd - origStart);
        const onMove = (ev) => {
            const dt = (ev.clientX - x0) / this.pixelsPerSecond;
            if (kind === 'left') {
                wc.startSeconds = Math.max(0, Math.min(origEnd - 0.5, Math.round((origStart + dt) * 100) / 100));
            }
            if (kind === 'grainDur') {
                const s2 = Math.max(0, Math.min(tPeak - 0.15, Math.round((origStart + dt) * 100) / 100));
                const f = (tPeak - s2) / Math.max(1e-6, tPeak - origStart);
                wc.startSeconds = s2;
                wc.nodes = origNodes.map(n => {
                    const t = origStart + n.pos * (origEnd - origStart);
                    const t2 = t <= tPeak ? tPeak - (tPeak - t) * f : t;
                    return { ...n, pos: Math.max(0, Math.min(1, Math.round((t2 - s2) / (origEnd - s2) * 1000) / 1000)) };
                });
            }
            if (kind === 'right' || kind === 'corner') {
                wc.endSeconds = Math.max(origStart + 0.5, Math.round((origEnd + dt) * 100) / 100);
            }
            if (kind === 'top' || kind === 'corner') {
                const dv = -(ev.clientY - y0) / dims.height * 10;
                const scale = Math.max(0.1, (maxY + dv) / maxY);
                wc.nodes.forEach((n, i) => { n.y = Math.max(0, Math.min(10, Math.round(origYs[i] * scale * 100) / 100)); });
            }
            if (isGroupShape && (kind === 'left' || kind === 'right' || kind === 'corner')) {
                const ratio = (wc.endSeconds - wc.startSeconds) / (origEnd - origStart);
                const map = t => +(wc.startSeconds + (t - origStart) * ratio).toFixed(3);
                for (const m of grpMembers) {
                    if (m.o.type === 'marker') {
                        m.o.time = Math.max(0, map(m.time));
                        this.renderMarker(m.o);
                    } else {
                        m.o.startSeconds = map(m.start);
                        m.o.endSeconds = this.isFixedLen(m.o)
                            ? +(m.o.startSeconds + (m.end - m.start)).toFixed(3)   // one-shot: length is the sample's
                            : Math.max(m.o.startSeconds + 0.02, map(m.end));
                        this.renderWaveCurve(m.o);
                    }
                }
            }
            this.updateWCRendering(wc);
            this.renderNodeHandles(wc);
        };
        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            this.renderWaveCurve(wc);   // reposition the apex dot
            this.refreshPanelValues();
            this.markDirty();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    // Splice: SHIFT+double-click on the line cuts the curve in two at that point
    spliceCurveAt(wc, clientX) {
        const tSplit = this.clientXToTime(clientX);
        const dur = wc.endSeconds - wc.startSeconds;
        if (tSplit < wc.startSeconds + 0.3 || tSplit > wc.endSeconds - 0.3) return;
        this.pushUndoState();
        const u = (tSplit - wc.startSeconds) / dur;
        const vAt = this.evalWaveCurve(wc, u);
        const mkSide = (lo, hi) => {
            const nodes = [];
            const span = hi - lo;
            if (lo === 0) nodes.push(...wc.nodes.filter(n => n.pos < hi - 1e-6).map(n => ({ ...n, pos: n.pos / span })));
            else nodes.push(...wc.nodes.filter(n => n.pos > lo + 1e-6).map(n => ({ ...n, pos: (n.pos - lo) / span })));
            const boundary = { pos: lo === 0 ? 1 : 0, y: Math.round(vAt * 100) / 10, smooth: 0.35 };
            if (lo === 0) nodes.push(boundary); else nodes.unshift(boundary);
            nodes.sort((a, b) => a.pos - b.pos);
            const segments = [];
            for (let i = 0; i < nodes.length - 1; i++) {
                const gu = lo + (nodes[i].pos + nodes[i + 1].pos) / 2 * span;
                let si = 0;
                for (let k = 1; k < wc.nodes.length; k++) if (gu > wc.nodes[k - 1].pos) si = Math.min(k - 1, wc.segments.length - 1);
                segments.push({ ...wc.segments[si] });
            }
            return { nodes, segments };
        };
        const L = mkSide(0, u), R = mkSide(u, 1);
        const base = { layer: wc.layer, color: wc.color, opacity: wc.opacity, fillMode: wc.fillMode };
        const wcL = this.createWaveCurve({ ...base, startSeconds: wc.startSeconds, endSeconds: Math.round(tSplit * 100) / 100, nodes: L.nodes, segments: L.segments });
        const wcR = this.createWaveCurve({ ...base, startSeconds: Math.round(tSplit * 100) / 100, endSeconds: wc.endSeconds, nodes: R.nodes, segments: R.segments });
        wcL.sonifyNote = wc.sonifyNote; wcL.technique = wc.technique;
        wcR.sonifyNote = wc.sonifyNote; wcR.technique = wc.technique;
        const idx = this.objects.indexOf(wc);
        if (wc._els && wc._els.group) wc._els.group.remove();
        if (idx >= 0) this.objects.splice(idx, 1);
        this.deselectAll();
        this.markDirty();
    },

    updateWCRendering(wc) {
        if (!wc._els) return;
        const { lineD, filledD } = this.generateWCPath(wc);
        const p = wc._els.path;
        if (wc.fillMode === 'line' || !filledD) {
            p.setAttribute('d', lineD); p.setAttribute('fill', 'none');
            p.setAttribute('stroke', wc.color); p.setAttribute('stroke-width', '2');
            p.removeAttribute('fill-opacity');
            p.setAttribute('opacity', String(wc.opacity ?? 0.8));
        } else {
            p.setAttribute('d', filledD); p.setAttribute('fill', wc.color);
            p.removeAttribute('fill-opacity');
            p.setAttribute('stroke', wc.color); p.setAttribute('stroke-width', '1');
            p.setAttribute('opacity', String(wc.opacity ?? 0.8));
        }
        wc._els.hitPath.setAttribute('d', (wc.fillMode !== 'line' && filledD) ? filledD : lineD);
        wc._els.highlight.setAttribute('d', lineD);
        this.renderNodeHandles(wc);
    },

    // ========== SELECTION ==========

    // ========== META STACK: overlaid gestures stay independently selectable ==========
    // Gesture shapes share one META lane, so they cover each other. Everything
    // here keeps each one reachable: stack query, click-cycling, an ALT+click
    // picker, and selected-shape-to-front so its handles are never buried.

    metaStackAt(timeSec) {
        return this.objects
            .filter(o => o.type === 'waveCurve' && o.layer === META_LAYER &&
                timeSec >= o.startSeconds && timeSec <= o.endSeconds)
            // narrowest first: a short shape buried under a long one is pick #1
            .sort((a, b) => (a.endSeconds - a.startSeconds) - (b.endSeconds - b.startSeconds) ||
                a.startSeconds - b.startSeconds);
    },

    metaShapeLabel(wc) {
        if (wc.groupId) {
            const mk = this.objects.find(o => o.type === 'marker' && o.groupId === wc.groupId);
            if (mk && mk.label) return mk.label;
        }
        return String(wc.performanceNotes || 'META shape').split(' (')[0];
    },

    pickFromMetaStack(e) {
        const t = this.clientXToTime(e.clientX);
        const stack = this.metaStackAt(t);
        if (stack.length <= 1) { this._metaCycle = null; return stack[0] || this.selectedObject; }
        const ids = stack.map(s => s.id).join(',');
        const sameSpot = this._metaCycle && this._metaCycle.ids === ids &&
            Math.abs(this._metaCycle.x - e.clientX) < 10;
        const idx = sameSpot ? (this._metaCycle.idx + 1) % stack.length : 0;
        this._metaCycle = { x: e.clientX, idx, ids };
        const pick = stack[idx];
        this.saveStatus.textContent = this.metaShapeLabel(pick) +
            ' — ' + (idx + 1) + '/' + stack.length + ' stacked (click again to cycle · ALT+click = list)';
        return pick;
    },

    bringMetaToFront(wc) {
        const g = wc && wc._els && wc._els.group;
        if (g && g.parentNode) g.parentNode.appendChild(g);   // last drawn = on top + clickable
    },

    openMetaStackPicker(e) {
        this.closeMetaStackPicker();
        const stack = this.metaStackAt(this.clientXToTime(e.clientX));
        if (!stack.length) return;
        const box = document.createElement('div');
        box.id = 'metaStackPicker';
        box.style.cssText = 'position:fixed; z-index:9999; background:#222; border:1px solid #5E8C7A;' +
            'border-radius:6px; padding:6px; box-shadow:0 4px 16px rgba(0,0,0,.5); min-width:190px;' +
            'left:' + Math.min(e.clientX, window.innerWidth - 240) + 'px; top:' + (e.clientY + 10) + 'px';
        const head = document.createElement('div');
        head.textContent = stack.length + ' stacked here';
        head.style.cssText = 'color:#8fb3a5; font-size:10px; margin:0 0 4px 2px';
        box.appendChild(head);
        stack.forEach(s => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex; align-items:center; gap:6px; padding:4px 6px;' +
                'cursor:pointer; border-radius:4px; color:#ddd; font-size:11px';
            const sw = document.createElement('span');
            sw.style.cssText = 'width:10px; height:10px; border-radius:2px; flex:none; background:' + (s.color || '#888');
            const txt = document.createElement('span');
            txt.textContent = this.metaShapeLabel(s) + '  ' +
                (s.endSeconds - s.startSeconds).toFixed(1) + 's';
            row.appendChild(sw); row.appendChild(txt);
            row.addEventListener('mouseenter', () => { row.style.background = '#33473f'; });
            row.addEventListener('mouseleave', () => { row.style.background = 'none'; });
            row.addEventListener('mousedown', (ev) => {
                ev.stopPropagation(); ev.preventDefault();
                this.selectObject(s);
                this.saveStatus.textContent = 'selected ' + this.metaShapeLabel(s);
                this.closeMetaStackPicker();
            });
            box.appendChild(row);
        });
        document.body.appendChild(box);
        this._metaPicker = box;
        this._metaPickerAway = (ev) => { if (!box.contains(ev.target)) this.closeMetaStackPicker(); };
        this._metaPickerEsc = (ev) => { if (ev.key === 'Escape') this.closeMetaStackPicker(); };
        setTimeout(() => {
            window.addEventListener('mousedown', this._metaPickerAway);
            window.addEventListener('keydown', this._metaPickerEsc);
        }, 0);
    },

    closeMetaStackPicker() {
        if (this._metaPicker) { this._metaPicker.remove(); this._metaPicker = null; }
        if (this._metaPickerAway) { window.removeEventListener('mousedown', this._metaPickerAway); this._metaPickerAway = null; }
        if (this._metaPickerEsc) { window.removeEventListener('keydown', this._metaPickerEsc); this._metaPickerEsc = null; }
    },

    selectObject(obj, opts) {
        const additive = !!(opts && opts.additive);
        if (additive) {
            const idx = this.selectedObjects.indexOf(obj);
            if (idx >= 0) {
                // Toggle off
                this.selectedObjects.splice(idx, 1);
                if (obj._els && obj._els.highlight) obj._els.highlight.style.display = 'none';
                if ((obj.type === 'waveCurve' || obj.type === 'lineWedge') && obj._els && obj._els.nodeHandles) {
                    obj._els.nodeHandles.forEach(h => h.remove());
                    obj._els.nodeHandles = [];
                }
                // Reassign primary if needed
                if (this.selectedObject === obj) {
                    this.selectedObject = this.selectedObjects[this.selectedObjects.length - 1] || null;
                }
                this.selectedNodeIdx = -1;
                if (this.selectedObject) this.showPropertyPanel(); else this.hidePropertyPanel();
                return;
            }
            // Add to selection as new primary
            this.selectedObjects.push(obj);
            this.selectedObject = obj;
            this.selectedNodeIdx = -1;
            if (obj._els && obj._els.highlight) obj._els.highlight.style.display = '';
            if (obj.type === 'waveCurve') this.renderNodeHandles(obj);
            if (obj.type === 'lineWedge') this.renderLWNodeHandles(obj);
            this.showPropertyPanel();
            return;
        }
        this.deselectAll();
        this.selectedObject = obj;
        this.selectedObjects = [obj];
        this.selectedNodeIdx = -1;
        if (obj._els && obj._els.highlight) obj._els.highlight.style.display = '';
        if (obj.type === 'waveCurve') {
            // a selected META shape draws on top so its handles are never buried
            if (obj.layer === META_LAYER) this.bringMetaToFront(obj);
            this.renderNodeHandles(obj);
        }
        if (obj.type === 'lineWedge') this.renderLWNodeHandles(obj);
        this.showPropertyPanel();
    },

    deselectAll() {
        const list = this.selectedObjects.length ? this.selectedObjects : (this.selectedObject ? [this.selectedObject] : []);
        for (const obj of list) {
            if (obj && obj._els) {
                if (obj._els.highlight) obj._els.highlight.style.display = 'none';
                if ((obj.type === 'waveCurve' || obj.type === 'lineWedge') && obj._els.nodeHandles) {
                    obj._els.nodeHandles.forEach(h => h.remove());
                    obj._els.nodeHandles = [];
                }
            }
        }
        this.selectedObject = null;
        this.selectedObjects = [];
        this.selectedNodeIdx = -1;
        this.hidePropertyPanel();
    },

    // ========== GROUP DRAG (multi-select block move) ==========

    startGroupDrag(anchorObj, startEvent) {
        this.pushUndoState();
        const startClientX = startEvent.clientX;

        // Snapshot original times per object (only horizontal time shift)
        const snaps = this.selectedObjects.map(o => {
            const s = { obj: o };
            if (o.type === 'zone') {
                s.startTime = o.startTime;
                s.endTime = o.endTime;
                s.chordTimes = (o.chordMarkers || []).map(cm => cm.time);
                s.ratioTimes = (o.ratioMarkers || []).map(rm => rm.time);
            } else if (o.type === 'marker') {
                s.time = o.time;
            } else if (o.type === 'waveCurve' || o.type === 'lineWedge') {
                s.startSeconds = o.startSeconds;
                s.endSeconds = o.endSeconds;
            } else if (o.type === 'motive') {
                s.startTime = o.startTime;
            }
            return s;
        });

        // Earliest time across all selected — clamp so Δt can't push it below 0
        const minTime = Math.min(...snaps.map(s => {
            if (s.obj.type === 'zone' || s.obj.type === 'motive') return s.startTime;
            if (s.obj.type === 'marker') return s.time;
            return s.startSeconds;
        }));

        let hasMoved = false;

        const onMove = (ev) => {
            const dx = ev.clientX - startClientX;
            if (!hasMoved && Math.abs(dx) < 3) return;
            hasMoved = true;
            let dt = dx / this.pixelsPerSecond;
            // Snap to 0.05s (matches single-drag snap)
            dt = Math.round(dt * 20) / 20;
            // Clamp so earliest object stays ≥ 0
            if (minTime + dt < 0) dt = -minTime;

            for (const s of snaps) {
                const o = s.obj;
                if (o.type === 'zone') {
                    o.startTime = Math.round((s.startTime + dt) * 20) / 20;
                    o.endTime = Math.round((s.endTime + dt) * 20) / 20;
                    if (o.chordMarkers) {
                        o.chordMarkers.forEach((cm, i) => {
                            if (s.chordTimes[i] != null) cm.time = Math.round((s.chordTimes[i] + dt) * 20) / 20;
                        });
                    }
                    if (o.ratioMarkers) {
                        o.ratioMarkers.forEach((rm, i) => {
                            if (s.ratioTimes[i] != null) rm.time = Math.round((s.ratioTimes[i] + dt) * 20) / 20;
                        });
                    }
                    if (o.midiSnippet) o.midiSnippet._stale = true;
                    this.renderZone(o);
                } else if (o.type === 'marker') {
                    o.time = Math.round((s.time + dt) * 20) / 20;
                    this.renderMarker(o);
                } else if (o.type === 'waveCurve') {
                    o.startSeconds = Math.round((s.startSeconds + dt) * 20) / 20;
                    o.endSeconds = Math.round((s.endSeconds + dt) * 20) / 20;
                    this.renderWaveCurve(o);
                } else if (o.type === 'lineWedge') {
                    o.startSeconds = Math.round((s.startSeconds + dt) * 20) / 20;
                    o.endSeconds = Math.round((s.endSeconds + dt) * 20) / 20;
                    this.renderLineWedge(o);
                } else if (o.type === 'motive') {
                    o.startTime = Math.round((s.startTime + dt) * 20) / 20;
                    this.renderMotive(o);
                }
            }
            this.refreshPanelValues();
        };
        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (!hasMoved) this.undoStack.pop();
            this.showPropertyPanel();
            this.markDirty();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    // ========== NODE INTERACTION ==========

    startWCBodyDrag(wc, startEvent) {
        this.pushUndoState();
        const startClientX = startEvent.clientX;
        const startClientY = startEvent.clientY;
        const origStart = wc.startSeconds;
        const origEnd = wc.endSeconds;
        const origLayer = wc.layer || 0;
        const DRAG_THRESHOLD = 4;
        let hasMoved = false;
        let constrainAxis = null;
        // META group shape: dragging the shape retimes every object that
        // shares its groupId (the gesture's MIDI moves with the handle)
        const isGroupShape = !!wc.groupId && wc.layer === META_LAYER;
        const memberOrig = isGroupShape
            ? this.objects.filter(o => o !== wc && o.groupId === wc.groupId)
                .map(o => ({ o, start: o.startSeconds, end: o.endSeconds, time: o.time }))
            : [];

        const onMove = (e) => {
            const dx = e.clientX - startClientX;
            const dy = e.clientY - startClientY;
            if (!hasMoved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
            hasMoved = true;
            if (wc._els && wc._els.hitPath) wc._els.hitPath.style.cursor = 'grabbing';

            let effDx = dx, effDy = dy;
            if (e.shiftKey) {
                if (!constrainAxis && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                    constrainAxis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
                }
                if (constrainAxis === 'h') effDy = 0;
                else if (constrainAxis === 'v') effDx = 0;
            } else {
                constrainAxis = null;
            }

            const dtSec = effDx / this.pixelsPerSecond;
            let newStart = origStart + dtSec;
            if (newStart < 0) newStart = 0;
            const dur = origEnd - origStart;
            wc.startSeconds = Math.round(newStart * 20) / 20;
            wc.endSeconds = Math.round((wc.startSeconds + dur) * 20) / 20;

            // Grains and containers move horizontally ONLY (whole-shape grab =
            // retime, never a lane change) — SHIFT-v is also ignored for them.
            // Group shapes stay on META for the same reason.
            if (constrainAxis !== 'h' && !this.isGrain(wc) && !wc.isContainer && !isGroupShape) {
                wc.layer = this.getLaneFromY(e.clientY);
            }

            if (isGroupShape) {
                const dt = wc.startSeconds - origStart;
                for (const m of memberOrig) {
                    if (m.o.type === 'marker') {
                        m.o.time = Math.max(0, +(m.time + dt).toFixed(3));
                        this.renderMarker(m.o);
                    } else {
                        m.o.startSeconds = +(m.start + dt).toFixed(3);
                        m.o.endSeconds = +(m.end + dt).toFixed(3);
                        this.renderWaveCurve(m.o);
                    }
                }
            }

            this.renderWaveCurve(wc);
            this.refreshPanelValues();
        };

        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (wc._els && wc._els.hitPath) wc._els.hitPath.style.cursor = 'grab';
            if (!hasMoved) this.undoStack.pop();
            this.showPropertyPanel();
            this.markDirty();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    startNodeDrag(wc, nodeIdx, startEvent) {
        const dims = this.getLaneDims(wc.layer);
        const node = wc.nodes[nodeIdx];
        this.pushUndoState();
        let hasMoved = false;
        // META group shape: dragging an EDGE node time-scales the members —
        // shrink the shape's width and the gesture gets proportionally shorter
        // (durations included). Edge drags are time-only for group shapes
        // (node y frozen, like container duration edges).
        const isGroupShape = !!wc.groupId && wc.layer === META_LAYER;
        const grpOrig = (isGroupShape && (nodeIdx === 0 || nodeIdx === wc.nodes.length - 1)) ? {
            start: wc.startSeconds, end: wc.endSeconds,
            members: this.objects.filter(o => o !== wc && o.groupId === wc.groupId)
                .map(o => ({ o, start: o.startSeconds, end: o.endSeconds, time: o.time })),
        } : null;

        const onMove = (e) => {
            hasMoved = true;
            const viewportW = window.innerWidth;
            const tx = viewportW / 2 - this.scrollOffset;
            const contentX = e.clientX - tx;
            const timeAtCursor = contentX / this.pixelsPerSecond;

            if (nodeIdx === 0) {
                const newStart = Math.max(0, Math.round(timeAtCursor * 20) / 20);
                if (newStart < wc.endSeconds - 0.1) wc.startSeconds = newStart;
            } else if (nodeIdx === wc.nodes.length - 1) {
                const newEnd = Math.max(wc.startSeconds + 0.1, Math.round(timeAtCursor * 20) / 20);
                wc.endSeconds = newEnd;
            } else {
                const curX1 = wc.startSeconds * this.pixelsPerSecond;
                const curTw = (wc.endSeconds - wc.startSeconds) * this.pixelsPerSecond;
                if (curTw > 0) {
                    const minP = wc.nodes[nodeIdx - 1].pos + 0.001;
                    const maxP = wc.nodes[nodeIdx + 1].pos - 0.001;
                    node.pos = Math.max(minP, Math.min(maxP, (contentX - curX1) / curTw));
                }
            }

            if (grpOrig) {
                // affine remap [origStart, origEnd] -> [newStart, newEnd]:
                // the untouched edge stays anchored, everything else scales
                const ratio = (wc.endSeconds - wc.startSeconds) / (grpOrig.end - grpOrig.start);
                const map = t => +(wc.startSeconds + (t - grpOrig.start) * ratio).toFixed(3);
                for (const m of grpOrig.members) {
                    if (m.o.type === 'marker') {
                        m.o.time = Math.max(0, map(m.time));
                        this.renderMarker(m.o);
                    } else {
                        m.o.startSeconds = map(m.start);
                        m.o.endSeconds = this.isFixedLen(m.o)
                            ? +(m.o.startSeconds + (m.end - m.start)).toFixed(3)   // one-shot: length is the sample's
                            : Math.max(m.o.startSeconds + 0.02, map(m.end));
                        this.renderWaveCurve(m.o);
                    }
                }
            } else {
                const lane = this.lanes[wc.layer];
                const laneRect = lane.getBoundingClientRect();
                const relY = e.clientY - laneRect.top;
                const yNorm = 1 - Math.max(0, Math.min(1, (relY - dims.top) / dims.height));
                node.y = Math.round(yNorm * 100) / 10;
            }
            this.updateWCRendering(wc);
            this.refreshPanelValues();
        };

        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (!hasMoved) this.undoStack.pop();
            this.showPropertyPanel();
            this.markDirty();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    addNodeAtClick(wc, clientX) {
        this.pushUndoState();
        const viewportW = window.innerWidth;
        const tx = viewportW / 2 - this.scrollOffset;
        const contentX = clientX - tx;
        const x1 = wc.startSeconds * this.pixelsPerSecond;
        const tw = (wc.endSeconds - wc.startSeconds) * this.pixelsPerSecond;
        const nPos = Math.max(0, Math.min(1, (contentX - x1) / tw));

        let insertIdx = 0;
        for (let i = 0; i < wc.nodes.length - 1; i++) {
            if (nPos >= wc.nodes[i].pos && nPos <= wc.nodes[i + 1].pos) { insertIdx = i + 1; break; }
        }

        const segIdx = insertIdx - 1;
        const seg = wc.segments[segIdx] || { model: 'bezier', slope: 0 };
        const n0 = wc.nodes[segIdx], n1 = wc.nodes[insertIdx];
        const segLen = n1.pos - n0.pos;
        const segT = segLen > 0 ? (nPos - n0.pos) / segLen : 0;
        const interpY = this.computeYAtT(seg.model, seg.slope, n0.y / 10, n1.y / 10, segT) * 10;

        wc.nodes.splice(insertIdx, 0, { pos: nPos, y: Math.round(interpY * 10) / 10, smooth: 0.25 });
        wc.segments.splice(segIdx + 1, 0, { model: seg.model, slope: seg.slope });
        this.selectedNodeIdx = insertIdx;
        this.updateWCRendering(wc);
        this.showPropertyPanel();
        this.markDirty();
    },

    deleteSelected() {
        if (!this.selectedObject) return;
        if (this.selectedNodeIdx >= 0 && this.selectedObject.type === 'waveCurve') {
            const wc = this.selectedObject;
            if (wc.nodes.length <= 2) return;
            if (this.selectedNodeIdx === 0 || this.selectedNodeIdx === wc.nodes.length - 1) return;
            this.pushUndoState();
            wc.nodes.splice(this.selectedNodeIdx, 1);
            wc.segments.splice(Math.min(this.selectedNodeIdx, wc.segments.length - 1), 1);
            this.selectedNodeIdx = -1;
            this.updateWCRendering(wc);
            this.showPropertyPanel();
            this.markDirty();
        } else if (this.selectedNodeIdx >= 0 && this.selectedObject.type === 'lineWedge') {
            const lw = this.selectedObject;
            if (lw.nodes.length <= 2) return;
            if (this.selectedNodeIdx === 0 || this.selectedNodeIdx === lw.nodes.length - 1) return;
            this.pushUndoState();
            lw.nodes.splice(this.selectedNodeIdx, 1);
            this.selectedNodeIdx = -1;
            this.updateLWRendering(lw);
            this.showPropertyPanel();
            this.markDirty();
        } else {
            // Multi-delete: remove every selected object (or just the primary if no multi-sel)
            let targets = this.selectedObjects.length > 0 ? this.selectedObjects.slice() : [this.selectedObject];
            // deleting a gesture's META shape deletes the whole gesture (composer
            // 2026-08-14: the shape IS the handle, so its parts must go with it)
            const groups = new Set(targets.filter(o => o && o.groupId && o.layer === META_LAYER).map(o => o.groupId));
            if (groups.size) {
                const members = this.objects.filter(o => groups.has(o.groupId));
                const notes = members.filter(o => o.type === 'waveCurve' && o.layer < META_LAYER).length;
                // Cancel means ABORT (composer 2026-08-16). It used to mean
                // "delete the shape only", which left the notes orphaned with no
                // handle — a third outcome nobody asked for, from a button that
                // reads like "never mind".
                if (notes && !confirm('Delete this whole gesture?\n\n' +
                    notes + ' parts + marker + shape.\n\nCancel = nothing happens.')) {
                    return;
                }
                const have = new Set(targets);
                members.forEach(m => { if (!have.has(m)) targets.push(m); });
            }
            this.pushUndoState();
            for (const obj of targets) {
                if (!obj) continue;
                const idx = this.objects.indexOf(obj);

                el.addEventListener('click', () => {
                    this._selectedChordMarkerIdx = parseInt(el.dataset.cmIdx, 10);

            if (addCmBtn) {
                addCmBtn.addEventListener('click', () => {
                    this.addChordMarkerToZone(obj);
                });
            }
            const delCmBtn = panel.querySelector('#ppDelChordMarker');
            if (delCmBtn) {
                delCmBtn.addEventListener('click', () => {
                    this.deleteSelectedChordMarker(obj);
                });
            }
            // Source slot controls (same as ostinato)
            panel.querySelectorAll('.pp-source-mode').forEach(btn => {
                btn.addEventListener('click', () => {
                    const hand = btn.dataset.hand;
                    const newMode = btn.dataset.mode;
                    const cms = obj.chordMarkers || [];
                    const scm = cms[this._selectedChordMarkerIdx];
                    if (!scm) return;
                    if (!scm[hand]) scm[hand] = {};
                    scm[hand].mode = newMode;
                    if (newMode === 'set' && !scm[hand].setId) scm[hand].setId = '';
                    if (newMode === 'set' && !scm[hand].strategy) scm[hand].strategy = 'random';
                    if (obj.midiSnippet) obj.midiSnippet._stale = true;
                    this.showPropertyPanel();
                    this.markDirty();
                });
            });
            panel.querySelectorAll('.pp-source-set').forEach(sel => {
                sel.addEventListener('change', () => {
                    const hand = sel.dataset.hand;
                    const cms = obj.chordMarkers || [];
                    const scm = cms[this._selectedChordMarkerIdx];
                    if (!scm || !scm[hand]) return;
                    scm[hand].setId = sel.value;
                    if (obj.midiSnippet) obj.midiSnippet._stale = true;
                    this.showPropertyPanel();
                    this.markDirty();
                });
            });
            panel.querySelectorAll('.pp-source-strategy').forEach(sel => {
                sel.addEventListener('change', () => {
                    const hand = sel.dataset.hand;
                    const cms = obj.chordMarkers || [];
                    const scm = cms[this._selectedChordMarkerIdx];
                    if (!scm || !scm[hand]) return;
                    scm[hand].strategy = sel.value;
                    if (obj.midiSnippet) obj.midiSnippet._stale = true;
                    this.markDirty();
                });
            });
            panel.querySelectorAll('.pp-source-fixed-perc').forEach(sel => {
                sel.addEventListener('change', () => {
                    const hand = sel.dataset.hand;
                    const cms = obj.chordMarkers || [];
                    const scm = cms[this._selectedChordMarkerIdx];
                    if (!scm) return;
                    const midi = parseInt(sel.value, 10);
                    if (isNaN(midi)) return;
                    const artInfo = InstrumentRegistry.getArticulations(obj.instrument).find(a => a.midi === midi);
                    scm[hand] = {
                        mode: 'fixed', midis: [midi],
                        label: artInfo ? artInfo.label : 'MIDI ' + midi,
                        instrument: obj.instrument,
                        beater: artInfo ? artInfo.beater : null,
                        articulation: artInfo ? artInfo.articulation : null
                    };
                    if (obj.midiSnippet) obj.midiSnippet._stale = true;
                    this.showPropertyPanel();
                    this.markDirty();
                });

            panel.querySelectorAll('.pp-source-fixed-pitch').forEach(inp => {
                inp.addEventListener('change', () => {
                    const hand = inp.dataset.hand;
                    const cms = obj.chordMarkers || [];
                    const scm = cms[this._selectedChordMarkerIdx];
                    if (!scm) return;
                    const midi = parseInt(inp.value, 10);
                    if (isNaN(midi) || midi < 0 || midi > 127) return;
                    const noteName = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][midi % 12] + (Math.floor(midi / 12) - 1);
                    scm[hand] = { mode: 'fixed', midis: [midi], label: noteName + ' (' + midi + ')' };

                    this.markDirty();

                });

                    this.testPlaySnippet(obj);
                });

            if (assignBtn) {
                assignBtn.addEventListener('click', () => {
                    this.startOneShotChordAssignment(obj);
                });

            const markerCellAudBtn = panel.querySelector('#ppMarkerCellAudition');
            if (markerCellAudBtn) {
                markerCellAudBtn.addEventListener('click', () => {
                    const beh = this._buildZoneCellBehavior(obj);
                    const _cdM = (this.databases.cells || []).find(c => c.id === obj.cellId);
                    const _durM = obj.cellDurationMs != null ? obj.cellDurationMs : ((_cdM && _cdM.defaultDurationMs) || 1000);
                    this.auditionPanelCell(obj.cellId, obj.player, _durM, beh);

                    setTimeout(() => { markerCellAudBtn.style.background = '#43A047'; }, 300);

        // Anticipation-Reaction marker event listeners

                genBtn.addEventListener('click', () => {

                });

            if (ar1CellAudBtn) {
                ar1CellAudBtn.addEventListener('click', () => {

                    const beh1 = cd1 ? this._buildARCellBehavior(obj, 'inst1', cd1) : null;
                    const _dur1 = obj.inst1CellDurationMs != null ? obj.inst1CellDurationMs : ((cd1 && cd1.defaultDurationMs) || 1000);
                    this.auditionPanelCell(obj.inst1CellId, obj.inst1Player, _dur1, beh1);
                    ar1CellAudBtn.style.background = '#1B5E20';
                    setTimeout(() => { ar1CellAudBtn.style.background = '#43A047'; }, 300);
                });
            }
            const ar2CellAudBtn = panel.querySelector('#ppAR2CellAudition');
            if (ar2CellAudBtn) {
                ar2CellAudBtn.addEventListener('click', () => {
                    const cd2 = obj.inst2CellId ? (this.databases.cells || []).find(c => c.id === obj.inst2CellId) : null;
                    const beh2 = cd2 ? this._buildARCellBehavior(obj, 'inst2', cd2) : null;
                    const _dur2 = obj.inst2CellDurationMs != null ? obj.inst2CellDurationMs : ((cd2 && cd2.defaultDurationMs) || 1000);
                    this.auditionPanelCell(obj.inst2CellId, obj.inst2Player, _dur2, beh2);
                    ar2CellAudBtn.style.background = '#1B5E20';

        // Audition pad clicks (all panel types)
        panel.querySelectorAll('.pp-audition-pad').forEach(btn => {
            btn.addEventListener('click', () => {

                btn.style.background = '#4A90D9';
                setTimeout(() => { btn.style.background = '#2a2a2a'; }, 200);

        // Restore focus after rebuild — prefer pending Tab target over saved field
        const restoreField = this._pendingTabTarget || savedField;
        if (restoreField) {
            const el = panel.querySelector('[data-field="' + restoreField + '"]')
                     || panel.querySelector('[data-prop-key="' + restoreField + '"]')
                     || panel.querySelector('[data-prop-oldkey="' + restoreField + '"]');
            if (el) {
                el.focus();
                if (this._pendingTabTarget) {
                    if (el.select) el.select();
                } else if (savedSelStart != null && el.setSelectionRange) {
                    try { el.setSelectionRange(savedSelStart, savedSelEnd); } catch(e) {}
                }
            }
        }

    hidePropertyPanel() {
        this._panelOverride = false;
        if (this.propertyPanel) this.propertyPanel.style.display = 'none';
