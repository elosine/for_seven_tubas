    refreshPanelValues() {
        if (!this.selectedObject || !this.propertyPanel || this.propertyPanel.style.display === 'none') return;
        const obj = this.selectedObject;
        if (obj.type === 'waveCurve') {
            const dur = obj.endSeconds - obj.startSeconds;
            this.propertyPanel.querySelectorAll('[data-field]').forEach(el => {
                if (el.dataset.field === 'startSeconds') el.value = obj.startSeconds;
                if (el.dataset.field === 'endSeconds') el.value = obj.endSeconds;
            });
            if (this.selectedNodeIdx >= 0 && this.selectedNodeIdx < obj.nodes.length) {
                const segIdx = Math.min(this.selectedNodeIdx, obj.segments.length - 1);
                const seg = obj.segments[segIdx];
                const node = obj.nodes[this.selectedNodeIdx];
                const nodeTime = obj.startSeconds + node.pos * dur;
                this.propertyPanel.querySelectorAll('[data-field]').forEach(el => {
                    if (el.dataset.field === 'seg.slope' && seg) el.value = seg.slope;
                    if (el.dataset.field === 'seg.model' && seg) el.value = seg.model;
                    if (el.dataset.field === 'node.y') el.value = node.y;
                    if (el.dataset.field === 'node.time') el.value = nodeTime.toFixed(2);
                    if (el.dataset.field === 'node.smooth') el.value = node.smooth;
                });
            }
        } else if (obj.type === 'lineWedge') {
            const dur = obj.endSeconds - obj.startSeconds;
            this.propertyPanel.querySelectorAll('[data-field]').forEach(el => {
                if (el.dataset.field === 'startSeconds') el.value = obj.startSeconds;
                if (el.dataset.field === 'endSeconds') el.value = obj.endSeconds;
                if (el.dataset.field === 'yOffset') el.value = Math.round(obj.yOffset || 0);
            });
            if (this.selectedNodeIdx >= 0 && this.selectedNodeIdx < obj.nodes.length) {
                const node = obj.nodes[this.selectedNodeIdx];
                const nodeTime = obj.startSeconds + node.pos * dur;
                this.propertyPanel.querySelectorAll('[data-field]').forEach(el => {
                    if (el.dataset.field === 'node.thickness') el.value = node.thickness;
                    if (el.dataset.field === 'node.time') el.value = nodeTime.toFixed(2);
                });
            }
        } else if (obj.type === 'zone') {
            this.propertyPanel.querySelectorAll('[data-field]').forEach(el => {
                if (el.dataset.field === 'startTime') el.value = obj.startTime;
                if (el.dataset.field === 'endTime') el.value = obj.endTime;
                if (el.dataset.field === 'layer') el.value = obj.layer;
            });
            // Update duration text
            const durSpan = this.propertyPanel.querySelector('.pp-row span[style*="color:#666"]');
            if (durSpan) durSpan.textContent = (obj.endTime - obj.startTime).toFixed(2) + ' s';
        } else if (obj.type === 'marker') {
            this.propertyPanel.querySelectorAll('[data-field]').forEach(el => {
                if (el.dataset.field === 'time') el.value = obj.time;
            });
        }
    },

    // ============================================
    // STAGGERED ENTRY CALCULATOR
    // ============================================
    initStaggerCalc() {
        const panel = document.getElementById('staggerCalc');
        if (!panel) return;
        const self = this;

        // Toggle button
        document.getElementById('staggerBtn').addEventListener('click', () => {
            if (panel.style.display === 'none' || !panel.style.display) {
                panel.style.display = 'block';
                if (!panel.style.left) { panel.style.left = '60px'; panel.style.top = '80px'; }
                self._staggerCalcUpdate();
            } else {
                panel.style.display = 'none';
            }
        });

        // Close button
        panel.querySelector('.sc-close').addEventListener('click', () => { panel.style.display = 'none'; });

        // Select-all on focus for number inputs (click or tab)
        panel.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
                setTimeout(() => e.target.select(), 0);
            }
        });

        // Drag support
        let dragging = false, startX, startY, startLeft, startTop;
        panel.querySelector('.sc-dragbar').addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('sc-close')) return;
            dragging = true; startX = e.clientX; startY = e.clientY;
            startLeft = panel.offsetLeft; startTop = panel.offsetTop;
            panel.querySelector('.sc-dragbar').style.cursor = 'grabbing';
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            panel.style.left = (startLeft + e.clientX - startX) + 'px';
            panel.style.top = Math.max(40, startTop + e.clientY - startY) + 'px';
        });
        window.addEventListener('mouseup', () => { if (dragging) { dragging = false; panel.querySelector('.sc-dragbar').style.cursor = 'grab'; } });

        // Direction toggle: show/hide dropout shape
        document.getElementById('scDirection').addEventListener('change', () => {
            document.getElementById('scDropoutRow').style.display =
                document.getElementById('scDirection').value === 'subtract' ? 'flex' : 'none';
            self._staggerCalcUpdate();
        });

        // Tutti slider label + hint
        document.getElementById('scTutti').addEventListener('input', () => {
            const v = parseInt(document.getElementById('scTutti').value, 10);
            document.getElementById('scTuttiVal').textContent = v + '%';
            let hint = '';
            if (v <= 15) hint = 'aggressive pile-up, last voice barely establishes';
            else if (v <= 30) hint = 'balanced, each voice audible';
            else hint = 'long tutti, emphasis on full texture';
            document.getElementById('scTuttiHint').textContent = hint;
            self._staggerCalcUpdate();
        });

        // Live recalc on any input change
        ['scStart', 'scEnd', 'scPlayers', 'scTutti', 'scCurve', 'scDirection', 'scDropout'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('change', () => self._staggerCalcUpdate());
        });
    },

    _staggerCalcUpdate() {
        const start = parseFloat(document.getElementById('scStart').value) || 0;
        const end = parseFloat(document.getElementById('scEnd').value) || 10;
        const numPlayers = Math.max(2, Math.min(8, parseInt(document.getElementById('scPlayers').value, 10) || 4));
        const tuttiPct = parseInt(document.getElementById('scTutti').value, 10) || 25;
        const curve = document.getElementById('scCurve').value || 'geometric';
        const direction = document.getElementById('scDirection').value || 'accumulate';
        const dropout = document.getElementById('scDropout').value || 'collapse';

        const totalDur = end - start;
        if (totalDur <= 0) { document.getElementById('scResults').innerHTML = '<span style="color:#c66">End must be after Start</span>'; return; }

        const tuttiDur = totalDur * (tuttiPct / 100);
        const entrySpan = totalDur - tuttiDur;
        const numGaps = numPlayers - 1;

        // Generate gap ratios based on curve type
        // For forward/accumulate: gaps go large→small (index 0 = first gap = largest)
        let rawRatios = [];
        for (let i = 0; i < numGaps; i++) {
            if (curve === 'linear') {
                rawRatios.push(numGaps - i);
            } else if (curve === 'geometric') {
                rawRatios.push(Math.pow(2, numGaps - 1 - i));
            } else if (curve === 'exponential') {
                rawRatios.push(Math.pow(3, numGaps - 1 - i));
            }
        }

        // For subtract mode
        if (direction === 'subtract') {
            if (dropout === 'collapse') {
                // Same acceleration direction: gaps shrink (large first, small at end = rapid thinning)
                // rawRatios already large→small, keep as is
            } else {
                // Peel: reverse — small gap first (quick first exit), then wider
                rawRatios.reverse();
            }
        }

        // Normalize ratios to fill entrySpan
        const ratioSum = rawRatios.reduce((a, b) => a + b, 0);
        const gaps = rawRatios.map(r => (r / ratioSum) * entrySpan);

        // Build player entries
        const players = [];
        if (direction === 'accumulate') {
            // P1 enters at start, subsequent players enter with gaps
            let t = start;
            for (let i = 0; i < numPlayers; i++) {
                players.push({ player: i + 1, entry: t, exit: end, duration: end - t });
                if (i < numGaps) t += gaps[i];
            }
        } else {
            // Subtract: all start at start, players exit with gaps after tutti
            // Tutti is at the beginning
            let t = start + tuttiDur;
            for (let i = 0; i < numPlayers; i++) {
                if (i === numPlayers - 1) {
                    // Last remaining player plays to end
                    players.push({ player: i + 1, entry: start, exit: end, duration: totalDur });
                } else {
                    players.push({ player: i + 1, entry: start, exit: t, duration: t - start });
                    if (i < numGaps) t += gaps[i];
                }
            }
        }

        // Render results table
        let h = '<table><tr><th>Player</th><th>Entry</th><th>Exit</th><th>Duration</th></tr>';
        for (let i = 0; i < players.length; i++) {
            const p = players[i];
            h += '<tr><td>P' + p.player + '</td>';
            h += '<td>' + p.entry.toFixed(2) + '</td>';
            h += '<td>' + p.exit.toFixed(2) + '</td>';
            h += '<td>' + p.duration.toFixed(2) + 's</td></tr>';
            // Show gap to next entry/exit
            if (i < players.length - 1) {
                let gapVal;
                if (direction === 'accumulate') {
                    gapVal = players[i + 1].entry - players[i].entry;
                } else {
                    gapVal = players[i + 1].exit - players[i].exit;
                }
                h += '<tr><td colspan="4" class="sc-gap" style="text-align:center">↕ gap: ' + gapVal.toFixed(2) + 's</td></tr>';
            }
        }
        h += '</table>';

        // Summary
        h += '<div style="margin-top:6px;font-size:9px;color:#888">';
        h += 'Total: ' + totalDur.toFixed(2) + 's · Tutti: ' + tuttiDur.toFixed(2) + 's (' + tuttiPct + '%) · Entry span: ' + entrySpan.toFixed(2) + 's';
        h += '</div>';

        document.getElementById('scResults').innerHTML = h;
    },

    setupPanelDrag() {
        const panel = this.propertyPanel;
        if (!panel) return;
        let dragging = false;
        let startX, startY, startLeft, startTop;

        // Select-all on focus for number inputs (covers click, tab, and programmatic focus)
        panel.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
                setTimeout(() => e.target.select(), 0);
            }
        });

        // Explicit Tab handling — manually cycle focus between panel inputs
        panel.addEventListener('keydown', (e) => {
            if (e.key !== 'Tab') return;
            const focusable = Array.from(panel.querySelectorAll('input, select'));
            if (focusable.length < 2) return;
            const idx = focusable.indexOf(document.activeElement);
            if (idx < 0) return;
            e.preventDefault();
            e.stopPropagation();
            const next = e.shiftKey
                ? (idx - 1 + focusable.length) % focusable.length
                : (idx + 1) % focusable.length;
            // Store target so it survives any panel rebuild triggered by change-on-blur
            const targetField = focusable[next].dataset.field
                || focusable[next].dataset.propKey
                || focusable[next].dataset.propOldkey || null;
            this._pendingTabTarget = targetField;
            focusable[next].focus();
            if (focusable[next].select) focusable[next].select();
            setTimeout(() => { this._pendingTabTarget = null; }, 50);
        });

        panel.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (e.target.tagName !== 'H4' && e.target.tagName !== 'H5' && e.target !== panel) return;
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = panel.offsetLeft;
            startTop = panel.offsetTop;
            panel.querySelector('h4').style.cursor = 'grabbing';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const newTop = Math.max(40, startTop + e.clientY - startY);
            panel.style.left = (startLeft + e.clientX - startX) + 'px';
            panel.style.top = newTop + 'px';
            panel.style.maxHeight = (window.innerHeight - newTop - 10) + 'px';
        });

        window.addEventListener('mouseup', () => {
            if (dragging) {
                dragging = false;
                const h4 = panel.querySelector('h4');
                if (h4) h4.style.cursor = 'grab';
                this.panelUserPos = { left: panel.style.left, top: panel.style.top };
                try { localStorage.setItem('composerPanelPos', JSON.stringify(this.panelUserPos)); } catch(e) {}
            }
        });
    },

    ppRow(label, type, field, value, attrs, options) {
        let input;
        if (type === 'select') {
            const opts = (options || []).map(o => {
                const [val, display] = Array.isArray(o) ? o : [o, o];
                return '<option value="' + val + '"' + (val == value ? ' selected' : '') + '>' + display + '</option>';
            }).join('');
            input = '<select data-field="' + field + '">' + opts + '</select>';
        } else if (type === 'color') {
            input = '<input type="color" data-field="' + field + '" value="' + value + '" />';
        } else {
            input = '<input type="' + type + '" data-field="' + field + '" value="' + value + '" ' + (attrs || '') + ' />';
        }
        return '<div class="pp-row"><label>' + label + '</label>' + input + '</div>';
    },

    ppColorRow(field, currentValue) {
        let html = '<div class="pp-color-row"><label>Color</label>';
        this.COLOR_PALETTE.forEach(c => {
            const sel = c.hex === currentValue ? 'border-color:#333;box-shadow:0 0 0 1px #333' : '';
            html += '<span class="pp-color-preset" data-preset-color="' + c.hex + '" style="background:' + c.hex + ';' + sel + '" title="' + c.name + '"></span>';
        });
        html += '<input type="color" data-field="' + field + '" value="' + (currentValue || '#4A90D9') + '" style="width:30px;height:20px;padding:0;border:1px solid #ccc;cursor:pointer;flex-shrink:0" />';
        html += '</div>';
        return html;
    },

    ppAuditionPads(player, instrumentKey, idPrefix) {
        if (!InstrumentRegistry.isPerc(instrumentKey)) return '';
        const arts = InstrumentRegistry.getArticulations(instrumentKey);
        if (arts.length === 0) return '';
        const routing = InstrumentRegistry.getRouting(player, instrumentKey);
        if (!routing) return '';
        let h = '<details class="pp-audition" style="margin:4px 0 6px 0;font-size:10px">';
        h += '<summary style="cursor:pointer;color:#90CAF9;user-select:none">&#9654; Audition pads</summary>';
        h += '<div style="display:flex;flex-wrap:wrap;gap:3px;padding:4px 0">';
        arts.forEach(a => {
            h += '<button class="pp-audition-pad" data-aud-port="' + routing.port + '" data-aud-ch="' + routing.channel + '" data-aud-midi="' + a.midi + '" ';
            h += 'style="font-size:9px;padding:3px 6px;background:#2a2a2a;color:#ccc;border:1px solid #555;border-radius:3px;cursor:pointer;white-space:nowrap" ';
            h += 'title="MIDI ' + a.midi + '">' + a.label + '</button>';
        });
        h += '</div></details>';
        return h;
    },

    _renderSourceSlot(handLabel, chordMarker, handKey, isPerc, instrumentKey, allSets) {
        const source = chordMarker[handKey] || {};
        const mode = source.mode || 'fixed';
        const fixedSel = mode === 'fixed' ? 'background:#4A90D9;color:#fff;' : 'background:#444;color:#888;';
        const setSel = mode === 'set' ? 'background:#FB8C00;color:#fff;' : 'background:#444;color:#888;';
        let h = '<div style="margin-top:4px;border-top:1px solid #333;padding-top:3px">';
        h += '<div class="pp-row"><label>Hand ' + handLabel + '</label>';
        h += '<button class="pp-source-mode" data-hand="' + handKey + '" data-mode="fixed" style="font-size:9px;padding:1px 6px;border:1px solid #555;border-radius:3px 0 0 3px;cursor:pointer;' + fixedSel + '">Fixed</button>';
        h += '<button class="pp-source-mode" data-hand="' + handKey + '" data-mode="set" style="font-size:9px;padding:1px 6px;border:1px solid #555;border-left:none;border-radius:0 3px 3px 0;cursor:pointer;' + setSel + '">Set</button>';
        h += '</div>';

        if (mode === 'fixed') {
            if (isPerc) {
                // Percussion fixed: articulation dropdown
                const arts = InstrumentRegistry.getArticulations(instrumentKey);
                const curMidi = (source.midis && source.midis[0]) || '';
                h += '<div class="pp-row"><label></label><select class="pp-source-fixed-perc" data-hand="' + handKey + '" style="font-size:10px;flex:1">';
                h += '<option value="">— Articulation —</option>';
                arts.forEach(a => {
                    const sel = String(a.midi) === String(curMidi) ? ' selected' : '';
                    h += '<option value="' + a.midi + '"' + sel + '>' + a.label + '</option>';
                });
                h += '</select></div>';
            } else {
                // Piano fixed: show current value + pitch input + Assign button
                const midisText = source.midis && source.midis.length ? source.midis.join(', ') : '';
                const labelText = source.label || (midisText || 'empty');
                h += '<div class="pp-row"><label></label><span style="font-size:10px;color:#ccc;flex:1">' + labelText + '</span>';
                h += '<button class="pp-source-assign" data-hand="' + handKey + '" style="font-size:9px;padding:1px 6px;margin-left:4px;background:#2a6faa;color:#fff;border:1px solid #3a7fba;border-radius:3px;cursor:pointer">Assign</button></div>';
                h += '<div class="pp-row"><label></label><input class="pp-source-fixed-pitch" data-hand="' + handKey + '" type="number" min="0" max="127" step="1" placeholder="MIDI #" value="' + midisText + '" style="font-size:10px;width:60px;margin-right:4px"> <span style="font-size:9px;color:#888">single pitch</span></div>';
            }
        } else {
            // Set mode: set dropdown + strategy
            const curSetId = source.setId || '';
            h += '<div class="pp-row"><label></label><select class="pp-source-set" data-hand="' + handKey + '" style="font-size:10px;flex:1">';
            h += '<option value="">— Select Set —</option>';
            allSets.forEach(s => {
                const sel = s.id === curSetId ? ' selected' : '';
                h += '<option value="' + s.id + '"' + sel + '>' + s.name + ' (' + s.items.length + ')</option>';
            });
            h += '</select></div>';
            // Strategy dropdown
            const curStrategy = source.strategy || 'random';
            h += '<div class="pp-row"><label></label><select class="pp-source-strategy" data-hand="' + handKey + '" style="font-size:10px;flex:1">';
            h += '<option value="random"' + (curStrategy === 'random' ? ' selected' : '') + '>Random</option>';
            h += '<option value="roundRobin"' + (curStrategy === 'roundRobin' ? ' selected' : '') + '>Round Robin</option>';
            h += '<option value="noRepeat"' + (curStrategy === 'noRepeat' ? ' selected' : '') + '>No Repeat</option>';
            h += '</select></div>';
        }
        h += '</div>';
        return h;
    },

    async auditionSetItemForPlayer(playerKey, item) {
        // Ensure MIDI outputs are initialized
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { console.warn('[Audition] No MIDI access'); return; }
        }

        const PLAYER_DEFAULTS = { piano1: { port: 'Piano1', channel: 1 }, piano2: { port: 'Piano2', channel: 1 }, perc1: { port: 'Perc1-A', channel: 1 }, perc2: { port: 'Perc2-A', channel: 1 } };
        const instKey = item.instrument || '';
        const routing = (instKey ? InstrumentRegistry.getRouting(playerKey, instKey) : null) || PLAYER_DEFAULTS[playerKey] || { port: 'Piano1', channel: 1 };

        if (item.type === 'cellRef' && item.cellId) {
            const cellDef = (this.databases.cells || []).find(c => c.id === item.cellId);
            if (!cellDef || !cellDef.items || cellDef.items.length === 0) return;
            const cellRouting = (cellDef.instrument ? InstrumentRegistry.getRouting(playerKey, cellDef.instrument) : null) || routing;
            const dur = cellDef.defaultDurationMs || 1000;
            const events = expandCellRef(cellDef, 0, dur, null);
            if (events.length === 0) return;
            // Direct scheduling (same pattern as PK's working auditionSetItem)
            const portName = (cellRouting.port || '').toLowerCase();
            const output = this._zoneMidiOutputs[portName];
            if (!output) { console.warn('[Audition] Port not found:', cellRouting.port); return; }
            const ch = (cellRouting.channel || 1) - 1;
            events.forEach(evt => {
                // Per-event routing for multi-instrument cells
                let evtOutput = output, evtCh = ch;
                if (evt._instrument) {
                    const evtRouting = InstrumentRegistry.getRouting(playerKey, evt._instrument) || cellRouting;
                    const evtPort = this._zoneMidiOutputs[(evtRouting.port || '').toLowerCase()];
                    if (evtPort) { evtOutput = evtPort; evtCh = (evtRouting.channel || 1) - 1; }
                }
                setTimeout(() => {
                    evt.notes.forEach(m => evtOutput.send([0x90 | evtCh, m, evt.velocity]));
                    const noteDur = (evt.durations && evt.durations[0]) || 200;
                    setTimeout(() => evt.notes.forEach(m => evtOutput.send([0x80 | evtCh, m, 0])), noteDur);
                }, evt.onsetMs);
            });
        } else {
            // Single note or chord
            const midis = item.midis || (item.midi ? [item.midi] : []);
            if (midis.length === 0) return;
            const portName = (routing.port || '').toLowerCase();
            const output = this._zoneMidiOutputs[portName];
            if (!output) { console.warn('[Audition] Port not found:', routing.port); return; }
            const ch = (routing.channel || 1) - 1;
            const vel = item.velocity || 100;
            const dur = item.durationMs || 300;
            midis.forEach(m => {
                output.send([0x90 | ch, m, vel]);
                setTimeout(() => output.send([0x80 | ch, m, 0]), dur);
            });
        }
    },

    async auditionPanelCell(cellId, playerKey, durationMs, behaviorOverrides) {
        if (!cellId) return;
        const cellDef = (this.databases.cells || []).find(c => c.id === cellId);
        if (!cellDef || !cellDef.items || cellDef.items.length === 0) return;
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { console.warn('[Audition] No MIDI access'); return; }
        }
        const dur = Math.max(100, durationMs || cellDef.defaultDurationMs || 1000);
        const events = expandCellRef(cellDef, 0, dur, behaviorOverrides);
        if (events.length === 0) return;
        const PLAYER_DEFAULTS = { piano1: { port: 'Piano1', channel: 1 }, piano2: { port: 'Piano2', channel: 1 }, perc1: { port: 'Perc1-A', channel: 1 }, perc2: { port: 'Perc2-A', channel: 1 } };
        const baseRouting = (cellDef.instrument ? InstrumentRegistry.getRouting(playerKey, cellDef.instrument) : null) || PLAYER_DEFAULTS[playerKey] || { port: 'Piano1', channel: 1 };
        const outs = this._zoneMidiOutputs;
        events.forEach(evt => {
            const instKey = evt._instrument || cellDef.instrument || null;
            const evtRouting = (instKey ? InstrumentRegistry.getRouting(playerKey, instKey) : null) || baseRouting;
            const portName = (evtRouting.port || '').toLowerCase();
            const output = outs[portName];
            if (!output) return;
            const ch = (evtRouting.channel || 1) - 1;
            const delay = evt.onsetMs;
            if (evt._cc != null) {
                setTimeout(() => { output.send([0xB0 | ch, evt._cc, evt._ccValue != null ? evt._ccValue : 0]); }, delay);
                return;
            }
            setTimeout(() => {
                evt.notes.forEach(m => output.send([0x90 | ch, m, evt.velocity]));
                const noteDur = (evt.durations && evt.durations[0]) || 200;
                setTimeout(() => evt.notes.forEach(m => output.send([0x80 | ch, m, 0])), noteDur);
            }, delay);
        });
    },

    async auditionNote(portName, channel, midi, velocity, durationMs) {
        if (!this._zoneMidiInited) {
            try {
                const access = await navigator.requestMIDIAccess();
                access.outputs.forEach((output) => {
                    this._zoneMidiOutputs[output.name.toLowerCase()] = output;
                });
                this._zoneMidiInited = true;
            } catch (e) { console.warn('[Audition] No MIDI access'); return; }
        }
        const output = this._zoneMidiOutputs[(portName || '').toLowerCase()];
        if (!output) { console.warn('[Audition] Port not found:', portName); return; }
        const ch = (channel || 1) - 1;
        const vel = Math.max(1, Math.min(127, velocity || 115));
        const dur = durationMs || 200;
        output.send([0xB0 | ch, 7, 127]);   // auditions always at full level (CC7 residue guard)
        output.send([0x90 | ch, midi, vel]);
        setTimeout(() => { output.send([0x80 | ch, midi, 0]); }, dur);
    },

    applyPanelField(field, value, inputType) {
        const obj = this.selectedObject;
        if (!obj) return;
        this.pushUndoStateDebounced(300);

        if (field.startsWith('node.')) {
            const node = obj.nodes[this.selectedNodeIdx];
            if (!node) return;
            const key = field.split('.')[1];
            if (key === 'time') {
                const dur = obj.endSeconds - obj.startSeconds;
                if (dur > 0) node.pos = Math.max(0, Math.min(1, (parseFloat(value) - obj.startSeconds) / dur));
            } else if (key === 'y') {
                node.y = parseFloat(value);
            } else if (key === 'smooth') {
                node.smooth = parseFloat(value);
            } else if (key === 'thickness') {
                node.thickness = Math.max(1, Math.min(10, parseInt(value) || 1));
            }
        } else if (field.startsWith('seg.')) {
            const segIdx = Math.min(this.selectedNodeIdx, obj.segments.length - 1);
            const seg = obj.segments[segIdx];
            if (!seg) return;
            const key = field.split('.')[1];
            if (key === 'model') seg.model = value;
            else if (key === 'slope') seg.slope = parseFloat(value);
        } else if (field === 'grainEnv' && obj.type === 'waveCurve') {
            if (!value) return;
            // As-if-generated envelope swap: rebuild nodes/segments from the Roads
            // catalog anchored at the current peak time, level, and sounding span.
            const span = obj.endSeconds - obj.startSeconds;
            let aIdx = 0, aY = -Infinity;
            obj.nodes.forEach((n, i) => { if (n.y > aY) { aY = n.y; aIdx = i; } });
            const tPeak = obj.startSeconds + obj.nodes[aIdx].pos * span;
            const env = grainEnvelope(value, { dur: span, lv: aY / 10, ratio: 4, release: 0.06 });
            obj.startSeconds = Math.max(0, Math.round((tPeak - env.pre) * 100) / 100);
            obj.endSeconds = Math.round((tPeak + env.post) * 100) / 100;
            obj.nodes = env.nodes;
            obj.segments = env.segments;
            obj.envShape = value;
            this.selectedNodeIdx = -1;
            this.renderWaveCurve(obj);
            this.refreshPanelValues();
            this.markDirty();
            return;
        } else if (field.startsWith('ostinatoParams.') && obj.type === 'zone') {
            if (!obj.ostinatoParams) obj.ostinatoParams = { smooth: 0.7, speed: 1.0, stretch: 1.5 };
            const key = field.split('.')[1];
            const pv = parseFloat(value);
            obj.ostinatoParams[key] = isNaN(pv) ? null : pv;
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field.startsWith('accelDecelParams.') && obj.type === 'zone') {
            if (!obj.accelDecelParams) obj.accelDecelParams = { fastRate: 100, slowRate: 500, humanize: 15, velStart: 80, velEnd: 110, volumeMode: 'linear' };
            const key = field.split('.')[1];
            if (key === 'volumeMode') {
                obj.accelDecelParams[key] = value;
            } else {
                const pv = parseFloat(value);
                obj.accelDecelParams[key] = isNaN(pv) ? null : pv;
            }
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field === 'flockingNumPlayers' && obj.type === 'zone') {
            const n = Math.max(2, Math.min(8, parseInt(value, 10) || 4));
            if (!obj.flockingPlayers) obj.flockingPlayers = [];
            // Grow or shrink array to match
            while (obj.flockingPlayers.length < n) {
                obj.flockingPlayers.push({ player: '', instrument: '', setId: '' });
            }
            while (obj.flockingPlayers.length > n) {
                obj.flockingPlayers.pop();
            }
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field.startsWith('flockingParams.') && obj.type === 'zone') {
            if (!obj.flockingParams) obj.flockingParams = { anticipationProb: 0.3, cascadeProb: 0.5 };
            const key = field.split('.')[1];
            obj.flockingParams[key] = parseFloat(value);
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field === 'threeBodyNumPlayers' && obj.type === 'zone') {

            if (!obj.threeBodyPlayers) obj.threeBodyPlayers = [];
            while (obj.threeBodyPlayers.length < n) {
                obj.threeBodyPlayers.push({ player: '', instrument: '', setId: '' });
            }
            while (obj.threeBodyPlayers.length > n) {
                obj.threeBodyPlayers.pop();
            }
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field.startsWith('threeBodyParams.') && obj.type === 'zone') {
            if (!obj.threeBodyParams) obj.threeBodyParams = { anticipationAccuracy: 0.5, density: 5, separationMin: 25 };
            const key = field.split('.')[1];
            obj.threeBodyParams[key] = parseFloat(value);
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field === 'satpNumPlayers' && obj.type === 'zone') {
            const n = Math.max(2, Math.min(4, parseInt(value, 10) || 2));
            if (!obj.seeAllThePeoplePlayers) obj.seeAllThePeoplePlayers = [];
            while (obj.seeAllThePeoplePlayers.length < n) {
                obj.seeAllThePeoplePlayers.push({ player: '', setId: '' });
            }
            while (obj.seeAllThePeoplePlayers.length > n) {
                obj.seeAllThePeoplePlayers.pop();
            }
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
        } else if (field === 'cm.time' && obj.type === 'zone') {
            const cms = obj.chordMarkers || [];
            const idx = this._selectedChordMarkerIdx;
            if (idx != null && idx >= 0 && cms[idx]) {
                cms[idx].time = Math.max(obj.startTime, Math.min(obj.endTime, parseFloat(value)));
                if (obj.midiSnippet) obj.midiSnippet._stale = true;
                this.renderZone(obj);
                this.showPropertyPanel();
                this.markDirty();
                return;
            }
        } else if (field === 'rm.time' && obj.type === 'zone') {
            const rms = obj.ratioMarkers || [];
            const idx = this._selectedRatioMarkerIdx;
            if (idx != null && idx >= 0 && rms[idx]) {
                rms[idx].time = Math.max(obj.startTime, Math.min(obj.endTime, parseFloat(value)));
                if (obj.midiSnippet) obj.midiSnippet._stale = true;
                this.renderZone(obj);
                this.showPropertyPanel();
                this.markDirty();
                return;
            }
        } else if ((field === 'zoneFunction' || field === 'midiModel' || field === 'materialType' || field === 'cellId') && obj.type === 'zone') {
            obj[field] = value;
            if (field === 'zoneFunction' && value !== 'midiPreview') {
                obj.midiModel = '';
            }
            if (field === 'materialType' && value === 'cell') {
                delete obj.cellSpeedStart; delete obj.cellSpeedEnd; delete obj.cellSpeedCurve;
                delete obj.cellVolStart; delete obj.cellVolEnd; delete obj.cellVolCurve;
            }
            if (field === 'cellId') {
                delete obj.cellSpeedStart; delete obj.cellSpeedEnd; delete obj.cellSpeedCurve;
                delete obj.cellVolStart; delete obj.cellVolEnd; delete obj.cellVolCurve;
            }
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
            this.renderZone(obj);
            this.showPropertyPanel();
            this.markDirty();
            return;
        } else if (field === 'curveLayer' && obj.type === 'zone') {
            obj.curveLayer = value === '' ? null : parseInt(value, 10);
            obj.linkedCurveId = null;
            if (obj.midiSnippet) obj.midiSnippet._stale = true;
            this.showPropertyPanel();
            this.markDirty();
            return;
        } else if (field === 'sonifyNote' && obj.type === 'waveCurve') {
            const pv = parseInt(value, 10);
            obj.sonifyNote = isNaN(pv) ? null : Math.max(0, Math.min(127, pv));
        } else if (field === 'motiveName' && obj.type === 'motive') {
            const m = this.motiveData(obj.motiveId);
            if (m) {
                m.name = value;
                this.saveMotive(obj.motiveId);
                this.refreshMotiveSelect();
                this.rerenderMotiveBlocks(obj.motiveId);
            }
        } else if (field === 'layer' && (obj.type === 'waveCurve' || obj.type === 'lineWedge' || obj.type === 'zone' || obj.type === 'marker' || obj.type === 'motive')) {
            const newLayer = parseInt(value);
            if (obj.layer !== newLayer) {
                if (obj._els && obj._els.group) obj._els.group.remove();
                this.elementCache.delete(obj.id);
                obj.layer = newLayer;
                if (obj.type === 'waveCurve') this.renderWaveCurve(obj);
                else if (obj.type === 'lineWedge') this.renderLineWedge(obj);
                else if (obj.type === 'zone') this.renderZone(obj);
                else if (obj.type === 'marker') this.renderMarker(obj);
                else if (obj.type === 'motive') {
                    const techs = this.trackTechniques(newLayer);
                    if (!techs.some(t => t.key === obj.technique)) obj.technique = techs.length ? techs[0].key : '';
                    this.renderMotive(obj);
                }
                this.selectObject(obj);
                return;
            }
        } else {
            if (inputType === 'number') {
                const pv = parseFloat(value);
                // META group shape retimed via the PANEL scales its members too
                // (same affine rule as the edge-node drag) — panel edits were
                // the invisible path in the 2026-08-13 "not resizing" saga
                if ((field === 'startSeconds' || field === 'endSeconds') &&
                    obj.type === 'waveCurve' && obj.groupId && obj.layer === META_LAYER && !isNaN(pv)) {
                    this.scaleGroupTo(obj,
                        field === 'startSeconds' ? pv : obj.startSeconds,
                        field === 'endSeconds' ? pv : obj.endSeconds);
                } else {
                    obj[field] = pv;
                }
            }
            else obj[field] = value;
        }

        // Mark zone MIDI snippet stale if bounds, instrument, or one-shot params changed
        if (obj.type === 'zone' && obj.midiSnippet && (field === 'startTime' || field === 'endTime' || field === 'instrument' || field === 'player' || field === 'oneShotVelocity' || field === 'oneShotDurationMs' || field === 'oneShotArticulation' || field === 'asrVelocity' || field === 'asrArticulation' || field === 'linkedCurveId' || field === 'curveLayer' || field === 'ratioSourceZoneId' || field === 'responseDelayMs' || field === 'jitterMs' || field === 'driftFactor' || field === 'materialType' || field === 'cellId' || field === 'cellDurationMs' || field === 'cellSpeedStart' || field === 'cellSpeedEnd' || field === 'cellSpeedCurve' || field === 'cellVolStart' || field === 'cellVolEnd' || field === 'cellVolCurve')) {
            obj.midiSnippet._stale = true;
        }
        // Auto-populate percussion markers when instrument changes
        if (obj.type === 'zone' && field === 'instrument' && InstrumentRegistry.isPerc(value)) {
            this.autoPopulatePercMarkers(obj);
        }
        // Mark marker one-shot snippet stale if relevant fields change
        if (obj.type === 'marker' && obj.midiSnippet && (field === 'instrument' || field === 'player' || field === 'articulation' || field === 'velocity' || field === 'durationMs' || field === 'time' || field === 'materialType' || field === 'cellId' || field === 'cellDurationMs' || field === 'cellSpeedStart' || field === 'cellSpeedEnd' || field === 'cellSpeedCurve' || field === 'cellVolStart' || field === 'cellVolEnd' || field === 'cellVolCurve')) {
            obj.midiSnippet._stale = true;
        }
        // Mark marker AR snippet stale if relevant fields change
        if (obj.type === 'marker' && obj.midiSnippet && (field === 'inst1Player' || field === 'inst1Instrument' || field === 'inst1Articulation' || field === 'inst1Velocity' || field === 'inst1DurationMs' || field === 'inst2Player' || field === 'inst2Instrument' || field === 'inst2Articulation' || field === 'inst2Velocity' || field === 'inst2DurationMs' || field === 'time' || field.startsWith('inst1Cell') || field.startsWith('inst2Cell') || field === 'inst1MaterialType' || field === 'inst2MaterialType')) {
            obj.midiSnippet._stale = true;
        }
        // Refresh panel when midiFunction, player, instrument, materialType, or cellId changes on marker
        if (obj.type === 'marker' && (field === 'midiFunction' || field === 'player' || field === 'instrument' || field === 'materialType' || field === 'cellId')) {
            if (field === 'instrument') { obj.articulation = ''; obj.notes = []; }
            if (field === 'materialType' && value === 'cell') {
                // Switching to cell mode: clear cell behavior overrides so they inherit from cell
                delete obj.cellSpeedStart; delete obj.cellSpeedEnd; delete obj.cellSpeedCurve;
                delete obj.cellVolStart; delete obj.cellVolEnd; delete obj.cellVolCurve;
            }
            if (field === 'cellId') {
                // Changing cell: clear behavior overrides so they inherit from new cell
                delete obj.cellSpeedStart; delete obj.cellSpeedEnd; delete obj.cellSpeedCurve;
                delete obj.cellVolStart; delete obj.cellVolEnd; delete obj.cellVolCurve;
            }
            this.renderMarker(obj);
            this.showPropertyPanel();
            this.markDirty();
            return;
        }
        // Refresh panel when AR instrument/player/materialType/cellId fields change
        if (obj.type === 'marker' && (field === 'inst1Player' || field === 'inst1Instrument' || field === 'inst2Player' || field === 'inst2Instrument' || field === 'inst1MaterialType' || field === 'inst2MaterialType' || field === 'inst1CellId' || field === 'inst2CellId')) {
            if (field === 'inst1Instrument') { obj.inst1Articulation = ''; obj.inst1Notes = []; }
            if (field === 'inst2Instrument') { obj.inst2Articulation = ''; obj.inst2Notes = []; }
            if (field === 'inst1MaterialType' && value === 'cell') {
                delete obj.inst1CellSpeedStart; delete obj.inst1CellSpeedEnd;
                delete obj.inst1CellVolStart; delete obj.inst1CellVolEnd;
            }
            if (field === 'inst2MaterialType' && value === 'cell') {
                delete obj.inst2CellSpeedStart; delete obj.inst2CellSpeedEnd;
                delete obj.inst2CellVolStart; delete obj.inst2CellVolEnd;
            }
            if (field === 'inst1CellId') {
                delete obj.inst1CellSpeedStart; delete obj.inst1CellSpeedEnd;
                delete obj.inst1CellVolStart; delete obj.inst1CellVolEnd;
            }
            if (field === 'inst2CellId') {
                delete obj.inst2CellSpeedStart; delete obj.inst2CellSpeedEnd;
                delete obj.inst2CellVolStart; delete obj.inst2CellVolEnd;
            }
            this.renderMarker(obj);
            this.showPropertyPanel();
            this.markDirty();
            return;
        }

        if (obj.type === 'waveCurve') this.updateWCRendering(obj);
        else if (obj.type === 'lineWedge') this.updateLWRendering(obj);

    // ========== MARKERS ==========

    // ========== ZONES ==========

    createZone(params) {

    duplicateMarker(srcMarker, opts) {

        clone.midiSnippet = null;

        const offset = (opts && opts.timeOffset != null) ? opts.timeOffset : 0.5;
        clone.time = Math.max(0, clone.time + offset);

    duplicateZone(srcZone, opts) {
        this.pushUndoState();
