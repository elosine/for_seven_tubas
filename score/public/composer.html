                const cmHit = document.createElementNS(svgNS, 'line');
                cmHit.setAttribute('x1', cmx); cmHit.setAttribute('x2', cmx);
                cmHit.setAttribute('y1', ry); cmHit.setAttribute('y2', ry + rh);
                cmHit.setAttribute('stroke', 'transparent');
                cmHit.setAttribute('stroke-width', '10');
                cmHit.style.cursor = 'ew-resize';
                cmHit.style.pointerEvents = 'stroke';
                cmHit.addEventListener('mousedown', (e) => {
                    e.stopPropagation(); e.preventDefault();
                    this.selectObject(zone);
                    this._selectedChordMarkerIdx = i;
                    this.pushUndoState();
                    let hasMoved = false;
                    const onMove = (ev) => {
                        hasMoved = true;
                        let newTime = Math.round(this.clientXToTime(ev.clientX) * 20) / 20;
                        newTime = Math.max(zone.startTime, Math.min(zone.endTime, newTime));
                        cm.time = newTime;
                        if (zone.midiSnippet) zone.midiSnippet._stale = true;
                        this.renderZone(zone);
                        this.refreshPanelValues();
                    };
                    const onUp = () => {
                        window.removeEventListener('mousemove', onMove);
                        window.removeEventListener('mouseup', onUp);
                        if (!hasMoved) this.undoStack.pop();
                        this.showPropertyPanel();
                        this.markDirty();
                    };
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                });

                g.appendChild(cmLine);
                g.appendChild(cmHit);
            });
        }

        // Render ratio markers as orange dashed lines inside imitation zones
        if (zone.midiModel === 'imitation' && zone.ratioMarkers && zone.ratioMarkers.length > 0) {
            zone.ratioMarkers.sort((a, b) => a.time - b.time);
            zone.ratioMarkers.forEach((rm, i) => {
                const rmx = rm.time * this.pixelsPerSecond;
                const rmLine = document.createElementNS(svgNS, 'line');
                rmLine.setAttribute('x1', rmx); rmLine.setAttribute('x2', rmx);
                rmLine.setAttribute('y1', ry); rmLine.setAttribute('y2', ry + rh);
                const isSel = (this._selectedRatioMarkerIdx === i && this.selectedObject && this.selectedObject.id === zone.id);
                rmLine.setAttribute('stroke', isSel ? '#FFD700' : '#FB8C00');
                rmLine.setAttribute('stroke-width', isSel ? '2' : '1.5');
                rmLine.setAttribute('stroke-dasharray', '5,3');
                rmLine.setAttribute('opacity', '0.9');
                rmLine.style.pointerEvents = 'none';

                // Ratio label
                const rmLabel = document.createElementNS(svgNS, 'text');
                rmLabel.setAttribute('x', rmx + 3); rmLabel.setAttribute('y', ry + rh - 4);
                rmLabel.setAttribute('fill', '#FB8C00'); rmLabel.setAttribute('font-size', '9');
                rmLabel.setAttribute('font-family', "'Segoe UI', sans-serif");
                rmLabel.textContent = rm.p + ':' + rm.q;
                rmLabel.style.pointerEvents = 'none';

                const rmHit = document.createElementNS(svgNS, 'line');
                rmHit.setAttribute('x1', rmx); rmHit.setAttribute('x2', rmx);
                rmHit.setAttribute('y1', ry); rmHit.setAttribute('y2', ry + rh);
                rmHit.setAttribute('stroke', 'transparent');
                rmHit.setAttribute('stroke-width', '10');
                rmHit.style.cursor = 'ew-resize';
                rmHit.style.pointerEvents = 'stroke';
                rmHit.addEventListener('mousedown', (e) => {
                    e.stopPropagation(); e.preventDefault();
                    this.selectObject(zone);
                    this._selectedRatioMarkerIdx = i;
                    this.pushUndoState();
                    let hasMoved = false;
                    const onMove = (ev) => {
                        hasMoved = true;
                        let newTime = Math.round(this.clientXToTime(ev.clientX) * 20) / 20;
                        newTime = Math.max(zone.startTime, Math.min(zone.endTime, newTime));
                        rm.time = newTime;
                        if (zone.midiSnippet) zone.midiSnippet._stale = true;
                        this.renderZone(zone);
                        this.refreshPanelValues();
                    };
                    const onUp = () => {
                        window.removeEventListener('mousemove', onMove);
                        window.removeEventListener('mouseup', onUp);
                        if (!hasMoved) this.undoStack.pop();
                        this.showPropertyPanel();
                        this.markDirty();
                    };
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                });

                g.appendChild(rmLine);
                g.appendChild(rmLabel);
                g.appendChild(rmHit);
            });
        }

        cg.appendChild(g);

        this.elementCache.set(zone.id, g);
        zone._els = { group: g, highlight: hl };
        const selIdx = this.selectedObjects.findIndex(o => o.id === zone.id);
        if (selIdx >= 0) {
            this.selectedObjects[selIdx] = zone;
            if (this.selectedObject && this.selectedObject.id === zone.id) this.selectedObject = zone;
            hl.style.display = '';
        }
    },

    // ========== CURVE SONIFICATION (E-series: drawn dB shapes -> note + CC7) ==========
    // A waveCurve with sonifyNote set plays as: noteOn at curve start, CC#7 stream
    // tracing the curve through the measured CC7->dB inverse (probes/cc7_map.json,
    // E0 calibration), noteOff at curve end. Drawn shape = heard dB shape.

    _cc7Map: null,               // normalized [{cc, x}] ascending in x
    _activeCurvePlayback: {},
    _curvePreArm: {},            // curveId -> true once entry CC is sent ahead of noteOn
    _lastCurveTimeSec: null,

    async loadCC7Map() {
        try {
            const m = await (await fetch('/probes/cc7_map.json')).json();
            if (m && m.normalized && m.normalized.length > 2) {
                this._cc7Map = m.normalized.slice().sort((a, b) => a.x - b.x);
                this._cc7Points = m.points.slice().sort((a, b) => a.db - b.db);
                console.log('[CC7 map] loaded:', this._cc7Points.length, 'points, measured span', m.dbSpan,
                    'dB; musical level span', this.levelSpanDb, 'dB');
            }
        } catch (e) { console.warn('[CC7 map] unavailable - falling back to linear CC'); }
    },

    // LEVEL SPAN DIAL (CC7 fine-tune, 2026-08-13): drawn height 0-10 maps across
    // levelSpanDb (NOT the full measured 58 dB — a y=5 curve at -29 dB was the
    // recurring "volume problem"). Target dB = (v-1)*span, inverted through the
    // MEASURED cc->dB points. v=0 stays true silence. Adjustable per ear
    // (Composer.levelSpanDb); S1-era ratio tables assumed 58 - shapes read
    // slightly gentler at narrower spans (recalibrate by ear if it matters).
    levelSpanDb: 40,

    curveValToCC(v) {
        v = Math.max(0, Math.min(1, v));
        if (v <= 0.001) return 0;
        const pts = this._cc7Points;
        if (!pts) return Math.round(v * 127);
        const target = (v - 1) * this.levelSpanDb;   // 0 dB at full height
        if (target <= pts[0].db) return pts[0].cc;
        for (let i = 1; i < pts.length; i++) {
            if (target <= pts[i].db) {
                const a = pts[i - 1], b = pts[i];
                const f = (target - a.db) / Math.max(1e-6, b.db - a.db);
                return Math.round(a.cc + f * (b.cc - a.cc));
            }
        }
        return pts[pts.length - 1].cc;
    },

    evalWaveCurve(wc, t01) {
        const nodes = wc.nodes;
        if (!nodes || nodes.length < 2) return 0;
        t01 = Math.max(0, Math.min(1, t01));
        for (let i = 1; i < nodes.length; i++) {
            if (t01 <= nodes[i].pos || i === nodes.length - 1) {
                const a = nodes[i - 1], b = nodes[i];
                const seg = wc.segments[Math.min(i - 1, wc.segments.length - 1)] || { model: 'bezier', slope: 0 };
                const lt = (t01 - a.pos) / Math.max(1e-6, b.pos - a.pos);
                return this.computeSegY(seg, a.y / 10, b.y / 10, lt);
            }
        }
        return nodes[nodes.length - 1].y / 10;
    },

    curveTechniqueFor(wc) {
        const techs = this.trackTechniques(wc.layer);
        return techs.find(t => t.key === wc.technique) || techs[0] || null;
    },

    tickCurvePlayback(currentTimeSec) {
        if (!this._zoneMidiInited) return;
        const prevTime = this._lastCurveTimeSec;
        this._lastCurveTimeSec = currentTimeSec;
        if (prevTime == null) return;

        this.objects.forEach(wc => {
            if (wc.type !== 'waveCurve' || wc.sonifyNote == null) return;
            const inst = this.trackInstrument(wc.layer);
            if (!inst) return;
            const tech = this.curveTechniqueFor(wc);
            const output = this._zoneMidiOutputs[((tech && tech.port) || inst.port || '').toLowerCase()];
            if (!output) return;
            const ch = ((tech && tech.channel) || 1) - 1;
            const st = this._activeCurvePlayback[wc.id];

            const PREARM_S = 0.15;   // settle CC7/KS before the attack (kills the entry bite)
            // KS mode (composer 2026-08-12): the grain rides a keyswitched SAMPLE
            // (cresc-cut) — latch the KS + set a STATIC level in the pre-arm, no
            // CC7 stream during the grain; noteOff at curve end = the cut.
            // 'ks' = keyswitched sample; 'plain' = captured note (static level,
            // no CC7 stream) — both bypass curve-following
            const ksMode = (wc.sonifyMode === 'ks' && wc.ksNote != null) || wc.sonifyMode === 'plain';
            const ksArm = () => {
                if (wc.sonifyMode === 'ks' && wc.ksNote != null) {
                    output.send([0x90 | ch, wc.ksNote, 100]);   // latch the keyswitch
                    output.send([0x80 | ch, wc.ksNote, 0]);
                }
                // plain (captured) notes replay exactly as monitored: full CC7,
                // dynamics from the played velocity — not the level-curve map
                output.send([0xB0 | ch, 7, wc.sonifyMode === 'plain' ? 127
                    : this.curveValToCC(Math.max(...wc.nodes.map(n => n.y)) / 10)]);
            };
            // solo gate: un-soloed parts take the outside path (clean noteOff)
            const inside = this.isPartAudible(wc.layer)
                && currentTimeSec >= wc.startSeconds && currentTimeSec <= wc.endSeconds;
            if (!inside) {
                if (st) {
                    output.send([0x80 | ch, st.note, 0]);
                    delete this._activeCurvePlayback[wc.id];
                }
                if (this.isPartAudible(wc.layer) && currentTimeSec >= wc.startSeconds - PREARM_S && currentTimeSec < wc.startSeconds) {
                    if (!this._curvePreArm[wc.id]) {
                        if (tech && tech.cc0 != null) output.send([0xB0 | ch, 0, tech.cc0]);
                        if (ksMode) ksArm();
                        else output.send([0xB0 | ch, 7, this.curveValToCC(this.evalWaveCurve(wc, 0))]);
                        this._curvePreArm[wc.id] = true;
                    }
                } else {
                    delete this._curvePreArm[wc.id];
                }
                return;
            }
            const t01 = (currentTimeSec - wc.startSeconds) / Math.max(1e-6, wc.endSeconds - wc.startSeconds);
            const cc = ksMode ? null : this.curveValToCC(this.evalWaveCurve(wc, t01));
            if (!st) {
                if (!this._curvePreArm[wc.id]) {   // scrubbed in mid-curve: no pre-arm happened
                    if (tech && tech.cc0 != null) output.send([0xB0 | ch, 0, tech.cc0]);
                    if (ksMode) ksArm();
                    else output.send([0xB0 | ch, 7, cc]);
                }
                output.send([0x90 | ch, wc.sonifyNote,
                    (wc.sonifyMode === 'plain' && wc.recVel != null) ? wc.recVel : 100]);
                delete this._curvePreArm[wc.id];
                this._activeCurvePlayback[wc.id] = { note: wc.sonifyNote, lastCC: cc, lastSend: performance.now() };
                return;
            }
            const now = performance.now();
            if (!ksMode && cc !== st.lastCC && now - st.lastSend >= 25) {
                output.send([0xB0 | ch, 7, cc]);
                st.lastCC = cc; st.lastSend = now;
            }
        });
    },

    flushCurvePlayback() {
        for (const [id, st] of Object.entries(this._activeCurvePlayback)) {
            const wc = this.objects.find(o => o.id === id);
            if (wc) {
                const inst = this.trackInstrument(wc.layer);
                const tech = this.curveTechniqueFor(wc);
                const output = inst && this._zoneMidiOutputs[((tech && tech.port) || inst.port || '').toLowerCase()];
                const ch = ((tech && tech.channel) || 1) - 1;
                if (output) { output.send([0x80 | ch, st.note, 0]); output.send([0xB0 | ch, 7, 127]); }
            }
        }
        this._activeCurvePlayback = {};
        this._curvePreArm = {};
        // THE CC7 RESIDUE CURE (composer 2026-08-13): swell tails leave CC7 near
        // zero on every channel they touched; UVI keeps that channel state across
        // patch changes ("tracks very quiet"). Every STOP now sweeps CC7=127 (+
        // all-notes-off) across the entire technique map, not just active grains.
        this.resetCC7All();
    },

    // Full-rig CC7 reset: every known (port, channel) in the instrument map gets
    // all-notes-off + CC7=127. Wired to the stop-flush and the CC7 Reset button.
    resetCC7All() {
        if (!this._zoneMidiOutputs) return 0;
        const sent = new Set();
        TRACKS.forEach(t => {
            const inst = typeof INSTRUMENTS !== 'undefined' && INSTRUMENTS[t.instKey];
            if (!inst) return;
            (inst.techniques || []).forEach(tech => {
                const portName = (tech.port || inst.port || '').toLowerCase();
                const out = this._zoneMidiOutputs[portName];
                const ch = (tech.channel || 1) - 1;
                const key = portName + ':' + ch;
                if (!out || sent.has(key)) return;
                sent.add(key);
                out.send([0xB0 | ch, 123, 0]);   // all notes off
                out.send([0xB0 | ch, 7, 127]);   // channel volume to unity
                if (tech.cc0 != null) out.send([0xB0 | ch, 0, tech.cc0]);   // sub-patch default (ISSUES I2)
            });
        });
        return sent.size;
    },

    // ========== MOTIVE BLOCKS (linked references into the motive library) ==========
    // Identity model (approved 2026-08-09): a block = {motiveId, layer, startTime,
    // technique}. Note data lives ONLY in the library (sandbox/motives/*.json) — editing
    // notes in any linked block edits the library motive for all of them; Unlink forks
    // a new library file. Pitch axis: fixed per-instrument range (a-1).

    _motiveCache: {},            // file -> motive JSON (events kept sorted by .on)
    _activeMotivePlayback: {},
    _lastMotiveTimeSec: null,

    async loadMotiveLibrary() {
        try {
            const list = await (await fetch('/api/motives')).json();
            for (const item of list) {
                try {
                    const m = await (await fetch('/api/motives/' + encodeURIComponent(item.file))).json();
                    (m.events || []).sort((a, b) => a.on - b.on);
                    this._motiveCache[item.file] = m;
                } catch (e) { console.warn('Motive load failed:', item.file, e); }
            }
            this.refreshMotiveSelect();
            this.renderAll();
        } catch (e) { console.warn('Motive library unavailable:', e); }
    },

    refreshMotiveSelect() {
        const sel = document.getElementById('motiveSelect');
        if (!sel) return;
        const cur = sel.value;
        sel.innerHTML = '<option value="">— motives —</option>';
        for (const [file, m] of Object.entries(this._motiveCache)) {
            const o = document.createElement('option');
            o.value = file; o.textContent = m.name || file;
            sel.appendChild(o);
        }
        sel.value = cur;
    },

    motiveData(file) { return this._motiveCache[file] || null; },

    motiveDurationSec(file) {
        const m = this.motiveData(file);
        if (!m || !m.events || !m.events.length) return 1;
        return Math.max(0.5, Math.max(...m.events.map(e => e.off)) / 1000);
    },

    async saveMotive(file) {
        const m = this._motiveCache[file];
        if (!m) return;
        try {
            await fetch('/api/motives/' + encodeURIComponent(file), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(m)
            });
        } catch (e) { console.error('Motive save failed:', file, e); }
    },

    trackInstrument(laneIdx) {
        const t = TRACKS[laneIdx];
        return (t && typeof INSTRUMENTS !== 'undefined' && INSTRUMENTS[t.instKey]) || null;
    },

    trackRange(laneIdx) {
        const inst = this.trackInstrument(laneIdx);
        return inst ? [inst.rangeLow, inst.rangeHigh] : [21, 108];
    },

    trackTechniques(laneIdx) {
        const inst = this.trackInstrument(laneIdx);
        return inst ? inst.techniques : [];
    },

    // Fixed per-instrument pitch axis (a-1): a note's height means the same thing in
    // every block on the track.
    pitchToY(laneIdx, note, dims) {
        const [lo, hi] = this.trackRange(laneIdx);
        const clamped = Math.max(lo, Math.min(hi, note));
        return dims.top + ((hi - clamped) / Math.max(1, hi - lo)) * dims.height;
    },

    createMotiveBlock(file, params) {
        const m = this.motiveData(file);
        if (!m) return null;
        this.pushUndoState();
        // Default track: the motive's source instrument, if it maps to one
        let layer = params && params.layer != null ? params.layer : this.activeLane;
        if (!(params && params.layer != null) && m.instrument) {
            const idx = TRACKS.findIndex(t => t.instKey === m.instrument);
            if (idx >= 0) layer = idx;
        }
        const techs = this.trackTechniques(layer);
        let technique = (params && params.technique) || m.technique || '';
        if (!techs.some(t => t.key === technique)) technique = techs.length ? techs[0].key : '';
        const mo = {
            id: this.generateId('mo'),
            type: 'motive',
            motiveId: file,
            layer,
            startTime: (params && params.startTime != null) ? params.startTime : Math.max(0, this.getTimeAtPlayhead()),
            technique,
            color: (params && params.color) || '#7B4FA0',
            opacity: (params && params.opacity != null) ? params.opacity : 0.15,
            performanceNotes: '',
            properties: {}
        };
        this.objects.push(mo);
        this.renderMotive(mo);
        this.selectObject(mo);
        this.markDirty();
        return mo;
    },

    duplicateMotive(src, opts) {
        this.pushUndoState();
        const stripEls = (k, v) => k === '_els' ? undefined : v;
        const clone = JSON.parse(JSON.stringify(src, stripEls));
        clone.id = this.generateId('mo');   // same motiveId → a linked instance
        delete clone._els;
        const offset = (opts && opts.timeOffset != null) ? opts.timeOffset : this.motiveDurationSec(src.motiveId);
        clone.startTime = Math.max(0, clone.startTime + offset);
        this.objects.push(clone);
        this.renderMotive(clone);
        this.rerenderMotiveBlocks(clone.motiveId);   // link badges update
        this.selectObject(clone);
        this.markDirty();
        return clone;
    },

    async forkMotive(mo) {
        const m = this.motiveData(mo.motiveId);
        if (!m) return;
        const copy = JSON.parse(JSON.stringify(m));
        copy.name = (m.name || mo.motiveId) + ' (fork)';
        copy.created = new Date().toISOString();
        try {
            const r = await fetch('/api/motives', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(copy)
            });
            const { file } = await r.json();
            if (!file) return;
            this._motiveCache[file] = copy;
            this.pushUndoState();
            const oldId = mo.motiveId;
            mo.motiveId = file;
            this.refreshMotiveSelect();
            this.renderMotive(mo);
            this.rerenderMotiveBlocks(oldId);
            this.showPropertyPanel();
            this.markDirty();
        } catch (e) { console.error('Fork failed:', e); }
    },

    rerenderMotiveBlocks(file) {
        this.objects.forEach(o => { if (o.type === 'motive' && o.motiveId === file) this.renderMotive(o); });
    },

    _restoreMotives(restored) {
        if (!restored) return;
        for (const [file, m] of Object.entries(restored)) {
            if (JSON.stringify(this._motiveCache[file]) !== JSON.stringify(m)) {
                this._motiveCache[file] = m;
                this.saveMotive(file);
            }
        }
    },

    renderMotive(mo) {
        if (mo._els && mo._els.group && typeof mo._els.group.remove === 'function') mo._els.group.remove();

        const svgNS = 'http://www.w3.org/2000/svg';
        const laneIdx = mo.layer || 0;
        const cg = this.contentGroups[laneIdx];
        if (!cg) return;

        const m = this.motiveData(mo.motiveId);
        const dims = this.getLaneDims(laneIdx);
        const x = mo.startTime * this.pixelsPerSecond;
        const durSec = this.motiveDurationSec(mo.motiveId);
        const w = Math.max(12, durSec * this.pixelsPerSecond);
        const ry = dims.top, rh = dims.height;

        const g = document.createElementNS(svgNS, 'g');
        g.setAttribute('class', 'composerObject');
        g.setAttribute('data-id', mo.id);

        const hl = document.createElementNS(svgNS, 'rect');
        hl.setAttribute('x', x - 2); hl.setAttribute('y', ry - 2);
        hl.setAttribute('width', w + 4); hl.setAttribute('height', rh + 4);
        hl.setAttribute('fill', 'none'); hl.setAttribute('stroke', '#FFD700');
        hl.setAttribute('stroke-width', '3'); hl.setAttribute('rx', '4');
        hl.style.display = 'none'; hl.style.pointerEvents = 'none';
        g.appendChild(hl);

        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', ry);
        rect.setAttribute('width', w); rect.setAttribute('height', rh);
        rect.setAttribute('fill', mo.color); rect.setAttribute('fill-opacity', String(mo.opacity));
        rect.setAttribute('stroke', mo.color); rect.setAttribute('stroke-width', '1.5');
        rect.setAttribute('stroke-opacity', '0.8'); rect.setAttribute('rx', '3');
        rect.style.pointerEvents = 'none';
        g.appendChild(rect);

        const label = document.createElementNS(svgNS, 'text');
        const linkedCount = this.objects.filter(o => o.type === 'motive' && o.motiveId === mo.motiveId).length;
        label.setAttribute('x', x + 6); label.setAttribute('y', ry + 13);
        label.setAttribute('fill', '#5A3080'); label.setAttribute('font-size', '10');
        label.setAttribute('font-family', "'Segoe UI', sans-serif");
        label.textContent = (m ? (m.name || mo.motiveId) : mo.motiveId + ' (loading…)') +
            (linkedCount > 1 ? '  ∞×' + linkedCount : '');
        label.style.pointerEvents = 'none';
        g.appendChild(label);

        // Body hit (select/drag) — sits under the note hit strips
        const bodyHit = document.createElementNS(svgNS, 'rect');
        bodyHit.setAttribute('x', x); bodyHit.setAttribute('y', ry);
        bodyHit.setAttribute('width', w); bodyHit.setAttribute('height', rh);
        bodyHit.setAttribute('fill', 'transparent');
        bodyHit.style.cursor = 'grab';
        g.appendChild(bodyHit);

        // Note lines + per-note hit strips (in-place editing, b-1)
        if (m && m.events) {
            for (let i = 0; i < m.events.length; i++) {
                const ev = m.events[i];
                const nx = x + (ev.on / 1000) * this.pixelsPerSecond;
                const nw = Math.max(2, ((ev.off - ev.on) / 1000) * this.pixelsPerSecond);
                const ny = this.pitchToY(laneIdx, ev.note, dims);
                const line = document.createElementNS(svgNS, 'rect');
                line.setAttribute('x', nx); line.setAttribute('y', ny - 1.25);
                line.setAttribute('width', nw); line.setAttribute('height', 2.5);
                line.setAttribute('fill', '#3A1F55'); line.setAttribute('rx', '1');
                line.style.pointerEvents = 'none';
                g.appendChild(line);
                const nHit = document.createElementNS(svgNS, 'rect');
                nHit.setAttribute('x', nx - 1); nHit.setAttribute('y', ny - 4.5);
                nHit.setAttribute('width', nw + 2); nHit.setAttribute('height', 9);
                nHit.setAttribute('fill', 'transparent');
                nHit.style.cursor = 'ns-resize';
                nHit.addEventListener('mousedown', (e) => {
                    e.stopPropagation(); e.preventDefault();
                    this.startMotiveNoteDrag(mo, i, e);
                });
                g.appendChild(nHit);
            }
        }

        bodyHit.addEventListener('mousedown', (e) => {
            e.stopPropagation(); e.preventDefault();
            if (e.shiftKey) { this.selectObject(mo, { additive: true }); return; }
            if (this.selectedObjects.length > 1 && this.selectedObjects.includes(mo)) {
                this.startGroupDrag(mo, e);
                return;
            }
            if (e.ctrlKey) {
                const clone = this.duplicateMotive(mo, { timeOffset: 0 });
                this.startMotiveBodyDrag(clone, e);
                return;
            }
            this.selectObject(mo);
            this.startMotiveBodyDrag(mo, e);
        });

        cg.appendChild(g);
        mo._els = { group: g, highlight: hl, bodyHit };
        if (this.selectedObjects.includes(mo) || this.selectedObject === mo) hl.style.display = '';
    },

    startMotiveBodyDrag(mo, startEvent) {
        this.pushUndoState();
        let hasMoved = false;
        const startMouseX = startEvent.clientX;
        const startMouseY = startEvent.clientY;
        const origStart = mo.startTime;
        const origLayer = mo.layer;
        if (mo._els && mo._els.bodyHit) mo._els.bodyHit.style.cursor = 'grabbing';
        let constrainAxis = null;

        const onMove = (ev) => {
            hasMoved = true;
            const dx = ev.clientX - startMouseX;
            const dy = ev.clientY - startMouseY;
            if (ev.shiftKey && !constrainAxis && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                constrainAxis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
            }
            if (!ev.shiftKey) constrainAxis = null;
            if (constrainAxis !== 'v') {
                const dt = dx / this.pixelsPerSecond;
                mo.startTime = Math.max(0, Math.round((origStart + dt) * 20) / 20);
            } else {
                mo.startTime = origStart;
            }
            if (constrainAxis !== 'h') {
                const newLayer = this.getLaneFromY(ev.clientY);
                if (newLayer !== mo.layer) {
                    const techs = this.trackTechniques(newLayer);
                    if (!techs.some(t => t.key === mo.technique)) mo.technique = techs.length ? techs[0].key : '';
                    mo.layer = newLayer;
                }
            } else if (mo.layer !== origLayer) {
                mo.layer = origLayer;
            }
            this.renderMotive(mo);
            this.refreshPanelValues();
        };
        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (!hasMoved) this.undoStack.pop();
            if (mo._els && mo._els.bodyHit) mo._els.bodyHit.style.cursor = 'grab';
            this.showPropertyPanel();
            this.markDirty();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    // In-place note editing (b-1): horizontal = time, vertical = semitones (snapped).
    // Edits the LIBRARY motive — every linked block updates; written to disk on release.
    startMotiveNoteDrag(mo, noteIdx, startEvent) {
        const m = this.motiveData(mo.motiveId);
        if (!m || !m.events[noteIdx]) return;
        if (this.selectedObject !== mo) this.selectObject(mo);
        this.pushUndoState();
        const orig = { on: m.events[noteIdx].on, off: m.events[noteIdx].off, note: m.events[noteIdx].note };
        const startMouseX = startEvent.clientX;
        const startMouseY = startEvent.clientY;
        const dims = this.getLaneDims(mo.layer);
        const [lo, hi] = this.trackRange(mo.layer);
        const pxPerSemitone = dims.height / Math.max(1, hi - lo);
        let hasMoved = false;

        const onMove = (e) => {
            hasMoved = true;
            const ev = m.events[noteIdx];
            const dtMs = ((e.clientX - startMouseX) / this.pixelsPerSecond) * 1000;
            const dur = orig.off - orig.on;
            ev.on = Math.max(0, Math.round(orig.on + dtMs));
            ev.off = ev.on + dur;
            const dSemis = Math.round(-(e.clientY - startMouseY) / pxPerSemitone);
            ev.note = Math.max(lo, Math.min(hi, orig.note + dSemis));
            this.renderMotive(mo);
        };
        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (!hasMoved) { this.undoStack.pop(); return; }
            m.events.sort((a, b) => a.on - b.on);
            this.saveMotive(mo.motiveId);
            this.rerenderMotiveBlocks(mo.motiveId);
            this.showPropertyPanel();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    },

    ppMotivePanel(mo) {
        const m = this.motiveData(mo.motiveId);
        const techs = this.trackTechniques(mo.layer);
        const linkedCount = this.objects.filter(o => o.type === 'motive' && o.motiveId === mo.motiveId).length;
        let html = '<h4>Motive (' + mo.id + ')</h4>';
        html += this.ppRow('Name', 'text', 'motiveName', (m && m.name) || mo.motiveId, '');
        html += this.ppRow('Start (s)', 'number', 'startTime', mo.startTime, 'step="0.01" min="0"');
        html += this.ppRow('Track', 'select', 'layer', mo.layer, '', TRACKS.map((t, i) => [String(i), t.label]));
        if (techs.length) html += this.ppRow('Technique', 'select', 'technique', mo.technique, '', techs.map(t => [t.key, t.label]));
        html += this.ppColorRow('color', mo.color);
        html += this.ppRow('Opacity', 'number', 'opacity', mo.opacity, 'step="0.05" min="0" max="1"');
        const nEvents = m && m.events ? m.events.length : 0;
        html += '<div class="pp-row" style="color:#888;font-size:10px">' + nEvents + ' notes · ' +
            this.motiveDurationSec(mo.motiveId).toFixed(2) + ' s · ∞ linked ×' + linkedCount + '</div>';
        html += '<div class="pp-row"><button id="ppUnlinkMotive" style="font-size:10px;padding:2px 8px;cursor:pointer">Unlink (fork a copy)</button></div>';
        return html;
    },

    // ---- Motive playback: playhead-triggered, same pattern as zone MIDI ----

    trackTechniqueFor(mo) {
        const techs = this.trackTechniques(mo.layer);
        return techs.find(t => t.key === mo.technique) || techs[0] || null;
    },

    tickMotivePlayback(currentTimeSec) {
        if (!this._zoneMidiInited) return;   // initZoneMidi is kicked by tickZoneMidiPlayback
        const prevTime = this._lastMotiveTimeSec;
        this._lastMotiveTimeSec = currentTimeSec;
        if (prevTime == null) return;

        this.objects.forEach(mo => {
            if (mo.type !== 'motive') return;
            if (!this.isPartAudible(mo.layer)) return;   // solo gate
            const m = this.motiveData(mo.motiveId);
            if (!m || !m.events || !m.events.length) return;
            const inst = this.trackInstrument(mo.layer);
            if (!inst) return;
            const tech0 = this.trackTechniqueFor(mo);
            const output = this._zoneMidiOutputs[((tech0 && tech0.port) || inst.port || '').toLowerCase()];
            if (!output) return;

            const blockStart = mo.startTime;
            const blockEnd = mo.startTime + this.motiveDurationSec(mo.motiveId);

            if (prevTime < blockStart && currentTimeSec >= blockStart) {
                this._activeMotivePlayback[mo.id] = { nextEventIdx: 0 };
            }
            if (currentTimeSec > blockEnd || currentTimeSec < blockStart) {
                delete this._activeMotivePlayback[mo.id];
                return;
            }
            if (!this._activeMotivePlayback[mo.id]) {
                const elapsed = (currentTimeSec - blockStart) * 1000;
                let startIdx = 0;
                for (let i = 0; i < m.events.length; i++) {
                    if (m.events[i].on >= elapsed) { startIdx = i; break; }
                    startIdx = i + 1;
                }
                this._activeMotivePlayback[mo.id] = { nextEventIdx: startIdx };
            }

            const st = this._activeMotivePlayback[mo.id];
            const elapsedMs = (currentTimeSec - blockStart) * 1000;
            const lookaheadMs = 100;
            const tech = tech0;
            const ch = ((tech && tech.channel) || 1) - 1;

            while (st.nextEventIdx < m.events.length) {
                const ev = m.events[st.nextEventIdx];
                if (ev.on > elapsedMs + lookaheadMs) break;
                if (ev.on >= elapsedMs - 50) {
                    const delayMs = Math.max(0, ev.on - elapsedMs);
                    const now = performance.now();
                    if (tech && tech.cc0 != null) output.send([0xB0 | ch, 0, tech.cc0], now + delayMs);
                    const vel = Math.min(127, Math.max(1, Math.round(ev.vel || 90)));
                    output.send([0x90 | ch, ev.note, vel], now + delayMs);
                    output.send([0x80 | ch, ev.note, 0], now + delayMs + Math.max(30, ev.off - ev.on));
                }
                st.nextEventIdx++;
            }
        });
    },

    // ========== ZONE MIDI HELPERS ==========

    // Delegates to InstrumentRegistry (backward-compatible wrappers)
    autoPopulatePercMarkers(zone) {
        const perc = InstrumentRegistry.getPercNotes(zone.instrument);
        if (!perc) return;
        const cms = zone.chordMarkers || [];
        cms.forEach(cm => {
            cm.handL = { shapeId: 'perc', root: perc.handL.midis[0], midis: [...perc.handL.midis] };
            cm.handR = { shapeId: 'perc', root: perc.handR.midis[0], midis: [...perc.handR.midis] };
        });
    },

    getZoneMidiRouting(zone) {
        return InstrumentRegistry.getRouting(zone.player, zone.instrument);
    },

    // ========== ONE-SHOT MIDI GENERATION ==========

    generateOneShotMidi(marker) {
        if (!marker || marker.midiFunction !== 'oneShot') return;
        const routing = InstrumentRegistry.getRouting(marker.player, marker.instrument);
        if (!routing) {
            alert('Cannot resolve MIDI routing — check Player/Instrument');
            return;
        }

        // === Cell material mode ===
        if (marker.materialType === 'cell') {
            const cellDef = marker.cellId ? (this.databases.cells || []).find(c => c.id === marker.cellId) : null;
            if (!cellDef || !cellDef.items || cellDef.items.length === 0) {
                alert('Select a cell with items first');
                return;
            }
            const dur = Math.max(100, marker.cellDurationMs != null ? marker.cellDurationMs : (cellDef.defaultDurationMs || 1000));
            // Build behavior overrides from marker fields (only if user has set them)
            let behaviorOverrides = null;
            if (marker.cellSpeedStart != null || marker.cellVolStart != null) {
                behaviorOverrides = {};
                const cb = (cellDef.behavior || {});
                const cs = cb.speed || {};
                const cv = cb.volume || {};
                behaviorOverrides.speed = {
                    start: marker.cellSpeedStart != null ? marker.cellSpeedStart : (cs.start != null ? cs.start : 5),
                    end: marker.cellSpeedEnd != null ? marker.cellSpeedEnd : (cs.end != null ? cs.end : 5),
                    curve: marker.cellSpeedCurve || cs.curve || 'linear'
                };
                behaviorOverrides.volume = {
                    start: marker.cellVolStart != null ? marker.cellVolStart : (cv.start != null ? cv.start : 5),
                    end: marker.cellVolEnd != null ? marker.cellVolEnd : (cv.end != null ? cv.end : 5),
                    curve: marker.cellVolCurve || cv.curve || 'linear'
                };
            }
            const events = expandCellRef(cellDef, 0, dur, behaviorOverrides);
            if (events.length === 0) {
                alert('Cell generated no events — check cell definition');
                return;
            }
            // Tag each event with per-event routing (cell items may have different instruments)
            events.forEach(evt => {
                const instKey = evt._instrument || cellDef.instrument || marker.instrument;
                const evtRouting = InstrumentRegistry.getRouting(marker.player, instKey) || routing;
                evt.port = evtRouting.port;
                evt.channel = evtRouting.channel;
            });
            const _hRules = InstrumentRegistry.getHarmonicsRules();
            if (_hRules) injectHarmonicsCC(events, _hRules);
            marker.midiSnippet = {
                events: events,
                port: routing.port,
                channel: routing.channel,
                _perEventRouting: true,
                _stale: false,
                _generatedAt: Date.now()
            };
            console.log('[OneShot/Cell] Generated', events.length, 'events for', marker.id, 'cell:', marker.cellId, 'dur:', dur + 'ms');
            this.showPropertyPanel();
            this.markDirty();
            return;
        }

        // === Articulation material mode (original) ===
        let notes = [];
        if (InstrumentRegistry.isPerc(marker.instrument)) {
            const midi = parseInt(marker.articulation);
            if (!midi && midi !== 0) {
                alert('Select an articulation first');
                return;
            }
            notes = [midi];
        } else if (InstrumentRegistry.isPiano(marker.instrument) || InstrumentRegistry.isHarmonics(marker.instrument)) {
            notes = marker.notes || [];
            if (notes.length === 0) {
                alert('Assign notes first (use Assign button)');
                return;
            }
        } else {
            alert('Unknown instrument type');
            return;
        }

        const velocity = Math.max(1, Math.min(127, marker.velocity || 115));
        const durationMs = Math.max(10, marker.durationMs || 200);

        // Build single event in same shape as zone ostinato events
        const events = [{
            onsetMs: 0,
            notes: [...notes],
            velocity: velocity,
            durations: notes.map(() => durationMs)
        }];

        // Tag harmonics metadata if present
        if (marker.harmonics) {
            events[0]._harmonics = marker.harmonics;
        }

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(events, _hRules);
        marker.midiSnippet = {
            events: events,
            port: routing.port,
            channel: routing.channel,
            _stale: false,
            _generatedAt: Date.now()
        };

        console.log('[OneShot] Generated', notes.length, 'notes for', marker.id, 'at', marker.time + 's', 'port:', routing.port, 'ch:', routing.channel);
        this.showPropertyPanel();
        this.markDirty();
    },

    // Helper: build behavior overrides from zone or marker cell fields (cellSpeedStart etc.)
    _buildZoneCellBehavior(obj) {
        if (obj.cellSpeedStart == null && obj.cellVolStart == null) return null;
        const cellDef = obj.cellId ? (this.databases.cells || []).find(c => c.id === obj.cellId) : null;
        const cb = (cellDef && cellDef.behavior) || {};
        const cs = cb.speed || {};
        const cv = cb.volume || {};
        return {
            speed: {
                start: obj.cellSpeedStart != null ? obj.cellSpeedStart : (cs.start != null ? cs.start : 5),
                end: obj.cellSpeedEnd != null ? obj.cellSpeedEnd : (cs.end != null ? cs.end : 5),
                curve: obj.cellSpeedCurve || cs.curve || 'linear'
            },
            volume: {
                start: obj.cellVolStart != null ? obj.cellVolStart : (cv.start != null ? cv.start : 5),
                end: obj.cellVolEnd != null ? obj.cellVolEnd : (cv.end != null ? cv.end : 5),
                curve: obj.cellVolCurve || cv.curve || 'linear'
            }
        };
    },

    // Helper: build behavior overrides from marker fields for a given prefix
    _buildARCellBehavior(marker, prefix, cellDef) {
        const cb = (cellDef.behavior || {});
        const cs = cb.speed || {};
        const cv = cb.volume || {};
        const spdS = marker[prefix + 'CellSpeedStart'];
        const volS = marker[prefix + 'CellVolStart'];
        if (spdS == null && volS == null) return null;
        return {
            speed: {
                start: spdS != null ? spdS : (cs.start != null ? cs.start : 5),
                end: (marker[prefix + 'CellSpeedEnd'] != null ? marker[prefix + 'CellSpeedEnd'] : (cs.end != null ? cs.end : 5)),
                curve: cs.curve || 'linear'
            },
            volume: {
                start: volS != null ? volS : (cv.start != null ? cv.start : 5),
                end: (marker[prefix + 'CellVolEnd'] != null ? marker[prefix + 'CellVolEnd'] : (cv.end != null ? cv.end : 5)),
                curve: cv.curve || 'linear'
            }
        };
    },

    generateAnticipationReactionMidi(marker) {
        if (!marker || marker.midiFunction !== 'anticipationReaction') return;
        const r1 = InstrumentRegistry.getRouting(marker.inst1Player, marker.inst1Instrument);
        const r2 = InstrumentRegistry.getRouting(marker.inst2Player, marker.inst2Instrument);
        if (!r1 || !r2) {
            alert('Cannot resolve MIDI routing for both instruments — check Player/Instrument');
            return;
        }

        // Resolve events for each instrument slot (articulation or cell)
        let events1 = [];
        if ((marker.inst1MaterialType || 'articulation') === 'cell') {
            const cellDef = marker.inst1CellId ? (this.databases.cells || []).find(c => c.id === marker.inst1CellId) : null;
            if (!cellDef || !cellDef.items || cellDef.items.length === 0) { alert('Select a cell for Instrument 1'); return; }
            const dur = Math.max(100, marker.inst1CellDurationMs != null ? marker.inst1CellDurationMs : (cellDef.defaultDurationMs || 1000));
            const beh = this._buildARCellBehavior(marker, 'inst1', cellDef);
            events1 = expandCellRef(cellDef, 0, dur, beh);
            if (events1.length === 0) { alert('Cell generated no events for Instrument 1'); return; }
            events1.forEach(evt => {
                const instKey = evt._instrument || cellDef.instrument || marker.inst1Instrument;
                const evtR = InstrumentRegistry.getRouting(marker.inst1Player, instKey) || r1;
                evt.port = evtR.port;
                evt.channel = evtR.channel;
            });
        } else {
            let notes1 = [];
            if (InstrumentRegistry.isPerc(marker.inst1Instrument)) {
                const midi = parseInt(marker.inst1Articulation);
                if (!midi && midi !== 0) { alert('Select articulation for Instrument 1'); return; }
                notes1 = [midi];
            } else if (InstrumentRegistry.isPiano(marker.inst1Instrument) || InstrumentRegistry.isHarmonics(marker.inst1Instrument)) {
                notes1 = marker.inst1Notes || [];
                if (notes1.length === 0) { alert('Assign notes for Instrument 1'); return; }
            }
            const vel1 = Math.max(1, Math.min(127, marker.inst1Velocity || 115));
            const dur1 = Math.max(10, marker.inst1DurationMs || 200);
            const evt1 = {
                onsetMs: 0,
                notes: [...notes1],
                velocity: vel1,
                durations: notes1.map(() => dur1),
                port: r1.port,
                channel: r1.channel
            };
            if (marker.inst1Harmonics) evt1._harmonics = marker.inst1Harmonics;
            events1 = [evt1];
        }

        let events2 = [];
        if ((marker.inst2MaterialType || 'articulation') === 'cell') {
            const cellDef = marker.inst2CellId ? (this.databases.cells || []).find(c => c.id === marker.inst2CellId) : null;
            if (!cellDef || !cellDef.items || cellDef.items.length === 0) { alert('Select a cell for Instrument 2'); return; }
            const dur = Math.max(100, marker.inst2CellDurationMs != null ? marker.inst2CellDurationMs : (cellDef.defaultDurationMs || 1000));
            const beh = this._buildARCellBehavior(marker, 'inst2', cellDef);
            events2 = expandCellRef(cellDef, 0, dur, beh);
            if (events2.length === 0) { alert('Cell generated no events for Instrument 2'); return; }
            events2.forEach(evt => {
                const instKey = evt._instrument || cellDef.instrument || marker.inst2Instrument;
                const evtR = InstrumentRegistry.getRouting(marker.inst2Player, instKey) || r2;
                evt.port = evtR.port;
                evt.channel = evtR.channel;
            });
        } else {
            let notes2 = [];
            if (InstrumentRegistry.isPerc(marker.inst2Instrument)) {
                const midi = parseInt(marker.inst2Articulation);
                if (!midi && midi !== 0) { alert('Select articulation for Instrument 2'); return; }
                notes2 = [midi];
            } else if (InstrumentRegistry.isPiano(marker.inst2Instrument) || InstrumentRegistry.isHarmonics(marker.inst2Instrument)) {
                notes2 = marker.inst2Notes || [];
                if (notes2.length === 0) { alert('Assign notes for Instrument 2'); return; }
            }
            const vel2 = Math.max(1, Math.min(127, marker.inst2Velocity || 115));
            const dur2 = Math.max(10, marker.inst2DurationMs || 200);
            const evt2 = {
                onsetMs: 0,
                notes: [...notes2],
                velocity: vel2,
                durations: notes2.map(() => dur2),
                port: r2.port,
                channel: r2.channel
            };
            if (marker.inst2Harmonics) evt2._harmonics = marker.inst2Harmonics;
            events2 = [evt2];
        }

        // Dice roll: before (anticipation) or after (reaction)
        const isBefore = Math.random() < 0.5;
        let offsetMs;
        if (isBefore) {
            offsetMs = -(80 + Math.random() * 90);
        } else {
            offsetMs = 100 + Math.random() * 100;
        }
        offsetMs = Math.round(offsetMs);
        marker.arLastOffset = offsetMs;

        // Shift events: inst1 at baseMs, inst2 at baseMs + offsetMs
        const baseMs = isBefore ? Math.abs(offsetMs) : 0;
        events1.forEach(evt => { evt.onsetMs += baseMs; });
        events2.forEach(evt => { evt.onsetMs += baseMs + offsetMs; });

        const allEvents = [...events1, ...events2];
        allEvents.sort((a, b) => a.onsetMs - b.onsetMs);

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(allEvents, _hRules);
        this.pushUndoState();
        marker.midiSnippet = {
            events: allEvents,
            port: r1.port,
            channel: r1.channel,
            _perEventRouting: true,
            _stale: false,
            _generatedAt: Date.now()
        };

        const dir = offsetMs < 0 ? 'before' : 'after';
        console.log('[A-R] Generated for', marker.id, '—', allEvents.length, 'events, Inst2', Math.abs(offsetMs) + 'ms', dir);
        this.showPropertyPanel();
        this.markDirty();
    },

    generateFlockingMidi(zone) {
        if (!zone || zone.midiModel !== 'flocking') return;

        let routing = this.getZoneMidiRouting(zone);
        // Flocking zones may not have zone-level player/instrument — fall back to first flocking player
        if (!routing && zone.flockingPlayers && zone.flockingPlayers.length > 0) {
            const fp0 = zone.flockingPlayers[0];
            if (fp0.player && fp0.instrument) {
                routing = InstrumentRegistry.getRouting(fp0.player, fp0.instrument);
            }
        }
        if (!routing) {
            alert('Cannot resolve MIDI routing — check Player/Instrument on zone or flocking players');
            return;
        }

        // Sample curve (wave curve or line wedge)
        const curveSample = this.sampleCurveForZone(zone);
        if (!curveSample) {
            alert('No Wave Curve or Line Wedge found in this layer overlapping the zone');
            return;
        }

        // Store curve snapshot for data completeness
        zone.linkedCurveId = curveSample.curveId;
        zone.linkedCurveType = curveSample.curveType;
        zone.curveSnapshot = {
            points: curveSample.points,
            curveType: curveSample.curveType,
            yMin: curveSample.yMin,
            yMax: curveSample.yMax,
            sampledAt: new Date().toISOString()
        };

        const fp = zone.flockingParams || { anticipationProb: 0.3, cascadeProb: 0.5 };
        const fPlayers = zone.flockingPlayers || [];
        const numPlayers = Math.max(2, fPlayers.length);
        const anticipationProb = fp.anticipationProb ?? 0.3;
        const cascadeProb = fp.cascadeProb ?? 0.5;
        const separationMin = 25; // ms
        const durationMs = (zone.endTime - zone.startTime) * 1000;

        // Density: curve Y (0→1) maps to level (1→10) maps to inter-cluster gap
        // gap = 2500 * (150/2500)^((level-1)/9)
        const gapRatio = 150 / 2500;
        function levelToGapMs(level) {
            return 2500 * Math.pow(gapRatio, (level - 1) / 9);
        }

        // Interpolate curve Y at a given normalized time (0→1 within zone)
        function getCurveY(normT) {
            const pts = curveSample.points;
            if (pts.length === 0) return 0.5;
            if (normT <= pts[0].t) return pts[0].y;
            if (normT >= pts[pts.length - 1].t) return pts[pts.length - 1].y;
            for (let i = 0; i < pts.length - 1; i++) {
                if (normT >= pts[i].t && normT <= pts[i + 1].t) {
                    const segT = (normT - pts[i].t) / (pts[i + 1].t - pts[i].t);
                    return pts[i].y + segT * (pts[i + 1].y - pts[i].y);
                }
            }
            return pts[pts.length - 1].y;
        }

        // Generate one flock cluster at a given time offset (ms from zone start)
        function generateCluster(clusterOnsetMs) {
            const offsets = [{ player: 0, offsetMs: 0 }]; // initiator at t=0

            // Shuffle remaining player indices
            const remaining = [];
            for (let i = 1; i < numPlayers; i++) remaining.push(i);
            for (let i = remaining.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
            }

            for (const pIdx of remaining) {
                // Choose reference: initiator or most recently placed
                const refIdx = Math.random() < cascadeProb
                    ? offsets.length - 1  // cascade: reference most recent
                    : 0;                  // reference initiator
                const refOffset = offsets[refIdx].offsetMs;

                // Choose direction and roll offset
                const isBefore = Math.random() < anticipationProb;
                let range, minOff;
                if (isBefore) {
                    minOff = 80; range = 90;   // 80–170ms before
                } else {
                    minOff = 100; range = 100;  // 100–200ms after
                }
                let off = minOff + Math.random() * range;
                if (isBefore) off = -off;
                let finalMs = Math.round(refOffset + off);

                // Enforce separation from all placed players
                for (const placed of offsets) {
                    if (Math.abs(finalMs - placed.offsetMs) < separationMin) {
                        finalMs = placed.offsetMs + (finalMs >= placed.offsetMs ? separationMin : -separationMin);
                    }
                }

                offsets.push({ player: pIdx, offsetMs: finalMs });
            }

            // Shift so earliest offset = 0, then add cluster onset
            const earliest = Math.min(...offsets.map(o => o.offsetMs));
            return offsets.map(o => ({
                player: o.player,
                onsetMs: clusterOnsetMs + (o.offsetMs - earliest)
            }));
        }

        // Walk timeline placing clusters at density-driven intervals
        const allEvents = [];
        let cursorMs = 0;
        let safetyCount = 0;
        const maxEvents = 5000;

        while (cursorMs < durationMs && safetyCount < maxEvents) {
            // Get density at current position
            const normT = cursorMs / durationMs;
            const curveY = getCurveY(normT);
            const level = 1 + curveY * 9; // 0→1 maps to 1→10
            const gapMs = levelToGapMs(level);

            // Generate cluster
            const cluster = generateCluster(cursorMs);
            for (const evt of cluster) {
                if (evt.onsetMs < durationMs) {
                    allEvents.push(evt);
                    safetyCount++;
                }
            }

            // Advance cursor by gap (with small jitter ±15%)
            const jitter = 1 + (Math.random() - 0.5) * 0.3;
            cursorMs += gapMs * jitter;
        }

        // Sort by onset
        allEvents.sort((a, b) => a.onsetMs - b.onsetMs);

        // Resolve per-player sets → items + routing
        const allSets = (this.databases && this.databases.sets) || [];
        const vel = Math.max(1, Math.min(127, zone.flockingVelocity || 115));
        const dur = Math.max(10, zone.flockingDurationMs || 200);

        // Snapshot set contents per player for data completeness
        const cellsDbFlock = (this.databases && this.databases.cells) || [];
        zone.flockingPlayersSnapshot = fPlayers.map((pCfg, pi) => {
            const set = pCfg.setId ? allSets.find(s => s.id === pCfg.setId) : null;
            return {
                player: pCfg.player || '',
                instrument: pCfg.instrument || '',
                setId: pCfg.setId || '',
                setName: set ? set.name : '',
                setItems: set ? set.items.map(item => {
                    const snap = {
                        type: item.type,
                        label: item.label || '',
                        midis: item.midis ? [...item.midis] : [],
                        midi: item.midi || null,
                        instrument: item.instrument || null,
                        beater: item.beater || null,
                        articulation: item.articulation || null,
                        pitch: item.pitch || null,
                        shapeId: item.shapeId || null,
                        root: item.root || null
                    };
                    if (item.type === 'cellRef' && item.cellId) {
                        snap.cellId = item.cellId;
                        const cellDef = cellsDbFlock.find(c => c.id === item.cellId);
                        if (cellDef) {
                            snap.cellSnapshot = {
                                label: cellDef.label || '',
                                phrasing: cellDef.phrasing || 'ostinato',
                                repeatMode: cellDef.repeatMode || 'cycle',
                                ordering: cellDef.ordering || 'sequential',
                                clusterWindowMs: cellDef.clusterWindowMs || null,
                                sustainMs: cellDef.sustainMs || null,
                                ringMode: cellDef.ringMode || null,
                                ringMs: cellDef.ringMs || null,
                                defaultDurationMs: cellDef.defaultDurationMs || null,
                                jitter: cellDef.jitter || 0,
                                behavior: cellDef.behavior ? JSON.parse(JSON.stringify(cellDef.behavior)) : {},
                                items: cellDef.items.map(it => ({
                                    midi: it.midi, name: it.name || '',
                                    instrument: it.instrument || cellDef.instrument || '',
                                    beater: it.beater || '', articulation: it.articulation || ''
                                }))
                            };
                        }
                    }
                    return snap;
                }) : []
            };
        });

        const cellsDb = (this.databases && this.databases.cells) || [];
        const events = allEvents.flatMap(evt => {
            const pi = evt.player;
            const pCfg = fPlayers[pi] || {};
            const setId = pCfg.setId;
            const set = setId ? allSets.find(s => s.id === setId) : null;
            const playerKey = pCfg.player || '';   // e.g. 'perc1', 'piano1'
            const playerInst = pCfg.instrument || '';

            let notes, evtPort, evtChannel;
            let itemMeta = {};
            if (set && set.items.length > 0) {
                // Pick a random item from the player's set
                const item = set.items[Math.floor(Math.random() * set.items.length)];

                // CellRef expansion: expand cell into multiple events at this onset
                if (item.type === 'cellRef' && item.cellId) {
                    const cellDef = cellsDb.find(c => c.id === item.cellId);
                    if (cellDef && cellDef.items && cellDef.items.length > 0) {
                        // Duration = current inter-cluster gap (algorithm-determined)
                        const normT = evt.onsetMs / durationMs;
                        const curveY = getCurveY(normT);
                        const level = 1 + curveY * 9;
                        const cellDur = Math.max(200, Math.round(levelToGapMs(level) * 0.8));
                        const cellEvents = expandCellRef(cellDef, Math.round(evt.onsetMs), cellDur, null);
                        cellEvents.forEach(ce => {
                            const instKey = ce._instrument || cellDef.instrument || playerInst;
                            const r = InstrumentRegistry.getRouting(playerKey, instKey) || routing;
                            ce.port = r.port;
                            ce.channel = r.channel;
                            ce.playerIndex = pi;
                            ce.playerKey = playerKey;
                            ce.itemType = 'cellRef';
                            ce.itemLabel = item.label || cellDef.label || item.cellId;
                        });
                        return cellEvents;
                    }
                }

                notes = item.midis || [item.midi] || [60];
                itemMeta = {
                    itemType: item.type || '',
                    itemLabel: item.label || '',
                    instrument: item.instrument || null,
                    beater: item.beater || null,
                    articulation: item.articulation || null
                };

                // Resolve routing using zone's player assignment + item's instrument
                if (item.type === 'percArticulation' && item.instrument) {
                    const r = InstrumentRegistry.getRouting(playerKey || 'perc1', item.instrument);
                    evtPort = r ? r.port : routing.port;
                    evtChannel = r ? r.channel : routing.channel;
                } else {
                    // Piano items: use item instrument if tagged, else player assignment
                    const pianoKey = item.instrument || playerInst;
                    const r = pianoKey ? InstrumentRegistry.getRouting(playerKey, pianoKey) : null;
                    evtPort = r ? r.port : routing.port;
                    evtChannel = r ? r.channel : routing.channel;
                }
            } else if (playerInst) {
                // No set but has instrument: use instrument's default note
                notes = InstrumentRegistry.isPerc(playerInst)
                    ? [parseInt(zone.oneShotArticulation) || 60]
                    : [60];
                const r = InstrumentRegistry.getRouting(playerKey, playerInst);
                evtPort = r ? r.port : routing.port;
                evtChannel = r ? r.channel : routing.channel;
            } else {
                // Fallback: zone routing
                notes = [60];
                evtPort = routing.port;
                evtChannel = routing.channel;
            }

            return [{
                onsetMs: Math.round(evt.onsetMs),
                notes: [...notes],
                velocity: vel,
                durations: notes.map(() => dur),
                port: evtPort,
                channel: evtChannel,
                playerIndex: pi,
                playerKey: playerKey,
                ...itemMeta
            }];
        });

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(events, _hRules);
        this.pushUndoState();
        zone.midiSnippet = {
            events,
            port: routing.port,
            channel: routing.channel,
            _stale: false,
            _generatedAt: Date.now()
        };

        zone.cellActivations = [];
        console.log('[Flocking] Generated for', zone.id, '—', events.length, 'events,', numPlayers, 'players, curve:', curveSample.curveType, curveSample.curveId);
        this.showPropertyPanel();
        this.markDirty();
    },

    generateThreeBodyMidi(zone) {
        if (!zone || zone.midiModel !== 'threeBody') return;

        const tbPlayers = zone.threeBodyPlayers || [];
        const numPlayers = tbPlayers.length;
        if (numPlayers < 2) { alert('Need at least 2 players'); return; }

        // Default routing: fall back to first player with valid config
        let routing = this.getZoneMidiRouting(zone);
        if (!routing) {
            for (const p of tbPlayers) {
                if (p.player && p.instrument) {
                    routing = InstrumentRegistry.getRouting(p.player, p.instrument);
                    if (routing) break;
                }
            }
        }
        if (!routing) { alert('Cannot resolve MIDI routing — check Player/Instrument'); return; }

        const tbp = zone.threeBodyParams || { anticipationAccuracy: 0.5, density: 5, separationMin: 25 };
        const accuracy = Math.max(0, Math.min(1, tbp.anticipationAccuracy ?? 0.5));
        const density = Math.max(1, Math.min(10, tbp.density ?? 5));
        const separationMin = tbp.separationMin || 25;
        const durationMs = (zone.endTime - zone.startTime) * 1000;

        // --- Generate derangement: permutation where no element maps to itself ---
        function randomDerangement(n) {
            if (n < 2) return [0];
            for (let attempt = 0; attempt < 100; attempt++) {
                const perm = Array.from({ length: n }, (_, i) => i);
                for (let i = n - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [perm[i], perm[j]] = [perm[j], perm[i]];
                }
                if (perm.every((v, i) => v !== i)) return perm;
            }
            // Fallback: simple rotation
            return Array.from({ length: n }, (_, i) => (i + 1) % n);
        }

        // Generate anticipation and reaction derangements
        // Constraint: anticipates[i] !== reactsTo[i] for all i
        let anticipates, reactsTo;
        for (let attempt = 0; attempt < 100; attempt++) {
            anticipates = randomDerangement(numPlayers);
            reactsTo = randomDerangement(numPlayers);
            if (anticipates.every((a, i) => a !== reactsTo[i])) break;
        }
        zone.threeBodyRelationships = { anticipates, reactsTo };

        // --- Density → constant gap ---
        const gapRatio = 350 / 4000;
        const gapMs = 4000 * Math.pow(gapRatio, (density - 1) / 9);

        // --- Generate one Three-Body cluster ---
        function generateCluster(clusterOnsetMs) {
            const placed = new Array(numPlayers).fill(null); // null = not yet placed

            // 1. Pick random instigator
            const instigator = Math.floor(Math.random() * numPlayers);
            placed[instigator] = { offsetMs: 0, role: 'instigator' };

            // 2. BFS cascade — process players whose targets are already placed
            let changed = true;
            let rounds = 0;
            while (changed && rounds < numPlayers) {
                changed = false;
                rounds++;
                for (let pi = 0; pi < numPlayers; pi++) {
                    if (placed[pi] !== null) continue; // already placed

                    const reactTarget = reactsTo[pi];   // player pi reacts to this player
                    const anticTarget = anticipates[pi]; // player pi anticipates this player
                    const reactPlaced = placed[reactTarget];
                    const anticPlaced = placed[anticTarget];

                    if (!reactPlaced && !anticPlaced) continue; // neither target placed yet

                    let finalMs;

                    if (reactPlaced && anticPlaced) {
                        // Both targets placed: reaction sets base, anticipation pulls
                        const reactionOff = 100 + Math.random() * 100; // 100–200ms after
                        const reactionTime = reactPlaced.offsetMs + reactionOff;

                        // Anticipation pull depends on accuracy
                        let anticPull;
                        if (accuracy < 0.1) {
                            // Air shot: random time in cluster window
                            anticPull = -200 + Math.random() * 400;
                        } else {
                            const anticOff = (20 + Math.random() * (60 + (1 - accuracy) * 140));
                            anticPull = anticPlaced.offsetMs - anticOff;
                        }

                        // Blend: reaction dominates, accuracy determines anticipation weight
                        const anticWeight = accuracy * 0.5;
                        finalMs = reactionTime * (1 - anticWeight) + anticPull * anticWeight;

                    } else if (reactPlaced) {
                        // Only reaction target placed: play after them
                        const reactionOff = 100 + Math.random() * 100;
                        finalMs = reactPlaced.offsetMs + reactionOff;

                    } else {
                        // Only anticipation target placed: try to play before them (accuracy-dependent)
                        if (Math.random() > accuracy) {
                            // Miss — air shot: random offset from anticipation target
                            finalMs = anticPlaced.offsetMs + (-200 + Math.random() * 400);
                        } else {
                            // Successful anticipation: play before target
                            const anticOff = 20 + Math.random() * (60 + (1 - accuracy) * 140);
                            finalMs = anticPlaced.offsetMs - anticOff;
                        }
                    }

                    // Enforce separation from all placed players
                    for (let j = 0; j < numPlayers; j++) {
                        if (placed[j] !== null && Math.abs(finalMs - placed[j].offsetMs) < separationMin) {
                            finalMs = placed[j].offsetMs + (finalMs >= placed[j].offsetMs ? separationMin : -separationMin);
                        }
                    }

                    const role = reactPlaced && !anticPlaced ? 'reactor'
                               : !reactPlaced && anticPlaced ? 'anticipator'
                               : 'blended';
                    placed[pi] = { offsetMs: Math.round(finalMs), role };
                    changed = true;
                }
            }

            // Fallback: any unplaced player (disconnected graph edge case)
            for (let pi = 0; pi < numPlayers; pi++) {
                if (placed[pi] === null) {
                    placed[pi] = { offsetMs: Math.round(Math.random() * 200), role: 'fallback' };
                }
            }

            // Shift so earliest offset = 0, then add cluster onset
            const earliest = Math.min(...placed.map(p => p.offsetMs));
            return placed.map((p, pi) => ({
                player: pi,
                onsetMs: clusterOnsetMs + (p.offsetMs - earliest),
                role: p.role
            }));
        }

        // --- Walk timeline placing clusters at constant density ---
        const allEvents = [];
        let cursorMs = 0;
        let safetyCount = 0;
        const maxEvents = 5000;

        while (cursorMs < durationMs && safetyCount < maxEvents) {
            const cluster = generateCluster(cursorMs);
            for (const evt of cluster) {
                if (evt.onsetMs < durationMs) {
                    allEvents.push(evt);
                    safetyCount++;
                }
            }
            // Advance cursor by gap (with small jitter ±15%)
            const jitter = 1 + (Math.random() - 0.5) * 0.3;
            cursorMs += gapMs * jitter;
        }

        allEvents.sort((a, b) => a.onsetMs - b.onsetMs);

        // --- Resolve per-player sets → items + routing ---
        const allSets = (this.databases && this.databases.sets) || [];
        const vel = 100;
        const dur = 200;

        // Snapshot set contents per player for data completeness
        const cellsDbTB = (this.databases && this.databases.cells) || [];
        zone.threeBodyPlayersSnapshot = tbPlayers.map((pCfg) => {
            const set = pCfg.setId ? allSets.find(s => s.id === pCfg.setId) : null;
            return {
                player: pCfg.player || '',
                instrument: pCfg.instrument || '',
                setId: pCfg.setId || '',
                setName: set ? set.name : '',
                setItems: set ? set.items.map(item => {
                    const snap = {
                        type: item.type, label: item.label || '',
                        midis: item.midis ? [...item.midis] : [],
                        midi: item.midi || null,
                        instrument: item.instrument || null,
                        beater: item.beater || null,
                        articulation: item.articulation || null,
                        pitch: item.pitch || null,
                        shapeId: item.shapeId || null,
                        root: item.root || null
                    };
                    if (item.type === 'cellRef' && item.cellId) {
                        snap.cellId = item.cellId;
                        const cellDef = cellsDbTB.find(c => c.id === item.cellId);
                        if (cellDef) {
                            snap.cellSnapshot = {
                                label: cellDef.label || '',
                                phrasing: cellDef.phrasing || 'ostinato',
                                repeatMode: cellDef.repeatMode || 'cycle',
                                ordering: cellDef.ordering || 'sequential',
                                clusterWindowMs: cellDef.clusterWindowMs || null,
                                sustainMs: cellDef.sustainMs || null,
                                ringMode: cellDef.ringMode || null,
                                ringMs: cellDef.ringMs || null,
                                defaultDurationMs: cellDef.defaultDurationMs || null,
                                jitter: cellDef.jitter || 0,
                                behavior: cellDef.behavior ? JSON.parse(JSON.stringify(cellDef.behavior)) : {},
                                items: cellDef.items.map(it => ({
                                    midi: it.midi, name: it.name || '',
                                    instrument: it.instrument || cellDef.instrument || '',
                                    beater: it.beater || '', articulation: it.articulation || ''
                                }))
                            };
                        }
                    }
                    return snap;
                }) : []
            };
        });

        const cellsDb = (this.databases && this.databases.cells) || [];
        const cellDur = Math.max(200, Math.round(gapMs * 0.8));
        const events = allEvents.flatMap(evt => {
            const pi = evt.player;
            const pCfg = tbPlayers[pi] || {};
            const setId = pCfg.setId;
            const set = setId ? allSets.find(s => s.id === setId) : null;
            const playerKey = pCfg.player || '';
            const playerInst = pCfg.instrument || '';

            let notes, evtPort, evtChannel;
            let itemMeta = {};
            if (set && set.items.length > 0) {
                const item = set.items[Math.floor(Math.random() * set.items.length)];

                // CellRef expansion
                if (item.type === 'cellRef' && item.cellId) {
                    const cellDef = cellsDb.find(c => c.id === item.cellId);
                    if (cellDef && cellDef.items && cellDef.items.length > 0) {
                        const cellEvents = expandCellRef(cellDef, Math.round(evt.onsetMs), cellDur, null);
                        cellEvents.forEach(ce => {
                            const instKey = ce._instrument || cellDef.instrument || playerInst;
                            const r = InstrumentRegistry.getRouting(playerKey, instKey) || routing;
                            ce.port = r.port;
                            ce.channel = r.channel;
                            ce.playerIndex = pi;
                            ce.playerKey = playerKey;
                            ce.role = evt.role;
                            ce.itemType = 'cellRef';
                            ce.itemLabel = item.label || cellDef.label || item.cellId;
                        });
                        return cellEvents;
                    }
                }

                notes = item.midis || [item.midi] || [60];
                itemMeta = {
                    itemType: item.type || '',
                    itemLabel: item.label || '',
                    instrument: item.instrument || null,
                    beater: item.beater || null,
                    articulation: item.articulation || null
                };
                if (item.type === 'percArticulation' && item.instrument) {
                    const r = InstrumentRegistry.getRouting(playerKey || 'perc1', item.instrument);
                    evtPort = r ? r.port : routing.port;
                    evtChannel = r ? r.channel : routing.channel;
                } else {
                    const pianoKey = item.instrument || playerInst;
                    const r = pianoKey ? InstrumentRegistry.getRouting(playerKey, pianoKey) : null;
                    evtPort = r ? r.port : routing.port;
                    evtChannel = r ? r.channel : routing.channel;
                }
            } else if (playerInst) {
                notes = InstrumentRegistry.isPerc(playerInst) ? [60] : [60];
                const r = InstrumentRegistry.getRouting(playerKey, playerInst);
                evtPort = r ? r.port : routing.port;
                evtChannel = r ? r.channel : routing.channel;
            } else {
                notes = [60];
                evtPort = routing.port;
                evtChannel = routing.channel;
            }

            return [{
                onsetMs: Math.round(evt.onsetMs),
                notes: [...notes],
                velocity: vel,
                durations: notes.map(() => dur),
                port: evtPort,
                channel: evtChannel,
                playerIndex: pi,
                playerKey: playerKey,
                role: evt.role,
                ...itemMeta
            }];
        });

        const _hRules = InstrumentRegistry.getHarmonicsRules();
        if (_hRules) injectHarmonicsCC(events, _hRules);
        this.pushUndoState();
        zone.midiSnippet = {
            events,
            port: routing.port,
            channel: routing.channel,
            _stale: false,
            _generatedAt: Date.now()
        };

        zone.cellActivations = [];
        console.log('[ThreeBody] Generated for', zone.id, '—', events.length, 'events,', numPlayers, 'players, accuracy:', accuracy, 'density:', density);
        console.log('[ThreeBody] Relationships — anticipates:', anticipates, 'reactsTo:', reactsTo);
        this.showPropertyPanel();
        this.markDirty();
