<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cluster Sandbox</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1c1c1e; color: #ddd;
         margin: 0; padding: 8px 16px 30px; }
  .bar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; font-size: 12px; padding: 3px 0; }
  select, button, input[type=text] { background: #2a2a2e; color: #ddd; border: 1px solid #555;
         border-radius: 4px; padding: 3px 8px; font-size: 12px; }
  button { cursor: pointer; }
  button.on { background: #4a3a12; border-color: #B8860B; color: #ffd479; }
  button.rec { background: #5a2020; border-color: #a44; color: #ffb4b4; }
  button.chip { padding: 2px 7px; font-size: 11px; }
  button.chip.on { background: #14424a; border-color: #3FA7B8; color: #8fdbe8; }
  input[type=range] { width: 100px; vertical-align: middle; }
  .hint { color: #777; }
  #roll { display: block; width: 100%; height: 340px; background: #202024;
          border: 1px solid #333; border-radius: 6px; cursor: crosshair; margin-top: 4px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11px; padding: 2px 0; }
  .snip { background: #232327; border: 1px solid #555; border-radius: 4px; padding: 2px 6px;
          cursor: pointer; }
  .snip.on { border-color: #3FA7B8; color: #8fdbe8; }
  .snip .x { color: #777; margin-left: 5px; }
  .snip .x:hover { color: #ff9c54; }
  select.flash { border-color: #ff9c54; box-shadow: 0 0 6px #ff9c54; }
</style>
</head>
<body>

<div class="bar">
  <select id="clSel" title="the cluster bank: imported takes + your recordings"></select>
  <button id="playBtn" title="SPACE — play the selection (or the whole cluster)">&#9654; play</button>
  <button id="stopBtn" title="stop playback">&#9632;</button>
  <span class="hint">|</span>
  <select id="recTech" title="the articulation preset you are playing through">
    <option value="staccato">rec: staccato</option>
    <option value="fortepiano">rec: fortepiano</option>
    <option value="ord">rec: ordinario</option>
  </select>
  <button id="recBtn" title="record from your MIDI keyboard — first note starts the clock">&#9679; rec</button>
  <span class="hint">|</span>
  <span id="selInfo" class="hint">drag on the roll to select</span>
  <button id="selClear" title="clear the selection">clear sel</button>
  <button id="snipSave" title="save the selection as a snippet (a pointer — cheap, disposable)">&#10549; snippet</button>
  <span class="hint">|</span>
  <button id="zoomIn" title="zoom in (or ALT+wheel on the roll)">+</button>
  <button id="zoomOut" title="zoom out">&#8722;</button>
  <button id="zoomFit" title="fit the whole cluster">fit</button>
  <span style="flex:1 1 auto"></span>
  <span class="hint" id="midiStatus">midi: &#8230;</span>
</div>

<div id="rollWrap" style="position:relative">
  <canvas id="roll" width="1600" height="340"></canvas>
  <div id="playCursor" style="position:absolute; top:0; bottom:0; width:0; border-left:1.5px solid #ffd479; display:none; pointer-events:none"></div>
</div>

<div class="chiprow" id="snips"></div>

<div class="bar">
  <span class="hint">time:</span>
  <button class="chip str" data-f="0.5">&#215;0.5</button>
  <button class="chip str" data-f="0.75">&#215;0.75</button>
  <button class="chip str" data-f="1">&#215;1</button>
  <button class="chip str" data-f="1.5">&#215;1.5</button>
  <button class="chip str" data-f="2">&#215;2</button>
  <button class="chip str" data-f="4">&#215;4</button>
  <button class="chip str" data-f="10">&#215;10</button>
  <label>fine <input type="range" id="strSlider" min="0.25" max="10" step="0.05" value="1"><span id="strV" class="hint">1.00&#215;</span></label>
  <span class="hint">|</span>
  <button class="chip" id="revBtn" title="mirror the attack pattern in time">reverse</button>
  <button class="chip" id="octDn" title="shift down an octave (folds back into range)">oct &#8722;</button>
  <button class="chip" id="octUp" title="shift up an octave (folds back into range)">oct +</button>
  <label>thin <input type="range" id="thin" min="10" max="100" step="5" value="100"><span id="thinV" class="hint">100%</span></label>
  <button id="resetBtn" title="back to the untouched original">&#8634; original</button>
</div>

<div class="bar" id="tonRow">
  <span class="hint">tonality:</span>
  <!-- chips injected -->
  <select id="chordSel" title="remap onto any of the 33 played chords (V1 pitches)"><option value="">chord&#8230;</option></select>
  <button class="chip on" id="poolBtn" title="POOLED: the target's pitch classes spread over the whole range (keeps register + contour). LITERAL: exactly the target's notes (keeps voicing; tight targets collapse register)">pooled</button>
</div>

<div class="bar">
  <button id="storeBtn" title="bake the current sound into a keeper gesture (CG###) and add it to the chosen list">&#9733; store &#8594;</button>
  <span class="hint">add to:</span>
  <select id="listSel"></select>
  <span id="storeMsg" style="color:#ff9c54"></span>
  <span class="hint" id="info"></span>
</div>

<script>
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const LO = 30, HI = 65;

// ---- tonality palette (the documented harmony palette, GESTURES.md 2026-08-13) ----
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const pcsPool = (pcs) => range(LO, HI).filter(m => pcs.includes(m % 12));
const onPc = (root, degs) => degs.map(d => (root + d) % 12);
// deterministic placed 11-pc row (cres_ref recipe, fixed order)
const ROW = (() => {
  const pcs = [0, 7, 3, 10, 5, 1, 8, 4, 11, 6, 2];
  return pcs.map((pc, i) => {
    const target = LO + (HI - LO) * ((i * 7) % 11) / 10;
    let best = null;
    for (let m = LO; m <= HI; m++)
      if (m % 12 === pc && (best === null || Math.abs(m - target) < Math.abs(best - target))) best = m;
    return best;
  }).sort((a, b) => a - b);
})();
const TONALITIES = {
  'cl low':  range(30, 36),
  'cl mid':  range(44, 50),
  'cl high': range(59, 65),
  'cl spread': [30, 36, 43, 47, 56, 57, 58],
  'BbE 2oct': [...range(34, 40), ...range(58, 64)],
  '5ths 30': [30, 37, 44, 51, 58, 65],
  '5ths 37': [37, 44, 51, 58, 65],
  'oct F#': [30, 42, 54],
  'oct Bb': [34, 46, 58],
  'm7 (F#)': pcsPool(onPc(6, [0, 1, 2, 3, 5, 6, 7, 8, 10, 11])),
  'm4 (F#)': pcsPool(onPc(6, [0, 1, 2, 5, 6, 7, 8, 11])),
  'm6 (F#)': pcsPool(onPc(6, [0, 2, 4, 5, 6, 8, 10, 11])),
  'm3 (F)':  pcsPool(onPc(5, [0, 2, 3, 4, 6, 7, 8, 10, 11])),
  'Bhairav (F)': pcsPool(onPc(5, [0, 1, 4, 5, 7, 8, 11])),
  'row (placed)': ROW,
};

// ---- measured one-shot lengths (probe 2026-08-15) ----
let SAMPLE_LEN = null;
const FIXED_FALLBACK = { fortepiano: 1.67, staccato: 0.45, cuivre: 1.17 };
function techLen(tech, pitch) {
  const tbl = SAMPLE_LEN && SAMPLE_LEN[tech];
  if (tbl && tbl[pitch] != null) return tbl[pitch];
  if (tbl) {
    const keys = Object.keys(tbl).map(Number);
    if (keys.length) return tbl[keys.reduce((a, b) => Math.abs(b - pitch) < Math.abs(a - pitch) ? b : a)];
  }
  return FIXED_FALLBACK[tech];   // undefined for ord = variable
}

// ---- state ----
let BANK = null, TAXCH = {};        // cluster bank; chord id -> V1 pitches
let cur = null;                     // current cluster id
let sel = null;                     // [t0, t1] in cluster time, or null
let selSnip = null;                 // active snippet id (highlight only)
// non-destructive transform state — always recomputed from the source
let TR = { stretch: 1, tonality: null, chord: null, reverse: false, oct: 0, thin: 100, pool: true };
const trDefault = () => ({ stretch: 1, tonality: null, chord: null, reverse: false, oct: 0, thin: 100, pool: true });
// view window: pxPerSec = null means fit-whole-cluster; viewT0 = left edge (s)
let pxPerSec = null, viewT0 = 0;
// AUDIO-EDITOR TRANSPORT MODEL (composer 2026-08-15): the cursor and the
// selection are one concept. Click = place the cursor (collapses selection).
// Drag = select (cursor rides the selection start). SPACE plays the selection,
// or cursor-to-end when there is none. HOME = zero. Boundary notes get 30 ms
// of grace so clicking ON a note plays it.
let cursorT = 0;

const $ = id => document.getElementById(id);

// ---- the transform pipeline ----
const EDGE_EPS = 0.03;   // boundary grace: a note AT the window edge plays
function playWindow() {
  return sel ? [sel[0], sel[1]] : [cursorT, rollSpan()];
}
function sourceEvents() {
  if (!cur || !BANK.clusters[cur]) return [];
  const w = playWindow();
  // normalize to the window EDGE so leading empty space is heard as silence
  return BANK.clusters[cur].events
    .filter(e => e.t >= w[0] - EDGE_EPS && e.t <= w[1] + 0.001)
    .map(e => ({ ...e, srcT: e.t, srcP: e.p, t: +Math.max(0, e.t - w[0]).toFixed(3) }));
}
function foldInto(p) {
  while (p < LO) p += 12;
  while (p > HI) p -= 12;
  return p;
}
function viewEvents() {
  let ev = sourceEvents().map(e => ({ ...e }));
  if (!ev.length) return ev;
  // 1. thin: keep the loudest N%
  if (TR.thin < 100) {
    const keep = Math.max(1, Math.round(ev.length * TR.thin / 100));
    const kept = new Set(ev.slice().sort((a, b) => b.v - a.v).slice(0, keep));
    ev = ev.filter(e => kept.has(e));
  }
  const span = Math.max(...ev.map(e => e.t));
  // 2. reverse: mirror the attack pattern
  if (TR.reverse) { ev = ev.map(e => ({ ...e, t: +(span - e.t).toFixed(3) })).sort((a, b) => a.t - b.t); }
  // 3. stretch: onsets scale; ord durations scale; fixed one-shots keep their length (D9)
  if (TR.stretch !== 1) ev = ev.map(e => ({ ...e, t: +(e.t * TR.stretch).toFixed(3),
    d: e.tech === 'ord' ? +(e.d * TR.stretch).toFixed(3) : e.d }));
  // 4. tonality remap (composer 2026-08-15: pooled + no-repeat kick)
  const targetLit = TR.chord ? TAXCH[TR.chord] : TR.tonality ? TONALITIES[TR.tonality] : null;
  if (targetLit && targetLit.length) {
    // POOLED: spread the target's pitch classes over the whole range so tight
    // targets stop collapsing register; LITERAL: the target's exact notes
    const target = TR.pool ? pcsPool([...new Set(targetLit.map(q => q % 12))]) : targetLit;
    const nearestIn = (q, excl) => {
      let best = null, bd = 1e9;
      for (const m of target) {
        if (excl && excl.has(m)) continue;
        const d = Math.abs(m - q);
        if (d < bd) { bd = d; best = m; }
      }
      return best;
    };
    // pc-consistent base map
    const map = {};
    for (const e of ev) {
      if (map[e.p] === undefined) map[e.p] = nearestIn(e.p);
      e.p = map[e.p];
    }
    // NO-REPEAT KICK: when DISTINCT source pitches collide on one target note
    // (consecutively, or simultaneously as an accidental unison), bump the
    // later one to the next-nearest target member. Repeats that exist in the
    // source stay repeats - they are the material.
    let prevP = null, prevSrc = null, curT = null, used = new Set();
    for (const e of ev) {
      if (curT === null || Math.abs(e.t - curT) > 0.001) { curT = e.t; used = new Set(); }
      let q = e.p;
      const clashPrev = prevP !== null && q === prevP && e.srcP !== prevSrc;
      const clashSim = used.has(q);
      if ((clashPrev || clashSim) && target.length > 1) {
        const excl = new Set(used);
        if (prevP !== null && e.srcP !== prevSrc) excl.add(prevP);
        const alt = nearestIn(e.srcP, excl);
        if (alt !== null) q = alt;
      }
      used.add(q);
      prevP = q; prevSrc = e.srcP;
      e.p = q;
    }
  }
  // 5. octave shift, folded back into range
  if (TR.oct) ev = ev.map(e => ({ ...e, p: foldInto(e.p + 12 * TR.oct) }));
  return ev;
}
const viewSpan = ev => ev.length ? Math.max(...ev.map(e => e.t + (e.tech === 'ord' ? e.d : (techLen(e.tech, e.p) || e.d)))) : 0;

// ---- piano roll ----
const rollSpan = () => cur ? Math.max(BANK.clusters[cur].span, 0.5) : 1;
function fitPps() { return ($('roll').clientWidth - 16) / rollSpan(); }
function pps() { return pxPerSec || fitPps(); }
function clampView() {
  const maxT0 = Math.max(0, rollSpan() - ($('roll').clientWidth - 16) / pps());
  viewT0 = Math.max(0, Math.min(maxT0, viewT0));
}
const rollX = t => 8 + (t - viewT0) * pps();
const rollTimeAt = x => viewT0 + (x - 8) / pps();
const trActive = () => TR.stretch !== 1 || TR.tonality || TR.chord || TR.reverse || TR.oct || TR.thin < 100;
function drawRoll() {
  const cv = $('roll'), ctx = cv.getContext('2d');
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!cur) return;
  clampView();
  const cl = BANK.clusters[cur];
  const X = rollX;
  const Y = p => H - 14 - (H - 28) * (p - LO) / (HI - LO + 4);
  // second ruler
  ctx.fillStyle = '#3a3a40'; ctx.font = '9px Consolas';
  const visSpan = (W - 16) / pps();
  const step = visSpan > 40 ? 5 : 1;
  for (let s = Math.floor(viewT0); s <= viewT0 + visSpan + 1; s++) {
    if (X(s) < 0 || X(s) > W) continue;
    ctx.fillRect(X(s), 0, 1, H);
    if (s % step === 0) ctx.fillText(s + 's', X(s) + 2, 10);
  }
  // selection band
  if (sel) {
    ctx.fillStyle = 'rgba(63,167,184,0.14)';
    ctx.fillRect(X(sel[0]), 0, X(sel[1]) - X(sel[0]), H);
    ctx.strokeStyle = '#3FA7B8';
    ctx.strokeRect(X(sel[0]), 0, X(sel[1]) - X(sel[0]), H);
  }
  {
    const px = X(cursorT);
    if (px >= 0 && px <= W) {
      ctx.strokeStyle = '#ffd479';
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  const dot = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
  const techColor = tech => tech === 'fortepiano' ? '#c9986e' : tech === 'ord' ? '#8ea9c9' : '#ffd479';
  const transformed = trActive();
  // pass 1: every source event — dim if outside the selection, ghosted if transforms are active
  for (const e of cl.events) {
    const inSel = !sel || (e.t >= sel[0] && e.t <= sel[1]);
    const x = X(e.t);
    if (x < -4 || x > W + 4) continue;
    const r = 1.2 + 2.6 * e.v / 127;
    dot(x, Y(e.p), r, !inSel ? 'rgba(150,150,150,0.25)'
      : transformed ? 'rgba(150,150,150,0.35)' : techColor(e.tech));
  }
  // pass 2: when transforms are active, THE SOUND — bright dots at the source
  // position but the transformed pitch (what you see = what plays)
  if (transformed) {
    for (const e of viewEvents()) {
      const sx = X(e.srcT);
      if (sx < -4 || sx > W + 4) continue;
      const r = 1.4 + 2.6 * e.v / 127;
      dot(sx, Y(e.p), r, techColor(e.tech));
      if (e.p !== e.srcP) {   // remap trace: a faint tick at the original pitch
        ctx.strokeStyle = 'rgba(63,167,184,0.35)';
        ctx.beginPath(); ctx.moveTo(sx, Y(e.srcP)); ctx.lineTo(sx, Y(e.p)); ctx.stroke();
      }
    }
  }
  $('info').textContent = cur + ': ' + cl.n + ' notes / ' + cl.span.toFixed(1) + 's' +
    (sel ? ' — sel ' + sel[0].toFixed(2) + '–' + sel[1].toFixed(2) + 's (' + sourceEvents().length + 'n)' : '') +
    (transformed ? trDesc() : '');
}

// selection drag (horizontal only)
(() => {
  const cv = $('roll');
  let dragging = false, startT = 0;
  const timeAt = e => {
    const r = cv.getBoundingClientRect();
    return Math.max(0, Math.min(rollSpan(), rollTimeAt(e.clientX - r.left)));
  };
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    // with ALT held, some devices deliver the motion as deltaX — use the dominant axis
    const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (e.altKey) {
      // zoom anchored at the mouse position
      const r = cv.getBoundingClientRect();
      const anchorT = rollTimeAt(e.clientX - r.left);
      const f = d < 0 ? 1.18 : 1 / 1.18;
      pxPerSec = Math.max(fitPps() * 0.5, Math.min(Math.max(600, fitPps() * 10), pps() * f));
      viewT0 = anchorT - (e.clientX - r.left - 8) / pxPerSec;
    } else {
      viewT0 += d / pps();
    }
    drawRoll();
  }, { passive: false });
  let moved = false, dragMode = 'new';
  const nearEdge = e => {
    if (!sel) return null;
    const x = e.clientX - cv.getBoundingClientRect().left;
    if (Math.abs(x - rollX(sel[0])) < 7) return 'lo';
    if (Math.abs(x - rollX(sel[1])) < 7) return 'hi';
    return null;
  };
  cv.addEventListener('mousedown', e => {
    if (!cur) return;
    dragging = true; moved = false; startT = timeAt(e);
    dragMode = nearEdge(e) || 'new';
    if (dragMode !== 'new') moved = true;   // grabbing an edge IS a drag
  });
  cv.addEventListener('mousemove', e => {
    if (!dragging) { cv.style.cursor = nearEdge(e) ? 'ew-resize' : 'crosshair'; return; }
    const t = timeAt(e);
    if (dragMode === 'lo') { sel = [Math.min(t, sel[1] - 0.05), sel[1]]; cursorT = sel[0]; drawRoll(); return; }
    if (dragMode === 'hi') { sel = [sel[0], Math.max(t, sel[0] + 0.05)]; drawRoll(); return; }
    if (Math.abs(t - startT) * pps() > 5) moved = true;   // >5px = a drag
    if (moved) {
      sel = [Math.min(startT, t), Math.max(startT, t)];
      cursorT = sel[0];
      drawRoll();
    }
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    if (dragMode !== 'new') { drawRoll(); updateSelInfo(); return; }
    if (!moved || (sel && sel[1] - sel[0] < 0.05)) {
      // a CLICK: cursor here, selection collapsed (the audio-editor rule)
      sel = null;
      cursorT = startT;
      selSnip = null;
    } else if (sel) {
      cursorT = sel[0];
      selSnip = null;
    }
    drawRoll(); updateSelInfo();
  });
})();
function updateSelInfo() {
  $('selInfo').textContent = sel
    ? 'sel ' + sel[0].toFixed(2) + '–' + sel[1].toFixed(2) + 's · ' + sourceEvents().length + ' notes'
    : cursorT > 0
    ? 'cursor @ ' + cursorT.toFixed(2) + 's · SPACE plays to end · HOME = start'
    : 'click = cursor · drag = select · SPACE = play/stop';
}

// ---- playback ----
let MIDI = null, OUTS = {}, pending = [];
async function midiInit() {
  const st = $('midiStatus');
  try {
    MIDI = await navigator.requestMIDIAccess();
    OUTS = {};
    MIDI.outputs.forEach(o => { OUTS[o.name.toLowerCase()] = o; });
    const missing = [];
    for (let i = 1; i <= 10; i++) {
      if (!OUTS['tuba' + i]) missing.push('tuba' + i);
      if (!OUTS['tuba' + i + 'b']) missing.push('tuba' + i + 'b');
    }
    st.textContent = missing.length ? 'midi: missing ' + missing.slice(0, 3).join(',') + '…' : 'midi: 10 tubas ready';
    hookInputs();
  } catch (e) { st.textContent = 'midi: unavailable'; }
}
// round-robin with cooldown: pick the least-recently-used free player
function assignPlayers(ev) {
  const busyUntil = Array(10).fill(-1);
  return ev.map(e => {
    const end = e.t + (e.tech === 'ord' ? e.d : (techLen(e.tech, e.p) || e.d));
    let k = -1, oldest = Infinity;
    for (let i = 0; i < 10; i++)
      if (busyUntil[i] + 0.04 <= e.t && busyUntil[i] < oldest) { oldest = busyUntil[i]; k = i; }
    if (k < 0) { k = busyUntil.indexOf(Math.min(...busyUntil)); }   // steal the earliest-free
    busyUntil[k] = end;
    return { ...e, player: k };
  });
}
let cursorTimer = null, playT0 = null, playSpanS = 0;
function stopCursor() {
  if (cursorTimer) clearInterval(cursorTimer);
  cursorTimer = null; playT0 = null;
  $('playCursor').style.display = 'none';
}
function startCursor(spanS, leadMs) {
  stopCursor();
  playT0 = performance.now() + (leadMs || 0);
  playSpanS = spanS;
  const cv = $('roll');
  cursorTimer = setInterval(() => {
    if (playT0 === null) return;
    const played = (performance.now() - playT0) / 1000;
    if (played < 0) return;                       // still in the lead-in
    if (played > playSpanS + 0.3) return stopCursor();
    // inverse of the time transforms: played -> source (selection-local) time
    let srcLocal = played / TR.stretch;
    if (TR.reverse) {
      const ev = sourceEvents();
      const S = ev.length ? Math.max(...ev.map(e => e.t)) : 0;
      srcLocal = S - srcLocal;
    }
    let rollT = (sel ? sel[0] : cursorT) + srcLocal;
    if (sel) rollT = Math.min(rollT, sel[1]);        // never scroll past the band
    const x = rollX(rollT);
    const cu = $('playCursor');
    if (x < 0 || x > cv.clientWidth) { cu.style.display = 'none'; }
    else {
      cu.style.display = 'block';
      cu.style.left = x + 'px';
    }
  }, 33);
}
let playing = false;
function stopAll() {
  playing = false;
  stopCursor();
  pending.forEach(clearTimeout);
  pending = [];
  for (let i = 1; i <= 10; i++) for (const sub of ['', 'b']) {
    const out = OUTS['tuba' + i + sub];
    if (out) for (const ch of [0, 3, 4, 10]) out.send([0xB0 | ch, 123, 0]);
  }
}
const SCHED_LEAD_MS = 150;   // the first note must never race play()'s all-notes-off
function play() {
  if (!MIDI || !cur) return;
  stopAll();
  const ev = assignPlayers(viewEvents());
  for (const e of ev) {
    const sub = e.tech === 'staccato' ? 'b' : '';
    const ch = (e.tech === 'fortepiano' ? 11 : e.tech === 'staccato' ? 4 : e.tech === 'cuivre' ? 5 : 1) - 1;
    const out = OUTS['tuba' + (e.player + 1) + sub];
    if (!out) continue;
    const holdMs = (e.tech === 'ord' ? e.d : (techLen(e.tech, e.p) || e.d)) * 1000;
    pending.push(setTimeout(() => {
      out.send([0xB0 | ch, 7, 127]);
      out.send([0x90 | ch, e.p, e.v]);
      pending.push(setTimeout(() => out.send([0x80 | ch, e.p, 0]), holdMs));
    }, e.t * 1000 + SCHED_LEAD_MS));
  }
  const spanS = viewSpan(ev);
  const lastAttack = Math.max.apply(null, ev.map(e => e.t));
  playing = true;
  pending.push(setTimeout(() => { playing = false; }, spanS * 1000 + SCHED_LEAD_MS + 300));
  startCursor(lastAttack + 0.15, SCHED_LEAD_MS);
  $('info').textContent = 'playing ' + ev.length + ' notes / ' + spanS.toFixed(1) + 's' + trDesc();
}
function trDesc() {
  const bits = [];
  if (TR.stretch !== 1) bits.push('×' + TR.stretch);
  if (TR.tonality) bits.push(TR.tonality);
  if (TR.chord) bits.push('ch' + TR.chord.replace('VERT01-', ''));
  if (TR.reverse) bits.push('rev');
  if (TR.oct) bits.push('oct' + (TR.oct > 0 ? '+' : '') + TR.oct);
  if (TR.thin < 100) bits.push('thin' + TR.thin + '%');
  if ((TR.tonality || TR.chord) && !TR.pool) bits.push('literal');
  return bits.length ? ' — ' + bits.join(' · ') : '';
}

// ---- recording ----
let recording = false, recEvents = [], recOpen = {}, recT0 = null;
// live THRU: your keyboard sounds through the chosen rec preset, always —
// switching the preset switches the patch you hear. Note-offs follow the
// route their note-on took, so a mid-note preset change can't strand a note.
const thruRoute = () => {
  const tech = $('recTech').value;
  return tech === 'staccato' ? { out: OUTS['tuba1b'], ch: 3 }
       : tech === 'fortepiano' ? { out: OUTS['tuba1'], ch: 10 }
       : { out: OUTS['tuba1'], ch: 0 };
};
const thruOpen = {};
function hookInputs() {
  MIDI.inputs.forEach(inp => {
    // loopMIDI ports are BIDIRECTIONAL: echoing what arrives on tuba* would
    // feed our own output back through the thru forever. Keyboards only.
    if (/^tuba\d+b?$/i.test(inp.name.trim())) return;
    inp.onmidimessage = m => {
      const [st, p, v] = m.data;
      const cmd = st & 0xF0;
      const now = performance.now();
      if (cmd === 0x90 && v > 0) {
        const r = thruRoute();
        if (r.out) {
          r.out.send([0xB0 | r.ch, 7, 127]);
          r.out.send([0x90 | r.ch, p, v]);
          thruOpen[p] = r;
        }
        if (recording) {
          if (recT0 === null) recT0 = now;
          recOpen[p] = { t: (now - recT0) / 1000, v, tech: $('recTech').value };
        }
      } else if (cmd === 0x80 || (cmd === 0x90 && v === 0)) {
        const r = thruOpen[p];
        if (r && r.out) { r.out.send([0x80 | r.ch, p, 0]); delete thruOpen[p]; }
        const o = recOpen[p];
        if (o && recording) {
          recEvents.push({ t: +o.t.toFixed(3), p, v: o.v,
            d: +Math.max(0.05, (now - recT0) / 1000 - o.t).toFixed(3),
            tech: o.tech });
          delete recOpen[p];
        }
      }
    };
  });
}
async function toggleRec() {
  const b = $('recBtn');
  if (!recording) {
    recording = true; recEvents = []; recOpen = {}; recT0 = null;
    b.classList.add('rec');
    b.textContent = '■ stop (0 notes)';
    const tick = setInterval(() => {
      if (!recording) return clearInterval(tick);
      b.textContent = '■ stop (' + recEvents.length + ' notes)';
    }, 500);
  } else {
    recording = false;
    b.classList.remove('rec');
    b.textContent = '● rec';
    if (!recEvents.length) { $('info').textContent = 'nothing recorded'; return; }
    const name = prompt('Name this cluster (blank = auto):') || '';
    const r = await fetch('/api/clusterbank', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveCluster', name, events: recEvents, tech: $('recTech').value }) })
      .then(x => x.json());
    if (r.success) { await loadBank(); setCluster(r.id); $('info').textContent = r.id + ' saved (' + recEvents.length + ' notes)'; }
  }
}

// ---- snippets ----
function drawSnips() {
  const row = $('snips');
  row.innerHTML = '<span class="hint">snippets:</span>';
  const ids = Object.keys(BANK.snippets);
  if (!ids.length) { row.innerHTML += ' <span class="hint">(none — select a span and ↵ snippet)</span>'; return; }
  ids.forEach(id => {
    const sn = BANK.snippets[id];
    const el = document.createElement('span');
    el.className = 'snip' + (id === selSnip ? ' on' : '');
    el.innerHTML = id + ' · ' + sn.cluster + ' ' + sn.t0.toFixed(1) + '–' + sn.t1.toFixed(1) + 's<span class="x" data-x="' + id + '">×</span>';
    el.addEventListener('click', async e => {
      if (e.target.dataset.x) {
        await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'deleteSnippet', id: e.target.dataset.x }) });
        await loadBank(); drawSnips();
        return;
      }
      setCluster(sn.cluster, false);
      sel = [sn.t0, sn.t1];
      cursorT = sn.t0;
      selSnip = id;
      drawRoll(); drawSnips(); updateSelInfo();
    });
    row.appendChild(el);
  });
}

// ---- tonality chips ----
function buildTonRow() {
  const row = $('tonRow');
  const orig = document.createElement('button');
  orig.className = 'chip on';
  orig.textContent = 'original';
  orig.id = 'tonOrig';
  row.insertBefore(orig, $('chordSel'));
  orig.addEventListener('click', () => { TR.tonality = null; TR.chord = null; $('chordSel').value = ''; tonHi(); drawRoll(); });
  Object.keys(TONALITIES).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip ton';
    b.dataset.t = k;
    b.textContent = k;
    b.title = TONALITIES[k].map(nm).join(' ');
    row.insertBefore(b, $('chordSel'));
    b.addEventListener('click', () => { TR.tonality = k; TR.chord = null; $('chordSel').value = ''; tonHi(); drawRoll(); });
  });
  $('chordSel').addEventListener('change', function () {
    this.blur();
    TR.chord = this.value || null;
    if (this.value) TR.tonality = null;
    tonHi(); drawRoll();
  });
}
function tonHi() {
  $('tonOrig').classList.toggle('on', !TR.tonality && !TR.chord);
  document.querySelectorAll('.ton').forEach(b => b.classList.toggle('on', b.dataset.t === TR.tonality));
}

// ---- store ----
async function refreshLists() {
  const s = $('listSel');
  const keep = s.value;
  s.innerHTML = '<option value="">— choose —</option><option value="__library__">library only</option>';
  Object.keys(BANK.lists).forEach(l => {
    const o = document.createElement('option');
    o.value = l;
    o.textContent = l + ' (' + BANK.lists[l].length + ')';
    s.appendChild(o);
  });
  const nw = document.createElement('option');
  nw.value = '__new__';
  nw.textContent = 'new list…';
  s.appendChild(nw);
  if (keep) s.value = keep;
}
$('listSel').addEventListener('change', async function () {
  this.blur();
  if (this.value === '__new__') {
    const name = prompt('New list name:');
    this.value = '';
    if (!name) return;
    await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'createList', name }) });
    await loadBank(); refreshLists();
    this.value = name;
  }
});
async function store() {
  if (!cur) return;
  const dest = $('listSel').value;
  if (!dest) {
    const s = $('listSel');
    s.classList.add('flash');
    setTimeout(() => s.classList.remove('flash'), 900);
    $('storeMsg').textContent = 'choose a destination first';
    setTimeout(() => { $('storeMsg').textContent = ''; }, 2200);
    return;
  }
  const ev = viewEvents();
  if (!ev.length) return;
  const r = await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveGesture', events: ev, span: viewSpan(ev),
      provenance: { cluster: cur, sel, snippet: selSnip, transforms: { ...TR } }, list: dest }) })
    .then(x => x.json());
  if (r.success) {
    $('storeMsg').textContent = r.id + (r.existed ? ' (already in library)' : ' stored') +
      (r.added ? ' → ' + dest : '');
    setTimeout(() => { $('storeMsg').textContent = ''; }, 3000);
    await loadBank(); refreshLists();
  }
}

// ---- wiring ----
function setCluster(id, clearSel = true) {
  cur = id;
  pxPerSec = null; viewT0 = 0; cursorT = 0;
  $('clSel').value = id;
  if (clearSel) { sel = null; selSnip = null; }
  TR = trDefault();
  $('strSlider').value = 1; $('strV').textContent = '1.00×';
  $('thin').value = 100; $('thinV').textContent = '100%';
  $('revBtn').classList.remove('on');
  const pb = $('poolBtn');
  if (pb) { pb.classList.add('on'); pb.textContent = 'pooled'; }
  document.querySelectorAll('.str').forEach(b => b.classList.toggle('on', b.dataset.f === '1'));
  if ($('tonOrig')) tonHi();
  drawRoll(); updateSelInfo();
}
async function loadBank() {
  BANK = (await fetch('/api/clusterbank').then(r => r.json())).bank;
  const s = $('clSel');
  const keep = s.value;
  s.innerHTML = '';
  const fams = {};
  Object.entries(BANK.clusters).forEach(([id, c]) => { (fams[c.family] = fams[c.family] || []).push(id); });
  Object.keys(fams).sort().forEach(f => {
    const og = document.createElement('optgroup');
    og.label = f;
    fams[f].forEach(id => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = id + ' (' + BANK.clusters[id].n + 'n/' + BANK.clusters[id].span.toFixed(0) + 's)';
      og.appendChild(o);
    });
    s.appendChild(og);
  });
  if (keep && BANK.clusters[keep]) s.value = keep;
}

$('zoomIn').addEventListener('click', () => {
  const mid = viewT0 + ($('roll').clientWidth - 16) / pps() / 2;
  pxPerSec = Math.min(Math.max(600, fitPps() * 10), pps() * 1.5);
  viewT0 = mid - ($('roll').clientWidth - 16) / pxPerSec / 2;
  drawRoll();
});
$('zoomOut').addEventListener('click', () => {
  const mid = viewT0 + ($('roll').clientWidth - 16) / pps() / 2;
  pxPerSec = Math.max(fitPps() * 0.5, pps() / 1.5);
  viewT0 = mid - ($('roll').clientWidth - 16) / pxPerSec / 2;
  drawRoll();
});
$('zoomFit').addEventListener('click', () => { pxPerSec = null; viewT0 = 0; drawRoll(); });
$('clSel').addEventListener('change', function () { this.blur(); setCluster(this.value); });
$('playBtn').addEventListener('click', play);
$('stopBtn').addEventListener('click', stopAll);
$('recBtn').addEventListener('click', toggleRec);
$('selClear').addEventListener('click', () => { sel = null; selSnip = null; cursorT = 0; drawRoll(); updateSelInfo(); });
$('snipSave').addEventListener('click', async () => {
  if (!cur || !sel) { $('selInfo').textContent = 'select a span first'; return; }
  const r = await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveSnippet', cluster: cur, t0: sel[0], t1: sel[1] }) }).then(x => x.json());
  if (r.success) { selSnip = r.id; await loadBank(); drawSnips(); }
});
document.querySelectorAll('.str').forEach(b => b.addEventListener('click', () => {
  TR.stretch = +b.dataset.f;
  $('strSlider').value = TR.stretch;
  $('strV').textContent = TR.stretch.toFixed(2) + '×';
  document.querySelectorAll('.str').forEach(x => x.classList.toggle('on', x === b));
  drawRoll();
}));
$('strSlider').addEventListener('input', function () {
  TR.stretch = +this.value;
  $('strV').textContent = TR.stretch.toFixed(2) + '×';
  document.querySelectorAll('.str').forEach(x => x.classList.remove('on'));
});
$('strSlider').addEventListener('change', function () { this.blur(); drawRoll(); });
$('revBtn').addEventListener('click', function () { TR.reverse = !TR.reverse; this.classList.toggle('on', TR.reverse); drawRoll(); });
$('octUp').addEventListener('click', () => { TR.oct = Math.min(2, TR.oct + 1); drawRoll(); });
$('octDn').addEventListener('click', () => { TR.oct = Math.max(-2, TR.oct - 1); drawRoll(); });
$('thin').addEventListener('input', function () { TR.thin = +this.value; $('thinV').textContent = TR.thin + '%'; });
$('thin').addEventListener('change', function () { this.blur(); drawRoll(); });
$('resetBtn').addEventListener('click', () => { const id = cur; setCluster(id, false); drawRoll(); });
$('poolBtn').addEventListener('click', function () {
  TR.pool = !TR.pool;
  this.classList.toggle('on', TR.pool);
  this.textContent = TR.pool ? 'pooled' : 'literal';
  drawRoll();
});
$('storeBtn').addEventListener('click', store);
window.addEventListener('keyup', e => {
  // bare ALT release focuses Chrome's menu and eats the next interaction
  if (e.key === 'Alt') e.preventDefault();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Home') {
    e.preventDefault();
    sel = null; cursorT = 0; viewT0 = 0;
    drawRoll(); updateSelInfo();
    return;
  }
  if (e.code === 'Space' && !(e.target.matches && e.target.matches('input[type=text]'))) {
    e.preventDefault();
    if (playing) stopAll(); else play();
  }
  if (e.key === 'Escape') stopAll();
});
window.addEventListener('resize', drawRoll);

(async () => {
  try { SAMPLE_LEN = await fetch('/bank/sample_lengths.json').then(r => r.json()); } catch (e) {}
  try {
    // all 33 played chords as remap targets (bank files; taxonomy only holds the working set)
    const ids = Array.from({ length: 33 }, (_, i) => String(i + 1).padStart(2, '0'));
    const banks = await Promise.all(ids.map(n =>
      fetch('/bank/VERT01-' + n + '.json').then(r => r.ok ? r.json() : null).catch(() => null)));
    const cs = $('chordSel');
    ids.forEach((n, i) => {
      if (!banks[i] || !banks[i].pitches) return;
      const k = 'VERT01-' + n;
      const ps = [...new Set(banks[i].pitches.map(p => foldInto(p)))].sort((a, b) => a - b);
      TAXCH[k] = ps;
      // descriptor: count, range, shape (cluster / split / spread)
      const iv = ps.slice(1).map((p, j) => p - ps[j]);
      const shape = iv.length === 0 ? ''
        : Math.max.apply(null, iv) >= 12 ? 'split'
        : iv.filter(x => x <= 2).length >= iv.length * 0.6 ? 'cluster'
        : 'spread';
      const o = document.createElement('option');
      o.value = k;
      o.textContent = 'ch ' + n + ' · ' + ps.length + 'n ' + nm(ps[0]) + '–' + nm(ps[ps.length - 1]) +
        (shape ? ' · ' + shape : '');
      cs.appendChild(o);
    });
  } catch (e) {}
  buildTonRow();
  await loadBank();
  await midiInit();
  refreshLists();
  drawSnips();
  const first = Object.keys(BANK.clusters)[0];
  if (first) setCluster(first);
})();
</script>
