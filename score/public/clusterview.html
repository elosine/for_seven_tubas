<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cluster Sandbox</title>
<!-- v2 REBUILD (composer 2026-08-15). Architecture lessons from v1:
     1. ONE transport model (audio-editor standard): cursor+selection are one
        concept; click=cursor, drag=select, SPACE=play/stop, HOME=zero.
     2. MIDI thru NEVER listens to loopMIDI (tuba*) ports - feedback-proof.
     3. Playback schedules with a lead so note 1 never races all-notes-off.
     4. Snippets are EDITABLE COPIES (mini piano-roll); sources are immutable.
     5. No auto-play anywhere; transforms are a non-destructive VIEW. -->
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1c1c1e; color: #ddd;
         margin: 0; padding: 8px 16px 30px; }
  .bar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; font-size: 12px; padding: 3px 0; }
  select, button, input[type=text] { background: #2a2a2e; color: #ddd; border: 1px solid #555;
         border-radius: 4px; padding: 3px 8px; font-size: 12px; }
  button { cursor: pointer; }
  button.on { background: #4a3a12; border-color: #B8860B; color: #ffd479; }
  button.rec { background: #5a2020; border-color: #a44; color: #ffb4b4; }
  button.chip { padding: 2px 7px; font-size: 11px; }
  button.chip.on { background: #14424a; border-color: #3FA7B8; color: #8fdbe8; }
  input[type=range] { width: 100px; vertical-align: middle; }
  input.numbox { width: 54px; padding: 2px 4px; font-size: 11px; font-family: Consolas, monospace;
                 background: #232327; color: #ffd479; border: 1px solid #444; border-radius: 3px;
                 text-align: right; }
  input.numbox:focus { border-color: #B8860B; outline: none; }
  #strSlider { width: 170px; }
  #velSlider { width: 120px; }
  .hint { color: #777; }
  #roll { display: block; width: 100%; height: 380px; background: #202024;
          border: 1px solid #333; border-radius: 6px; cursor: crosshair; }
  #rollWrap { position: relative; margin-top: 4px; }
  #playCursor { position: absolute; top: 0; bottom: 0; width: 0;
                border-left: 1.5px solid #ffd479; display: none; pointer-events: none; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11px; padding: 2px 0; }
  .snip { background: #232327; border: 1px solid #555; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  .snip.on { border-color: #3FA7B8; color: #8fdbe8; }
  .snip .x { color: #777; margin-left: 5px; }
  .snip .x:hover { color: #ff9c54; }
  select.flash { border-color: #ff9c54; box-shadow: 0 0 6px #ff9c54; }
  #editBar { background: #17272b; border: 1px solid #2c4a52; border-radius: 5px; padding: 3px 8px; }
</style>
</head>
<body>

<div class="bar">
  <select id="clSel" title="the cluster bank: imported takes + your recordings"></select>
  <button id="playBtn" title="SPACE - play/stop the selection (or cursor to end)">&#9654; play</button>
  <button id="stopBtn" title="stop (ESC)">&#9632;</button>
  <span class="hint">|</span>
  <select id="recTech" title="the articulation you play through (live thru; recordings are labelled with it)">
    <option value="staccato">rec: staccato</option>
    <option value="fortepiano">rec: fortepiano</option>
    <option value="ord">rec: ordinario</option>
    <option value="cuivre">rec: cuivre</option>
  </select>
  <button id="recBtn" title="record from your MIDI keyboard - first note starts the clock">&#9679; rec</button>
  <span class="hint">|</span>
  <span id="selInfo" class="hint"></span>
  <button id="selClear" title="clear selection + cursor to 0 (HOME)">clear</button>
  <button id="snipSave" title="cut the selection (or the whole thing) into an editable snippet COPY">&#9986; snippet</button>
  <span class="hint">|</span>
  <button id="zoomIn" title="zoom in (ALT+wheel on the roll)">+</button>
  <button id="zoomOut" title="zoom out">&#8722;</button>
  <button id="zoomFit" title="fit">fit</button>
  <span style="flex:1 1 auto"></span>
  <span class="hint" id="midiStatus">midi: &#8230;</span>
</div>

<div class="bar" id="editBar" style="display:none">
  <b id="editTitle" style="color:#8fdbe8"></b>
  <span class="hint" id="editProv"></span>
  <span class="hint">&#183; click note = select &#183; drag = move (pitch/time) &#183; right edge = length (ord)
    &#183; dbl-click note = articulation &#183; dbl-click empty = add &#183; DEL = delete
    &#183; &#8593;/&#8595; = velocity</span>
  <span id="selNoteInfo" style="color:#ffd479; font-family:Consolas,monospace"></span>
  <input type="text" id="noteVel" class="numbox" style="display:none"
         title="velocity of the selected note(s), 1-127 - ENTER to apply">
  <span id="dirtyDot" style="color:#ff9c54; display:none">&#9679; unsaved</span>
  <button id="saveOverBtn" class="chip" style="display:none"
          title="overwrite the stored keeper - the composer score's strip reads this">&#10515; save over</button>
  <button id="saveAsBtn" class="chip" style="display:none"
          title="keep the original and store this as a NEW gesture">&#10515; save as new</button>
  <button id="backBtn" class="chip">&#9666; back to sources</button>
</div>

<div id="rollWrap">
  <canvas id="roll" width="1600" height="380"></canvas>
  <div id="playCursor"></div>
</div>

<div class="chiprow" id="snips"></div>
<div class="chiprow" id="gests"></div>

<div class="bar">
  <span class="hint">time:</span>
  <button class="chip str" data-f="0.5">&#215;0.5</button>
  <button class="chip str" data-f="0.75">&#215;0.75</button>
  <button class="chip str on" data-f="1">&#215;1</button>
  <button class="chip str" data-f="1.5">&#215;1.5</button>
  <button class="chip str" data-f="2">&#215;2</button>
  <button class="chip str" data-f="4">&#215;4</button>
  <button class="chip str" data-f="10">&#215;10</button>
  <label title="logarithmic - x0.5 and x2 sit symmetrically about x1; double-click to type a value">fine
    <input type="range" id="strSlider" min="0" max="1000" step="1" value="376"></label>
  <input type="text" id="strV" class="numbox" value="1.00" title="type a stretch factor (0.25-10), ENTER to apply">
  <span class="hint">|</span>
  <button class="chip" id="revBtn" title="mirror the attack pattern in time">reverse</button>
  <button class="chip" id="octDn" title="down an octave (folds back into range)">oct &#8722;</button>
  <button class="chip" id="octUp" title="up an octave (folds back into range)">oct +</button>
  <label>thin <input type="range" id="thin" min="10" max="100" step="5" value="100"><span id="thinV" class="hint">100%</span></label>
  <span class="hint">|</span>
  <label title="scale every velocity; double-click to type">vel
    <input type="range" id="velSlider" min="20" max="200" step="1" value="100"></label>
  <input type="text" id="velV" class="numbox" value="100%" title="velocity scale in percent (20-200), ENTER to apply">
  <button id="resetBtn" title="drop all transforms (the entity itself is untouched)">&#8634; original</button>
</div>

<div class="bar" id="tonRow">
  <span class="hint">tonality:</span>
  <select id="chordSel" title="remap onto any of the 33 played chords"><option value="">chord&#8230;</option></select>
  <button class="chip on" id="poolBtn" title="POOLED: the target's pitch classes over the whole range (keeps register/contour). LITERAL: exactly the target's notes">pooled</button>
</div>

<div class="bar">
  <button id="storeBtn" title="bake what you HEAR (entity + transforms) into a keeper gesture CG###">&#9733; store &#8594;</button>
  <span class="hint">add to:</span>
  <select id="listSel"></select>
  <span id="storeMsg" style="color:#ff9c54"></span>
  <span class="hint" id="info"></span>
</div>

<script>
'use strict';
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const LO = 30, HI = 65, TOP = 67;          // ord range; cuivre extends to 67
const $ = id => document.getElementById(id);

// ================= tonality palette =================
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const pcsPool = pcs => range(LO, HI).filter(m => pcs.includes(m % 12));
const onPc = (root, degs) => degs.map(d => (root + d) % 12);
const ROW = (() => {
  const pcs = [0, 7, 3, 10, 5, 1, 8, 4, 11, 6, 2];
  return pcs.map((pc, i) => {
    const target = LO + (HI - LO) * ((i * 7) % 11) / 10;
    let best = null;
    for (let m = LO; m <= HI; m++)
      if (m % 12 === pc && (best === null || Math.abs(m - target) < Math.abs(best - target))) best = m;
    return best;
  }).sort((a, b) => a - b);
})();
const TONALITIES = {
  'cl low': range(30, 36), 'cl mid': range(44, 50), 'cl high': range(59, 65),
  'cl spread': [30, 36, 43, 47, 56, 57, 58],
  'BbE 2oct': [...range(34, 40), ...range(58, 64)],
  '5ths 30': [30, 37, 44, 51, 58, 65], '5ths 37': [37, 44, 51, 58, 65],
  'oct F#': [30, 42, 54], 'oct Bb': [34, 46, 58],
  'm7 (F#)': pcsPool(onPc(6, [0, 1, 2, 3, 5, 6, 7, 8, 10, 11])),
  'm4 (F#)': pcsPool(onPc(6, [0, 1, 2, 5, 6, 7, 8, 11])),
  'm6 (F#)': pcsPool(onPc(6, [0, 2, 4, 5, 6, 8, 10, 11])),
  'm3 (F)': pcsPool(onPc(5, [0, 2, 3, 4, 6, 7, 8, 10, 11])),
  'Bhairav (F)': pcsPool(onPc(5, [0, 1, 4, 5, 7, 8, 11])),
  'row (placed)': ROW,
};

// ================= CC7 = LOUDNESS (composer 2026-08-15) =================
// SI2 responds to CC7, not to note velocity - the composer score sets CC7 from
// the curve and passes velocity only as data. The sandbox was sending CC7=127
// for every note, which is why the velocity dial was inaudible. Same calibrated
// map (probes/cc7_map.json), same 40 dB musical span as Composer.levelSpanDb.
let CC7_POINTS = null;
const LEVEL_SPAN_DB = 40;
function velToCC(v) {
  const x = Math.max(0, Math.min(1, v / 127));
  if (x <= 0.001) return 0;
  if (!CC7_POINTS) return Math.round(x * 127);
  const target = (x - 1) * LEVEL_SPAN_DB;          // 0 dB at full velocity
  if (target <= CC7_POINTS[0].db) return CC7_POINTS[0].cc;
  for (let i = 1; i < CC7_POINTS.length; i++) {
    if (target <= CC7_POINTS[i].db) {
      const a = CC7_POINTS[i - 1], b = CC7_POINTS[i];
      const f = (target - a.db) / Math.max(1e-6, b.db - a.db);
      return Math.round(a.cc + f * (b.cc - a.cc));
    }
  }
  return CC7_POINTS[CC7_POINTS.length - 1].cc;
}

// ================= measured one-shot lengths (probe 2026-08-15) =================
let SAMPLE_LEN = null;
const FIXED_FALLBACK = { fortepiano: 1.67, staccato: 0.45, cuivre: 1.17 };
function techLen(tech, pitch) {
  const tbl = SAMPLE_LEN && SAMPLE_LEN[tech];
  if (tbl && tbl[pitch] != null) return tbl[pitch];
  if (tbl) {
    const keys = Object.keys(tbl).map(Number);
    if (keys.length) return tbl[keys.reduce((a, b) => Math.abs(b - pitch) < Math.abs(a - pitch) ? b : a)];
  }
  return FIXED_FALLBACK[tech];               // undefined for ord = variable
}
const VARIABLE = new Set(['ord', 'cuivre']);
const soundLen = e => VARIABLE.has(e.tech) ? e.d : (techLen(e.tech, e.p) || e.d);
const CUIVRE_LO = 60, CUIVRE_HI = 67;      // the patch's sampled cuivre range

// ================= state =================
let BANK = null, TAXCH = {};
// the loaded ENTITY: a cluster (immutable source) or a snippet (editable copy)
let entity = { kind: 'cluster', id: null };
let sel = null, cursorT = 0;               // ONE transport concept
// selected NOTE OBJECTS (not indices - the array re-sorts after a time drag,
// which would invalidate indices; references stay valid)
let selNotes = new Set();
const trDefault = () => ({ stretch: 1, tonality: null, chord: null, reverse: false, oct: 0, thin: 100, pool: true, vel: 100 });
// the stretch slider is LOGARITHMIC: x0.5 and x2 sit symmetrically about x1,
// and the musically-sensitive low end gets the resolution it needs
const STR_MIN = 0.25, STR_MAX = 10, STR_STEPS = 1000;
const strToPos = v => Math.round(STR_STEPS * Math.log(v / STR_MIN) / Math.log(STR_MAX / STR_MIN));
const posToStr = q => +(STR_MIN * Math.pow(STR_MAX / STR_MIN, q / STR_STEPS)).toFixed(3);
let TR = trDefault();
const trActive = () => TR.stretch !== 1 || TR.tonality || TR.chord || TR.reverse || TR.oct || TR.thin < 100 || TR.vel !== 100;
// LAYOUT transforms move notes on the roll, so the picture stops matching the
// data and editing has to pause. Velocity is NOT one of them (composer
// 2026-08-15: changing the global velocity was silently killing note editing).
const layoutTransformed = () => TR.stretch !== 1 || TR.tonality || TR.chord || TR.reverse || TR.oct || TR.thin < 100;
const blockingTransforms = () => {
  const b = [];
  if (TR.stretch !== 1) b.push('stretch');
  if (TR.tonality || TR.chord) b.push('tonality');
  if (TR.reverse) b.push('reverse');
  if (TR.oct) b.push('octave');
  if (TR.thin < 100) b.push('thin');
  return b;
};
let pxPerSec = null, viewT0 = 0;
const isSnip = () => entity.kind === 'snippet';
const isGest = () => entity.kind === 'gesture';
// a recalled gesture is edited as an in-memory DRAFT: the stored keeper is
// untouched until you press save-over (composer 2026-08-15, same working-copy
// safety the piece files got). Snippets autosave; gestures never do.
let gestDraft = null, gestDirty = false;
const canEdit = () => (isSnip() || isGest()) && !layoutTransformed();

function baseObj() {
  if (!BANK || !entity.id) return null;
  if (isGest()) return gestDraft;
  return isSnip() ? BANK.snippets[entity.id] : BANK.clusters[entity.id];
}
function baseEvents() { const o = baseObj(); return (o && o.events) || []; }
function baseSpan() {
  const ev = baseEvents();
  return ev.length ? Math.max(0.5, ...ev.map(e => e.t + soundLen(e))) : 0.5;
}

// ================= transport window + transforms (non-destructive view) =================
const EDGE_EPS = 0.03;                     // a note AT the window edge plays
function playWindow() { return sel ? [sel[0], sel[1]] : [cursorT, baseSpan()]; }
function sourceEvents() {
  const w = playWindow();
  return baseEvents()
    .filter(e => e.t >= w[0] - EDGE_EPS && e.t <= w[1] + 0.001)
    .map(e => ({ ...e, srcT: e.t, srcP: e.p, t: +Math.max(0, e.t - w[0]).toFixed(3) }));
}
function foldInto(p) { while (p < LO) p += 12; while (p > HI) p -= 12; return p; }
function viewEvents() {
  let ev = sourceEvents();
  if (!ev.length) return ev;
  if (TR.thin < 100) {
    const keep = Math.max(1, Math.round(ev.length * TR.thin / 100));
    const kept = new Set(ev.slice().sort((a, b) => b.v - a.v).slice(0, keep));
    ev = ev.filter(e => kept.has(e));
  }
  const span = Math.max(...ev.map(e => e.t));
  if (TR.reverse) ev = ev.map(e => ({ ...e, t: +(span - e.t).toFixed(3) })).sort((a, b) => a.t - b.t);
  if (TR.stretch !== 1) ev = ev.map(e => ({ ...e, t: +(e.t * TR.stretch).toFixed(3),
    d: VARIABLE.has(e.tech) ? +(e.d * TR.stretch).toFixed(3) : e.d }));
  const targetLit = TR.chord ? TAXCH[TR.chord] : TR.tonality ? TONALITIES[TR.tonality] : null;
  if (targetLit && targetLit.length) {
    const target = TR.pool ? pcsPool([...new Set(targetLit.map(q => q % 12))]) : targetLit;
    const nearestIn = (q, excl) => {
      let best = null, bd = 1e9;
      for (const m of target) {
        if (excl && excl.has(m)) continue;
        const d = Math.abs(m - q);
        if (d < bd) { bd = d; best = m; }
      }
      return best;
    };
    const map = {};
    for (const e of ev) {
      if (map[e.p] === undefined) map[e.p] = nearestIn(e.p);
      e.p = map[e.p];
    }
    // no-repeat kick: DISTINCT sources colliding on one target get bumped;
    // repeats present in the source stay repeats
    let prevP = null, prevSrc = null, curT = null, used = new Set();
    for (const e of ev) {
      if (curT === null || Math.abs(e.t - curT) > 0.001) { curT = e.t; used = new Set(); }
      let q = e.p;
      const clashPrev = prevP !== null && q === prevP && e.srcP !== prevSrc;
      if ((clashPrev || used.has(q)) && target.length > 1) {
        const excl = new Set(used);
        if (prevP !== null && e.srcP !== prevSrc) excl.add(prevP);
        const alt = nearestIn(e.srcP, excl);
        if (alt !== null) q = alt;
      }
      used.add(q);
      prevP = q; prevSrc = e.srcP;
      e.p = q;
    }
  }
  if (TR.oct) ev = ev.map(e => ({ ...e, p: foldInto(e.p + 12 * TR.oct) }));
  if (TR.vel !== 100)
    ev = ev.map(e => ({ ...e, v: Math.max(1, Math.min(127, Math.round(e.v * TR.vel / 100))) }));
  return ev;
}
const viewSpan = ev => ev.length ? Math.max(...ev.map(e => e.t + soundLen(e))) : 0;
function trDesc() {
  const b = [];
  if (TR.stretch !== 1) b.push('×' + TR.stretch);
  if (TR.tonality) b.push(TR.tonality);
  if (TR.chord) b.push('ch' + TR.chord.replace('VERT01-', ''));
  if (TR.reverse) b.push('rev');
  if (TR.oct) b.push('oct' + (TR.oct > 0 ? '+' : '') + TR.oct);
  if (TR.thin < 100) b.push('thin' + TR.thin + '%');
  if (TR.vel !== 100) b.push('vel ' + TR.vel + '%');
  if ((TR.tonality || TR.chord) && !TR.pool) b.push('literal');
  return b.length ? ' — ' + b.join(' · ') : '';
}

// ================= roll geometry =================
const KEYS_W = 54;                          // left piano gutter
function fitPps() { return ($('roll').clientWidth - KEYS_W - 12) / baseSpan(); }
function pps() { return pxPerSec || fitPps(); }
function clampView() {
  const maxT0 = Math.max(0, baseSpan() - ($('roll').clientWidth - KEYS_W - 12) / pps());
  viewT0 = Math.max(0, Math.min(maxT0, viewT0));
}
const rollX = t => KEYS_W + 6 + (t - viewT0) * pps();
const rollTimeAt = x => viewT0 + (x - KEYS_W - 6) / pps();
const rowH = () => ($('roll').clientHeight - 24) / (TOP - LO + 1);
const rollY = p => $('roll').clientHeight - 12 - (p - LO + 0.5) * rowH();
const pitchAt = y => Math.round(LO - 0.5 + ($('roll').clientHeight - 12 - y) / rowH());
const techColor = t => t === 'fortepiano' ? '#c9986e' : t === 'ord' ? '#8ea9c9'
                     : t === 'cuivre' ? '#ff9c54' : '#ffd479';

// ================= drawing =================
function drawRoll() {
  const cv = $('roll'), ctx = cv.getContext('2d');
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!entity.id) return;
  clampView();
  const rh = rowH();
  // piano gutter + row shading
  for (let p = LO; p <= TOP; p++) {
    const y = rollY(p) - rh / 2;
    const black = [1, 3, 6, 8, 10].includes(p % 12);
    ctx.fillStyle = black ? 'rgba(255,255,255,0.025)' : 'rgba(255,255,255,0.055)';
    ctx.fillRect(KEYS_W, y, W - KEYS_W, rh);
    ctx.fillStyle = black ? '#2e2e32' : '#d8d4cc';
    ctx.fillRect(0, y + 0.5, KEYS_W - 8, rh - 1);
    if (p % 12 === 0) {
      ctx.fillStyle = '#555';
      ctx.font = '9px Consolas';
      ctx.fillText(nm(p), 2, y + rh - 2);
      ctx.fillStyle = 'rgba(138,138,146,0.4)';
      ctx.fillRect(KEYS_W, y + rh, W - KEYS_W, 1);
    }
    if (p === HI) {                         // ord ceiling
      ctx.fillStyle = 'rgba(255,156,84,0.35)';
      ctx.fillRect(KEYS_W, y, W - KEYS_W, 1);
    }
  }
  // second ruler
  ctx.font = '9px Consolas';
  const visSpan = (W - KEYS_W - 12) / pps();
  const step = visSpan > 40 ? 5 : 1;
  for (let s2 = Math.floor(viewT0); s2 <= viewT0 + visSpan + 1; s2++) {
    const x = rollX(s2);
    if (x < KEYS_W || x > W) continue;
    ctx.fillStyle = '#3a3a40';
    ctx.fillRect(x, 0, 1, H);
    if (s2 % step === 0) { ctx.fillStyle = '#666'; ctx.fillText(s2 + 's', x + 2, 9); }
  }
  // selection band
  if (sel) {
    ctx.fillStyle = 'rgba(63,167,184,0.13)';
    ctx.fillRect(rollX(sel[0]), 0, rollX(sel[1]) - rollX(sel[0]), H);
    ctx.strokeStyle = '#3FA7B8';
    ctx.strokeRect(rollX(sel[0]), 0, rollX(sel[1]) - rollX(sel[0]), H);
  }
  // cursor line
  {
    const px = rollX(cursorT);
    if (px >= KEYS_W && px <= W) {
      ctx.strokeStyle = '#ffd479';
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // note BARS
  const barH = Math.max(3, rh - 2);
  const bar = (t, p, len, color, alpha, outline) => {
    const x = rollX(t), y = rollY(p) - barH / 2;
    const w = Math.max(2.5, len * pps());
    if (x + w < KEYS_W || x > W) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    const cx = Math.max(x, KEYS_W);
    ctx.fillRect(cx, y, w - (cx - x), barH);
    ctx.globalAlpha = 1;
    if (outline) { ctx.strokeStyle = '#fff'; ctx.strokeRect(x - 0.5, y - 0.5, w + 1, barH + 1); }
  };
  const transformed = layoutTransformed();
  const velScale = TR.vel / 100;
  const w = playWindow();
  baseEvents().forEach((e, i) => {
    const inWin = e.t >= w[0] - EDGE_EPS && e.t <= w[1] + 0.001;
    const shownV = Math.max(1, Math.min(127, e.v * velScale));
    bar(e.t, e.p, soundLen(e),
      transformed || !inWin ? '#999' : techColor(e.tech),
      transformed ? 0.25 : inWin ? (0.35 + 0.55 * shownV / 127) : 0.15,
      !transformed && selNotes.has(e));
  });
  // velocity readout on selected notes (few enough to stay legible)
  if (!transformed && selNotes.size && selNotes.size <= 12) {
    ctx.font = '9px Consolas';
    ctx.fillStyle = '#ffd479';
    for (const n of selNotes) {
      const x = rollX(n.t) + Math.max(2.5, soundLen(n) * pps()) + 3;
      const y = rollY(n.p) + 3;
      if (x > KEYS_W && x < W - 18) ctx.fillText(String(n.v), x, y);
    }
  }
  // the SOUND when transforms are active (drawn at source time, transformed pitch)
  if (transformed) {
    for (const e of viewEvents()) {
      bar(e.srcT, e.p, soundLen(e), techColor(e.tech), 0.4 + 0.55 * e.v / 127, false);
      if (e.p !== e.srcP) {
        ctx.strokeStyle = 'rgba(63,167,184,0.35)';
        ctx.beginPath();
        ctx.moveTo(rollX(e.srcT) + 1, rollY(e.srcP));
        ctx.lineTo(rollX(e.srcT) + 1, rollY(e.p));
        ctx.stroke();

    }
  }
  $('info').textContent = entity.id + ': ' + baseEvents().length + ' notes / ' + baseSpan().toFixed(1) + 's' + trDesc() +
    (isSnip() && transformed ? '   — note editing paused by: ' + blockingTransforms().join(', ') +
      ' (↺ original re-enables it)' : '');
}
function updateNoteSel() {
  const el = $('selNoteInfo'), box = $('noteVel');
  if (!el) return;
  if (!selNotes.size) { el.textContent = ''; box.style.display = 'none'; return; }
  const vs = [...selNotes].map(n => n.v);
  const lo = Math.min(...vs), hi = Math.max(...vs);
  const one = selNotes.size === 1 ? [...selNotes][0] : null;
  const scaled = v => Math.max(1, Math.min(127, Math.round(v * TR.vel / 100)));
  const suffix = TR.vel !== 100
    ? '  vel (sounds ' + (lo === hi ? scaled(lo) : scaled(lo) + '–' + scaled(hi)) + ')'
    : '  vel';
  const oor = [...selNotes].some(n => n.tech === 'cuivre' && (n.p < CUIVRE_LO || n.p > CUIVRE_HI));
  el.textContent = (one
    ? '· ' + nm(one.p) + ' ' + one.tech + ' ' + one.d.toFixed(2) + 's' + suffix
    : '· ' + selNotes.size + ' notes' + suffix) +
    (oor ? '  ⚠ cuivre sampled only ' + nm(CUIVRE_LO) + '–' + nm(CUIVRE_HI) : '');

}
function updateSelInfo() {
  $('selInfo').textContent = sel
    ? 'sel ' + sel[0].toFixed(2) + '–' + sel[1].toFixed(2) + 's · ' + sourceEvents().length + 'n'
    : cursorT > 0.001
    ? 'cursor @ ' + cursorT.toFixed(2) + 's'
    : 'click = cursor · drag = select';
}

// ================= mouse: transport + note editing =================
(() => {
  const cv = $('roll');
  let mode = null, startT = 0, dragNote = null, grabOff = 0, dragHappened = false;
  const timeAt = e => {
    const r = cv.getBoundingClientRect();
    return Math.max(0, Math.min(baseSpan(), rollTimeAt(e.clientX - r.left)));
  };
  const hitNote = e => {
    if (!canEdit()) return -1;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const ev = baseEvents();
    for (let i = ev.length - 1; i >= 0; i--) {
      const n = ev[i];
      const nx = rollX(n.t), nw = Math.max(2.5, soundLen(n) * pps());
      if (x >= nx - 1 && x <= nx + nw + 1 && Math.abs(y - rollY(n.p)) <= Math.max(4, rowH() / 2)) return i;
    }
    return -1;
  };
  const nearSelEdge = e => {
    if (!sel) return null;
    const x = e.clientX - cv.getBoundingClientRect().left;
    if (Math.abs(x - rollX(sel[0])) < 7) return 'lo';
    if (Math.abs(x - rollX(sel[1])) < 7) return 'hi';
    return null;
  };
  const persist = () => {
    if (isGest()) { gestDirty = true; markDirty(); return; }   // explicit save only
    clearTimeout(persist._t);
    persist._t = setTimeout(() => {
      const o = baseObj();
      if (!isSnip() || !o) return;
      fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateSnippet', id: entity.id,
          events: o.events, span: baseSpan() }) });
    }, 700);
  };
  window._persistSnippet = persist;

  cv.addEventListener('mousedown', e => {
    if (!entity.id) return;
    dragHappened = false;
    const ni = hitNote(e);
    if (ni >= 0) {
      const n = baseEvents()[ni];
      if (e.shiftKey) selNotes.add(n);
      else if (!selNotes.has(n)) selNotes = new Set([n]);
      dragNote = n;
      grabOff = timeAt(e) - n.t;
      const edgeX = rollX(n.t) + Math.max(2.5, soundLen(n) * pps());
      const x = e.clientX - cv.getBoundingClientRect().left;
      mode = (VARIABLE.has(n.tech) && Math.abs(x - edgeX) < 6) ? 'dur' : 'note';
      drawRoll(); updateNoteSel();
      return;
    }
    mode = nearSelEdge(e) || 'new';
    startT = timeAt(e);
  });

  cv.addEventListener('mousemove', e => {
    if (!mode) {
      cv.style.cursor = hitNote(e) >= 0 ? 'move' : nearSelEdge(e) ? 'ew-resize' : 'crosshair';
      return;
    }
    dragHappened = true;
    const t = timeAt(e);
    if (mode === 'note' && dragNote) {
      const targetP = Math.max(LO, Math.min(TOP, pitchAt(e.clientY - cv.getBoundingClientRect().top)));
      const dp = targetP - dragNote.p;
      const dt = +(Math.max(0, t - grabOff) - dragNote.t).toFixed(3);
      for (const m of selNotes) {
        m.p = Math.max(LO, Math.min(TOP, m.p + dp));
        m.t = +Math.max(0, m.t + dt).toFixed(3);
      }
      drawRoll(); persist();
      return;
    }
    if (mode === 'dur' && dragNote) {
      dragNote.d = +Math.max(0.1, t - dragNote.t).toFixed(3);
      drawRoll(); persist();
      return;
    }
    if (mode === 'lo') { sel = [Math.min(t, sel[1] - 0.05), sel[1]]; cursorT = sel[0]; drawRoll(); return; }
    if (mode === 'hi') { sel = [sel[0], Math.max(t, sel[0] + 0.05)]; drawRoll(); return; }
    if (Math.abs(t - startT) * pps() > 5) {
      sel = [Math.min(startT, t), Math.max(startT, t)];
      cursorT = sel[0];
      drawRoll();
    }
  });

  window.addEventListener('mouseup', () => {
    if (!mode) return;
    const m = mode;
    mode = null; dragNote = null;
    if (m === 'note' || m === 'dur' || m === 'lo' || m === 'hi') {
      // sorting is safe now: selNotes holds references, not indices
      if (isSnip()) baseObj().events.sort((a, b) => a.t - b.t);
      drawRoll(); updateSelInfo(); updateNoteSel();
      return;
    }
    // 'new' gesture: CLICK = cursor + collapse; DRAG = keep selection
    if (!dragHappened || (sel && sel[1] - sel[0] < 0.05)) {
      sel = null;
      cursorT = startT;
      selNotes.clear();
    } else if (sel) {
      cursorT = sel[0];
    }
    drawRoll(); updateSelInfo(); updateNoteSel();
  });

  // double-click: on a note = cycle articulation; on empty = add a note
  cv.addEventListener('dblclick', e => {
    if (!canEdit()) return;
    const ni = hitNote(e);
    const o = baseObj();
    if (ni >= 0) {
      const n = o.events[ni];
      n.tech = n.tech === 'staccato' ? 'fortepiano'
             : n.tech === 'fortepiano' ? 'ord'
             : n.tech === 'ord' ? 'cuivre' : 'staccato';
      // variable techniques need a sensible duration when converted into
      if (n.tech === 'ord' && n.d < 0.3) n.d = 0.5;
      if (n.tech === 'cuivre' && n.d < 0.3) n.d = +(techLen('cuivre', n.p) || 1.17).toFixed(3);
      drawRoll(); updateNoteSel(); persist();
      return;
    }
    const r = cv.getBoundingClientRect();
    const p = pitchAt(e.clientY - r.top);
    if (p < LO || p > TOP) return;
    const fresh = { t: +timeAt(e).toFixed(3), p, v: 100, d: 0.5, tech: $('recTech').value };
    o.events.push(fresh);
    o.events.sort((a, b) => a.t - b.t);
    selNotes = new Set([fresh]);
    drawRoll(); updateNoteSel(); persist();
  });

  // wheel: pan / ALT-zoom (dominant axis - ALT shunts to deltaX on some devices)
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (e.altKey) {
      const r = cv.getBoundingClientRect();
      const anchorT = rollTimeAt(e.clientX - r.left);
      const f = d < 0 ? 1.18 : 1 / 1.18;
      pxPerSec = Math.max(fitPps() * 0.5, Math.min(Math.max(600, fitPps() * 10), pps() * f));
      viewT0 = anchorT - (e.clientX - r.left - KEYS_W - 6) / pxPerSec;
    } else {
      viewT0 += d / pps();
    }
    drawRoll();
  }, { passive: false });

  window._deleteSelectedNotes = () => {
    if (!canEdit() || !selNotes.size) return;
    const o = baseObj();
    o.events = o.events.filter(e => !selNotes.has(e));
    selNotes.clear();
    drawRoll(); updateNoteSel(); persist();
  };
})();

// ================= playback =================
let MIDI = null, OUTS = {}, pending = [], playing = false;
const SCHED_LEAD_MS = 150;                 // note 1 must never race all-notes-off
async function midiInit() {
  const st = $('midiStatus');
  try {
    MIDI = await navigator.requestMIDIAccess();
    OUTS = {};
    MIDI.outputs.forEach(o => { OUTS[o.name.toLowerCase()] = o; });
    const missing = [];
    for (let i = 1; i <= 10; i++) {
      if (!OUTS['tuba' + i]) missing.push('tuba' + i);
      if (!OUTS['tuba' + i + 'b']) missing.push('tuba' + i + 'b');
    }
    st.textContent = missing.length ? 'midi: missing ' + missing.slice(0, 3).join(',') + '…' : 'midi: 10 tubas ready';
    hookInputs();
  } catch (e) { st.textContent = 'midi: unavailable'; }
}
function assignPlayers(ev) {
  const busy = Array(10).fill(-1);
  return ev.map(e => {
    const end = e.t + soundLen(e);
    let k = -1, oldest = Infinity;
    for (let i = 0; i < 10; i++)
      if (busy[i] + 0.04 <= e.t && busy[i] < oldest) { oldest = busy[i]; k = i; }
    if (k < 0) k = busy.indexOf(Math.min(...busy));
    busy[k] = end;
    return { ...e, player: k };
  });
}
let cursorTimer = null, playT0 = null, playSpanS = 0;
function stopCursor() {
  if (cursorTimer) clearInterval(cursorTimer);
  cursorTimer = null; playT0 = null;
  $('playCursor').style.display = 'none';
}
function startCursor(spanS, leadMs) {
  stopCursor();
  playT0 = performance.now() + (leadMs || 0);
  playSpanS = spanS;
  const cv = $('roll');
  cursorTimer = setInterval(() => {
    if (playT0 === null) return;
    const played = (performance.now() - playT0) / 1000;
    if (played < 0) return;
    if (played > playSpanS + 0.3) return stopCursor();
    let srcLocal = played / TR.stretch;
    if (TR.reverse) {
      const ev = sourceEvents();
      const S = ev.length ? Math.max(...ev.map(e => e.t)) : 0;
      srcLocal = S - srcLocal;
    }
    let rollT = (sel ? sel[0] : cursorT) + srcLocal;
    if (sel) rollT = Math.min(rollT, sel[1]);
    const x = rollX(rollT);
    const cu = $('playCursor');
    if (x < KEYS_W || x > cv.clientWidth) cu.style.display = 'none';
    else { cu.style.display = 'block'; cu.style.left = x + 'px'; }
  }, 33);
}
function stopAll() {
  playing = false;
  stopCursor();
  pending.forEach(clearTimeout);
  pending = [];
  for (let i = 1; i <= 10; i++) for (const sub of ['', 'b']) {
    const out = OUTS['tuba' + i + sub];
    if (out) for (const ch of [0, 3, 4, 10]) out.send([0xB0 | ch, 123, 0]);
  }
}
function play() {
  if (!MIDI || !entity.id) return;
  stopAll();
  const ev = assignPlayers(viewEvents());
  if (!ev.length) return;
  for (const e of ev) {
    const sub = e.tech === 'staccato' ? 'b' : '';
    const ch = (e.tech === 'fortepiano' ? 11 : e.tech === 'staccato' ? 4 : e.tech === 'cuivre' ? 5 : 1) - 1;
    const out = OUTS['tuba' + (e.player + 1) + sub];
    if (!out) continue;
    const holdMs = soundLen(e) * 1000;
    const cc = velToCC(e.v);
    pending.push(setTimeout(() => {
      out.send([0xB0 | ch, 7, cc]);            // CC7 carries the dynamic
      out.send([0x90 | ch, e.p, e.v]);
      pending.push(setTimeout(() => out.send([0x80 | ch, e.p, 0]), holdMs));
    }, e.t * 1000 + SCHED_LEAD_MS));
  }
  const spanS = viewSpan(ev);
  const lastAttack = Math.max(...ev.map(e => e.t));
  playing = true;
  pending.push(setTimeout(() => { playing = false; }, spanS * 1000 + SCHED_LEAD_MS + 300));
  startCursor(lastAttack + 0.15, SCHED_LEAD_MS);
  $('info').textContent = 'playing ' + ev.length + ' notes / ' + spanS.toFixed(1) + 's' + trDesc();
}

// ================= recording + live thru =================
let recording = false, recEvents = [], recOpen = {}, recT0 = null;
const thruRoute = () => {
  const tech = $('recTech').value;
  return tech === 'staccato' ? { out: OUTS['tuba1b'], ch: 3 }
       : tech === 'fortepiano' ? { out: OUTS['tuba1'], ch: 10 }
       : tech === 'cuivre' ? { out: OUTS['tuba1'], ch: 4 }
       : { out: OUTS['tuba1'], ch: 0 };
};
const thruOpen = {};
function hookInputs() {
  MIDI.inputs.forEach(inp => {
    // loopMIDI ports are BIDIRECTIONAL - echoing tuba* input would loop forever
    if (/^tuba\d+b?$/i.test(inp.name.trim())) return;
    inp.onmidimessage = m => {
      const [st, p, v] = m.data;
      const cmd = st & 0xF0;
      const now = performance.now();
      if (cmd === 0x90 && v > 0) {
        const r = thruRoute();
        if (r.out) {
          r.out.send([0xB0 | r.ch, 7, velToCC(v)]);
          r.out.send([0x90 | r.ch, p, v]);
          thruOpen[p] = r;
        }
        if (recording) {
          if (recT0 === null) recT0 = now;
          recOpen[p] = { t: (now - recT0) / 1000, v, tech: $('recTech').value };
        }
      } else if (cmd === 0x80 || (cmd === 0x90 && v === 0)) {
        const r = thruOpen[p];
        if (r && r.out) { r.out.send([0x80 | r.ch, p, 0]); delete thruOpen[p]; }
        const o = recOpen[p];
        if (o && recording) {
          recEvents.push({ t: +o.t.toFixed(3), p, v: o.v,
            d: +Math.max(0.05, (now - recT0) / 1000 - o.t).toFixed(3), tech: o.tech });
          delete recOpen[p];
        }
      }
    };
  });
}
async function toggleRec() {
  const b = $('recBtn');
  if (!recording) {
    recording = true; recEvents = []; recOpen = {}; recT0 = null;
    b.classList.add('rec');
    b.textContent = '■ stop (0 notes)';
    const tick = setInterval(() => {
      if (!recording) return clearInterval(tick);
      b.textContent = '■ stop (' + recEvents.length + ' notes)';
    }, 500);
  } else {
    recording = false;
    b.classList.remove('rec');
    b.textContent = '● rec';
    if (!recEvents.length) { $('info').textContent = 'nothing recorded'; return; }
    const name = prompt('Name this cluster (blank = auto):') || '';
    const r = await fetch('/api/clusterbank', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveCluster', name, events: recEvents, tech: $('recTech').value }) })
      .then(x => x.json());
    if (r.success) { await loadBank(); openCluster(r.id); $('info').textContent = r.id + ' saved (' + recEvents.length + ' notes)'; }
  }
}

  const row = $('snips');
  row.innerHTML = '<span class="hint">snippets (editable copies):</span>';
  const ids = Object.keys(BANK.snippets);
  if (!ids.length) { row.innerHTML += ' <span class="hint">(none — ✂ snippet cuts one)</span>'; return; }
  ids.forEach(id => {
    const sn = BANK.snippets[id];
    const pv = sn.provenance || {};
    const el = document.createElement('span');
    el.className = 'snip' + (isSnip() && id === entity.id ? ' on' : '');
    el.innerHTML = id + ' · ' + (pv.from || sn.cluster || '?') +
      ' · ' + ((sn.events && sn.events.length) || '?') + 'n<span class="x" data-x="' + id + '">×</span>';
    el.addEventListener('click', async e => {
      if (e.target.dataset.x) {
        const del = e.target.dataset.x;
        await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'deleteSnippet', id: del }) });
        await loadBank();
        if (isSnip() && entity.id === del) openCluster($('clSel').value);
        else drawSnips();
        return;
      }
      openSnippet(id);
    });
    row.appendChild(el);
  });
}

// ================= tonality row =================
function buildTonRow() {
  const row = $('tonRow');
  const orig = document.createElement('button');
  orig.className = 'chip on';
  orig.textContent = 'original';
  orig.id = 'tonOrig';
  row.insertBefore(orig, $('chordSel'));
  orig.addEventListener('click', () => { TR.tonality = null; TR.chord = null; $('chordSel').value = ''; tonHi(); drawRoll(); });
  Object.keys(TONALITIES).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip ton';
    b.dataset.t = k;
    b.textContent = k;
    b.title = TONALITIES[k].map(nm).join(' ');
    row.insertBefore(b, $('chordSel'));
    b.addEventListener('click', () => { TR.tonality = k; TR.chord = null; $('chordSel').value = ''; tonHi(); drawRoll(); });
  });
  $('chordSel').addEventListener('change', function () {
    this.blur();
    TR.chord = this.value || null;
    if (this.value) TR.tonality = null;
    tonHi(); drawRoll();
  });
  $('poolBtn').addEventListener('click', function () {
    TR.pool = !TR.pool;
    this.classList.toggle('on', TR.pool);
    this.textContent = TR.pool ? 'pooled' : 'literal';
    drawRoll();
  });
}
function tonHi() {
  const o = $('tonOrig');
  if (o) o.classList.toggle('on', !TR.tonality && !TR.chord);
  document.querySelectorAll('.ton').forEach(b => b.classList.toggle('on', b.dataset.t === TR.tonality));
}

// ================= store =================
async function refreshLists() {
  const s = $('listSel');
  const keep = s.value;
  s.innerHTML = '<option value="">— choose —</option><option value="__library__">library only</option>';
  Object.keys(BANK.lists).forEach(l => {
    const o = document.createElement('option');
    o.value = l;
    o.textContent = l + ' (' + BANK.lists[l].length + ')';
    s.appendChild(o);
  });
  const nw = document.createElement('option');
  nw.value = '__new__';
  nw.textContent = 'new list…';
  s.appendChild(nw);
  if (keep) s.value = keep;
}
$('listSel').addEventListener('change', async function () {
  this.blur();
  if (this.value === '__new__') {
    const name = prompt('New list name:');
    this.value = '';
    if (!name) return;
    await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'createList', name }) });
    await loadBank(); refreshLists();
    this.value = name;
  }
});
async function store() {
  if (!entity.id) return;
  const dest = $('listSel').value;
  if (!dest) {
    const s = $('listSel');
    s.classList.add('flash');
    setTimeout(() => s.classList.remove('flash'), 900);
    $('storeMsg').textContent = 'choose a destination first';
    setTimeout(() => { $('storeMsg').textContent = ''; }, 2200);
    return;
  }
  const evFull = viewEvents();
  const ev = evFull.map(e => ({ t: e.t, p: e.p, v: e.v, d: e.d, tech: e.tech }));
  if (!ev.length) return;
  const o = baseObj();
  const r = await fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveGesture', events: ev, span: viewSpan(evFull),
      provenance: { [entity.kind]: entity.id, source: (o && o.provenance) || undefined,
        sel: sel || undefined, transforms: { ...TR } }, list: dest }) }).then(x => x.json());
  if (r.success) {
    $('storeMsg').textContent = r.id + (r.existed ? ' (already in library)' : ' stored') + (r.added ? ' → ' + dest : '');
    setTimeout(() => { $('storeMsg').textContent = ''; }, 3000);
    await loadBank(); refreshLists(); drawSnips(); drawGests();
  }
}

// ================= wiring =================
async function loadBank() {
  BANK = (await fetch('/api/clusterbank').then(r => r.json())).bank;
  // migrate pointer-era snippets to copies
  for (const [id, sn] of Object.entries(BANK.snippets)) {
    if (sn.events || !sn.cluster || !BANK.clusters[sn.cluster]) continue;
    const src = BANK.clusters[sn.cluster].events
      .filter(e => e.t >= sn.t0 - EDGE_EPS && e.t <= sn.t1 + 0.001)
      .map(e => ({ ...e, t: +Math.max(0, e.t - sn.t0).toFixed(3) }));
    sn.events = src;
    sn.provenance = { from: sn.cluster, t0: sn.t0, t1: sn.t1 };
    fetch('/api/clusterbank', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'updateSnippet', id, events: src,
        span: src.length ? Math.max(...src.map(e => e.t + soundLen(e))) : 0.5,
        provenance: sn.provenance }) });
  }
  const s = $('clSel');
  const keep = s.value;
  s.innerHTML = '';
  const fams = {};
  Object.entries(BANK.clusters).forEach(([id, c]) => { (fams[c.family] = fams[c.family] || []).push(id); });
  Object.keys(fams).sort().forEach(f => {
    const og = document.createElement('optgroup');
    og.label = f;
    fams[f].forEach(id => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = id + ' (' + BANK.clusters[id].n + 'n/' + BANK.clusters[id].span.toFixed(0) + 's)';
      og.appendChild(o);
    });
    s.appendChild(og);
  });
  if (keep && BANK.clusters[keep]) s.value = keep;
}

$('clSel').addEventListener('change', function () { this.blur(); openCluster(this.value); });
$('backBtn').addEventListener('click', () => openCluster($('clSel').value));
$('playBtn').addEventListener('click', play);
$('stopBtn').addEventListener('click', stopAll);
$('recBtn').addEventListener('click', toggleRec);
$('selClear').addEventListener('click', () => { sel = null; cursorT = 0; selNotes.clear(); drawRoll(); updateSelInfo(); });
$('snipSave').addEventListener('click', cutSnippet);
$('storeBtn').addEventListener('click', store);
$('saveOverBtn').addEventListener('click', saveOverGesture);
$('saveAsBtn').addEventListener('click', saveAsNewGesture);
$('zoomIn').addEventListener('click', () => {
  const mid = viewT0 + ($('roll').clientWidth - KEYS_W - 12) / pps() / 2;
  pxPerSec = Math.min(Math.max(600, fitPps() * 10), pps() * 1.5);
  viewT0 = mid - ($('roll').clientWidth - KEYS_W - 12) / pxPerSec / 2;
  drawRoll();
});
$('zoomOut').addEventListener('click', () => {
  const mid = viewT0 + ($('roll').clientWidth - KEYS_W - 12) / pps() / 2;
  pxPerSec = Math.max(fitPps() * 0.5, pps() / 1.5);
  viewT0 = mid - ($('roll').clientWidth - KEYS_W - 12) / pxPerSec / 2;
  drawRoll();
});
$('zoomFit').addEventListener('click', () => { pxPerSec = null; viewT0 = 0; drawRoll(); });
document.querySelectorAll('.str').forEach(b => b.addEventListener('click', () => syncStretch(+b.dataset.f, true)));
function syncStretch(v, redraw) {
  TR.stretch = Math.max(STR_MIN, Math.min(STR_MAX, v));
  $('strSlider').value = strToPos(TR.stretch);
  $('strV').value = TR.stretch.toFixed(2);
  document.querySelectorAll('.str').forEach(x =>
    x.classList.toggle('on', Math.abs(+x.dataset.f - TR.stretch) < 0.0005));
  if (redraw) drawRoll();
}
function syncVel(v, redraw) {
  TR.vel = Math.max(20, Math.min(200, Math.round(v)));
  $('velSlider').value = TR.vel;
  $('velV').value = TR.vel + '%';
  if (redraw) drawRoll();
}
$('strSlider').addEventListener('input', function () { syncStretch(posToStr(+this.value), false); });
$('strSlider').addEventListener('change', function () { this.blur(); drawRoll(); });
$('strSlider').addEventListener('dblclick', () => { $('strV').focus(); $('strV').select(); });
$('velSlider').addEventListener('input', function () { syncVel(+this.value, false); });
$('velSlider').addEventListener('change', function () { this.blur(); drawRoll(); });
$('velSlider').addEventListener('dblclick', () => { $('velV').focus(); $('velV').select(); });
// type-in boxes: ENTER (or blur) commits
function numBox(el, apply) {
  const commit = () => {
    const v = parseFloat(String(el.value).replace(/[^0-9.\-]/g, ''));
    if (!isNaN(v)) apply(v, true);
    else apply(null, true);
  };
  el.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(); el.blur(); }
    if (e.key === 'Escape') { el.blur(); }
  });
  el.addEventListener('blur', commit);
  el.addEventListener('focus', () => el.select());
}
numBox($('strV'), v => syncStretch(v === null ? TR.stretch : v, true));
numBox($('velV'), v => syncVel(v === null ? TR.vel : v, true));
numBox($('noteVel'), v => {
  if (v !== null && selNotes.size) {
    const q = Math.max(1, Math.min(127, Math.round(v)));
    for (const n of selNotes) n.v = q;
    if (window._persistSnippet) window._persistSnippet();
  }
  drawRoll(); updateNoteSel();
});
$('revBtn').addEventListener('click', function () { TR.reverse = !TR.reverse; this.classList.toggle('on', TR.reverse); drawRoll(); });
$('octUp').addEventListener('click', () => { TR.oct = Math.min(2, TR.oct + 1); drawRoll(); });
$('octDn').addEventListener('click', () => { TR.oct = Math.max(-2, TR.oct - 1); drawRoll(); });
$('thin').addEventListener('input', function () { TR.thin = +this.value; $('thinV').textContent = TR.thin + '%'; });
$('thin').addEventListener('change', function () { this.blur(); drawRoll(); });
$('resetBtn').addEventListener('click', () => {
  const keep = { ...entity };
  resetViewState();
  entity = keep;
  drawRoll(); updateSelInfo();
});

window.addEventListener('keyup', e => { if (e.key === 'Alt') e.preventDefault(); });
window.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[type=text], select')) return;
  if (e.key === 'Home') {
    e.preventDefault();
    sel = null; cursorT = 0; viewT0 = 0;
    drawRoll(); updateSelInfo();
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (playing) stopAll(); else play();
    return;
  }
  if (e.key === 'Escape') { stopAll(); selNotes.clear(); drawRoll(); updateNoteSel(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    window._deleteSelectedNotes();
    return;
  }
  // per-note velocity on the selected notes (snippet editing)
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && canEdit() && selNotes.size) {
    e.preventDefault();
    const d = (e.key === 'ArrowUp' ? 6 : -6) * (e.shiftKey ? 3 : 1);
    for (const n of selNotes) n.v = Math.max(1, Math.min(127, n.v + d));
    drawRoll(); updateNoteSel();
    if (window._persistSnippet) window._persistSnippet();
  }
});
window.addEventListener('resize', drawRoll);

(async () => {
  try { SAMPLE_LEN = await fetch('/bank/sample_lengths.json').then(r => r.json()); } catch (e) {}
  try {
    const m = await fetch('/probes/cc7_map.json').then(r => r.json());
    if (m && m.points && m.points.length > 2) CC7_POINTS = m.points.slice().sort((a, b) => a.db - b.db);
  } catch (e) {}
  try {
    const ids = Array.from({ length: 33 }, (_, i) => String(i + 1).padStart(2, '0'));
    const banks = await Promise.all(ids.map(n =>
      fetch('/bank/VERT01-' + n + '.json').then(r => r.ok ? r.json() : null).catch(() => null)));
    const cs = $('chordSel');
    ids.forEach((n, i) => {
      if (!banks[i] || !banks[i].pitches) return;
      const k = 'VERT01-' + n;
      const ps = [...new Set(banks[i].pitches.map(p => foldInto(p)))].sort((a, b) => a - b);
      TAXCH[k] = ps;
      const iv = ps.slice(1).map((p, j) => p - ps[j]);
      const shape = iv.length === 0 ? ''
        : Math.max(...iv) >= 12 ? 'split'
        : iv.filter(x => x <= 2).length >= iv.length * 0.6 ? 'cluster' : 'spread';
      const o = document.createElement('option');
      o.value = k;
      o.textContent = 'ch ' + n + ' · ' + ps.length + 'n ' + nm(ps[0]) + '–' + nm(ps[ps.length - 1]) +
        (shape ? ' · ' + shape : '');
      cs.appendChild(o);
    });
  } catch (e) {}
  buildTonRow();
  await loadBank();
  await midiInit();
  refreshLists();
  drawSnips();
  drawGests();
  openCluster(Object.keys(BANK.clusters)[0]);
})();
